          - 시드 재현: 같은 시드·같은 temperature 면 두 호출 결과가 동일함을 assert
          - top-k 제약: 생성된 각 토큰이 그 시점 상위 k 안에 있었음을 assert

       3. pytest 로 실행해 결과를 보인다

