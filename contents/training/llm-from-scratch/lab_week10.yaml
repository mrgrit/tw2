      ```

      ## 🔍 에이전트 판정 포인트
      **`temperature=0` 을 처리하지 않으면 NaN 이 난다.** `logits / 0` 은 `inf` 가 되고
      softmax 를 거치면 NaN, `multinomial` 은 거기서 죽는다. 에이전트가 이를 피하려고
