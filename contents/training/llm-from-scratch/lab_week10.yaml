  - order: 7
    instruction: |
      ## 🎯 미션 — `qkv_bias` 게이트 + 4모델 비교표

      ## 💡 (a) `qkv_bias=False` 로는 **실패해야 정상이다**
      OpenAI 의 GPT-2 에는 QKV bias 가 **있는데** 우리 모델에 그 자리가 없으면 넣을 데가 없다.
      W05 에서 계산한 `2,360,064` vs `2,362,368` 의 **2,304 = 3 × 768** 차이가 바로 이것이다.

      ## 💡 (b) 4모델 비교표 — 이번 주의 결론
      | 모델 | val 손실 | 퍼플렉시티 | 무엇이 다른가 |
      |---|---|---|---|
      | 무작위 초기화 | **10.98** | 58,900 | 아무것도 모름 |
      | 내 10에폭 모델 | **6.31** | 551 | 5,145 토큰을 외움 |
      | **OpenAI 124M** | **3.56** | 35 | 수백억 토큰 학습 |
      | **OpenAI 355M** | **3.36** | 29 | 같은 데이터, 더 큰 모델 |

      **아키텍처는 우리가 만든 것과 똑같다. 다른 것은 오직 데이터의 양이다.**
      그리고 124M → 355M 은 파라미터가 **2.85배**인데 손실은 3.56 → 3.36 (**0.2 감소**)뿐이다 —
      **모델을 키우는 것보다 데이터를 늘리는 것이 압도적으로 효과적**이다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch, torch.nn.functional as F
      from openai_load import build, build_loaders
      from common import device, VERDICT
      print('--- (a) qkv_bias=False 로 로드 시도 (실패해야 정상)')
      try:
          build('gpt2-small (124M)', qkv_bias=False); print('NO_ERROR_UNEXPECTED')
      except Exception as e:
          print(type(e).__name__ + ':', str(e)[:80]); print('QKV_BIAS_GATE_OK')
      print('--- (b) 4모델 비교')
      raw = open(VERDICT, encoding='utf-8').read()
      _, val, _, _ = build_loaders(raw)
      def loss(m):
          t = 0.0
          with torch.no_grad():
              for x, y in val:
                  x, y = x.to(device), y.to(device)
                  t += F.cross_entropy(m(x).flatten(0,1), y.flatten()).item()
          return t/len(val)
      for name in ['gpt2-small (124M)', 'gpt2-medium (355M)']:
          m, cfg, _ = build(name)
          v = loss(m); print(f'{name:22s} val_loss={v:.4f}  perplexity={torch.exp(torch.tensor(v)).item():.1f}')
          del m; torch.cuda.empty_cache()
      print('FOUR_MODEL_TABLE_OK')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      `QKV_BIAS_GATE_OK`(오류가 나야 정상), 124M **3점대 중반**, 355M 이 124M 보다 낮음,
      `FOUR_MODEL_TABLE_OK`.
    hint: '355M 은 1.5GB 다운로드가 필요하다. 측정 후 del + empty_cache 를 잊지 마라'
