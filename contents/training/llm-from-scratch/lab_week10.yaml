    answer_detail: "낮은 T 에서 k 변화가 무의미한 것은 정상이다 — 이 사실을 미리 알려주지 않으면 학생이 버그를 찾느라 시간을 쓴다. 검증 설계에서 '정상인데 이상해 보이는 것'을 미리 표시하는 것도 중요하다."
    verify:
      type: output_contains
      expect: SAMPLING_GRID_OK
      field: stdout
      semantic:
        intent: "temperature × top_k 그리드로 말투 변화 관찰"
        success_criteria: ["6개 조합 생성", "T 증가 시 붕괴 경향", "낮은 T에서 k 무관 이해"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 체크포인트: 모델 **+ 옵티마이저** 상태

      ## 💡 왜 옵티마이저 상태도 저장하는가
      AdamW 는 파라미터마다 **1차·2차 모멘텀 2개**를 들고 있다(W09 메모리 계산의 그것).
      모델만 저장하고 재개하면 **관성이 사라져 손실이 잠시 튀어 오른다.**
      "매끄럽게 이어지는가"가 이 미션의 통과 기준인 이유다.

      ## 💡 저장 형식
      ```python
      torch.save({'model_state_dict': model.state_dict(),
                  'optimizer_state_dict': optimizer.state_dict()}, path)
      ```

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys, json, os; sys.path.insert(0, '.')
      import torch, common  # week07 경로 등록
      from gpt_model import GPTModel, GPT_CONFIG_124M
      ck = torch.load('checkpoint_5ep.pth', map_location='cpu', weights_only=True)
      print('CHECKPOINT_KEYS', sorted(ck.keys()))
      has_model = 'model_state_dict' in ck; has_opt = 'optimizer_state_dict' in ck
      print('HAS_MODEL', has_model, 'HAS_OPTIMIZER', has_opt)
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      m = GPTModel(cfg); m.load_state_dict(ck['model_state_dict'])
      if os.path.exists('checkpoint_5ep_meta.json'):
          print('META', json.load(open('checkpoint_5ep_meta.json')))
      print('CHECKPOINT_OK' if has_model and has_opt else 'NG')"
      ```
