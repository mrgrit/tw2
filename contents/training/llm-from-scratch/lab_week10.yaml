  - order: 3
    instruction: |
      ## 🎯 미션 — generate 통합: greedy 폴백과 성질 테스트

      ## 💡 핵심 구조
      ```python
      if top_k is not None:
          logits = topk_mask(logits, top_k)
      if temperature > 0.0:
          probs = torch.softmax(logits / temperature, dim=-1)
          idx_next = torch.multinomial(probs, num_samples=1)
      else:
          idx_next = torch.argmax(logits, dim=-1, keepdim=True)   # greedy 폴백
      ```

      ## 💡 세 테스트가 지키는 것
      | 테스트 | 성질 |
      |---|---|
      | greedy 폴백 | `temperature=0` 이면 W07 `generate_text_simple` 과 **동일 출력** |
      | 시드 재현 | 같은 시드·같은 T 면 **같은 출력** |
      | top-k 제약 | 생성된 토큰이 항상 상위 k 안에 있음 |

      **첫 번째 테스트가 중요하다.** W07 의 결정성이 여기서 "특수한 경우"로 보존된다 —
      새 기능을 추가해도 기존 동작이 깨지지 않는지 확인하는 **회귀 테스트**다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -m pytest test_decoding.py -q
      ```
      ## ✅ 합격 기준
      `passed` 가 출력되고 실패 0.
    hint: 'temperature=0 일 때 argmax 로 폴백하지 않으면 0으로 나누게 되어 NaN 이 난다'
    answer: |
      docker exec -w /work/week10 llm-lab python3 -m pytest test_decoding.py -q
    answer_detail: "새 기능(temperature/top-k)을 넣어도 기존 동작(greedy)이 특수 케이스로 보존되는지 확인하는 회귀 테스트다. W07 에서 고정한 결정성이 여기서 회수된다."
    verify:
      type: output_contains
      expect: passed
      field: stdout
      semantic:
        intent: "generate 의 greedy 폴백·재현성·top-k 제약을 pytest 로 고정"
        success_criteria: ["greedy 폴백 동일", "시드 재현", "top-k 제약"]

  - order: 4
    instruction: |
      ## 🎯 미션 — (T × k) 그리드: 말투가 바뀌는 것을 눈으로

      W09 에서 훈련한 `model_10ep.pth` 로 (temperature × top_k) 조합별 생성문을 만든다.

      ## 💡 예상 관찰
      | 설정 | 결과 |
      |---|---|
      | 낮은 T · 작은 k | W09 에서 **외운 문장**으로 수렴 |
      | 높은 T · 큰 k | **문장 붕괴** (헛소리) |

      ## ⚠️ T=0.5 행에서 k를 바꿔도 출력이 같을 수 있다 — **정상이다**
      온도가 낮으면 확률이 최상위 몇 개에 몰려서, k를 5로 하든 25로 하든 뽑히는 토큰이 같아진다.
      **버그로 오인하지 마라.** k가 의미를 갖는 것은 분포가 평평할 때(높은 T)다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch, tiktoken
      from common import device, text_to_token_ids, token_ids_to_text, MODEL_10EP
      from gpt_model import GPTModel, GPT_CONFIG_124M
      from decoding import generate
      enc = tiktoken.get_encoding('gpt2')
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      m = GPTModel(cfg)
      m.load_state_dict(torch.load(MODEL_10EP, map_location='cpu', weights_only=True))
      m.to(device).eval()
      start = text_to_token_ids('Every effort moves you', enc).to(device)
      for T in [0.5, 1.0, 2.0]:
          for k in [5, 25]:
              torch.manual_seed(123)
              out = generate(m, start, 20, 256, temperature=T, top_k=k)
              print(f'T={T:3.1f} k={k:2d} | ' + token_ids_to_text(out, enc).replace(chr(10), ' ')[:90])
      print('SAMPLING_GRID_OK')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      6개 조합의 생성문이 출력되고 `SAMPLING_GRID_OK`.
      T가 커질수록 문장이 무너지는 경향을 눈으로 확인한다.
    hint: '같은 시드를 쓰면 같은 설정에서 항상 같은 문장이 나온다 — 비교의 전제다'
    answer: |
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch, tiktoken
      from common import device, text_to_token_ids, token_ids_to_text, MODEL_10EP
      from gpt_model import GPTModel, GPT_CONFIG_124M
      from decoding import generate
      enc = tiktoken.get_encoding('gpt2')
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      m = GPTModel(cfg)
      m.load_state_dict(torch.load(MODEL_10EP, map_location='cpu', weights_only=True))
      m.to(device).eval()
