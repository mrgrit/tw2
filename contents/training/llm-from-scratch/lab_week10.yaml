steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — temperature 해부: 로짓을 나누는 한 줄

      ## 💡 temperature 는 이것뿐이다
      ```python
      probs = torch.softmax(logits / temperature, dim=-1)
      ```
      | T | 효과 |
      |---|---|
      | **작다** (0.1) | 로짓 차이가 **커져** 최고값에 확률이 몰림 |
      | 1.0 | 원래 분포 |
      | **크다** (5.0) | 로짓 차이가 **작아져** 평평해짐 |

      ## 💡 예상 결과 (장난감 어휘 9개, 1000회 샘플링)
      | T | forward | pizza | 엔트로피 |
      |---|---|---|---|
      | 0.01 | **1000** | 0 | 0.0000 |
      | 0.1 | 995 | 0 | 0.0514 |
      | 1.0 | 576 | 0 | 0.9127 |
      | **5.0** | 237 | **41 (약 4%)** | **1.9990** |

      `pizza` 는 로짓이 **−1.89** 로 최하위권이다. T=1 에서는 사실상 0회지만 T=5 에서는 약 4%.
      **temperature 를 올린다는 것은 "말도 안 되는 후보에게도 기회를 준다"는 뜻이다.**

      ## ⚠️ 어휘 순서 주의
      장난감 어휘는 **알파벳순이 아니다**(`every` < `effort` 가 아님). 인덱스를 눈으로 확인하라.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week10/decoding.py 를 만들고 temperature 의 효과를 샘플링으로 측정한다

      [할 일]
       1. decoding.py 에 다음을 정의한다
          - VOCAB: 장난감 어휘 9개의 {단어: 인덱스} 딕셔너리
            (closer, every, effort, forward, inches, moves, pizza, toward, you)
          - NEXT_TOKEN_LOGITS: 9개 로짓 텐서.
            forward 가 최댓값 6.75, toward 6.28, closer 4.51, pizza 는 -1.89 로 최하위권
          - softmax_with_temperature(logits, temperature): 로짓을 temperature 로 나눈 뒤 softmax
       2. argmax 단어와 그 로짓을 출력한다: ARGMAX_WORD <단어> LOGIT <값>
       3. torch.manual_seed(123) 뒤 T = 0.01, 0.1, 1.0, 5.0 각각에 대해
          - 확률 분포를 만들고 1000회 복원추출 샘플링한다
          - forward 와 pizza 가 각각 몇 번 뽑혔는지 센다
          - 분포의 엔트로피를 계산한다
          - 한 줄 출력: T=<값> forward=<수> pizza=<수> entropy=<소수 4자리>
       4. argmax 가 forward 이고 엔트로피가 T 증가에 단조 증가하면 TEMPERATURE_OK

      [제약]
       - 어휘 순서는 알파벳순이 아니다. 인덱스를 임의로 재배열하지 말 것
       - 엔트로피 계산에서 log(0) 이 나지 않도록 작은 값을 더할 것
       - 샘플링은 반드시 replacement=True 로 할 것
       - 시드를 루프 안에서 다시 고정하지 말 것 (한 번만)

      [검증] 네 줄을 모두 출력하고, T=5.0 에서 pizza 가 뽑히는 비율을 계산해
             "temperature 를 올린다"가 무엇을 뜻하는지 한 문장으로 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from decoding import VOCAB, NEXT_TOKEN_LOGITS, softmax_with_temperature
      inv = {v: k for k, v in VOCAB.items()}
      print('ARGMAX_WORD', inv[torch.argmax(NEXT_TOKEN_LOGITS).item()],
            'LOGIT', NEXT_TOKEN_LOGITS.max().item())
      torch.manual_seed(123); ents = []
      for T in [0.01, 0.1, 1.0, 5.0]:
          p = softmax_with_temperature(NEXT_TOKEN_LOGITS, T)
          s = torch.multinomial(p, num_samples=1000, replacement=True)
          fw = (s == VOCAB['forward']).sum().item(); pz = (s == VOCAB['pizza']).sum().item()
          ent = -(p*torch.log(p+1e-12)).sum().item(); ents.append(ent)
          print(f'T={T:5.2f} forward={fw:4d} pizza={pz:4d} entropy={ent:.4f}')
      mono = all(ents[i] < ents[i+1] for i in range(len(ents)-1))
      print('TEMPERATURE_OK' if inv[torch.argmax(NEXT_TOKEN_LOGITS).item()]=='forward' and mono else 'NG')"
      ```
      ## ✅ 합격 기준
      `ARGMAX_WORD forward LOGIT 6.75`, 엔트로피가 T 증가에 **단조 증가**, `TEMPERATURE_OK`.
      실측 출력:
      ```
      ARGMAX_WORD forward LOGIT 6.75
      T= 0.01 forward=1000 pizza=   0 entropy=0.0000
      T= 0.10 forward= 995 pizza=   0 entropy=0.0514
      T= 1.00 forward= 576 pizza=   0 entropy=0.9127
      T= 5.00 forward= 237 pizza=  41 entropy=1.9990
      ```

      ## 🔍 에이전트 판정 포인트
      **어휘를 알파벳순으로 정렬해 오는 실수가 잦다.** 에이전트는 딕셔너리를 만들 때 정리하는
      습관이 있어서 `closer:0, effort:1, every:2, ...` 로 만들기 쉽다. 교재 어휘는
      **알파벳순이 아니다**(`every` 가 `effort` 보다 앞). 순서가 바뀌면 로짓과 단어의 대응이
      틀어져 `ARGMAX_WORD` 가 다른 단어로 나온다. **인덱스를 눈으로 확인하라.**

      **`T=0.01` 에서 1000/1000 이 나오는 것이 정상이다.** 에이전트가 "샘플링인데 분산이 0이라
      이상합니다"라고 보고하면 오해다. 온도를 극단적으로 낮추면 **사실상 greedy 와 같아진다** —
      그것이 이 행이 보여주려는 것이다.

      **엔트로피를 안 내면 이 실험은 정성적 관찰에 그친다.** "분포가 평평해진다"를 눈으로만
      보면 판정이 애매하다. 엔트로피 단조 증가(0.0000 → 0.0514 → 0.9127 → 1.9990)가 그
      **정량 표현**이다.

      **T=5.0 의 `pizza=41` 이 이 단계의 결론이다.** `pizza` 는 로짓이 **−1.89** 로 최하위권인데
      T=1 에서는 0회, T=5 에서는 **약 4%** 나온다.
      **temperature 를 올린다는 것은 "말도 안 되는 후보에게도 기회를 준다"는 뜻이다** —
      창의성의 대가가 헛소리 확률이다.
    hint: 'T=0.01 에서 1000/1000 forward 가 나오면 사실상 greedy 와 같아진 것이다'
    answer: |
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from decoding import VOCAB, NEXT_TOKEN_LOGITS, softmax_with_temperature
      inv = {v: k for k, v in VOCAB.items()}
      print('ARGMAX_WORD', inv[torch.argmax(NEXT_TOKEN_LOGITS).item()],
            'LOGIT', NEXT_TOKEN_LOGITS.max().item())
      torch.manual_seed(123); ents = []
      for T in [0.01, 0.1, 1.0, 5.0]:
          p = softmax_with_temperature(NEXT_TOKEN_LOGITS, T)
          s = torch.multinomial(p, num_samples=1000, replacement=True)
          fw = (s == VOCAB['forward']).sum().item(); pz = (s == VOCAB['pizza']).sum().item()
          ent = -(p*torch.log(p+1e-12)).sum().item(); ents.append(ent)
          print(f'T={T:5.2f} forward={fw:4d} pizza={pz:4d} entropy={ent:.4f}')
      mono = all(ents[i] < ents[i+1] for i in range(len(ents)-1))
      print('TEMPERATURE_OK' if inv[torch.argmax(NEXT_TOKEN_LOGITS).item()]=='forward' and mono else 'NG')"
    answer_detail: "엔트로피 단조 증가가 '분포가 평평해진다'의 정량 표현이다. T=5 에서 pizza 가 4% 나오는 것은 창의성의 대가가 헛소리 확률이라는 것을 보여준다."
    verify:
      type: output_contains
      expect: TEMPERATURE_OK
      field: stdout
      semantic:
        intent: "temperature 가 분포에 미치는 영향을 샘플링·엔트로피로 정량 측정"
        success_criteria: ["argmax forward 6.75", "T별 빈도 변화", "엔트로피 단조 증가"]

  - order: 2
    instruction: |
      ## 🎯 미션 — top-k: `-inf` 트릭의 세 번째 등장

      ## 💡 구현
      ```python
      top_logits, _ = torch.topk(logits, k)
      min_val = top_logits[..., -1]
      logits = torch.where(logits < min_val, torch.tensor(float('-inf')), logits)
      ```
      **5주차 인과 마스크와 정확히 같은 트릭이다.** 0으로 만들면 `e⁰=1` 이라 남지만
      `-inf` 로 만들면 `e^(-inf)=0` 이라 사라진다. 이 수업에서 세 번째로 나오는 패턴이다.

      ## 💡 예상 결과 (k=3)
      남는 로짓 = **6.75(forward), 6.28(toward), 4.51(closer)**.
      나머지 6개는 softmax 후 **정확히 0**, 확률 합 **1.0**.

      ## ⚠️ top-k 와 temperature 를 함께 쓸 때 순서
      **먼저 top-k 마스킹 → temperature 나눗셈 → softmax.** 순서를 바꾸면 `-inf / T` 가 되어
      (여전히 `-inf` 라 결과는 같지만) 의도가 흐려진다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] decoding.py 에 top-k 마스킹을 추가하고 확률이 어떻게 재분배되는지 확인한다

      [할 일]
       1. topk_mask(logits, k) 를 만든다
          - 상위 k 개 로짓을 찾는다
          - 그 중 최솟값보다 작은 로짓을 전부 -inf 로 바꾼다
          - 마스킹된 로짓 텐서를 반환한다
       2. k=3 으로 적용한 뒤, -inf 가 아닌 원소를 (단어, 값) 쌍으로 출력한다
          TOPK3_KEPT <리스트>
       3. 마스킹된 로짓에 softmax 를 적용하고
          - 정확히 0인 원소의 개수를 출력한다: ZERO_COUNT <수> (9 - 3 = 6 이어야 한다)
          - 확률의 합을 출력한다: PROB_SUM <소수 6자리>
       4. ZERO_COUNT 가 6 이고 합이 1.0 이면 TOPK_OK, 아니면 NG

      [제약]
       - 마스킹 값은 반드시 -inf 다. 0 이나 아주 작은 음수로 대체하지 말 것
       - 잘라낸 확률을 수동으로 재분배하지 말 것. softmax 가 알아서 한다
       - 상위 k 를 정렬해서 앞에서 자르지 말고, 임계값 비교로 마스킹할 것
         (동점 처리가 달라진다)

      [검증] 세 줄을 모두 출력하고, 잘라냈는데도 확률 합이 1인 이유를 설명할 것.
             그리고 이 -inf 트릭이 이 수업에서 몇 번째로 나오는 것인지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from decoding import VOCAB, NEXT_TOKEN_LOGITS, topk_mask
      inv = {v: k for k, v in VOCAB.items()}
      top = topk_mask(NEXT_TOKEN_LOGITS, 3)
      kept = [(inv[i], round(v,2)) for i, v in enumerate(top.tolist()) if v != float('-inf')]
      print('TOPK3_KEPT', kept)
      pk = torch.softmax(top, dim=-1)
      print('ZERO_COUNT', (pk == 0).sum().item(), '(9 - 3 = 6 이어야 한다)')
      print('PROB_SUM  ', round(pk.sum().item(), 6))
      ok = (pk == 0).sum().item() == 6 and abs(pk.sum().item()-1.0) < 1e-6
      print('TOPK_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `ZERO_COUNT 6`, `PROB_SUM 1.0`, `TOPK_OK`. 실측 출력:
      ```
      TOPK3_KEPT [('closer', 4.51), ('forward', 6.75), ('toward', 6.28)]
      ZERO_COUNT 6 (9 - 3 = 6 이어야 한다)
      PROB_SUM   1.0
      ```
      **0이 아닌 작은 값이 남으면 `-inf` 대신 0 마스킹을 한 것이다.**

      ## 🔍 에이전트 판정 포인트
      **W05 1단계의 함정이 그대로 재현된다.** 에이전트가 마스킹을 `logits * mask` 나
      `logits.masked_fill(..., 0)` 으로 구현하면 `e⁰ = 1` 이라 잘라낸 6개에 **작지만 0이 아닌
      확률**이 남는다. `ZERO_COUNT` 가 6 이 아니라 0 으로 나온다. 5주차에서 이미 겪은 실수이고,
      **같은 실수가 다른 옷을 입고 돌아온 것**이다.

      **`TOPK3_KEPT` 의 순서에 놀라지 마라.** `closer` 가 먼저 나오는 것은 어휘 인덱스 순서로
      출력했기 때문이지 로짓 크기 순서가 아니다. 값을 보면 6.75 > 6.28 > 4.51 이다.

      **확률 합이 1인 이유를 설명하게 하라.** 잘라낸 뒤 **다시 softmax** 하므로 남은 3개끼리
      정규화가 일어난다. "확률을 버렸는데 합이 1"이라는 것이 이상하지 않아야 한다.

      **top-k 와 temperature 를 함께 쓸 때 순서:** **먼저 top-k 마스킹 → temperature 나눗셈
      → softmax.** 순서를 바꾸면 `-inf / T` 가 되어 (여전히 `-inf` 라 결과는 같지만) 의도가
      흐려진다.

      **-inf 트릭은 이번이 세 번째다** — W05 인과 마스크, W08 argmax 진단, 그리고 여기.
      "후보에서 완전히 제외한다"를 수학적으로 표현하는 표준 방법이다.
    hint: '나머지를 -inf 로 만든 뒤 다시 softmax 하므로 확률이 재분배된다 — 그래서 합이 1이다'
    answer: |
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from decoding import VOCAB, NEXT_TOKEN_LOGITS, topk_mask
      inv = {v: k for k, v in VOCAB.items()}
      top = topk_mask(NEXT_TOKEN_LOGITS, 3)
      kept = [(inv[i], round(v,2)) for i, v in enumerate(top.tolist()) if v != float('-inf')]
      print('TOPK3_KEPT', kept)
      pk = torch.softmax(top, dim=-1)
      print('ZERO_COUNT', (pk == 0).sum().item(), '(9 - 3 = 6 이어야 한다)')
      print('PROB_SUM  ', round(pk.sum().item(), 6))
      ok = (pk == 0).sum().item() == 6 and abs(pk.sum().item()-1.0) < 1e-6
      print('TOPK_OK' if ok else 'NG')"
