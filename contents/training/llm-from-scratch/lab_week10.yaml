description: |
  greedy 생성의 단조로움을 temperature 와 top-k 로 푼다. 장난감 어휘로 두 손잡이의 효과를 샘플링
  빈도와 엔트로피로 측정하고, -inf 마스킹이 세 번째로 등장하는 것을 확인한다. 모델+옵티마이저
  체크포인트로 훈련을 매끄럽게 재개한 뒤, OpenAI GPT-2 공식 가중치(safetensors)를 내 GPTModel 에
  이식한다 — QKV chunk 분할과 전치가 W04 연습문제 3.1 그대로 회수된다. 마지막으로 4모델 val 손실
  비교표로 "차이는 데이터의 양"을 확인한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  ## 📁 `common.py` 를 먼저 만든다 (P10-0)

  W09 와 같은 방식으로 `/work/week10/common.py` 에 경로 등록과 공통 상수를 모은다.
  `week03`·`week07`·`week09` 경로 등록, `device`, `text_to_token_ids` / `token_ids_to_text`,
  그리고 `MODEL_10EP`(week09 체크포인트 경로)와 `VERDICT`(the-verdict.txt 경로) 상수를 둔다.
  **이후 모든 단계의 스크립트는 `common` 을 먼저 import 한다.**
