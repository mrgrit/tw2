           - top_k 가 주어졌으면 topk_mask 를 적용한다
           - temperature > 0 이면 (로짓 / temperature) 에 softmax 후 multinomial 샘플링
           - temperature == 0 이면 argmax (greedy 폴백)
           - 고른 토큰을 이어 붙인다

       2. /work/week10/test_decoding.py 에 다음 테스트를 쓴다
