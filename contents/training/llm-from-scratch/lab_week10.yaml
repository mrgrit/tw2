    answer_detail: "엔트로피 단조 증가가 '분포가 평평해진다'의 정량 표현이다. T=5 에서 pizza 가 4% 나오는 것은 창의성의 대가가 헛소리 확률이라는 것을 보여준다."
    verify:
      type: output_contains
      expect: TEMPERATURE_OK
      field: stdout
      semantic:
        intent: "temperature 가 분포에 미치는 영향을 샘플링·엔트로피로 정량 측정"
        success_criteria: ["argmax forward 6.75", "T별 빈도 변화", "엔트로피 단조 증가"]

  - order: 2
    instruction: |
      ## 🎯 미션 — top-k: `-inf` 트릭의 세 번째 등장

      ## 💡 구현
      ```python
      top_logits, _ = torch.topk(logits, k)
      min_val = top_logits[..., -1]
      logits = torch.where(logits < min_val, torch.tensor(float('-inf')), logits)
      ```
      **5주차 인과 마스크와 정확히 같은 트릭이다.** 0으로 만들면 `e⁰=1` 이라 남지만
      `-inf` 로 만들면 `e^(-inf)=0` 이라 사라진다. 이 수업에서 세 번째로 나오는 패턴이다.

      ## 💡 예상 결과 (k=3)
      남는 로짓 = **6.75(forward), 6.28(toward), 4.51(closer)**.
      나머지 6개는 softmax 후 **정확히 0**, 확률 합 **1.0**.

      ## ⚠️ top-k 와 temperature 를 함께 쓸 때 순서
      **먼저 top-k 마스킹 → temperature 나눗셈 → softmax.** 순서를 바꾸면 `-inf / T` 가 되어
      (여전히 `-inf` 라 결과는 같지만) 의도가 흐려진다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week10 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from decoding import VOCAB, NEXT_TOKEN_LOGITS, topk_mask
      inv = {v: k for k, v in VOCAB.items()}
      top = topk_mask(NEXT_TOKEN_LOGITS, 3)
      kept = [(inv[i], round(v,2)) for i, v in enumerate(top.tolist()) if v != float('-inf')]
      print('TOPK3_KEPT', kept)
      pk = torch.softmax(top, dim=-1)
      print('ZERO_COUNT', (pk == 0).sum().item(), '(9 - 3 = 6 이어야 한다)')
      print('PROB_SUM  ', round(pk.sum().item(), 6))
      ok = (pk == 0).sum().item() == 6 and abs(pk.sum().item()-1.0) < 1e-6
      print('TOPK_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `ZERO_COUNT 6`, `PROB_SUM 1.0`, `TOPK_OK`.
      **0이 아닌 작은 값이 남으면 `-inf` 대신 0 마스킹을 한 것이다.**
    hint: '나머지를 -inf 로 만든 뒤 다시 softmax 하므로 확률이 재분배된다 — 그래서 합이 1이다'
    answer: |
