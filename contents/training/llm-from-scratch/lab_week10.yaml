      **내가 만든 클래스에 OpenAI 가 훈련한 1억 2천만 개의 숫자를 부어 넣는다.**

      ## 🔴 다운로드 경로에 함정이 셋 있다
      | 경로 | 문제 |
      |---|---|
      | 교재의 TensorFlow 체크포인트 | 이 환경에 **TF 가 없다** (aarch64 + CUDA 13) |
      | **`.safetensors`** | ✅ **이 경로를 쓴다** |
      | 변환된 `.pth` | 🔴 **미션이 무력화된다** — `load_state_dict()` 한 줄로 끝난다 |

      실제로 확인해 봤다 — 702MB `.pth` 를 받아 `load_state_dict(..., strict=True)` 를 돌리니
      **한 줄로 성공**했다. chunk 분할도 전치도 배우지 못한다. **safetensors 를 필수로 쓴다.**

      ## 💡 두 가지 변환
      **(a) QKV chunk 분할** — OpenAI 는 `c_attn.weight` 하나에 Q/K/V 를 붙여 저장한다
      (`[768, 2304]`). `torch.chunk(w, 3, dim=-1)` 로 셋으로 나눈다.

      **(b) 전치** — TF 규약은 `(입력, 출력)`, PyTorch `nn.Linear` 는 `(출력, 입력)` 이다.
      **W04 연습문제 3.1 그 자체다.** 6주 전의 연습이 오늘 회수된다.

