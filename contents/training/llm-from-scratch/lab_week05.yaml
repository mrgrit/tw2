  - order: 7
    instruction: |
      ## 🎯 미션 — 그런데 시간은 3배 느려진다 (GPU 실측)

      파라미터가 같으니 비용도 같을까? **아니다.**

      ## ⚠️ GPU 측정 규약 (이 과목 표준)
      1. 모델과 입력을 **명시적으로 device 로 이동**한다.
      2. **워밍업**을 3회 돌린다(첫 호출은 커널 컴파일·캐시 때문에 느리다).
      3. 측정 전후에 **`torch.cuda.synchronize()`** 를 호출한다. CUDA 는 비동기라 이걸 빼면
         커널이 끝나기 전에 시간이 찍혀 **말도 안 되게 빠른 값**이 나온다.
      4. 큰 모델은 측정 후 `del` + `torch.cuda.empty_cache()`.

      ## 💡 왜 느려지는가
      어텐션 점수 텐서 `attn_weights` 의 shape 는 `[B, num_heads, T, T]` 로 **헤드 수에
      정비례**해 커진다. `context_length=1024`, 12헤드면 `4 × 12 × 1024 × 1024` = **5,030만 원소**
      이고 softmax·마스킹이 이 전부를 훑는다. 파라미터는 그대로여도 **중간 활성값의 부피가 12배**다.

      참고 실측(GB10): 1헤드 **3.48ms** → 4헤드 **5.11ms** → 12헤드 **10.10ms** (**2.90배**).
      절대 시간은 GPU 부하 상태에 따라 달라지므로, **단조 증가와 배율**을 기준으로 판정한다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch, time
      from multihead import MultiHeadAttention
      dev = torch.device('cuda')
      x = torch.randn(4, 1024, 768, device=dev)
      ts = []
      for h in [1, 4, 12]:
          m = MultiHeadAttention(768, 768, 1024, 0.0, h).to(dev)
          for _ in range(3):
              with torch.no_grad(): m(x)
          torch.cuda.synchronize(); t0 = time.time()
          for _ in range(10):
              with torch.no_grad(): m(x)
          torch.cuda.synchronize(); dt = (time.time()-t0)/10*1000
          p = sum(q.numel() for q in m.parameters())
          print(f'heads={h:2d} head_dim={m.head_dim:3d} params={p:,} time={dt:.2f}ms')
          ts.append(dt); del m; torch.cuda.empty_cache()
      ratio = ts[-1]/ts[0]
      print(f'RATIO_12_OVER_1={ratio:.2f}')
      print('HEADS_TIMING_OK' if ts[0] < ts[1] < ts[2] and ratio >= 2.0 else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      시간이 **단조 증가**하고 12헤드/1헤드 배율이 **2.0 이상**, `HEADS_TIMING_OK`.

      ## 📝 해석 과제 (report.md 에 **직접** 작성)
      파라미터 수가 같은데도 GPT-2 가 헤드를 12개로 나눈 이유는? "여러 관점"이라는 통설을
      `head_dim` 과 연결해 3~5문장으로 쓰고, 위 시간 측정을 근거로 "그 대가는 무엇인가"를
      한 문장 덧붙여라.
    hint: 'synchronize 를 빼고 돌려 보라 — 말도 안 되게 빠른 값이 나온다. 그것이 비동기 실행이다'
    answer: |
