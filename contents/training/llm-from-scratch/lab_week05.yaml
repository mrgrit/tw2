lab_id: llm-from-scratch-week05
title: "W05 — 미래를 보지 마라: 인과 마스크·드롭아웃·멀티헤드·헤드 수 통념 깨기"
version: ai
course: llm-from-scratch
week: 5
description: |
  어텐션에 인과 마스크를 씌워 미래 토큰을 가린다. 0 으로 마스킹하는 순진한 방식이 왜 조용히
  틀리는지(e⁰=1) 실측으로 증명하고, -inf 방식과 재정규화 방식의 동치를 확인한다. 드롭아웃의
  역스케일링을 관찰한 뒤 배치 지원 CausalAttention → 래퍼 멀티헤드 → 분할 멀티헤드로 발전시키고,
  GPT-2 규모(768/12헤드) 파라미터 2,360,064 를 손계산 대조한다. 마지막으로 헤드 수를 바꿔도
  파라미터는 같은데 시간은 3배 느려지는 것을 GPU 에서 측정한다.
difficulty: medium
duration_minutes: 170
audience: LLM 밑바닥 구현 (5주차)
prerequisites:
  - W04 완료 — SelfAttention v1/v2, √d 스케일링, 전치 규약
  - "`/work/week05/inputs.py` 에 교재 3장 장난감 텐서(6×3)"
  - GPU 사용 규약 숙지 — device 이동, torch.cuda.synchronize, del + empty_cache
  - W05 강의안 정독 — 정답 누출, -inf 마스킹, 역스케일링, 활성값 부피
objectives:
  - "0 마스킹이 미래에 0 아닌 가중치를 남긴다는 것을 실측으로 확인한다"
  - "재정규화 방식과 -inf 방식의 동치를 allclose 로 증명한다"
  - "인과 마스크 첫 행이 [1,0,0,0,0,0] 임을 확인한다"
  - "드롭아웃 train 모드 살아남은 값이 2.0 인 이유를 설명한다"
  - "CausalAttention 배치 출력 [2,6,2] 를 확인한다"
  - "래퍼/분할 멀티헤드 출력이 모두 [2,6,4] 이고 d_out 의미가 다름을 안다"
  - "GPT-2 규모 파라미터 2,360,064 / 2,362,368 을 공식과 대조한다"
  - "헤드 수를 바꿔도 파라미터가 동일함을 확인한다"
  - "인과성 성질 테스트로 미래 변경이 과거 출력에 영향 없음을 검사한다"
  - "GPU 에서 헤드 수에 따른 forward 시간 증가를 측정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 순진한 0 마스킹의 함정 (조용히 틀리는 버그)

      "미래 점수를 0으로 만들면 안 보게 되지 않나?" — **틀리다.** 이것을 먼저 실측한다.

      ## 🔴 왜 틀리는가
      ```
      점수       : [1.0, 2.0, 3.0]
      0으로 마스킹 : [1.0, 0.0, 0.0]
      softmax    : [0.5761, 0.2119, 0.2119]   ← 미래에 21% 씩 남아 있다
      ```
      **`softmax(0) = e⁰ = 1` 이기 때문이다.** 0은 "없음"이 아니라 "중간값"이다.
      반면 `e^(-inf) = 0` 이므로 `-inf` 는 진짜로 후보에서 제외한다.

      ## ⚠️ 이 함정이 무서운 이유
      출력 shape 도 맞고, 행 합도 1이고, **오류도 안 난다.** 모델은 미래를 21% 씩 보면서
      훈련되고, 학생은 손실이 잘 내려간다고 기뻐하다가 생성 단계에서야 이상함을 발견한다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      sc = torch.tensor([[1.0, 2.0, 3.0]])
      mask = torch.tensor([[1.0, 0.0, 0.0]])
      naive = torch.softmax(sc * mask, dim=-1)
      print('ZERO_MASKED_SOFTMAX', [round(v,4) for v in naive[0].tolist()])
      print('ZERO_MASK_LEAK_OK' if naive[0][1].item() > 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `[0.5761, 0.2119, 0.2119]` 처럼 **미래 위치에 0이 아닌 값**이 남고 `ZERO_MASK_LEAK_OK`.
    hint: 'e^0 = 1 이다. 0 은 "제외"가 아니라 "중간 점수"다'
    answer: |
      docker exec llm-lab python3 -c "
      import torch
      sc = torch.tensor([[1.0, 2.0, 3.0]])
      mask = torch.tensor([[1.0, 0.0, 0.0]])
      naive = torch.softmax(sc * mask, dim=-1)
      print('ZERO_MASKED_SOFTMAX', [round(v,4) for v in naive[0].tolist()])
      print('ZERO_MASK_LEAK_OK' if naive[0][1].item() > 0 else 'NG')"
    answer_detail: "이 -inf 트릭은 10주차 top-k 샘플링에서 정확히 같은 형태로 다시 나온다. 지금 왜 0이 아니라 -inf 인지 이해해 두면 그때 막히지 않는다."
    verify:
      type: output_contains
      expect: ZERO_MASK_LEAK_OK
      field: stdout
      semantic:
        intent: "0 마스킹이 미래 정보를 차단하지 못함을 실측으로 확인"
        success_criteria: ["softmax(0)=1 이해", "미래에 잔여 가중치 관찰"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 인과 마스크 두 방식의 동치 증명

      올바른 방식은 두 가지다. 둘이 같은 답을 내는지 증명한다.

      ## 💡 두 방식
      | 방식 | 절차 |
      |---|---|
      | **A (재정규화)** | softmax 먼저 → 상삼각 0 → 행 합으로 나눠 재정규화 |
      | **B (-inf)** | 상삼각을 `-inf` 로 채움 → softmax 한 번 |

      **왜 같은가.** softmax 는 분자·분모에 같은 상수를 곱해도 값이 안 변한다. A 의 "0으로 만들고
      행 합으로 나누기"는 결국 **살아남은 항들만으로 다시 softmax 하는 것**과 같다. 다만 A 는 두 번
      계산하고 B 는 한 번이므로 **실전은 B** 를 쓴다.

      ## 💡 첫 행이 `[1, 0, 0, 0, 0, 0]` 인 이유
      첫 토큰은 볼 수 있는 것이 **자기 자신뿐**이라 가중치 전부가 자기에게 간다. 이 값은 마스크
      방향(`tril`/`triu` 혼동)을 잡아내는 좋은 지표다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch
      from inputs import inputs
      torch.manual_seed(123)
      W = torch.nn.Linear(3, 2, bias=False)
      q = W(inputs); k = W(inputs); sc = q @ k.T
      wA = torch.softmax(sc / 2**0.5, dim=-1)
      wA = wA * torch.tril(torch.ones(6,6)); wA = wA / wA.sum(dim=-1, keepdim=True)
      scB = sc.masked_fill(torch.triu(torch.ones(6,6), diagonal=1).bool(), -torch.inf)
      wB = torch.softmax(scB / 2**0.5, dim=-1)
      print('A_EQ_B', torch.allclose(wA, wB, atol=1e-6))
      print('UPPER_ZERO', torch.allclose(wB.triu(1), torch.zeros(6,6)))
      print('ROWSUM', torch.allclose(wB.sum(-1), torch.ones(6)))
      print('FIRSTROW', [round(v,4) for v in wB[0].tolist()])
      print('CAUSAL_MASK_OK' if torch.allclose(wA, wB, atol=1e-6) and wB[0].tolist()[0]==1.0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `A_EQ_B True`, `UPPER_ZERO True`, `ROWSUM True`, `FIRSTROW [1.0, 0.0, ...]`, `CAUSAL_MASK_OK`.
    hint: 'tril 은 하삼각(과거), triu(diagonal=1) 은 대각선 제외 상삼각(미래)이다'
    answer: |
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch
      from inputs import inputs
      torch.manual_seed(123)
      W = torch.nn.Linear(3, 2, bias=False)
      q = W(inputs); k = W(inputs); sc = q @ k.T
      wA = torch.softmax(sc / 2**0.5, dim=-1)
      wA = wA * torch.tril(torch.ones(6,6)); wA = wA / wA.sum(dim=-1, keepdim=True)
      scB = sc.masked_fill(torch.triu(torch.ones(6,6), diagonal=1).bool(), -torch.inf)
      wB = torch.softmax(scB / 2**0.5, dim=-1)
      print('A_EQ_B', torch.allclose(wA, wB, atol=1e-6))
      print('UPPER_ZERO', torch.allclose(wB.triu(1), torch.zeros(6,6)))
      print('ROWSUM', torch.allclose(wB.sum(-1), torch.ones(6)))
      print('FIRSTROW', [round(v,4) for v in wB[0].tolist()])
      print('CAUSAL_MASK_OK' if torch.allclose(wA, wB, atol=1e-6) and wB[0].tolist()[0]==1.0 else 'NG')"
    answer_detail: "훈련 조건과 추론 조건이 달라지면 모델은 쓸모가 없다. 생성할 때는 아직 안 만든 미래 토큰이 존재하지 않으므로, 훈련에서도 미래를 가려야 한다. 이것이 인과 어텐션의 존재 이유다."
    verify:
      type: output_contains
      expect: CAUSAL_MASK_OK
      field: stdout
      semantic:
        intent: "인과 마스크 두 구현의 동치 증명과 마스크 방향 확인"
        success_criteria: ["A==B allclose", "상삼각 0", "행 합 1", "첫 행 [1,0,...]"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 드롭아웃의 역스케일링 관찰

      드롭아웃을 켜면 살아남은 값이 **원래보다 커진다.** 왜인지 확인한다.

      ## 💡 왜 2.0 인가
      절반(p=0.5)을 껐으니 남은 절반이 **두 배로 일해야** 합의 기댓값이 유지된다.
      `1 / (1 − 0.5) = 2`. 이 방식을 **역스케일링 드롭아웃(inverted dropout)** 이라 하고,
      덕분에 추론(eval) 때는 아무 처리도 필요 없다.

      | 모드 | 원소 값 집합 |
      |---|---|
      | `train()` | `{0.0, 2.0}` ← 살아남은 값이 **2.0** |
      | `eval()` | `{1.0}` ← 아무것도 안 함 |

      ## ⚠️ `model.eval()` 빼먹기 — 이 수업 최다 버그
      9주차 손실 평가, 10주차 생성, 11주차 정확도 측정에서 전부 문제가 된다. 평가 결과가
      실행할 때마다 미묘하게 달라진다면 제일 먼저 의심하라.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      d = torch.nn.Dropout(0.5); x = torch.ones(6, 6)
      d.train(); o = d(x)
      print('TRAIN_VALUES', sorted(set(o.flatten().tolist())))
      d.eval(); oe = d(x)
      print('EVAL_VALUES ', sorted(set(oe.flatten().tolist())))
      print('DROPOUT_SCALE_OK' if 2.0 in o.flatten().tolist() and oe.flatten().tolist()[0]==1.0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `TRAIN_VALUES [0.0, 2.0]`, `EVAL_VALUES [1.0]`, `DROPOUT_SCALE_OK`.
    hint: 'p=0.2 로 바꿔 보면 살아남은 값이 1.25 (= 1/0.8) 가 된다'
    answer: |
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      d = torch.nn.Dropout(0.5); x = torch.ones(6, 6)
      d.train(); o = d(x)
      print('TRAIN_VALUES', sorted(set(o.flatten().tolist())))
      d.eval(); oe = d(x)
      print('EVAL_VALUES ', sorted(set(oe.flatten().tolist())))
      print('DROPOUT_SCALE_OK' if 2.0 in o.flatten().tolist() and oe.flatten().tolist()[0]==1.0 else 'NG')"
    answer_detail: "역스케일링 덕분에 추론 시 별도 보정이 필요 없다. train/eval 모드 전환을 잊으면 평가 결과가 매번 달라지므로, 평가 코드에는 model.eval() 과 torch.no_grad() 를 항상 짝으로 넣는다."
    verify:
      type: output_contains
      expect: DROPOUT_SCALE_OK
      field: stdout
      semantic:
        intent: "드롭아웃 역스케일링과 train/eval 모드 차이 확인"
        success_criteria: ["살아남은 값 2.0", "eval 은 항등", "1/(1-p) 이해"]

  - order: 4
    instruction: |
      ## 🎯 미션 — CausalAttention(배치) → 래퍼 멀티헤드 → 분할 멀티헤드

      세 클래스를 차례로 만들고 출력 shape 를 확인한다.

      ## 💡 구현 포인트 두 가지
      - **`register_buffer("mask", torch.triu(torch.ones(ctx, ctx), diagonal=1))`** — 마스크는
        학습 대상이 아니지만 `.to(device)` 때 같이 따라가야 한다. buffer 로 등록하면 파라미터가
        아니면서 모듈과 함께 이동한다. (`nn.Parameter` 로 만들면 학습 대상이 되어 버린다.)
      - **`self.mask.bool()[:num_tokens, :num_tokens]`** — 실제 입력 길이가 `context_length`
        보다 짧을 수 있으므로 **잘라 써야** 한다.

      ## 💡 래퍼와 분할의 `d_out` 의미가 다르다
      | 방식 | 호출 | 출력 |
      |---|---|---|
      | 래퍼 | `MultiHeadAttentionWrapper(d_in=3, d_out=2, num_heads=2)` | `[2,6,4]` |
      | 분할 | `MultiHeadAttention(d_in=3, d_out=4, num_heads=2)` | `[2,6,4]` |

      래퍼의 `d_out` 은 "헤드 **하나당**", 분할의 `d_out` 은 "**전체**" 차원이다. 그래서 래퍼에서
      `d_out=1` 로 바꾸면 출력이 `[2,6,2]` 가 된다(연습문제 3.2). 분할 방식은 `d_out` 이
      `num_heads` 로 나누어떨어져야 하므로 `assert` 로 못 박는다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch
      from inputs import inputs
      from causal_attention import CausalAttention
      from multihead import MultiHeadAttentionWrapper, MultiHeadAttention
      batch = torch.stack((inputs, inputs), dim=0)
      print('BATCH', tuple(batch.shape))
      torch.manual_seed(123); ca = CausalAttention(3, 2, 6, 0.0)
      torch.manual_seed(123); wr = MultiHeadAttentionWrapper(3, 2, 6, 0.0, 2)
      torch.manual_seed(123); mh = MultiHeadAttention(3, 4, 6, 0.0, 2)
      print('CA_OUT', tuple(ca(batch).shape))
      print('WRAPPER_OUT', tuple(wr(batch).shape))
      print('SPLIT_OUT', tuple(mh(batch).shape), 'head_dim', mh.head_dim)
      ok = (tuple(ca(batch).shape)==(2,6,2) and tuple(wr(batch).shape)==(2,6,4)
            and tuple(mh(batch).shape)==(2,6,4) and mh.head_dim==2)
      print('MHA_SHAPE_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `BATCH (2, 6, 3)`, `CA_OUT (2, 6, 2)`, `WRAPPER_OUT (2, 6, 4)`,
      `SPLIT_OUT (2, 6, 4) head_dim 2`, `MHA_SHAPE_OK`.
    hint: '래퍼에서 d_out=1 로 바꿔 출력이 [2,6,2] 가 되는지도 확인해 보라 (연습문제 3.2)'
    answer: |
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch
      from inputs import inputs
      from causal_attention import CausalAttention
      from multihead import MultiHeadAttentionWrapper, MultiHeadAttention
      batch = torch.stack((inputs, inputs), dim=0)
      print('BATCH', tuple(batch.shape))
      torch.manual_seed(123); ca = CausalAttention(3, 2, 6, 0.0)
      torch.manual_seed(123); wr = MultiHeadAttentionWrapper(3, 2, 6, 0.0, 2)
      torch.manual_seed(123); mh = MultiHeadAttention(3, 4, 6, 0.0, 2)
      print('CA_OUT', tuple(ca(batch).shape))
      print('WRAPPER_OUT', tuple(wr(batch).shape))
      print('SPLIT_OUT', tuple(mh(batch).shape), 'head_dim', mh.head_dim)
      ok = (tuple(ca(batch).shape)==(2,6,2) and tuple(wr(batch).shape)==(2,6,4)
            and tuple(mh(batch).shape)==(2,6,4) and mh.head_dim==2)
      print('MHA_SHAPE_OK' if ok else 'NG')"
    answer_detail: "래퍼는 헤드마다 별도 모듈을 만들어 cat 하고, 분할은 큰 투영 한 번 뒤 view/transpose 로 쪼갠다. 결과는 같지만 분할이 훨씬 빠르다 — 실전 구현이 분할 방식인 이유다. 이 MultiHeadAttention 이 7주차 GPT-2 의 12개 블록에 그대로 들어간다."
    verify:
      type: output_contains
      expect: MHA_SHAPE_OK
      field: stdout
      semantic:
        intent: "배치 인과 어텐션과 두 가지 멀티헤드 구현의 shape 확인"
        success_criteria: ["배치 [2,6,3]", "CA [2,6,2]", "두 MHA 모두 [2,6,4]", "head_dim 2"]

  - order: 5
    instruction: |
      ## 🎯 미션 — GPT-2 규모 파라미터 손계산 (2,360,064)

      실전 크기로 만들어 파라미터 수를 공식과 대조한다.

      ## 💡 공식
      `d_in = d_out = 768`, `num_heads = 12` → `head_dim = 768 / 12 = ` **64**

      | qkv_bias | 파라미터 | 공식 |
      |---|---|---|
      | `False` | **2,360,064** | `3 × 768² + 768² + 768` |
      | `True` | **2,362,368** | `4 × (768² + 768)` |

      앞의 `3 × 768²` 는 Q/K/V 투영(bias 없음), 뒤의 `768² + 768` 은 출력 투영 `out_proj`
      (bias 있음). **직접 계산해 대조하라** — `768² = 589,824` 다.

      ## 🔗 `qkv_bias` 가 왜 중요한가
      OpenAI 의 GPT-2 공식 가중치에는 **QKV bias 가 있다.** 그래서 10주차에서 가중치를 이식하려면
      `qkv_bias=True` 로 모델을 만들어야 한다. 그리고 이 2,304개(=3×768) 차이가 11주차 훈련 가능
