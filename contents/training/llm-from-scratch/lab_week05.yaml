      정비례**해 커진다. `context_length=1024`, 12헤드면 `4 × 12 × 1024 × 1024` = **5,030만 원소**
      이고 softmax·마스킹이 이 전부를 훑는다. 파라미터는 그대로여도 **중간 활성값의 부피가 12배**다.

