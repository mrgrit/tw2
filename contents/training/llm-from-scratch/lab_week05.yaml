  - order: 4
    instruction: |
      ## 🎯 미션 — CausalAttention(배치) → 래퍼 멀티헤드 → 분할 멀티헤드

      세 클래스를 차례로 만들고 출력 shape 를 확인한다.

      ## 💡 구현 포인트 두 가지
      - **`register_buffer("mask", torch.triu(torch.ones(ctx, ctx), diagonal=1))`** — 마스크는
        학습 대상이 아니지만 `.to(device)` 때 같이 따라가야 한다. buffer 로 등록하면 파라미터가
        아니면서 모듈과 함께 이동한다. (`nn.Parameter` 로 만들면 학습 대상이 되어 버린다.)
      - **`self.mask.bool()[:num_tokens, :num_tokens]`** — 실제 입력 길이가 `context_length`
        보다 짧을 수 있으므로 **잘라 써야** 한다.

      ## 💡 래퍼와 분할의 `d_out` 의미가 다르다
      | 방식 | 호출 | 출력 |
      |---|---|---|
      | 래퍼 | `MultiHeadAttentionWrapper(d_in=3, d_out=2, num_heads=2)` | `[2,6,4]` |
      | 분할 | `MultiHeadAttention(d_in=3, d_out=4, num_heads=2)` | `[2,6,4]` |

      래퍼의 `d_out` 은 "헤드 **하나당**", 분할의 `d_out` 은 "**전체**" 차원이다. 그래서 래퍼에서
      `d_out=1` 로 바꾸면 출력이 `[2,6,2]` 가 된다(연습문제 3.2). 분할 방식은 `d_out` 이
      `num_heads` 로 나누어떨어져야 하므로 `assert` 로 못 박는다.

      ## 🤖 에이전트 프롬프트 ① — 배치 지원 인과 어텐션
      ```text
      [목표] /work/week05/causal_attention.py 에 배치를 받는 CausalAttention 을 만든다

      [할 일]
       1. CausalAttention(d_in, d_out, context_length, dropout, qkv_bias=False) 를 정의한다
       2. Q/K/V 투영은 nn.Linear(bias=qkv_bias) 로 만든다
       3. 인과 마스크를 register_buffer 로 등록한다 (이름: mask)
       4. forward(x) 는 [배치, 토큰수, d_in] 을 받아 [배치, 토큰수, d_out] 을 돌려준다
          - 점수를 √head 차원으로 나눈다
          - 마스크로 미래를 -inf 처리한 뒤 softmax
          - dropout 을 적용하고 값과 가중합한다

      [제약]
       - 마스크는 nn.Parameter 가 아니라 register_buffer 로 만들 것.
         Parameter 로 만들면 학습 대상이 되어 옵티마이저가 마스크를 "학습"하려 든다
       - 입력 토큰 수가 context_length 보다 짧을 수 있다.
         마스크를 실제 입력 길이만큼 잘라 쓸 것
       - 배치 차원을 하드코딩하지 말 것

      [검증] 파일 전문을 보이고, register_buffer 를 쓴 이유를 한 문장으로 설명할 것
      ```

      ## 🤖 에이전트 프롬프트 ② — 멀티헤드 두 가지
      ```text
      [목표] /work/week05/multihead.py 에 멀티헤드 어텐션을 두 방식으로 만든다

      [할 일]
       1. MultiHeadAttentionWrapper(d_in, d_out, context_length, dropout, num_heads)
          - CausalAttention 을 num_heads 개 만들어 nn.ModuleList 에 담는다
          - forward 는 각 헤드의 출력을 마지막 차원으로 이어 붙인다(cat)
          - 따라서 출력 차원 = d_out × num_heads

       2. MultiHeadAttention(d_in, d_out, context_length, dropout, num_heads, qkv_bias=False)
          - Q/K/V 투영을 각각 "한 번"만 하고, 결과를 num_heads 개로 쪼갠다
          - head_dim = d_out // num_heads 를 속성으로 남긴다
          - 헤드별 어텐션을 계산한 뒤 다시 합쳐 out_proj 를 통과시킨다
          - 따라서 출력 차원 = d_out

       3. 두 클래스와 CausalAttention 의 출력 shape 를 확인한다
          inputs 를 두 번 쌓아 배치 [2, 6, 3] 을 만든 뒤
          BATCH / CA_OUT / WRAPPER_OUT / SPLIT_OUT(+head_dim) 을 출력하고
          각각 (2,6,3) (2,6,2) (2,6,4) (2,6,4) head_dim 2 이면 MHA_SHAPE_OK

      [제약]
       - 분할 방식은 d_out 이 num_heads 로 나누어떨어져야 한다. assert 로 못 박을 것
       - 세 인스턴스는 각각 만들기 직전에 manual_seed(123) 을 호출할 것
       - 래퍼와 분할의 d_out 인자 의미가 다르다. 같은 값을 넣지 말 것 —
         래퍼는 d_out=2, 분할은 d_out=4 로 호출해야 둘 다 출력이 4가 된다

      [검증] 네 줄의 shape 를 모두 출력하고,
             래퍼와 분할에서 d_out 의 의미가 어떻게 다른지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch
      from inputs import inputs
      from causal_attention import CausalAttention
      from multihead import MultiHeadAttentionWrapper, MultiHeadAttention
      batch = torch.stack((inputs, inputs), dim=0)
      print('BATCH', tuple(batch.shape))
      torch.manual_seed(123); ca = CausalAttention(3, 2, 6, 0.0)
      torch.manual_seed(123); wr = MultiHeadAttentionWrapper(3, 2, 6, 0.0, 2)
      torch.manual_seed(123); mh = MultiHeadAttention(3, 4, 6, 0.0, 2)
      print('CA_OUT', tuple(ca(batch).shape))
      print('WRAPPER_OUT', tuple(wr(batch).shape))
      print('SPLIT_OUT', tuple(mh(batch).shape), 'head_dim', mh.head_dim)
      ok = (tuple(ca(batch).shape)==(2,6,2) and tuple(wr(batch).shape)==(2,6,4)
            and tuple(mh(batch).shape)==(2,6,4) and mh.head_dim==2)
      print('MHA_SHAPE_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `BATCH (2, 6, 3)`, `CA_OUT (2, 6, 2)`, `WRAPPER_OUT (2, 6, 4)`,
      `SPLIT_OUT (2, 6, 4) head_dim 2`, `MHA_SHAPE_OK`.

      ## 🔍 에이전트 판정 포인트
      **`d_out` 의 의미가 두 구현에서 다르다는 것이 이 단계 최대의 혼란 지점이다.**

      | 방식 | 호출 | `d_out` 의 뜻 | 출력 |
      |---|---|---|---|
      | 래퍼 | `(d_in=3, d_out=2, num_heads=2)` | 헤드 **하나당** | `[2,6,4]` |
      | 분할 | `(d_in=3, d_out=4, num_heads=2)` | **전체** | `[2,6,4]` |

      에이전트에게 "두 방식으로 만들어라"라고만 하면 **양쪽에 같은 `d_out` 을 넣는다.**
      그러면 한쪽 출력이 `[2,6,2]` 나 `[2,6,8]` 이 되어 "구현이 틀렸다"고 오진하게 된다.
      실제로 틀린 건 호출 인자다. 래퍼에서 `d_out=1` 로 바꾸면 출력이 `[2,6,2]` 가 되는 것을
      직접 확인해 보라(연습문제 3.2).

      **`register_buffer` 대신 `nn.Parameter` 를 쓰면 지금은 안 죽는다.** shape 도 같고
      forward 도 돈다. 문제는 9주차에 터진다 — 옵티마이저가 마스크를 학습 대상으로 잡아
      **마스크 값이 훈련 중에 변한다.** 인과성이 서서히 무너지는데 에러는 없다.
      반대로 그냥 `self.mask = ...` 로 두면 `.to(device)` 때 따라가지 않아 GPU 에서
      device mismatch 로 죽는다. **buffer 는 "학습은 안 하지만 모듈과 함께 이동하는 것"** 이다.

      **마스크를 자르지 않으면 짧은 입력에서 죽는다.** `self.mask.bool()[:num_tokens, :num_tokens]`
      처럼 실제 입력 길이로 잘라야 한다. 이 실습은 `context_length=6`, 입력도 6토큰이라
      **자르지 않아도 통과한다** — 그래서 이 버그는 여기서 안 잡히고 10주차 생성(토큰이 하나씩
      늘어나는 상황)에서 터진다.

      래퍼는 헤드마다 별도 모듈을 만들어 `cat` 하고, 분할은 큰 투영 한 번 뒤 `view`/`transpose`
      로 쪼갠다. 결과는 같지만 분할이 훨씬 빠르다 — 실전 구현이 분할 방식인 이유다.
      이 `MultiHeadAttention` 이 7주차 GPT-2 의 12개 블록에 그대로 들어간다.
    hint: '래퍼에서 d_out=1 로 바꿔 출력이 [2,6,2] 가 되는지도 확인해 보라 (연습문제 3.2)'
