objectives:
  - "0 마스킹이 미래에 0 아닌 가중치를 남긴다는 것을 실측으로 확인한다"
  - "재정규화 방식과 -inf 방식의 동치를 allclose 로 증명한다"
  - "인과 마스크 첫 행이 [1,0,0,0,0,0] 임을 확인한다"
  - "드롭아웃 train 모드 살아남은 값이 2.0 인 이유를 설명한다"
