lab_id: llm-from-scratch-week05
title: "W05 — 미래를 보지 마라: 인과 마스크·드롭아웃·멀티헤드·헤드 수 통념 깨기"
version: ai
course: llm-from-scratch
week: 5
description: |
  어텐션에 인과 마스크를 씌워 미래 토큰을 가린다. 0 으로 마스킹하는 순진한 방식이 왜 조용히
  틀리는지(e⁰=1) 실측으로 증명하고, -inf 방식과 재정규화 방식의 동치를 확인한다. 드롭아웃의
  역스케일링을 관찰한 뒤 배치 지원 CausalAttention → 래퍼 멀티헤드 → 분할 멀티헤드로 발전시키고,
  GPT-2 규모(768/12헤드) 파라미터 2,360,064 를 손계산 대조한다. 마지막으로 헤드 수를 바꿔도
  파라미터는 같은데 시간은 3배 느려지는 것을 GPU 에서 측정한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.
difficulty: medium
