      **워밍업 없이 재면 첫 값이 부풀려진다.** 그러면 1헤드가 가장 느리게 나와 단조 증가가
      깨지고, 에이전트는 "헤드 수와 시간은 무관합니다"라는 **정반대 결론**을 보고한다.

      **`del` + `empty_cache` 를 빼먹으면 세 모델이 동시에 GPU 에 남는다.** 이 실습 규모에서는
      죽지 않지만 9주차·13주차에서는 OOM 으로 터진다. 지금 습관을 들이는 자리다.

      **왜 느려지는가.** 어텐션 점수 텐서의 shape 는 `[B, num_heads, T, T]` 로 **헤드 수에
      정비례**해 커진다. `4 × 12 × 1024 × 1024` = **5,030만 원소**이고 softmax·마스킹이 이
      전부를 훑는다. 파라미터는 그대로여도 **중간 활성값의 부피가 12배**다.
      **모델 크기(파라미터)와 실행 비용(활성값)은 별개의 축이다** — 9주차 메모리 해부에서
      다시 만난다.

      ## 📝 해석 과제 (report.md 에 **직접** 작성)
      파라미터 수가 같은데도 GPT-2 가 헤드를 12개로 나눈 이유는? "여러 관점"이라는 통설을
      `head_dim` 과 연결해 3~5문장으로 쓰고, 위 시간 측정을 근거로 "그 대가는 무엇인가"를
      한 문장 덧붙여라.
    hint: 'synchronize 를 빼고 돌려 보라 — 말도 안 되게 빠른 값이 나온다. 그것이 비동기 실행이다'
    answer: |
      docker exec -w /work/week05 llm-lab python3 -c "
      import torch, time
      from multihead import MultiHeadAttention
      dev = torch.device('cuda')
      x = torch.randn(4, 1024, 768, device=dev)
      ts = []
      for h in [1, 4, 12]:
          m = MultiHeadAttention(768, 768, 1024, 0.0, h).to(dev)
          for _ in range(3):
              with torch.no_grad(): m(x)
          torch.cuda.synchronize(); t0 = time.time()
          for _ in range(10):
              with torch.no_grad(): m(x)
          torch.cuda.synchronize(); dt = (time.time()-t0)/10*1000
          p = sum(q.numel() for q in m.parameters())
          print(f'heads={h:2d} head_dim={m.head_dim:3d} params={p:,} time={dt:.2f}ms')
          ts.append(dt); del m; torch.cuda.empty_cache()
      ratio = ts[-1]/ts[0]
      print(f'RATIO_12_OVER_1={ratio:.2f}')
      print('HEADS_TIMING_OK' if ts[0] < ts[1] < ts[2] and ratio >= 2.0 else 'NG')" 2>/dev/null
    answer_detail: "'파라미터 수가 같다 = 비용이 같다'가 아니다. 모델 크기(파라미터)와 실행 비용(활성값·중간 텐서)은 별개의 축이다. 9주차 메모리 해부에서 다시 만난다 — 실측하지 않고 '비슷하겠지'라고 넘어가면 놓치는 사실이다."
    verify:
      type: output_contains
      expect: HEADS_TIMING_OK
      field: stdout
      semantic:
        intent: "헤드 수에 따른 실행 시간 증가를 GPU 규약대로 측정"
        success_criteria: ["워밍업 + synchronize", "단조 증가 확인", "배율 2배 이상"]

