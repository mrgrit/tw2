      ## 💡 왜 같은가
      헤드를 나누는 것은 **같은 크기의 투영 출력을 조각내 병렬로 보는 것**이지 투영을 늘리는 게
      아니다. `768` 을 12조각(64씩)으로 자르든 1조각(768)으로 두든, 투영 행렬은 `768×768`
      그대로다. **`head_dim` 만 768 → 192 → 64 로 줄어든다.**

      | num_heads | head_dim | 파라미터 |
      |---|---|---|
      | 1 | 768 | **2,360,064** |
      | 4 | 192 | **2,360,064** |
      | 12 | 64 | **2,360,064** |

