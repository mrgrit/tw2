  - order: 5
    instruction: |
      ## 🎯 미션 — GPT-2 규모 파라미터 손계산 (2,360,064)

      실전 크기로 만들어 파라미터 수를 공식과 대조한다.

      ## 💡 공식
      `d_in = d_out = 768`, `num_heads = 12` → `head_dim = 768 / 12 = ` **64**

      | qkv_bias | 파라미터 | 공식 |
      |---|---|---|
      | `False` | **2,360,064** | `3 × 768² + 768² + 768` |
      | `True` | **2,362,368** | `4 × (768² + 768)` |

      앞의 `3 × 768²` 는 Q/K/V 투영(bias 없음), 뒤의 `768² + 768` 은 출력 투영 `out_proj`
      (bias 있음). **직접 계산해 대조하라** — `768² = 589,824` 다.

      ## 🔗 `qkv_bias` 가 왜 중요한가
      OpenAI 의 GPT-2 공식 가중치에는 **QKV bias 가 있다.** 그래서 10주차에서 가중치를 이식하려면
      `qkv_bias=True` 로 모델을 만들어야 한다. 그리고 이 2,304개(=3×768) 차이가 11주차 훈련 가능
      파라미터 계산에까지 영향을 준다.

