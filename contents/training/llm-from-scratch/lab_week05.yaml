      값을 대조하는 대신 **규칙을 검사**한다.

      ## 💡 test_causal_invariance 의 아이디어
      ```
      ① 입력 시퀀스로 출력을 계산한다
      ② 마지막 토큰만 바꾼 입력으로 다시 계산한다
      ③ 마지막 위치를 제외한 모든 출력이 동일해야 한다
      ```
      **"미래를 바꿔도 과거의 출력이 안 변한다"** — 인과 어텐션의 **정의 그 자체를 테스트로
      옮긴 것**이다.

      ## 📌 좋은 테스트는 구현 세부가 아니라 성질을 검사한다
      값 대조는 구현이 바뀌면 깨지지만, 성질 테스트는 구현이 어떻게 바뀌어도 살아남는다.
      그리고 성질 테스트는 **당신이 예상하지 못한 버그까지** 잡는다. 이 테스트 하나로
      "마스크 방향 반대", "0 마스킹", "transpose 누락"이 전부 걸린다.

      ## 💡 나머지 두 테스트
      | 테스트 | 지키는 성질 |
      |---|---|
      | `test_output_shape` | `[B, T, d_out]` 유지 |
      | `test_head_divisibility` | `d_out % num_heads != 0` 이면 assert 발생 |

      ## 🎴 함정 카드 — `mha_trap.py`
      조교가 배포하는 `mha_trap.py` 에는 겉보기에 멀쩡하지만 **버그가 1개** 있다.
      **절차가 중요하다:**
      1. **[에이전트 금지]** 직접 정독하고 의심 지점 1~3곳을 줄 번호와 함께 메모
      2. **[에이전트]** 기준 구현과 동일 시드·가중치·입력으로 **차등 테스트**, 어느 중간 단계부터
