lab_id: llm-from-scratch-week13
title: "W13 — 지시를 따르는 모델, 그리고 심판: SFT·LLM-as-judge 검증·LoRA"
version: ai
course: llm-from-scratch
week: 13
description: |
  355M 모델을 지시 튜닝해 손실 3.8 → 0.61 로 낮추고 응답 형식을 갖추게 한다. 그다음 자유 형식
  응답을 어떻게 채점할 것인가라는 평가 문제를 LLM-as-judge(로컬 Ollama llama3.1:8b)로 푼다.
  단, 심판의 상한·하한·결정성을 직접 검증한다 — temperature=0 인데도 8.2% 가 흔들리고, 무관한
  문장이 95점을 받는 것을 실측한다. 마지막으로 LoRA 로 파라미터의 1% 만 훈련해 같은 품질을 얻는다.
difficulty: hard
duration_minutes: 200
audience: LLM 밑바닥 구현 (13주차)
prerequisites:
  - W12 완료 — 지시 데이터 935/110/55, collate -100 마스킹
  - W10 완료 — OpenAI 355M 가중치 이식
  - 호스트에 Ollama 실행 + `llama3.1:8b` 준비 (`ollama pull llama3.1:8b`)
  - W13 강의안 정독 — 172.17.0.1 접속, 저지 검증 3종, B=0 항등 게이트
objectives:
  - "튜닝 전 355M 손실이 3.8 안팎임을 기록한다"
  - "2 에폭 지시 튜닝 후 train 0.31 / val 0.61 을 확인한다"
  - "테스트셋 110개 응답에 빈 응답이 0건임을 확인한다"
  - "컨테이너에서 172.17.0.1:11434 로 Ollama 에 접속한다"
  - "저지 채점 110/110, 파싱 실패 0, 평균 60.92 를 얻는다"
  - "저지의 상한·하한·결정성을 직접 검증한다"
  - "LoRA B=0 항등 게이트를 증명한다"
  - "LoRA 와 풀 튜닝을 파라미터·메모리·시간·품질 4축으로 비교한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 튜닝 **전** 상태 기록

      **"전"을 기록하지 않으면 "후"를 말할 수 없다.** W09 훈련 전 손실, W11 훈련 전 정확도와
      같은 습관이다.

      ## 💡 예상 결과
      | 항목 | 값 |
      |---|---|
      | 355M train/val 손실 | **3.8 안팎** |
      | 생성 | 지시를 따르지 않음 (문장을 이어 씀) |

      W10 에서 확인한 OpenAI 355M 의 the-verdict val 손실 3.36 과 비슷한 동네다 —
      **사전훈련 모델은 지시 데이터를 특별히 잘 예측하지도, 못 예측하지도 않는다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      d = json.load(open('before_tuning.json'))
      print('BEFORE_TUNING', json.dumps(d, ensure_ascii=False)[:400])
      loss = d.get('val_loss') or d.get('val') or d.get('loss')
      print('BEFORE_LOSS', loss)
      print('BEFORE_TUNING_OK' if loss and 3.0 < float(loss) < 4.5 else 'NG')"
      ```
      ## ✅ 합격 기준
      튜닝 전 손실이 **3.0~4.5** 범위이고 `BEFORE_TUNING_OK`.
      6점대가 나오면 사전훈련 가중치를 로드하지 않은 것이다.
    hint: '이 값이 뒤에서 LoRA 항등 게이트의 기준값(3.8172)이 된다'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      d = json.load(open('before_tuning.json'))
      print('BEFORE_TUNING', json.dumps(d, ensure_ascii=False)[:400])
      loss = d.get('val_loss') or d.get('val') or d.get('loss')
      print('BEFORE_LOSS', loss)
      print('BEFORE_TUNING_OK' if loss and 3.0 < float(loss) < 4.5 else 'NG')"
    answer_detail: "튜닝 전 기준선이 있어야 '얼마나 달라졌는가'를 말할 수 있다. 그리고 이 값은 W13 후반 LoRA 의 B=0 항등 게이트 검증에서 정확히 재사용된다."
    verify:
      type: output_contains
      expect: BEFORE_TUNING_OK
      field: stdout
      semantic:
        intent: "지시 튜닝 전 기준선 기록"
        success_criteria: ["손실 3.8 안팎", "지시 미추종 확인"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 지시 튜닝 (2 에폭) 결과 확인

      ## 💡 무엇이 바뀌나
      **구조는 하나도 안 바뀐다.** 같은 GPTModel, 같은 파라미터 수다. 바뀌는 것은
      **가중치의 값**과 그로 인한 **행동**이다.

      | 항목 | 튜닝 전 | 튜닝 후 |
      |---|---|---|
      | train 손실 | 3.8 안팎 | **0.3146** |
      | val 손실 | 3.8 안팎 | **0.6131** |
      | 훈련 시간 | — | **98초** |
      | peak 메모리 | — | **8.28 GB** |

      ## 💡 train < val 에 주목
      과적합의 시작이지만 W09 처럼 val 이 다시 올라갈 정도는 아니다. 데이터가 935건으로
      5,145 토큰보다 훨씬 많기 때문이다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      m = json.load(open('sft_meta.json'))
      print(f\"TRAIN_LOSS {m['train_loss']:.4f}\")
      print(f\"VAL_LOSS   {m['val_loss']:.4f}\")
      print(f\"ELAPSED    {m['elapsed_sec']:.1f}s\")
      print(f\"PEAK_GB    {m['peak_gb']:.2f}\")
      ok = m['train_loss'] < 1.0 and m['val_loss'] < 1.0 and m['train_loss'] < m['val_loss']
      print('SFT_TRAIN_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      두 손실 모두 **1 미만**, `train < val`, `SFT_TRAIN_OK`.
    hint: '손실이 1 이상이면 에폭 수나 학습률을 확인하라'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      m = json.load(open('sft_meta.json'))
      print(f\"TRAIN_LOSS {m['train_loss']:.4f}\")
      print(f\"VAL_LOSS   {m['val_loss']:.4f}\")
      print(f\"ELAPSED    {m['elapsed_sec']:.1f}s\")
      print(f\"PEAK_GB    {m['peak_gb']:.2f}\")
      ok = m['train_loss'] < 1.0 and m['val_loss'] < 1.0 and m['train_loss'] < m['val_loss']
      print('SFT_TRAIN_OK' if ok else 'NG')"
    answer_detail: "peak 8.28GB 는 다음 단계 LoRA 비교(4.5GB)의 기준값이 된다. 시간 98초도 마찬가지 — 4축 비교(파라미터·메모리·시간·품질)의 재료를 여기서 확보한다."
    verify:
      type: output_contains
      expect: SFT_TRAIN_OK
      field: stdout
      semantic:
        intent: "지시 튜닝 결과 손실·자원 지표 확인"
        success_criteria: ["손실 1 미만", "train < val", "시간·메모리 기록"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 테스트셋 응답 일괄 생성 (110개, 빈 응답 0건)

      ## 💡 왜 "빈 응답 0건"이 게이트인가
      하나라도 비어 있으면 **EOS 처리나 생성 길이 설정에 문제**가 있는 것이다.
      W12 의 "EOS 하나 남기기"가 여기서 회수된다 — EOS 를 못 배운 모델은 멈추지 못하거나
      즉시 멈춘다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      r = json.load(open('test_responses.json'))
      empty = sum(1 for x in r if not x.get('model_response','').strip())
      lens = [len(x.get('model_response','')) for x in r]
      print('RESPONSES', len(r))
      print('EMPTY    ', empty)
      print('LEN_MIN/MEAN/MAX', min(lens), round(sum(lens)/len(lens),1), max(lens))
      print('--- 샘플')
      for x in r[:2]:
          print('  Q:', x['instruction'][:60])
          print('  A:', x['model_response'][:80])
      print('RESPONSES_OK' if len(r) == 110 and empty == 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `RESPONSES 110`, `EMPTY 0`, `RESPONSES_OK`.
    hint: '빈 응답이 있으면 generate 의 eos_id 처리와 max_new_tokens 를 확인하라'
    answer: |
