      f = json.load(open('judge_full.json')); r = json.load(open('judge_recheck.json'))
      a, b = f['scores'], r['rescore_second']
      diff = [(i, x, y) for i, (x, y) in enumerate(zip(a, b)) if x != y]
      print('COMPARED', len(a))
      print('CHANGED ', len(diff), f'({len(diff)/len(a)*100:.1f}%)')
      if diff:
          print('MAX_SWING', max(abs(x-y) for _, x, y in diff))
          print('SAMPLES  ', diff[:3])
      ma = sum(a)/len(a); mb = sum(b)/len(b)
      print(f'MEAN_RUN1 {ma:.2f}  MEAN_RUN2 {mb:.2f}  SHIFT {abs(ma-mb):.2f}')
      rel = f['reliability']
      print('CEILING(정답 채점 평균)', rel['upper_mean'], '(90 이상이어야 통과)')
      print('FLOOR  (엉터리 평균)  ', rel['lower_mean'], '| 최고점', max(rel['lower']))
      print('ALL_SAME(3회 동일)    ', rel['all_same'])
      print('JUDGE_NONDETERMINISM_OK' if len(diff) > 0 and abs(ma-mb) < 2.0 else 'NG')"
      ```
      ## ✅ 합격 기준
