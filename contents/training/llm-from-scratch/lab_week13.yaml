    instruction: |
      ## 🎯 미션 — LoRA: 항등 게이트와 4축 비교

      ## 💡 아이디어
      원본 가중치는 얼리고 `A @ B` 라는 **저차원 곁가지**만 훈련한다.
      `768 × 768 = 589,824` 대신 `768 × 16 + 16 × 768 = 24,576` 만 학습한다.

      ## 🔴 B=0 초기화가 왜 결정적인가
      ```python
      self.A = nn.Parameter(torch.empty(in_dim, rank))
      nn.init.kaiming_uniform_(self.A, a=math.sqrt(5))
      self.B = nn.Parameter(torch.zeros(rank, out_dim))   # ← 0!
      ```
      `B = 0` 이므로 `x @ A @ B = 0` 이다. **LoRA 를 붙인 직후의 출력은 원본과 완전히 같다.**

      **이것이 "항등 게이트"다.** 훈련을 시작하기 전 모델이 망가지지 않았음을 보장한다.
      실측 게이트 손실 **3.8172** — 1단계에서 기록한 튜닝 전 손실과 **동일**하다.

      ## ⚠️ 스케일은 α 인가 α/r 인가
      원 논문은 `α/r`, 이 교재 구현은 **`α`** 를 쓴다. `r = α = 16` 이면 두 방식이 **16배**
      차이난다. **어느 쪽이든 상관없지만 일관되게 쓰고 명시해야 한다.**

      ## 💡 4축 비교 (실측)
      | 방식 | 훈련 파라미터 | 비율 | 시간 | peak 메모리 | val 손실 | 저지 평균 |
      |---|---|---|---|---|---|---|
      | **풀 튜닝** | 406,286,336 | 100% | **98초** | **8.28 GB** | **0.613** | **60.93** |
      | **LoRA r=16** | 7,898,384 | **1.94%** | **40초** | **4.58 GB** | 0.649 | **60.87** |
      | **LoRA r=8** | 3,949,192 | **0.97%** | **39초** | **4.52 GB** | 0.658 | **62.14** |

      ## ⚠️ "LoRA 가 더 좋다"고 결론 내리지 마라
      저지 평균 차이(60.87 / 62.14 / 60.93)는 **6단계에서 본 측정 오차 범위 안**이다.
      맞는 결론은 **"품질 저하 없이 비용을 크게 줄였다"** 이다.

      ## 🤖 에이전트 프롬프트 ① — LoRA 구현과 항등 게이트
      ```text
      [목표] /work/week13/lora.py 에 LoRA 를 구현하고, 적용 직후 모델이 안 바뀌었음을 증명한다

      [할 일]
       1. LoRALayer(in_dim, out_dim, rank, alpha) 를 만든다
          - A: (in_dim, rank) 파라미터, kaiming_uniform_ 으로 초기화
          - B: (rank, out_dim) 파라미터, "0으로" 초기화
          - forward(x) = alpha * (x @ A @ B)
       2. LinearWithLoRA(linear, rank, alpha) 를 만든다
          - 원본 Linear 는 그대로 두고 forward 에서 원본 출력 + LoRA 출력을 더한다
       3. 모델의 모든 Linear 를 LinearWithLoRA 로 교체하고,
          원본 파라미터는 전부 requires_grad=False 로 얼린다
       4. 항등 게이트를 검사한다
          - B 가 전부 0인지: B_IS_ZERO
          - 작은 Linear 에 LoRA 를 씌운 뒤 출력이 원본과 allclose 인지: IDENTITY_AT_INIT
          - 355M 모델에 LoRA 를 적용한 "직후" val 손실을 재서
            1단계의 튜닝 전 손실(3.8172)과 같은지: gate_loss

      [제약]
       - B 를 무작위로 초기화하지 말 것. 0이어야 항등이 성립한다
       - A 와 B 를 둘 다 0으로 두지도 말 것. 그러면 기울기가 흐르지 않아 학습이 안 된다
       - 스케일을 alpha 로 쓸지 alpha/rank 로 쓸지 정하고 "일관되게" 쓸 것.
         이 실습은 alpha 를 쓴다 (원 논문은 alpha/rank)
       - 원본 가중치를 수정하지 말 것

      [검증] B_IS_ZERO, IDENTITY_AT_INIT, gate_loss 를 출력하고,
             gate_loss 가 1단계 값과 일치하는지 대조해 보일 것.
             그리고 B 를 무작위로 초기화하면 어떻게 되는지 직접 확인해 보고할 것
      ```

      ## 🤖 에이전트 프롬프트 ② — 4축 비교
      ```text
      [목표] LoRA 와 풀 튜닝을 파라미터·시간·메모리·품질 네 축으로 비교한다

      [할 일]
       1. r=16 과 r=8 두 설정으로 각각 LoRA 지시 튜닝을 돌린다 (2 에폭, 나머지 조건 동일)
       2. 설정마다 다음을 측정해 lora_meta.json 에 저장한다
          tag, trainable(훈련 파라미터 수), ratio(%), elapsed(초), peak(GB),
          val_loss, gate_loss, gate(게이트 통과 여부)
       3. 각 LoRA 모델로 테스트셋 110개 응답을 생성하고 저지로 채점해
          judge_mean 을 함께 기록한다
       4. 풀 튜닝(sft_meta.json)과 함께 한 표로 출력한다
       5. 모든 게이트가 통과하면 LORA_OK

      [제약]
       - 풀 튜닝과 동일한 에폭·학습률·데이터로 돌릴 것. 조건이 다르면 비교가 안 된다
       - peak 메모리 측정 전에 reset_peak_memory_stats() 를 호출할 것
       - 저지 평균 차이를 근거로 "LoRA 가 더 좋다"고 결론 내리지 말 것.
         6단계에서 잰 측정 오차와 비교해 판단할 것

      [검증] 4축 표를 출력하고, 세 방식의 저지 평균 차이가
             6단계에서 측정한 저지의 변동 폭 안인지 밖인지 판정할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      import torch
      from lora import LinearWithLoRA
      lin = torch.nn.Linear(8, 4); w = LinearWithLoRA(lin, rank=2, alpha=16)
      x = torch.randn(3, 8)
      b_zero = bool((w.lora.B == 0).all()); ident = torch.allclose(w(x), lin(x))
      print('B_IS_ZERO       ', b_zero)
      print('IDENTITY_AT_INIT', ident)
      meta = json.load(open('lora_meta.json'))
      full = json.load(open('sft_meta.json'))
      print(f\"full        trainable=406,286,336 (100.00%) time={full['elapsed_sec']:.0f}s peak={full['peak_gb']:.2f}GB val={full['val_loss']:.3f}\")
      for m in meta:
          print(f\"{m['tag']:16s} trainable={m['trainable']:,} ({m['ratio']:.2f}%) time={m['elapsed']:.0f}s peak={m['peak']:.2f}GB val={m['val_loss']:.3f} judge={m['judge_mean']:.2f} gate_loss={m['gate_loss']:.4f}\")
      gates = all(m['gate'] for m in meta)
      print('LORA_OK' if b_zero and ident and gates else 'NG')"
      ```
      ## ✅ 합격 기준
      `B_IS_ZERO True`, `IDENTITY_AT_INIT True`, 모든 LoRA 설정의 게이트 통과, `LORA_OK`.
      그리고 `gate_loss` 가 1단계의 튜닝 전 손실과 **일치**하는지 눈으로 확인한다.

      실측 출력:
      ```
      B_IS_ZERO        True
      IDENTITY_AT_INIT True
      full             trainable=406,286,336 (100.00%) time=98s peak=8.28GB val=0.613
      LoRA r=16, α=16  trainable=7,898,384 (1.94%) time=40s peak=4.58GB val=0.649 judge=60.87 gate_loss=3.8172
      LoRA r=8,  α=16  trainable=3,949,192 (0.97%) time=39s peak=4.52GB val=0.658 judge=62.14 gate_loss=3.8172
      ```
      **`gate_loss=3.8172` 가 1단계의 튜닝 전 `val_loss=3.8171746` 과 같다.**
      LoRA 를 붙였는데 모델이 하나도 안 바뀌었다는 증거다.

      ## 🔍 에이전트 판정 포인트
      **B=0 초기화를 "이상한 코드"로 보고 고치려 드는 경우가 있다.** 파라미터를 0으로 두는 것은
      보통 잘못된 초기화이기 때문이다. 그런데 여기서는 **의도된 것**이다.
      `B = 0` 이므로 `x @ A @ B = 0` 이고, **LoRA 를 붙인 직후의 출력은 원본과 완전히 같다.**
      이것이 **항등 게이트**다 — 훈련을 시작하기 전 모델이 망가지지 않았음을 보장한다.

      **A 와 B 를 둘 다 0으로 두면 반대 문제가 생긴다.** 항등은 성립하지만
      `∂L/∂A = B^T(...) = 0` 이라 **기울기가 흐르지 않아 영원히 학습되지 않는다.**
      한쪽만 0이어야 한다.

      **`gate_loss` 를 안 재면 게이트가 아니라 주장이다.** `B_IS_ZERO True` 만으로는
      "LoRA 를 씌운 355M 모델 전체가 여전히 같은 출력을 낸다"를 보장하지 못한다 —
      교체 과정에서 다른 층을 잘못 건드렸을 수 있다. **실제 손실을 재서 1단계 값과
      대조해야** 게이트다.

      **스케일 규약 — α 인가 α/r 인가.** 원 논문은 `α/r`, 이 교재 구현은 **`α`** 를 쓴다.
      `r = α = 16` 이면 두 방식이 **16배** 차이난다. 에이전트가 논문을 참고해 `α/r` 로 짜 오면
      틀린 게 아니라 **다른 규약**이다. **어느 쪽이든 상관없지만 일관되게 쓰고 명시해야 한다.**

      **"LoRA 가 더 좋다"고 결론 내리지 마라.** 저지 평균 차이(60.87 / 62.14 / 60.93)는
      **6단계에서 본 측정 오차 범위 안**이다. 개별 점수가 8.2% 흔들리고 최대 83점까지 튀는
      도구로 1~2점 차이를 논할 수 없다. 맞는 결론은
      **"품질 저하 없이 비용을 크게 줄였다"** 이다 — 시간 98초 → 39초, 메모리 8.28GB → 4.52GB,
      훈련 파라미터 100% → **0.97%**.

      LoRA 는 오늘날 오픈 모델 파인튜닝의 표준이다. 이 게이트가 통과해야 이후 학습 결과를
      **LoRA 덕분이라고 말할 수 있다.**
