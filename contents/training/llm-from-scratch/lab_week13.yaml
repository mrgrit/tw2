  - order: 4
    instruction: |
      ## 🎯 미션 — 심판 소환: 컨테이너에서 호스트 Ollama 접속

      ## 🔴 `http://localhost:11434` 는 컨테이너 안에서 **동작하지 않는다**
      컨테이너의 `localhost` 는 **컨테이너 자신**이다. Ollama 는 호스트에서 돈다.

      | 주소 | 결과 |
      |---|---|
      | `http://localhost:11434` | ❌ 연결 거부 (`exit=7`) |
      | **`http://172.17.0.1:11434`** | ✅ **동작** (docker0 브리지 게이트웨이) |

      `172.17.0.1` 은 기본 Docker 브리지에서 **호스트를 가리키는 주소**다. 환경에 따라 다를 수
      있으니 `ip route | grep default` 나 `docker network inspect bridge` 로 확인하라.

      ## 💡 저지 설정 — 재현을 위한 옵션
      ```python
      options = {"seed": 123, "temperature": 0, "num_ctx": 2048}
      ```
      **저지 모델은 반드시 명시한다** — 어떤 모델을 쓰느냐가 점수를 크게 바꾼다.
      이 실습은 `llama3.1:8b` 를 쓴다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json, urllib.request; sys.path.insert(0, '.')
      from common import OLLAMA_URL, JUDGE_MODEL
      print('JUDGE_URL  ', OLLAMA_URL)
      print('JUDGE_MODEL', JUDGE_MODEL)
      payload = {'model': JUDGE_MODEL,
                 'messages': [{'role':'user','content':'Reply with the integer 42 only.'}],
                 'stream': False, 'options': {'seed':123,'temperature':0,'num_ctx':2048}}
      req = urllib.request.Request(OLLAMA_URL, data=json.dumps(payload).encode(),
                                   headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=120) as r: out = json.load(r)
      print('REPLY', repr(out['message']['content'][:60]))
      print('JUDGE_CONNECT_OK')"
      ```
      ## ✅ 합격 기준
      `JUDGE_URL http://172.17.0.1:11434/api/chat`, 응답이 돌아오고 `JUDGE_CONNECT_OK`.
      **`localhost` 로 바꿔서 실패하는 것도 직접 확인해 보라.**
    hint: 'ip route | grep default 로 컨테이너에서 본 호스트 주소를 확인할 수 있다'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json, urllib.request; sys.path.insert(0, '.')
      from common import OLLAMA_URL, JUDGE_MODEL
      print('JUDGE_URL  ', OLLAMA_URL)
      print('JUDGE_MODEL', JUDGE_MODEL)
      payload = {'model': JUDGE_MODEL,
                 'messages': [{'role':'user','content':'Reply with the integer 42 only.'}],
                 'stream': False, 'options': {'seed':123,'temperature':0,'num_ctx':2048}}
      req = urllib.request.Request(OLLAMA_URL, data=json.dumps(payload).encode(),
                                   headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=120) as r: out = json.load(r)
      print('REPLY', repr(out['message']['content'][:60]))
      print('JUDGE_CONNECT_OK')"
    answer_detail: "컨테이너-호스트 네트워크 경계는 실무에서 가장 흔한 함정 중 하나다. 그리고 W01 에서 확인한 'Ollama 가 0.0.0.0:11434 에 열려 있다'는 사실이 여기서 양날의 검이 된다 — 편리하지만 외부에도 열려 있다."
    verify:
      type: output_contains
      expect: JUDGE_CONNECT_OK
      field: stdout
      semantic:
        intent: "컨테이너에서 호스트 Ollama 로 접속 (172.17.0.1)"
        success_criteria: ["localhost 아님", "응답 수신", "저지 모델 명시"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 저지 채점 결과와 **교재 예상값의 문제**

      ## 💡 실측 결과 (llama3.1:8b)
      | 항목 | 값 |
      |---|---|
      | 채점 성공 | **110 / 110** |
      | 파싱 실패 | **0** |
      | 평균 | **60.92점** |
      | 표준편차 | 29.34 |
      | 중앙값 | 62.5 |

      파싱 실패 0건은 프롬프트의 `"Respond with the integer number only."` 가 잘 작동한 결과다.

      ## 🔴 교재는 "50점 안팎"을 예상했지만 실측은 60.92 다
      교재가 **저지 모델명을 플레이스홀더로 두었기 때문에 예상값 자체가 성립할 수 없다.**
      저지가 바뀌면 점수가 바뀐다.
      **평가 지표를 제시할 때는 반드시 "어떤 심판으로"를 함께 적어야 한다.**

      ## 💡 점수 앵커링 — 저지의 특성
      110개 점수 중 **61.8%** 가 `{0, 50, 75, 95, 100}` 다섯 값에 몰렸고, 서로 다른 값은
      **15개**뿐이었다. 저지는 연속적인 점수를 주지 않고 몇 개의 **앵커**에 붙는다.
      **이것이 25점 단위 점프의 원인이다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      from collections import Counter
      f = json.load(open('judge_full.json'))
      scores = f['scores']
      print('SCORED  ', len(scores), '/ 110')
      print('MEAN    ', round(f['mean'], 2))
      print('SD      ', round(f['sd'], 2))
      print('FAILURES', f['failures'])
      print('DISTINCT_VALUES', len(set(scores)))
      c = Counter(scores).most_common(5)
      top5 = sum(n for _, n in c)
      print('TOP5_ANCHORS', c)
      print(f'TOP5_SHARE {top5/len(scores)*100:.1f}%')
      print('JUDGE_SCORING_OK' if len(scores) == 110 and f['failures'] == 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `SCORED 110 / 110`, 평균이 출력되고, 앵커 5개가 **60% 이상**을 차지, `JUDGE_SCORING_OK`.
    hint: '점수 분포 히스토그램을 그려 보면 앵커링이 한눈에 보인다'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      from collections import Counter
      f = json.load(open('judge_full.json'))
      scores = f['scores']
      print('SCORED  ', len(scores), '/ 110')
      print('MEAN    ', round(f['mean'], 2))
      print('SD      ', round(f['sd'], 2))
      print('FAILURES', f['failures'])
      print('DISTINCT_VALUES', len(set(scores)))
      c = Counter(scores).most_common(5)
      top5 = sum(n for _, n in c)
      print('TOP5_ANCHORS', c)
      print(f'TOP5_SHARE {top5/len(scores)*100:.1f}%')
      print('JUDGE_SCORING_OK' if len(scores) == 110 and f['failures'] == 0 else 'NG')"
    answer_detail: "저지 점수는 연속값이 아니라 앵커에 붙는다. 경계선상의 응답은 실행마다 인접 앵커로 튄다 — 다음 단계에서 볼 8.2% 변동의 구조적 원인이다."
    verify:
      type: output_contains
      expect: JUDGE_SCORING_OK
      field: stdout
      semantic:
        intent: "저지 채점 결과 집계와 점수 앵커링 관찰"
        success_criteria: ["110건 채점", "파싱 실패 0", "앵커 편중 확인"]

  - order: 6
    instruction: |
      ## 🎯 미션 — 🔴 **심판을 검증하라** (이번 주의 핵심)

      **심판의 점수를 믿기 전에, 심판이 믿을 만한지 확인한다.**

      ## 💡 세 가지 검증
      | 검증 | 방법 | 기대 | 실측 |
      |---|---|---|---|
      | **상한** | 정답 자체를 채점 | 90점 이상 | ✅ 통과 |
      | **하한** | 엉터리 문장을 채점 | 낮아야 | ⚠️ **부분 실패** |
      | **결정성** | 같은 (항목,응답) 재채점 | 동일 점수 | ⚠️ **부분 실패** |

      ## 🔴 하한 검증의 발견
      `"The weather is nice today."` 라는 **완전히 무관한 문장**이 소수·합성수 분류 문제에서
      **95점**을 받았다. **저지도 실수한다.**

      ## 🔴 결정성 검증의 발견
      `temperature=0` 인데도 110개 재채점에서 **9건(8.2%)** 이 달라졌다.
      ```
      평균 변동폭: 31점 (최대 83점)
      그런데 전체 평균은 60.92 → 61.13 (0.21점만 이동)
      ```
      **개별 점수는 흔들리지만 평균은 안정적이다.** 이것이 이 발견의 핵심이다.
      **"이 응답은 75점"** 이라고 말하면 안 되고, **"이 모델의 평균은 61점"** 이라고 해야 한다.

      원인은 서버 측 실행 경로(배치 구성, KV 캐시 상태 등)로 추정되며 **클라이언트에서
      seed/temperature 로 제거할 수 없다.**

      ## 💻 실행 명령
      ```bash
