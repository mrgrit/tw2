lab_id: llm-from-scratch-week13
title: "W13 — 지시를 따르는 모델, 그리고 심판: SFT·LLM-as-judge 검증·LoRA"
version: ai
course: llm-from-scratch
week: 13
description: |
  355M 모델을 지시 튜닝해 손실 3.8 → 0.61 로 낮추고 응답 형식을 갖추게 한다. 그다음 자유 형식
  응답을 어떻게 채점할 것인가라는 평가 문제를 LLM-as-judge(로컬 Ollama llama3.1:8b)로 푼다.
  단, 심판의 상한·하한·결정성을 직접 검증한다 — temperature=0 인데도 8.2% 가 흔들리고, 무관한
  문장이 95점을 받는 것을 실측한다. 마지막으로 LoRA 로 파라미터의 1% 만 훈련해 같은 품질을 얻는다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  **이번 주 6단계가 이 교재 전체의 정점이다.** 채점 도구 자체를 의심하고 검증한다.
  에이전트에게 "평가하라"고 시키기는 쉽지만, **그 평가를 믿어도 되는지 확인하는 것**은
  시키지 않으면 아무도 하지 않는다.

  ## 📁 `common.py` 를 먼저 만든다 (P13-0)

  `week07`·`week10`·`week12` 경로 등록, `device`, 그리고 저지 설정 두 상수를 둔다.
  ```python
  OLLAMA_URL  = "http://172.17.0.1:11434/api/chat"   # localhost 아님 (4단계 참고)
  JUDGE_MODEL = "llama3.1:8b"                        # 저지 모델은 반드시 명시
  ```
difficulty: hard
duration_minutes: 200
audience: LLM 밑바닥 구현 (13주차)
prerequisites:
  - W12 완료 — 지시 데이터 935/110/55, collate -100 마스킹
  - W10 완료 — OpenAI 355M 가중치 이식
  - 호스트에 Ollama 실행 + `llama3.1:8b` 준비 (`ollama pull llama3.1:8b`)
  - W13 강의안 정독 — 172.17.0.1 접속, 저지 검증 3종, B=0 항등 게이트
objectives:
  - "튜닝 전 355M 손실이 3.8 안팎임을 기록한다"
  - "2 에폭 지시 튜닝 후 train 0.31 / val 0.61 을 확인한다"
  - "테스트셋 110개 응답에 빈 응답이 0건임을 확인한다"
  - "컨테이너에서 172.17.0.1:11434 로 Ollama 에 접속한다"
  - "저지 채점 110/110, 파싱 실패 0, 평균 60.92 를 얻는다"
  - "저지의 상한·하한·결정성을 직접 검증한다"
  - "LoRA B=0 항등 게이트를 증명한다"
  - "LoRA 와 풀 튜닝을 파라미터·메모리·시간·품질 4축으로 비교한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 튜닝 **전** 상태 기록

      **"전"을 기록하지 않으면 "후"를 말할 수 없다.** W09 훈련 전 손실, W11 훈련 전 정확도와
      같은 습관이다.

      ## 💡 예상 결과
      | 항목 | 값 |
      |---|---|
      | 355M train/val 손실 | **3.8 안팎** |
      | 생성 | 지시를 따르지 않음 (문장을 이어 씀) |

      W10 에서 확인한 OpenAI 355M 의 the-verdict val 손실 3.36 과 비슷한 동네다 —
      **사전훈련 모델은 지시 데이터를 특별히 잘 예측하지도, 못 예측하지도 않는다.**

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 지시 튜닝을 시작하기 전 355M 모델의 상태를 기록한다

      [할 일]
       1. W10 의 build() 로 OpenAI GPT-2 355M 을 불러온다
       2. W12 의 지시 데이터 로더(train/val)를 만든다
       3. 튜닝 전 train / val 손실을 각각 측정한다
       4. val 첫 항목에 대해 튜닝 전 모델이 어떤 응답을 내는지 생성해 기록한다
       5. 위 값들을 /work/week13/before_tuning.json 에 저장한다
          키: train_loss, val_loss, val0_prompt, val0_answer, val0_before
       6. 저장한 파일을 다시 읽어 val_loss 를 출력하고,
          3.0~4.5 범위면 BEFORE_TUNING_OK, 아니면 NG

      [제약]
       - 여기서 훈련하지 말 것. 측정과 기록만 한다
       - 손실 측정은 eval() + no_grad() 로 할 것
       - 생성 결과를 다듬거나 요약하지 말 것. 원문 그대로 저장한다
       - 355M 을 로드할 때 qkv_bias=True 를 잊지 말 것 (W10 참고)

      [검증] val_loss 를 출력하고, 튜닝 전 모델의 응답이 지시를 따르는지 눈으로 판정할 것.
             그리고 이 값이 W10 에서 잰 355M 의 the-verdict val 손실 3.36 과
             비슷한 동네인 것이 무엇을 뜻하는지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      d = json.load(open('before_tuning.json'))
      print('BEFORE_TUNING', json.dumps(d, ensure_ascii=False)[:400])
      loss = d.get('val_loss') or d.get('val') or d.get('loss')
      print('BEFORE_LOSS', loss)
      print('BEFORE_TUNING_OK' if loss and 3.0 < float(loss) < 4.5 else 'NG')"
      ```
      ## ✅ 합격 기준
      튜닝 전 손실이 **3.0~4.5** 범위이고 `BEFORE_TUNING_OK`.
      6점대가 나오면 사전훈련 가중치를 로드하지 않은 것이다.

      실측 출력:
      ```
      train_loss 3.787330  val_loss 3.817175
      val0_prompt: ... ### Instruction:
                   Convert the active sentence to passive: 'The chef cooks the meal every day.'
      val0_answer: The meal is cooked by the chef every day.
      val0_before: "\n\n### Response:\n\nThe chef cooks ..."   ← 지시를 따르지 않고 이어 씀
      ```

      ## 🔍 에이전트 판정 포인트
      **`val_loss = 3.8172` 라는 값을 반드시 기록해 두라.** 7단계 LoRA 의 **B=0 항등 게이트**가
      정확히 이 값과 대조된다. 여기서 대충 넘어가면 7단계에서 "게이트가 통과했다"는 말의
      의미를 알 수 없다.

      **에이전트가 여기서 훈련을 시작하는 경우가 있다.** W09 4단계와 같은 패턴이다 —
      "상태를 기록하라"를 "개선하라"로 확장한다. `backward()` 나 옵티마이저가 보이면 멈춰라.

      **`val0_before` 를 요약해 보고하면 관찰 대상이 사라진다.** 모델이 `### Response:` 를
      쓰고는 **질문을 다시 이어 쓰는** 것이 핵심이다. W11 3단계에서 본 것과 같은 현상이다.

      **W10 의 355M val 손실 3.36 과 비슷한 동네인 것이 시사하는 바.**
      **사전훈련 모델은 지시 데이터를 특별히 잘 예측하지도, 못 예측하지도 않는다.**
      지시 데이터도 그냥 텍스트일 뿐이다. "지시를 따른다"는 능력은 손실 수치에 안 나타난다 —
      그래서 6단계의 LLM-as-judge 같은 별도 평가가 필요하다.

      **"전"을 기록하지 않으면 "후"를 말할 수 없다.** W09 훈련 전 손실, W11 훈련 전 정확도와
      같은 습관이다.
    hint: '이 값이 뒤에서 LoRA 항등 게이트의 기준값(3.8172)이 된다'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      d = json.load(open('before_tuning.json'))
      print('BEFORE_TUNING', json.dumps(d, ensure_ascii=False)[:400])
      loss = d.get('val_loss') or d.get('val') or d.get('loss')
      print('BEFORE_LOSS', loss)
      print('BEFORE_TUNING_OK' if loss and 3.0 < float(loss) < 4.5 else 'NG')"
    answer_detail: "튜닝 전 기준선이 있어야 '얼마나 달라졌는가'를 말할 수 있다. 그리고 이 값은 W13 후반 LoRA 의 B=0 항등 게이트 검증에서 정확히 재사용된다."
    verify:
      type: output_contains
      expect: BEFORE_TUNING_OK
      field: stdout
      semantic:
        intent: "지시 튜닝 전 기준선 기록"
        success_criteria: ["손실 3.8 안팎", "지시 미추종 확인"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 지시 튜닝 (2 에폭) 결과 확인

      ## 💡 무엇이 바뀌나
      **구조는 하나도 안 바뀐다.** 같은 GPTModel, 같은 파라미터 수다. 바뀌는 것은
      **가중치의 값**과 그로 인한 **행동**이다.

      | 항목 | 튜닝 전 | 튜닝 후 |
      |---|---|---|
      | train 손실 | 3.8 안팎 | **0.3146** |
      | val 손실 | 3.8 안팎 | **0.6131** |
      | 훈련 시간 | — | **98초** |
      | peak 메모리 | — | **8.28 GB** |

      ## 💡 train < val 에 주목
      과적합의 시작이지만 W09 처럼 val 이 다시 올라갈 정도는 아니다. 데이터가 935건으로
      5,145 토큰보다 훨씬 많기 때문이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week13/instr_finetune.py 로 355M 모델을 2 에폭 지시 튜닝한다

      [할 일]
       1. W12 의 collate(-100 마스킹 포함)로 train/val 로더를 만든다
       2. 355M 모델 전체를 훈련 대상으로 둔다 (동결 없음)
       3. AdamW(lr=5e-5, weight_decay=0.1) 로 2 에폭 훈련한다
       4. 훈련 중 다음을 측정해 기록한다
          - 최종 train / val 손실
          - 총 소요 시간(초)
          - GPU peak 메모리(GB) — torch.cuda.max_memory_allocated 사용
       5. 손실 곡선을 sft_loss_curve.png 로, 가중치를 sft_355m.pth 로 저장한다
       6. 위 지표를 sft_meta.json 에 저장한다
          키: train_loss, val_loss, elapsed_sec, peak_gb
       7. 저장된 파일을 읽어 네 값을 출력하고,
          두 손실이 1 미만이고 train < val 이면 SFT_TRAIN_OK

      [제약]
       - peak 메모리 측정 전에 torch.cuda.reset_peak_memory_stats() 를 호출할 것
       - 시간 측정 전후에 torch.cuda.synchronize() 를 호출할 것 (W05 참고)
       - 손실 계산에 -100 마스킹된 타깃을 그대로 쓸 것.
         마스킹을 풀거나 패딩을 손실에 넣지 말 것
       - 에폭 수와 학습률을 임의로 바꾸지 말 것

      [검증] 네 값을 출력하고, 모델의 "구조"가 튜닝 전후로 무엇이 바뀌었는지 답할 것.
             그리고 train < val 인데 W09 처럼 val 이 다시 올라가지 않는 이유를 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      m = json.load(open('sft_meta.json'))
      print(f\"TRAIN_LOSS {m['train_loss']:.4f}\")
      print(f\"VAL_LOSS   {m['val_loss']:.4f}\")
      print(f\"ELAPSED    {m['elapsed_sec']:.1f}s\")
      print(f\"PEAK_GB    {m['peak_gb']:.2f}\")
      ok = m['train_loss'] < 1.0 and m['val_loss'] < 1.0 and m['train_loss'] < m['val_loss']
      print('SFT_TRAIN_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      두 손실 모두 **1 미만**, `train < val`, `SFT_TRAIN_OK`. 실측 출력:
      ```
      TRAIN_LOSS 0.3146
      VAL_LOSS   0.6131
      ELAPSED    98.2s
      PEAK_GB    8.28
      ```

      ## 🔍 에이전트 판정 포인트
      **`peak_gb` 와 `elapsed_sec` 를 기록하지 않으면 7단계 비교가 불가능해진다.** 에이전트는
      "손실을 낮춰라"라는 목표에 집중해 자원 지표를 빠뜨린다. **8.28 GB / 98초는 LoRA 비교의
      기준값**이다.

      **peak 메모리 측정에 `reset_peak_memory_stats()` 를 안 하면 이전 실험의 값이 섞인다.**
      같은 프로세스에서 여러 모델을 돌렸다면 최댓값이 남아 있어 8.28 이 아니라 더 큰 값이
      나온다. 그러면 LoRA 와의 비교가 무의미해진다.

      **`-100` 마스킹을 푸는 실수가 조용히 지나간다.** 에이전트가 손실 계산에서
      `targets[targets == -100] = pad_token` 같은 처리를 넣으면 에러 없이 돌고 손실도
      내려간다. 다만 **모델이 패딩 생성기가 된다**(W12 3단계). 3단계의 빈 응답 검사와
      응답 품질에서 드러난다.

      **구조는 하나도 안 바뀐다.** 같은 GPTModel, 같은 파라미터 수(406,286,336)다.
      바뀌는 것은 **가중치의 값**과 그로 인한 **행동**이다. 에이전트가 "모델을 개조했습니다"
      같은 표현을 쓰면 W11(헤드 교체)과 혼동한 것이다.

      **train < val 인데 W09 처럼 val 이 다시 올라가지 않는 이유.** 과적합의 시작이지만
      데이터가 **935건**으로 W09 의 5,145 토큰보다 훨씬 많기 때문이다. 파라미터 대비
      데이터 비율이 다르다.
    hint: '손실이 1 이상이면 에폭 수나 학습률을 확인하라'
    answer: |
      docker exec -w /work/week13 llm-lab python3 -c "
      import sys, json; sys.path.insert(0, '.')
      m = json.load(open('sft_meta.json'))
      print(f\"TRAIN_LOSS {m['train_loss']:.4f}\")
      print(f\"VAL_LOSS   {m['val_loss']:.4f}\")
      print(f\"ELAPSED    {m['elapsed_sec']:.1f}s\")
      print(f\"PEAK_GB    {m['peak_gb']:.2f}\")
      ok = m['train_loss'] < 1.0 and m['val_loss'] < 1.0 and m['train_loss'] < m['val_loss']
      print('SFT_TRAIN_OK' if ok else 'NG')"
    answer_detail: "peak 8.28GB 는 다음 단계 LoRA 비교(4.5GB)의 기준값이 된다. 시간 98초도 마찬가지 — 4축 비교(파라미터·메모리·시간·품질)의 재료를 여기서 확보한다."
    verify:
      type: output_contains
      expect: SFT_TRAIN_OK
      field: stdout
      semantic:
        intent: "지시 튜닝 결과 손실·자원 지표 확인"
        success_criteria: ["손실 1 미만", "train < val", "시간·메모리 기록"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 테스트셋 응답 일괄 생성 (110개, 빈 응답 0건)

      ## 💡 왜 "빈 응답 0건"이 게이트인가
      하나라도 비어 있으면 **EOS 처리나 생성 길이 설정에 문제**가 있는 것이다.
      W12 의 "EOS 하나 남기기"가 여기서 회수된다 — EOS 를 못 배운 모델은 멈추지 못하거나
      즉시 멈춘다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week13/gen_responses.py 로 테스트셋 110개의 모델 응답을 일괄 생성한다

      [할 일]
       1. sft_355m.pth 를 불러온다 (eval 모드)
       2. W12 의 test 분할 110건 각각에 대해
          - format_input 으로 프롬프트를 만들고 "### Response:" 를 붙인다
          - greedy 로 최대 256토큰 생성한다
          - EOS(50256)를 만나면 즉시 멈춘다
