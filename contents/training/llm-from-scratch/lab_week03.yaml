      ## 💡 두 가지를 동시에 증명한다
      1. **조회 = 행 꺼내기.** `emb(tensor([3]))` 가 `emb.weight[3]` 과 **정확히 같다.**
      2. **조회 = 원-핫 행렬곱.** 원-핫 행렬 `[4,6]` × 가중치 `[6,3]` 이 조회 결과와 allclose.

      ## 💡 그런데 왜 행렬곱이 아니라 조회로 구현하나
      실제 규모를 넣어 보라. 원-핫 행렬곱은 `[4, 50257] × [50257, 256]` → 곱셈 **5,146만 번**인데
      그중 99.998% 는 **0을 곱하는 것**이다. 조회는 4개 행을 메모리에서 꺼낼 뿐, 곱셈 **0번**.
      **"수학적 정의"와 "효율적 구현"이 다를 수 있다** — 이 감각은 5주차 인과 마스크의 두 구현,
