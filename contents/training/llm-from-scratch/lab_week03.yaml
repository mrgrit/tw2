  - order: 7
    instruction: |
      ## 🎯 미션 — 위치 임베딩은 정말 필요한가 (벡터로 측정)

      "위치 임베딩이 순서를 구분해준다"를 말이 아니라 **텐서로** 확인한다.

      ## 💡 측정 설계
      6단계에서 검증한 `"I saw the cat and the dog"` 을 쓴다. 중복 토큰은 `262`(` the`)이고
      위치는 2번과 5번이다.
      - **위치 임베딩 없이:** 두 위치의 벡터 차이 노름 = **0.000000** (완전히 같다)
      - **위치 임베딩 더한 후:** 차이 노름 = **> 0** (달라졌다)

      ## 💡 없으면 무엇이 구분 불가능해지나
      > **"개가 사람을 물었다"** vs **"사람이 개를 물었다"**

      토큰 집합이 완전히 같다. 위치 정보가 없으면 모델 입장에서 두 문장의 입력 표현은 구별할
      근거가 없다. GPT-2 는 **학습형 절대 위치 임베딩**을 쓴다 — 위치 벡터도 훈련으로 배운다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch, tiktoken
      from collections import Counter
      enc = tiktoken.get_encoding('gpt2')
      ids = enc.encode('I saw the cat and the dog'); print('IDS', ids)
      dup = [t for t, c in Counter(ids).items() if c > 1]; print('DUP_TOKENS', dup)
      assert dup, 'no duplicate token'
      pos_idx = [i for i, v in enumerate(ids) if v == dup[0]]; print('POSITIONS', pos_idx)
      torch.manual_seed(123)
      tok = torch.nn.Embedding(50257, 16); pos = torch.nn.Embedding(len(ids), 16)
      x = torch.tensor(ids); te = tok(x); pe = pos(torch.arange(len(ids))); ie = te + pe
      i, j = pos_idx[0], pos_idx[1]
      d_no = (te[i]-te[j]).norm().item(); d_yes = (ie[i]-ie[j]).norm().item()
      print(f'NO_POS_DIFF={d_no:.6f}  WITH_POS_DIFF={d_yes:.6f}')
      print('POS_EFFECT_OK' if d_no == 0.0 and d_yes > 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `NO_POS_DIFF=0.000000`, `WITH_POS_DIFF` > 0, `POS_EFFECT_OK`.
      **없을 때도 0 이 아니면 중복 토큰이 아닌 것이다** — 6단계로 돌아가라.
    hint: '차이 노름이 정확히 0.000000 이어야 한다. 조금이라도 크면 다른 토큰을 비교한 것이다'
    answer: |
