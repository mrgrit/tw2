lab_id: llm-from-scratch-week03
title: "W03 — 배치가 만들어지는 순간: 슬라이딩 윈도우·그리드 실험·임베딩 해부·위치 임베딩"
version: ai
course: llm-from-scratch
week: 3
description: |
  라벨 없는 텍스트에서 (입력, 정답) 쌍을 뜯어내 배치로 조립한다. 정답은 입력을 한 칸 민 것이며,
  이것이 LLM 이 자기지도 학습으로 커질 수 있었던 이유다. 슬라이딩 윈도우 Dataset/DataLoader 를
  구현하고 샘플 수를 공식으로 손계산 검증한 뒤, nn.Embedding 이 원-핫 행렬곱과 동치인 조회
  테이블임을 증명한다. 마지막으로 위치 임베딩이 없을 때 사라지는 정보를 벡터 노름으로 측정한다.
difficulty: easy
duration_minutes: 150
audience: LLM 밑바닥 구현 (3주차)
prerequisites:
  - W02 완료 — tiktoken BPE 이해, `the-verdict.txt` 확보
  - "`/work/week03/` 에 the-verdict.txt 복사"
  - W03 강의안 정독 — 시프트 라벨, 샘플 수 공식, 브로드캐스팅, 선행 공백 함정
objectives:
  - "BPE 총 토큰 수 5,145 를 확인하고 정규식 4,690 과의 차이를 설명한다"
  - "첫 배치에서 '정답 = 입력을 한 칸 민 것'을 눈으로 확인한다"
  - "샘플 수를 공식 ⌈(N−max_length)/stride⌉ 로 손계산 검증한다"
  - "임베딩 조회 == 가중치 행렬의 해당 행임을 확인한다"
  - "임베딩 조회 == 원-핫 행렬곱을 allclose 로 증명한다"
  - "파이프라인 shape 흐름과 파라미터 12,865,792 / 1,024 를 확인한다"
  - "선행 공백 함정을 피해 중복 토큰이 실재하는 문장을 고른다"
  - "위치 임베딩 유무에 따른 벡터 차이를 노름으로 측정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — BPE 총 토큰 수 (5,145)

      같은 파일인데 2주차 정규식 분리는 4,690 토큰이었다. BPE 로는 몇 개일까.

      ## 💡 왜 숫자가 다른가
      | 방식 | 토큰 수 | 이유 |
      |---|---|---|
      | 정규식 분리 (W02) | 4,690 | 단어·구두점 단위. 한 단어 = 한 토큰 |
      | BPE (tiktoken gpt2) | **5,145** | 드문 단어는 **서브워드로 더 잘게** 쪼갠다 |

      BPE 쪽이 **더 많다.** 19세기 소설에는 GPT-2 가 흔히 보지 못한 단어가 많아 통짜 토큰이
      아니라 조각으로 나뉜 것이다. 이 5,145 가 다음 단계 샘플 수 공식의 N 이 된다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      n = len(enc.encode(open('the-verdict.txt', encoding='utf-8').read()))
      print('BPE_TOKENS', n)
      print('BPE_5145_OK' if n == 5145 else 'NG')"
      ```
      ## ✅ 합격 기준
      `BPE_TOKENS 5145` 와 `BPE_5145_OK`.
    hint: '4,690 이 나오면 정규식 분리 코드를 돌린 것이다'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      n = len(enc.encode(open('the-verdict.txt', encoding='utf-8').read()))
      print('BPE_TOKENS', n)
      print('BPE_5145_OK' if n == 5145 else 'NG')"
    answer_detail: "N=5,145 는 이번 주 모든 샘플 수 계산의 분자다. 정규식(4,690)보다 큰 이유를 설명할 수 있어야 BPE 의 서브워드 분해를 이해한 것이다."
    verify:
      type: output_contains
      expect: BPE_5145_OK
      field: stdout
      semantic:
        intent: "BPE 총 토큰 수 확인 — 샘플 수 공식의 N 확보"
        success_criteria: ["5145 확인", "정규식과의 차이 설명"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 첫 배치: "정답 = 입력을 한 칸 민 것"

      LLM 의 학습 문제는 단 하나, **다음 토큰 맞히기**다. 그래서 정답 라벨은 입력을 왼쪽으로
      한 칸 민 것이고, **사람이 붙일 라벨이 없다**(자기지도 학습).

      ## 💡 무엇을 보는가
      ```
      첫 배치 입력 : [[40, 367, 2885, 1464]]
      첫 배치 정답 : [[367, 2885, 1464, 1807]]
      둘째 배치 입력: [[367, 2885, 1464, 1807]]   ← 첫 배치의 정답과 같다
      ```
      stride=1 이라 창이 정확히 한 칸 밀렸다. 이 관계를 눈으로 확인하는 것이 목적이다.

      ## ⚠️ `shuffle=False` 를 제약으로 명시하라
      셔플이 켜져 있으면 실행할 때마다 첫 배치가 달라져 정답지와 대조할 수 없다.
      **재현 가능성을 위해 난수를 끄는 것**은 검증 설계의 기본기다.

      ## 💻 실행 명령
      먼저 `week03/dataset.py` 에 `GPTDatasetV1` 과 `create_dataloader_v1` 을 만든 뒤(P3-1):
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=1, max_length=4, stride=1, shuffle=False)
      it = iter(dl); b1 = next(it); b2 = next(it)
      print('B1_IN', b1[0].tolist()); print('B1_TGT', b1[1].tolist()); print('B2_IN', b2[0].tolist())
      ok = (b1[0].tolist()==[[40,367,2885,1464]] and b1[1].tolist()==[[367,2885,1464,1807]]
            and b2[0].tolist()==[[367,2885,1464,1807]])
      print('SHIFT_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      세 배열이 정답지와 일치하고 `SHIFT_OK`.
    hint: '정답이 입력과 똑같이 나오면 시프트(+1)를 빠뜨린 것이다'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=1, max_length=4, stride=1, shuffle=False)
      it = iter(dl); b1 = next(it); b2 = next(it)
      print('B1_IN', b1[0].tolist()); print('B1_TGT', b1[1].tolist()); print('B2_IN', b2[0].tolist())
      ok = (b1[0].tolist()==[[40,367,2885,1464]] and b1[1].tolist()==[[367,2885,1464,1807]]
            and b2[0].tolist()==[[367,2885,1464,1807]])
      print('SHIFT_OK' if ok else 'NG')"
    answer_detail: "시프트가 한 칸이라도 어긋나면 모델은 '다음 토큰'이 아니라 '현재 토큰'을 맞히는 법을 배운다 — 손실은 0 에 가까워지는데 생성은 엉망인 기묘한 상황이 된다. 9주차에서 이 버그를 겪지 않으려면 여기서 잡아야 한다."
    verify:
      type: output_contains
      expect: SHIFT_OK
      field: stdout
      semantic:
        intent: "슬라이딩 윈도우 (입력, 정답) 쌍 생성 확인"
        success_criteria: ["첫 배치 값 일치", "정답 = 입력 시프트", "둘째 배치 = 첫 정답"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 그리드 실험 + 공식 손계산 검증

      같은 텍스트에서 하이퍼파라미터에 따라 학습 샘플이 얼마나 달라지는지 측정하고,
      그 값을 **공식으로 직접 검증**한다.

      ## 💡 샘플 수 공식
      > **샘플 수 = ⌈(전체 토큰 수 N − max_length) ÷ stride⌉**  (N = 5,145)

      | max_length | stride | 샘플 수 | 인접 중복 | 관찰 |
      |---|---|---|---|---|
      | 4 | 1 | **5,141** | 3 (75%) | 압도적으로 많지만 거의 같은 내용 |
      | 4 | 4 | **1,286** | 0 | 중복 없음, 샘플 1/4 |
      | 256 | 128 | **39** | 128 (50%) | 긴 문맥, 절반 중복 |
      | 256 | 256 | **20** | 0 | 긴 문맥, 중복 없음 |

      ## ⚠️ 반드시 `len(dataset)` 으로 셀 것
      `len(dataloader)` 로 세면 `batch_size` 와 `drop_last` 에 따라 값이 달라진다.
      **무엇을 세는지 명시하지 않으면 에이전트가 다른 것을 센다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      import math, tiktoken
      from dataset import GPTDatasetV1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      enc = tiktoken.get_encoding('gpt2'); N = len(enc.encode(raw))
      res = []
      for ml, st in [(4,1),(4,4),(256,128),(256,256)]:
          d = GPTDatasetV1(raw, enc, ml, st); f = math.ceil((N-ml)/st)
          print(f'ml={ml:3d} stride={st:3d} len={len(d):5d} formula={f:5d} match={len(d)==f}')
          res.append(len(d))
      print('GRID_OK' if res == [5141,1286,39,20] else 'NG')"
      ```
      ## ✅ 합격 기준
      네 행 모두 `match=True` 이고 `GRID_OK`.

      ## 📝 손계산 과제
      네 행 중 **하나를 골라 계산기 없이** 공식에 넣어 계산하고 `report.md` 에 과정을 남겨라.
      에이전트 검증과 본인 검증을 겹치는 것이 이 수업의 이중 안전장치다.
    hint: '⌈(5145-4)/1⌉ = 5141 부터 손으로 확인해 보라'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      import math, tiktoken
      from dataset import GPTDatasetV1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      enc = tiktoken.get_encoding('gpt2'); N = len(enc.encode(raw))
      res = []
      for ml, st in [(4,1),(4,4),(256,128),(256,256)]:
          d = GPTDatasetV1(raw, enc, ml, st); f = math.ceil((N-ml)/st)
          print(f'ml={ml:3d} stride={st:3d} len={len(d):5d} formula={f:5d} match={len(d)==f}')
          res.append(len(d))
      print('GRID_OK' if res == [5141,1286,39,20] else 'NG')"
    answer_detail: "(4,1)은 인접 샘플이 3/4 씩 겹친다 — 같은 문장을 사실상 4번 학습하는 셈이다. 9주차에서 과적합 곡선(훈련 손실은 내려가는데 검증 손실은 올라가는 그림)을 볼 때 이 표를 다시 꺼내게 된다. '샘플 수'와 '고유 정보량'은 다른 것이다."
    verify:
      type: output_contains
      expect: GRID_OK
      field: stdout
      semantic:
        intent: "stride/context 가 데이터 양과 중복에 미치는 영향 측정 + 공식 검증"
        success_criteria: ["4개 조합 측정", "공식과 일치", "len(dataset) 기준"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 임베딩 해부: 조회 == 행 꺼내기 == 원-핫 행렬곱

      `nn.Embedding` 을 신비한 물건으로 두면 안 된다. 장난감 크기(어휘 6, 차원 3)로 해부한다.

      ## 💡 두 가지를 동시에 증명한다
      1. **조회 = 행 꺼내기.** `emb(tensor([3]))` 가 `emb.weight[3]` 과 **정확히 같다.**
      2. **조회 = 원-핫 행렬곱.** 원-핫 행렬 `[4,6]` × 가중치 `[6,3]` 이 조회 결과와 allclose.

      ## 💡 그런데 왜 행렬곱이 아니라 조회로 구현하나
      실제 규모를 넣어 보라. 원-핫 행렬곱은 `[4, 50257] × [50257, 256]` → 곱셈 **5,146만 번**인데
      그중 99.998% 는 **0을 곱하는 것**이다. 조회는 4개 행을 메모리에서 꺼낼 뿐, 곱셈 **0번**.
      **"수학적 정의"와 "효율적 구현"이 다를 수 있다** — 이 감각은 5주차 인과 마스크의 두 구현,
      10주차 top-k 의 `-inf` 트릭에서 계속 쓰인다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      emb = torch.nn.Embedding(6, 3)
      row3 = emb.weight[3]; look = emb(torch.tensor([3]))[0]
      print('ROW3 ', row3.tolist()); print('LOOK3', look.tolist())
      ids = torch.tensor([2,3,5,1])
      onehot = torch.nn.functional.one_hot(ids, num_classes=6).float()
      mm = onehot @ emb.weight
      print('ALLCLOSE', torch.allclose(mm, emb(ids)))
      print('EMB_LOOKUP_OK' if torch.equal(row3, look) and torch.allclose(mm, emb(ids)) else 'NG')"
      ```
      ## ✅ 합격 기준
      `ROW3` 와 `LOOK3` 가 동일하고, `ALLCLOSE True`, `EMB_LOOKUP_OK`.
    hint: 'one_hot 은 int 를 돌려주므로 .float() 로 바꿔야 행렬곱이 된다'
    answer: |
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      emb = torch.nn.Embedding(6, 3)
      row3 = emb.weight[3]; look = emb(torch.tensor([3]))[0]
      print('ROW3 ', row3.tolist()); print('LOOK3', look.tolist())
      ids = torch.tensor([2,3,5,1])
      onehot = torch.nn.functional.one_hot(ids, num_classes=6).float()
      mm = onehot @ emb.weight
      print('ALLCLOSE', torch.allclose(mm, emb(ids)))
      print('EMB_LOOKUP_OK' if torch.equal(row3, look) and torch.allclose(mm, emb(ids)) else 'NG')"
    answer_detail: "임베딩은 학습 가능한 조회 테이블이다. 행렬의 각 행이 곧 그 토큰의 벡터이고, 처음엔 난수이며 훈련으로 학습된다. 이 동치성을 코드로 보고 나면 임베딩에 대한 미신이 사라진다."
    verify:
      type: output_contains
      expect: EMB_LOOKUP_OK
      field: stdout
      semantic:
        intent: "nn.Embedding = 조회 테이블 = 원-핫 행렬곱 동치 증명"
        success_criteria: ["조회 == 행", "원-핫 곱과 allclose", "효율 이유 설명"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 실전 파이프라인 조립 (GPT-2 규모)

      실제 GPT-2 어휘(50,257)와 교재 실습 차원(256)으로 토큰 임베딩 + 위치 임베딩을 조립한다.

      ## 💡 shape 흐름
      | 단계 | shape |
      |---|---|
      | 배치 (토큰 ID) | `[8, 4]` |
      | 토큰 임베딩 | `[8, 4, 256]` |
      | 위치 임베딩 | `[4, 256]` |
      | 최종 합 | `[8, 4, 256]` |

      ## 💡 브로드캐스팅 — 왜 `[4,256]` 을 `[8,4,256]` 에 더할 수 있나
      PyTorch 는 shape 가 다른 텐서를 더할 때 **뒤쪽 차원부터 맞춰 본다**. 없는 차원은 1 로
      간주해 `[1,4,256]` → 8번 복제해서 더한다. **의미:** 위치 벡터는 배치 안 모든 샘플에
      똑같이 더해진다. 당연하다 — "2번째 자리"의 의미는 어느 문장이든 같으니까.

      ## 💡 손계산
      `50,257 × 256 = 12,865,792`. **직접 계산해서 출력과 대조하라.**
      아직 모델 본체는 시작도 안 했는데 임베딩만 1,286만 파라미터다. W02 의 "어휘를 500만으로
      키우면?" 이라는 질문의 답이 여기 있다 — **어휘 크기는 공짜가 아니다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      import torch
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=8, max_length=4, stride=4, shuffle=False)
      x, y = next(iter(dl))
      tok = torch.nn.Embedding(50257, 256); pos = torch.nn.Embedding(4, 256)
      te = tok(x); pe = pos(torch.arange(4)); ie = te + pe
      print('BATCH', tuple(x.shape), 'TOK', tuple(te.shape), 'POS', tuple(pe.shape), 'SUM', tuple(ie.shape))
      tp = tok.weight.numel(); pp = pos.weight.numel()
      print('TOK_PARAMS', tp, 'POS_PARAMS', pp)
      print('PIPELINE_OK' if tuple(ie.shape)==(8,4,256) and tp==12865792 and pp==1024 else 'NG')"
      ```
      ## ✅ 합격 기준
      shape 흐름이 정답지와 일치하고 `TOK_PARAMS 12865792 POS_PARAMS 1024`, `PIPELINE_OK`.
    hint: '위치 임베딩의 입력은 토큰 ID 가 아니라 torch.arange(max_length) 다'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      import torch
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=8, max_length=4, stride=4, shuffle=False)
      x, y = next(iter(dl))
      tok = torch.nn.Embedding(50257, 256); pos = torch.nn.Embedding(4, 256)
