       - 행 == 조회 비교는 allclose 가 아니라 torch.equal 로 할 것 (완전히 같아야 한다)

      [검증] ROW3 와 LOOK3 두 줄을 나란히 보이고, ALLCLOSE 와 EMB_LOOKUP_OK 를 함께 출력할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      emb = torch.nn.Embedding(6, 3)
      row3 = emb.weight[3]; look = emb(torch.tensor([3]))[0]
      print('ROW3 ', row3.tolist()); print('LOOK3', look.tolist())
      ids = torch.tensor([2,3,5,1])
      onehot = torch.nn.functional.one_hot(ids, num_classes=6).float()
      mm = onehot @ emb.weight
