    instruction: |
      ## 🎯 미션 — 함정 먼저 확인: 선행 공백 때문에 중복 토큰이 없다

      다음 단계에서 "같은 토큰이 두 번 나오는 문장"이 필요하다. 그런데 교재가 예시로 주는
      `"the cat and the dog"` 에는 **중복 토큰이 하나도 없다.**

      ## 🔴 왜 없는가
      GPT-2 BPE 는 **선행 공백을 토큰 안에 넣는다**(W02 에서 배웠다). 그래서
      - 문장 맨 앞의 `"the"` → ID **1169** (공백 없음)
      - 중간의 `" the"` → ID **262** (공백 포함)

      **서로 다른 토큰이다.** 중복이 생기려면 `"I saw the cat and the dog"` 처럼 두 `the` 가
      모두 문장 중간에 와야 한다.

      ## 🔴 여기서 배울 것
      에이전트는 "예시"로 주어진 문장을 의심 없이 쓴다. 그리고 두 `the` 의 임베딩이 다르게
      나오면 **"위치 임베딩 효과다"라고 잘못 해석한다** — 실제로는 토큰 ID 부터 달랐던 것인데.
      **실험을 설계할 때는 전제 조건을 먼저 측정으로 확인하라.**

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      for s in ['the cat and the dog', 'I saw the cat and the dog']:
          ids = enc.encode(s)
          print(repr(s), ids, 'dup=', len(ids) != len(set(ids)))
      a = enc.encode('the cat and the dog'); b = enc.encode('I saw the cat and the dog')
      print('TRAP_CONFIRMED' if len(a)==len(set(a)) and len(b)!=len(set(b)) else 'NG')"
      ```
      ## ✅ 합격 기준
      첫 문장은 `dup= False`, 둘째 문장은 `dup= True`, 그리고 `TRAP_CONFIRMED`.
    hint: 'encode 결과를 눈으로 보는 한 줄이 틀린 결론을 막는다'
    answer: |
