          - 결과가 emb(ids) 와 allclose 인지 출력한다: ALLCLOSE <True/False>
       5. 두 조건(행 == 조회, 행렬곱 allclose)이 모두 참이면 EMB_LOOKUP_OK, 아니면 NG

       6. 마지막으로 답하라: 수학적으로 원-핫 행렬곱과 같은데
          왜 실제 구현은 행렬곱이 아니라 조회인가?
