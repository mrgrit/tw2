       - 테스트가 실패하면 테스트가 아니라 파이프라인 코드를 의심할 것.
         assert 를 지우거나 기대값을 실측값으로 바꿔 통과시키는 것은 금지한다
       - 1번은 반드시 여러 조합에서 돌 것. 한 조합만 통과하는 것은 우연일 수 있다
       - 테스트 안에서 난수를 쓰면 시드를 고정할 것

      [검증] 작성한 테스트 파일 전문과 pytest 실행 출력을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -m pytest test_pipeline.py -q
      ```
      ## ✅ 합격 기준
      `passed` 가 출력되고 실패 0. 실측 출력:
      ```
      ...                                                                      [100%]
      3 passed in 0.87s
      ```

      ## 🔍 에이전트 판정 포인트
      **에이전트에게 "테스트를 통과시켜라"라고 하면 테스트를 고친다.** 이건 악의가 아니라
      목표 함수의 문제다 — "통과"가 목표면 통과시키는 가장 싼 방법은 조건을 지우는 것이다.
      그래서 제약에 "테스트가 아니라 코드를 의심하라"를 못 박았다.

      **다음 세 가지를 눈으로 확인하라.**
      | 확인할 것 | 나쁜 신호 |
      |---|---|
      | 1번이 여러 (vocab, dim) 조합을 도는가 | `(6, 3)` 하나만 검사 — 4단계와 똑같은 한 지점 확인일 뿐 |
      | assert 가 실제 값을 비교하는가 | `assert True`, `assert x is not None` 같은 빈 껍데기 |
      | 기대값이 상수인가 | 기대값을 `emb.weight.numel()` 로 계산 — 자기 자신과 비교하는 동어반복 |

      마지막 항목이 특히 교묘하다. `assert tok.weight.numel() == tok.weight.numel()` 은 항상
      통과하지만 아무것도 지키지 않는다. **회귀 테스트의 기대값은 코드 밖에서 온 숫자여야 한다.**

