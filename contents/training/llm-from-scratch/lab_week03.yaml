lab_id: llm-from-scratch-week03
title: "W03 — 배치가 만들어지는 순간: 슬라이딩 윈도우·그리드 실험·임베딩 해부·위치 임베딩"
version: ai
course: llm-from-scratch
week: 3
description: |
  라벨 없는 텍스트에서 (입력, 정답) 쌍을 뜯어내 배치로 조립한다. 정답은 입력을 한 칸 민 것이며,
  이것이 LLM 이 자기지도 학습으로 커질 수 있었던 이유다. 슬라이딩 윈도우 Dataset/DataLoader 를
  구현하고 샘플 수를 공식으로 손계산 검증한 뒤, nn.Embedding 이 원-핫 행렬곱과 동치인 조회
  테이블임을 증명한다. 마지막으로 위치 임베딩이 없을 때 사라지는 정보를 벡터 노름으로 측정한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.
difficulty: easy
duration_minutes: 150
audience: LLM 밑바닥 구현 (3주차)
prerequisites:
  - W02 완료 — tiktoken BPE 이해, `the-verdict.txt` 확보
  - "`/work/week03/` 에 the-verdict.txt 복사"
  - W03 강의안 정독 — 시프트 라벨, 샘플 수 공식, 브로드캐스팅, 선행 공백 함정
objectives:
  - "BPE 총 토큰 수 5,145 를 확인하고 정규식 4,690 과의 차이를 설명한다"
  - "첫 배치에서 '정답 = 입력을 한 칸 민 것'을 눈으로 확인한다"
  - "샘플 수를 공식 ⌈(N−max_length)/stride⌉ 로 손계산 검증한다"
  - "임베딩 조회 == 가중치 행렬의 해당 행임을 확인한다"
  - "임베딩 조회 == 원-핫 행렬곱을 allclose 로 증명한다"
  - "파이프라인 shape 흐름과 파라미터 12,865,792 / 1,024 를 확인한다"
  - "선행 공백 함정을 피해 중복 토큰이 실재하는 문장을 고른다"
  - "위치 임베딩 유무에 따른 벡터 차이를 노름으로 측정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — BPE 총 토큰 수 (5,145)

      같은 파일인데 2주차 정규식 분리는 4,690 토큰이었다. BPE 로는 몇 개일까.

      ## 💡 왜 숫자가 다른가
      | 방식 | 토큰 수 | 이유 |
      |---|---|---|
      | 정규식 분리 (W02) | 4,690 | 단어·구두점 단위. 한 단어 = 한 토큰 |
      | BPE (tiktoken gpt2) | **5,145** | 드문 단어는 **서브워드로 더 잘게** 쪼갠다 |

      BPE 쪽이 **더 많다.** 19세기 소설에는 GPT-2 가 흔히 보지 못한 단어가 많아 통짜 토큰이
      아니라 조각으로 나뉜 것이다. 이 5,145 가 다음 단계 샘플 수 공식의 N 이 된다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] the-verdict.txt 를 GPT-2 BPE 로 인코딩했을 때의 총 토큰 수를 구한다

      [할 일]
       1. /work/week03/the-verdict.txt 를 UTF-8 로 읽는다
       2. tiktoken 의 gpt2 인코딩으로 파일 전체를 encode 한다
       3. 토큰 개수를 BPE_TOKENS <숫자> 형식으로 출력한다
       4. 5145 와 같으면 BPE_5145_OK, 아니면 NG 를 한 줄 더 출력한다

      [제약]
       - 정규식으로 단어를 나누지 말 것. 반드시 tiktoken BPE 로 셀 것
       - 파일 일부만 읽지 말 것. 전체를 한 번에 encode 할 것
       - 컨테이너 안에서 실행할 것 (docker exec -w /work/week03 llm-lab)

      [검증] 실행한 명령 원문과 출력을 함께 보일 것.
             그리고 W02 의 정규식 4,690 보다 왜 더 많은지 한 문장으로 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      n = len(enc.encode(open('the-verdict.txt', encoding='utf-8').read()))
      print('BPE_TOKENS', n)
      print('BPE_5145_OK' if n == 5145 else 'NG')"
      ```
      ## ✅ 합격 기준
      `BPE_TOKENS 5145` 와 `BPE_5145_OK`.

      ## 🔍 에이전트 판정 포인트
      **4,690 이 나오면 에이전트가 W02 의 정규식 코드를 재사용한 것이다.** 두 숫자가 모두
      "이 파일의 토큰 수"라는 이름을 갖기 때문에 에이전트는 자연스럽게 앞 주차 코드를 가져다 쓴다.
      프롬프트에 "정규식으로 나누지 말 것"을 넣은 이유가 이것이다.

      또 하나 — 숫자가 안 맞을 때 **에이전트가 기준값 5145 를 자기 결과로 바꾸려 드는지** 보라.
      `if n == 5145` 를 `if n == 4690` 으로 고쳐 오면 그건 검증이 아니라 검증의 삭제다.
    hint: '4,690 이 나오면 정규식 분리 코드를 돌린 것이다'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      n = len(enc.encode(open('the-verdict.txt', encoding='utf-8').read()))
      print('BPE_TOKENS', n)
      print('BPE_5145_OK' if n == 5145 else 'NG')"
    answer_detail: "N=5,145 는 이번 주 모든 샘플 수 계산의 분자다. 정규식(4,690)보다 큰 이유를 설명할 수 있어야 BPE 의 서브워드 분해를 이해한 것이다."
    verify:
      type: output_contains
      expect: BPE_5145_OK
      field: stdout
      semantic:
        intent: "BPE 총 토큰 수 확인 — 샘플 수 공식의 N 확보"
        success_criteria: ["5145 확인", "정규식과의 차이 설명"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 첫 배치: "정답 = 입력을 한 칸 민 것"

      LLM 의 학습 문제는 단 하나, **다음 토큰 맞히기**다. 그래서 정답 라벨은 입력을 왼쪽으로
      한 칸 민 것이고, **사람이 붙일 라벨이 없다**(자기지도 학습).

      ## 💡 무엇을 보는가
      ```
      첫 배치 입력 : [[40, 367, 2885, 1464]]
      첫 배치 정답 : [[367, 2885, 1464, 1807]]
      둘째 배치 입력: [[367, 2885, 1464, 1807]]   ← 첫 배치의 정답과 같다
      ```
      stride=1 이라 창이 정확히 한 칸 밀렸다. 이 관계를 눈으로 확인하는 것이 목적이다.

      ## ⚠️ `shuffle=False` 를 제약으로 명시하라
      셔플이 켜져 있으면 실행할 때마다 첫 배치가 달라져 정답지와 대조할 수 없다.
      **재현 가능성을 위해 난수를 끄는 것**은 검증 설계의 기본기다.

      ## 🤖 에이전트 프롬프트 ① — 먼저 데이터셋을 만들게 한다
      ```text
      [목표] /work/week03/dataset.py 에 슬라이딩 윈도우 Dataset 과 DataLoader 팩토리를 만든다

      [할 일]
       1. GPTDatasetV1 클래스를 만든다 (torch.utils.data.Dataset 상속)
          - 생성자 인자: (txt, tokenizer, max_length, stride)
          - 텍스트 전체를 encode 한 뒤, stride 간격으로 창을 밀며
            입력 = 토큰[i : i+max_length]
            정답 = 토큰[i+1 : i+max_length+1]
            두 쌍을 torch.tensor 로 만들어 리스트에 쌓는다
          - __len__ 은 쌓인 쌍의 개수, __getitem__ 은 (입력, 정답) 튜플을 돌려준다
       2. create_dataloader_v1(txt, batch_size, max_length, stride, shuffle, drop_last, num_workers)
          함수를 만든다. 내부에서 tiktoken gpt2 인코더를 만들어 GPTDatasetV1 에 넘기고
          DataLoader 를 돌려준다

      [제약]
       - 정답은 반드시 입력을 한 칸 민 것이어야 한다. 시프트를 빼먹지 말 것
       - 창이 텍스트 끝을 넘어가면 그 창은 만들지 말 것 (범위 밖 인덱싱 금지)
       - shuffle 은 인자로 받아 그대로 DataLoader 에 넘길 것. 함수 안에서 고정하지 말 것

      [검증] 파일을 만든 뒤 import 가 되는지만 확인하고 멈출 것. 값 검증은 다음 프롬프트에서 한다
      ```

      ## 🤖 에이전트 프롬프트 ② — 시프트 관계를 눈으로 확인시킨다
      ```text
      [목표] 첫 배치와 둘째 배치를 꺼내 "정답 = 입력을 한 칸 민 것"을 확인한다

      [할 일]
       1. dataset.py 의 create_dataloader_v1 로 로더를 만든다
          batch_size=1, max_length=4, stride=1
       2. iter() 로 배치를 두 개 연속으로 꺼낸다
       3. 다음 세 줄을 출력한다
          B1_IN  <첫 배치 입력>
          B1_TGT <첫 배치 정답>
          B2_IN  <둘째 배치 입력>
       4. 세 값이 아래와 모두 같으면 SHIFT_OK, 아니면 NG 를 출력한다
          B1_IN  = [[40, 367, 2885, 1464]]
          B1_TGT = [[367, 2885, 1464, 1807]]
          B2_IN  = [[367, 2885, 1464, 1807]]

      [제약]
       - shuffle=False 로 만들 것. 셔플이 켜져 있으면 실행할 때마다 첫 배치가 달라져
         정답지와 대조 자체가 불가능하다
       - 텐서를 그대로 print 하지 말고 .tolist() 로 바꿔 출력할 것

      [검증] 세 배열 원문과 SHIFT_OK 를 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week03 llm-lab python3 -c "
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=1, max_length=4, stride=1, shuffle=False)
      it = iter(dl); b1 = next(it); b2 = next(it)
      print('B1_IN', b1[0].tolist()); print('B1_TGT', b1[1].tolist()); print('B2_IN', b2[0].tolist())
      ok = (b1[0].tolist()==[[40,367,2885,1464]] and b1[1].tolist()==[[367,2885,1464,1807]]
            and b2[0].tolist()==[[367,2885,1464,1807]])
      print('SHIFT_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      세 배열이 정답지와 일치하고 `SHIFT_OK`.

      ## 🔍 에이전트 판정 포인트
      **`B1_TGT` 가 `B1_IN` 과 똑같이 나오면 시프트를 빼먹은 것이다.** 슬라이스를
      `[i:i+max_length]` / `[i+1:i+max_length+1]` 로 써야 하는데 둘 다 `i` 로 시작하게 짜는
      실수가 가장 흔하다. 이 버그는 **에러를 내지 않는다.** 조용히 통과해서 9주차 훈련까지
      살아남고, 거기서 "손실은 잘 내려가는데 생성 결과가 입력을 그대로 따라 하는" 형태로
      나타난다. 원인을 찾기 극도로 어렵다 — 그래서 여기서 값으로 못 박는다.

      **둘째 함정: `shuffle` 을 안 끄면 실행할 때마다 답이 달라진다.** 에이전트는 DataLoader
      기본값(`shuffle=False`)에 의존하거나 반대로 "학습에는 셔플이 좋다"는 상식으로 켜 버린다.
      제약에 명시하지 않으면 둘 중 무엇이 될지 알 수 없고, **답이 매번 달라지는 실습은 채점이
      불가능하다.** 재현성을 위해 난수를 끄는 것은 검증 설계의 기본기다.
    hint: '정답이 입력과 똑같이 나오면 시프트(+1)를 빠뜨린 것이다'
    answer: |
      docker exec -w /work/week03 llm-lab python3 -c "
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      dl = create_dataloader_v1(raw, batch_size=1, max_length=4, stride=1, shuffle=False)
      it = iter(dl); b1 = next(it); b2 = next(it)
      print('B1_IN', b1[0].tolist()); print('B1_TGT', b1[1].tolist()); print('B2_IN', b2[0].tolist())
      ok = (b1[0].tolist()==[[40,367,2885,1464]] and b1[1].tolist()==[[367,2885,1464,1807]]
            and b2[0].tolist()==[[367,2885,1464,1807]])
      print('SHIFT_OK' if ok else 'NG')"
    answer_detail: "시프트가 한 칸이라도 어긋나면 모델은 '다음 토큰'이 아니라 '현재 토큰'을 맞히는 법을 배운다 — 손실은 0 에 가까워지는데 생성은 엉망인 기묘한 상황이 된다. 9주차에서 이 버그를 겪지 않으려면 여기서 잡아야 한다."
    verify:
      type: output_contains
      expect: SHIFT_OK
      field: stdout
      semantic:
        intent: "슬라이딩 윈도우 (입력, 정답) 쌍 생성 확인"
        success_criteria: ["첫 배치 값 일치", "정답 = 입력 시프트", "둘째 배치 = 첫 정답"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 그리드 실험 + 공식 손계산 검증

      같은 텍스트에서 하이퍼파라미터에 따라 학습 샘플이 얼마나 달라지는지 측정하고,
      그 값을 **공식으로 직접 검증**한다.

      ## 💡 샘플 수 공식
      > **샘플 수 = ⌈(전체 토큰 수 N − max_length) ÷ stride⌉**  (N = 5,145)

      | max_length | stride | 샘플 수 | 인접 중복 | 관찰 |
      |---|---|---|---|---|
      | 4 | 1 | **5,141** | 3 (75%) | 압도적으로 많지만 거의 같은 내용 |
      | 4 | 4 | **1,286** | 0 | 중복 없음, 샘플 1/4 |
      | 256 | 128 | **39** | 128 (50%) | 긴 문맥, 절반 중복 |
      | 256 | 256 | **20** | 0 | 긴 문맥, 중복 없음 |

      ## ⚠️ 반드시 `len(dataset)` 으로 셀 것
      `len(dataloader)` 로 세면 `batch_size` 와 `drop_last` 에 따라 값이 달라진다.
      **무엇을 세는지 명시하지 않으면 에이전트가 다른 것을 센다.**

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] (max_length, stride) 4조합에서 학습 샘플 수를 측정하고 공식과 대조한다

      [할 일]
       1. the-verdict.txt 의 BPE 총 토큰 수 N 을 구한다
       2. 다음 4조합에 대해 GPTDatasetV1 을 만든다
          (max_length, stride) = (4,1), (4,4), (256,128), (256,256)
       3. 조합마다 한 줄씩 출력한다
          ml=<max_length> stride=<stride> len=<실측 샘플 수> formula=<공식값> match=<True/False>
          공식값 = 올림( (N - max_length) / stride )
       4. 실측 4개가 [5141, 1286, 39, 20] 과 모두 같으면 GRID_OK, 아니면 NG 를 출력한다

      [제약]
       - 샘플 수는 반드시 len(dataset) 으로 셀 것.
         len(dataloader) 는 batch_size 와 drop_last 에 따라 값이 달라지는 다른 숫자다
       - 공식은 내림이 아니라 올림이다 (math.ceil)
       - 4조합을 한 번의 실행에서 전부 돌릴 것

      [검증] 4줄 전부와 GRID_OK 를 보일 것.
