    instruction: |
      ## 🎯 미션 — 암기의 물증: 최장 연속 일치 (10단어 이상)

      **"비슷해 보인다"로는 부족하다.** 생성문이 원문 **그대로**인지 검색으로 입증한다.

      ## 🔴 왜 "최장 연속 일치"가 핵심 지표인가
      조각 비율(예: 4/9 = 44%)만 보면 **"흔한 표현이 우연히 겹쳤다"** 는 반론이 가능하다.
      그리고 조각을 어떻게 자르느냐(7단어씩? 겹쳐서? 건너뛰며?)에 따라 22%~44% 로 흔들린다.

      **13단어가 연속으로 일치하는 것은 우연일 수 없다.** 그래서 이 실습의 통과 기준은
      **최장 연속 일치 ≥ 10단어**로 잡는다.

      ## 🔴 가장 강한 증거 — 봉합 지점
      실측에서 모델은 원문 오프셋 **13,218** 구간을 재현한 뒤 **멀리 떨어진 오프셋 14,294**
      구간으로 건너뛰어 이어 붙였다. **서로 떨어진 두 구절을 각각 외워 봉합한 것이다.**
      여러분의 생성문에서도 이런 봉합 지점을 찾아보라.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, torch, tiktoken; sys.path.insert(0, '.')
      from common import text_to_token_ids, token_ids_to_text
      from gpt_model import GPTModel, GPT_CONFIG_124M
      from generate import generate_text_simple
      enc = tiktoken.get_encoding('gpt2')
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      m = GPTModel(cfg)
      m.load_state_dict(torch.load('model_10ep.pth', map_location='cpu', weights_only=True)); m.eval()
      ids = generate_text_simple(m, text_to_token_ids('Every effort moves you', enc), 50, 256)
      gen = token_ids_to_text(ids, enc)
      raw = open('the-verdict.txt', encoding='utf-8').read()
      w = gen.split()
      frags = [' '.join(w[i:i+7]) for i in range(0, len(w)-6, 5)]
      hits = [f for f in frags if f in raw]
      best = 0
      for i in range(len(w)):
          for j in range(i+1, len(w)+1):
              if ' '.join(w[i:j]) in raw: best = max(best, j-i)
              else: break
      print('GEN:', gen[:150])
      print(f'FRAGMENTS {len(hits)}/{len(frags)} = {len(hits)/len(frags)*100:.1f}%')
      print(f'LONGEST_CONSECUTIVE {best} words')
      print(f'TRAIN_PERPLEXITY_HINT exp(0.8908) = 2.44')
      print('OVERFIT_EVIDENCE_OK' if best >= 10 else 'NG')"
      ```
      ## ✅ 합격 기준
      `LONGEST_CONSECUTIVE` 가 **10 이상**이고 `OVERFIT_EVIDENCE_OK`.
      (조각 비율은 참고값이다 — 자르는 방식에 따라 흔들린다.)

      ## 💡 퍼플렉시티로 해석하기
      train 손실 < 1 → 퍼플렉시티 `exp(1) ≈ 2.718` 이하. 즉 모델이 매 순간 **후보 3개 미만에서
      고민**한다. 5만 개 어휘 중에서 사실상 다음 토큰을 **알고 있다 — 이해가 아니라 암기다.**
    hint: '3~4단어만 일치한다면 훈련이 덜 된 것이다. 10 에폭을 끝까지 돌렸는지 확인하라'
