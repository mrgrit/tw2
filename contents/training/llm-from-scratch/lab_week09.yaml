  - order: 4
    instruction: |
      ## 🎯 미션 — 훈련 전 손실: 이론 예언과 같은 동네인가

      훈련을 시작하기 전에 기준선을 잰다.

      ## 💡 예상 결과
      train **10.9876** / val **10.9811** — 미션 1의 이론 예언 `ln(50257) = 10.8249` 와
      **같은 동네**다. 실제 데이터·실제 로더로 재도 이론값 근처가 나온다는 것이 확인 포인트다.

      ## ⚠️ eval 모드와 no_grad 를 짝으로
      드롭아웃이 켜져 있으면 손실이 매번 달라진다(W05). 평가 코드에는 항상
      `model.eval()` + `torch.no_grad()` 를 함께 넣는다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, torch; sys.path.insert(0, '.')
      import torch.nn.functional as F
      from common import device
      from dataset import create_dataloader_v1
      from gpt_model import GPTModel, GPT_CONFIG_124M
      raw = open('the-verdict.txt', encoding='utf-8').read()
      n = int(0.9*len(raw))
      trl = create_dataloader_v1(raw[:n], batch_size=2, max_length=256, stride=256, drop_last=True,  shuffle=False)
      val = create_dataloader_v1(raw[n:], batch_size=2, max_length=256, stride=256, drop_last=False, shuffle=False)
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      torch.manual_seed(123); m = GPTModel(cfg).to(device); m.eval()
      def loader_loss(dl):
          tot = 0.0
          with torch.no_grad():
              for x, y in dl:
                  x, y = x.to(device), y.to(device)
                  tot += F.cross_entropy(m(x).flatten(0,1), y.flatten()).item()
          return tot/len(dl)
      tr, va = loader_loss(trl), loader_loss(val)
      print(f'PRE_TRAIN_LOSS={tr:.4f}  PRE_VAL_LOSS={va:.4f}')
      print('PRETRAIN_BASELINE_OK' if 10.5 < tr < 11.5 and 10.5 < va < 11.5 else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      두 손실이 모두 **10.5 ~ 11.5** 범위이고 `PRETRAIN_BASELINE_OK`.
      6 근처가 나오면 이미 학습된 가중치를 쓴 것이다.
    hint: 'device 로 모델과 입력을 모두 옮겼는지 확인하라 — 하나만 옮기면 런타임 오류가 난다'
    answer: |
