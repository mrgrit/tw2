  - order: 7
    instruction: |
      ## 🎯 미션 — 속도 실험: "작은 배치는 GPU를 굶긴다"

      같은 훈련을 CPU·GPU·bf16 으로 돌리고, 배치 크기를 키워 처리량을 본다.

      ## ⚠️ **이 실험만 stride=128 로 바꿔야 한다** (반드시 지킬 것)
      P9-2 설정(`max_length = stride = 256`)으로는 train 샘플이 18개뿐이라 `batch=32` 에서
      `drop_last=True` 가 배치를 **0개**로 만든다 — 루프가 아예 돌지 않아 tokens/sec 가 0 이거나
      `ZeroDivisionError` 가 난다. `stride=128` 이면 샘플이 35개가 되어 세 조건 모두 측정된다.
      (W03 그리드 표의 `(256, 128)` 행이 바로 이 설정이다.)

      **로더를 만든 직후 `len(loader)` 를 세 조건 모두 출력해 확인하라.** 이 습관이 사고를 막는다.

      ## 💡 예상 결과 (참고 실측 GB10)
      | 장치 | CPU 대비 |
      |---|---|
      | CPU | 1× |
      | **GPU (fp32)** | **11.5×** |
      | GPU + bf16 | 1.13× (GPU fp32 대비) |

      | batch | tokens/sec | batch=2 대비 |
      |---|---|---|
      | 2 | 4,155 | 1.00× |
      | 32 | **7,166** | **1.72×** |

      **bf16 의 이득이 크지 않다.** 이 규모(124M, ctx 256, batch 2)에서는 **배치가 작아 GPU가
      놀고 있기** 때문이다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, time, torch; sys.path.insert(0, '.')
      import torch.nn.functional as F
      import common  # week03/week07 경로 등록
      from dataset import create_dataloader_v1
      from gpt_model import GPTModel, GPT_CONFIG_124M
      raw = open('the-verdict.txt', encoding='utf-8').read()
      n = int(0.9*len(raw)); cfg = dict(GPT_CONFIG_124M, context_length=256)
      dev = torch.device('cuda')
      rows = []
      for bs in [2, 8, 32]:
          dl = create_dataloader_v1(raw[:n], batch_size=bs, max_length=256, stride=128,
                                    drop_last=True, shuffle=False)
          print(f'batch={bs:2d}  len(loader)={len(dl)}')
          if len(dl) == 0: print('EMPTY_LOADER'); continue
          torch.manual_seed(123); m = GPTModel(cfg).to(dev)
          opt = torch.optim.AdamW(m.parameters(), lr=4e-4, weight_decay=0.1)
          x, y = next(iter(dl)); x, y = x.to(dev), y.to(dev)
          opt.zero_grad(); F.cross_entropy(m(x).flatten(0,1), y.flatten()).backward(); opt.step()
          torch.cuda.synchronize(); t0 = time.time(); toks = 0
          for x, y in dl:
              x, y = x.to(dev), y.to(dev)
              opt.zero_grad(); F.cross_entropy(m(x).flatten(0,1), y.flatten()).backward(); opt.step()
              toks += x.numel()
          torch.cuda.synchronize(); dt = time.time()-t0
          print(f'   time={dt:.2f}s  tokens/sec={toks/dt:.0f}')
          rows.append(toks/dt); del m, opt; torch.cuda.empty_cache()
      print(f'THROUGHPUT_RATIO={rows[-1]/rows[0]:.2f}x')
      print('SPEED_EXPERIMENT_OK' if rows[-1] > rows[0] else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      세 배치 모두 `len(loader) > 0`, `batch=32` 의 tokens/sec 가 `batch=2` 보다 크고,
      `SPEED_EXPERIMENT_OK`.

      ## 📝 해석 과제 (직접 작성)
      "모델 적재 621MB(W07)면 충분한 줄 알았는데 훈련은 왜 메모리가 더 필요한가?" —
      기울기, 옵티마이저 상태(AdamW는 파라미터당 **2개**), 활성값을 들어 3~4문장으로 설명하라.
      (`nvidia-smi` 로 훈련 중 메모리를 직접 관찰해 근거로 삼아도 좋다.)
    hint: 'stride=256 으로 두고 batch=32 를 돌려 보라 — len(loader)=0 이 나오는 것을 직접 확인할 수 있다'
