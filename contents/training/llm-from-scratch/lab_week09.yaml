lab_id: llm-from-scratch-week09
title: "W09 — 내 모델의 첫 학습: 손실 해부·train/val 분리·10에폭 사전훈련·과적합 물증·속도 실험"
version: ai
course: llm-from-scratch
week: 9
description: |
  크로스 엔트로피를 확률 단계부터 수동 재구성해 초기 손실이 ln(50257) 근처임을 이론으로 예언하고
  측정으로 확인한다. train/val 을 나눠 10 에폭을 훈련하고, train 손실은 1 아래로 내려가는데 val
  손실은 6에서 정체하다 다시 올라가는 과적합을 관찰한다. 그리고 생성문이 원문과 10단어 이상
  연속 일치한다는 물증으로 "이해가 아니라 암기"를 입증한다. 마지막으로 CPU/GPU/bf16/배치 크기를
  바꿔 처리량을 측정해 "작은 배치는 GPU를 굶긴다"를 확인한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  ## 📁 `common.py` 를 먼저 만든다 (P9-0)

  이번 주 코드는 `week03`(dataset), `week05`·`week06`(부품), `week07`(GPTModel) 을 모두 불러
  쓴다. 매번 `sys.path` 를 손대지 않도록 `/work/week09/common.py` 하나에 경로 등록과 공통
  유틸을 모아 둔다.

  ```text
  [목표] /work/week09/common.py 를 만든다
  [할 일]
   1. 이 파일이 import 될 때 week03, week05, week06, week07 디렉터리를
      sys.path 에 등록하도록 한다 (파일 위치 기준 상대 경로로)
   2. device 변수를 만든다 (cuda 가 있으면 cuda, 없으면 cpu)
   3. text_to_token_ids(text, tokenizer) — 문자열을 [1, T] 텐서로
   4. token_ids_to_text(token_ids, tokenizer) — [1, T] 텐서를 문자열로
  [제약]
   - 절대 경로를 하드코딩하지 말 것. __file__ 기준으로 잡을 것
  [검증] python3 -c "import common; from gpt_model import GPTModel" 이 통과하는지 확인
  ```

  ⚠️ **이후 모든 단계의 스크립트는 첫 줄에서 `import common` 을 해야 한다.**
  빼먹으면 `ModuleNotFoundError: No module named 'gpt_model'` 이 난다.
difficulty: hard
duration_minutes: 180
audience: LLM 밑바닥 구현 (9주차)
prerequisites:
  - W07 완료 — GPTModel, generate_text_simple
  - "`/work/week09/` 에 the-verdict.txt, week03·week07 모듈 import 가능"
  - GPU 사용 규약 — device 이동, torch.cuda.synchronize, del + empty_cache
  - W09 강의안 정독 — ln(50257) 예언, 퍼플렉시티 해석, stride=128 경고
objectives:
  - "수동 크로스 엔트로피와 F.cross_entropy 가 10.7940 으로 일치함을 확인한다"
  - "퍼플렉시티 48,726 과 ln(50257)=10.8249 를 대조한다"
  - "train 9배치 / val 1배치, 커버 토큰 4,608 / 512 를 손계산으로 유도한다"
  - "훈련 전 손실이 약 10.98 임을 확인한다"
  - "10 에폭 훈련 후 train < 1, val 6 초반대 정체·상승을 관찰한다"
  - "생성문이 원문과 10단어 이상 연속 일치함을 검색으로 입증한다"
  - "GPU/CPU 배속과 배치 크기별 tokens/sec 를 측정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 손실 해부: 수동 재구성 == F.cross_entropy (10.7940)

      크로스 엔트로피를 **확률 단계부터** 손으로 다시 만들어 라이브러리 함수와 대조한다.

      ## 💡 계산 순서
      ```
      로짓 → softmax → 정답 토큰의 확률만 추출 → −log → 평균
      ```

      ## 💡 `flatten(0, 1)` 이 왜 필요한가
      `F.cross_entropy` 는 `(N, C)` 로짓과 `(N,)` 정답을 받는데 우리 로짓은 `[2, 3, 50257]` 이다.
      ```
      logits.flatten(0, 1)  → [6, 50257]   (배치 2 × 토큰 3 = 6개 예측)
      targets.flatten()     → [6]
      ```
      배치와 토큰 축을 하나로 뭉갠다. 각 예측은 독립적으로 채점되므로 문제없다 —
      "6개 문제를 한 줄로 세워 채점한다".

      ## 💡 왜 context_length 를 1024 → 256 으로 줄이나
      훈련 데이터가 5,145 토큰뿐이다. 1024 로 두면 샘플이 4개, 256 이면 20개가 나온다.
      **⚠️ 이 설정 변경 때문에 파라미터 총계가 W07 의 163,009,536 과 달라진다.**
      정답지 수치는 항상 "어떤 설정에서"인지 함께 기억하라.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 크로스 엔트로피를 확률 단계부터 손으로 재구성해 F.cross_entropy 와 대조한다

      [할 일]
       1. GPT_CONFIG_124M 에서 context_length 만 256 으로 바꾼 설정으로 모델을 만든다
          (시드 123, eval 모드)
       2. 다음 두 텐서를 준비한다
          inputs  = [[16833, 3626, 6100], [40, 1107, 588]]
          targets = [[3626, 6100, 345], [1107, 588, 11311]]
       3. 로짓을 구한 뒤 "손으로" 손실을 계산한다
          로짓 → softmax → 정답 토큰 위치의 확률만 뽑기 → -log → 평균
       4. 같은 로짓으로 F.cross_entropy 도 계산한다
          (로짓은 배치·토큰 축을 하나로 뭉개고, 정답도 1차원으로 편다)
       5. 네 줄을 출력한다
          MANUAL <소수 4자리> / AUTO <소수 4자리> /
          PERPLEXITY <exp(AUTO), 소수 2자리> / LN_50257 <ln(50257), 소수 4자리>
       6. 두 값의 차이가 1e-4 미만이고 AUTO 가 10.7940 근처면 LOSS_ANATOMY_OK

      [제약]
       - 스크립트 첫머리에서 common 을 import 할 것. 안 하면 gpt_model 을 못 찾는다
       - 수동 계산에서 F.cross_entropy 나 F.nll_loss 를 쓰지 말 것.
          softmax → 인덱싱 → log → 평균 을 직접 쓸 것
       - 정답 토큰의 확률을 뽑을 때 배치와 토큰 축을 모두 맞춰 인덱싱할 것
       - context_length 를 256 으로 바꾸는 것을 잊지 말 것

      [검증] 네 줄을 모두 출력하고,
             측정값 10.7940 과 이론 예언 ln(50257)=10.8249 의 차이를 어떻게 해석하는지 답할 것.
             그리고 퍼플렉시티 48,726 이 어휘 크기 50,257 근처인 것이 무엇을 뜻하는지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, math, torch; sys.path.insert(0, '.')
      import common  # week03/05/06/07 경로 등록 — 빼면 gpt_model 을 못 찾는다
      import torch.nn.functional as F
      from gpt_model import GPTModel, GPT_CONFIG_124M
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      torch.manual_seed(123); m = GPTModel(cfg); m.eval()
      inputs  = torch.tensor([[16833, 3626, 6100], [40, 1107, 588]])
      targets = torch.tensor([[3626, 6100, 345], [1107, 588, 11311]])
      with torch.no_grad(): logits = m(inputs)
      probs = torch.softmax(logits, dim=-1)
      tp = torch.stack([probs[i, torch.arange(3), targets[i]] for i in range(2)])
      manual = -torch.log(tp).mean()
      auto = F.cross_entropy(logits.flatten(0,1), targets.flatten())
      print('MANUAL    ', round(manual.item(), 4))
      print('AUTO      ', round(auto.item(), 4))
      print('PERPLEXITY', round(torch.exp(auto).item(), 2))
      print('LN_50257  ', round(math.log(50257), 4))
      ok = abs(manual.item()-auto.item()) < 1e-4 and abs(auto.item()-10.7940) < 0.001
      print('LOSS_ANATOMY_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `MANUAL 10.794`, `AUTO 10.794`, `PERPLEXITY 48725.82`, `LN_50257 10.8249`,
      `LOSS_ANATOMY_OK`. 실측 출력:
      ```
      MANUAL     10.794
      AUTO       10.794
      PERPLEXITY 48725.82
      LN_50257   10.8249
      ```

      ## 🔍 에이전트 판정 포인트
      **`import common` 을 빼면 이렇게 죽는다.** 이 주차에서 가장 자주 나오는 오류다.
      ```
      ModuleNotFoundError: No module named 'gpt_model'
      ```
      에이전트는 이 에러를 만나면 **week07 의 gpt_model.py 를 week09 로 복사해 버리는** 경우가
      많다. 그러면 당장은 돌지만 W07 파일과 두 벌이 되어, 한쪽만 고치는 순간 두 주차의 결과가
      갈린다. **경로를 등록해야지 파일을 복제하면 안 된다.**

      **수동 계산에 라이브러리 함수를 쓰면 대조가 무의미해진다.** `F.nll_loss` 나
      `F.log_softmax` 를 쓰면 "수동"이 아니다. `MANUAL` 과 `AUTO` 가 같은 함수를 두 번 호출한
      결과가 되어 항상 일치한다. `softmax → 인덱싱 → log → 평균` 을 직접 쓴 코드인지 확인하라.

      **`flatten(0, 1)` 이 왜 필요한가.** `F.cross_entropy` 는 `(N, C)` 로짓과 `(N,)` 정답을
      받는데 우리 로짓은 `[2, 3, 50257]` 이다.
      ```
      logits.flatten(0, 1)  → [6, 50257]   (배치 2 × 토큰 3 = 6개 예측)
      targets.flatten()     → [6]
      ```
      배치와 토큰 축을 하나로 뭉갠다. 각 예측은 독립적으로 채점되므로 문제없다 —
      **"6개 문제를 한 줄로 세워 채점한다".**

      **`context_length` 를 256 으로 줄이는 것을 빠뜨리면 값이 달라진다.** 훈련 데이터가
      5,145 토큰뿐이라 1024 로 두면 샘플이 4개, 256 이면 20개가 나온다.
      **⚠️ 이 설정 변경 때문에 파라미터 총계가 W07 의 163,009,536 과 달라진다.**
      정답지 수치는 항상 "어떤 설정에서"인지 함께 기억하라.

      **이론 예언 → 측정 순서가 이 단계의 핵심이다.** 아무것도 모르는 모델은 5만 개 어휘에
      균등한 확률을 주므로 손실이 `-ln(1/50257) = ln(50257) = 10.8249` 여야 한다.
      측정값 10.7940 과의 차이 0.03 이 W07 에서 본 "10배 잡음"의 결과다.
      **숫자를 보고 놀라는 게 아니라 먼저 예언하고 측정으로 확인한다.**
    hint: '이론 예언 ln(50257)=10.8249 와 측정 10.7940 의 차이 0.03 이 W07 의 "10배 잡음"의 결과다'
    answer: |
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, math, torch; sys.path.insert(0, '.')
      import common  # week03/05/06/07 경로 등록 — 빼면 gpt_model 을 못 찾는다
      import torch.nn.functional as F
      from gpt_model import GPTModel, GPT_CONFIG_124M
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      torch.manual_seed(123); m = GPTModel(cfg); m.eval()
      inputs  = torch.tensor([[16833, 3626, 6100], [40, 1107, 588]])
      targets = torch.tensor([[3626, 6100, 345], [1107, 588, 11311]])
      with torch.no_grad(): logits = m(inputs)
      probs = torch.softmax(logits, dim=-1)
      tp = torch.stack([probs[i, torch.arange(3), targets[i]] for i in range(2)])
      manual = -torch.log(tp).mean()
      auto = F.cross_entropy(logits.flatten(0,1), targets.flatten())
      print('MANUAL    ', round(manual.item(), 4))
      print('AUTO      ', round(auto.item(), 4))
      print('PERPLEXITY', round(torch.exp(auto).item(), 2))
      print('LN_50257  ', round(math.log(50257), 4))
      ok = abs(manual.item()-auto.item()) < 1e-4 and abs(auto.item()-10.7940) < 0.001
      print('LOSS_ANATOMY_OK' if ok else 'NG')"
    answer_detail: "숫자를 보고 놀라는 게 아니라 먼저 예언하고 측정으로 확인한다 — 이것이 이 수업이 가르치는 사고방식이다. 퍼플렉시티 48,726 이 어휘 크기 50,257 근처인 것도 '아무것도 모르는 상태'의 정의 그대로다."
    verify:
      type: output_contains
      expect: LOSS_ANATOMY_OK
      field: stdout
      semantic:
        intent: "크로스 엔트로피 수동 재구성과 이론 예언 대조"
        success_criteria: ["수동==자동 10.7940", "퍼플렉시티 48,726", "ln(50257) 비교"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 손실 성질을 pytest 로 고정

      ## 💡 두 테스트
      | 테스트 | 지키는 성질 |
      |---|---|
      | 수동 == 내장 | 확률 단계부터 재구성한 값이 `F.cross_entropy` 와 일치 |
      | 초기 손실 범위 | 무작위 초기화 모델의 손실이 `ln(50257) ± 0.5` 안 |

      ## 💡 두 번째 테스트가 강력한 이유
      **이것은 모델 전체를 검사하는 게이트다.** 위치 임베딩이 빠져도, 잔차가 빠져도, 초기화가
      이상해도 이 범위를 벗어난다. W08 버그 은행 #8(잔차 누락)이 실제로 이 게이트에 걸렸다:
      ```
      정상 모델      : 10.6388  → 통과
      잔차 누락 모델 : 10.3156  → FAIL (검출됨)
      ```

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week09/test_loss.py 에 손실 계산의 두 성질을 회귀 테스트로 고정한다

      [할 일]
       1. test_manual_equals_builtin
          - 확률 단계부터 수동 재구성한 손실과 F.cross_entropy 결과가 일치함을 assert
          - 임의의 (배치, 토큰수) 조합에서도 성립하게 쓸 것

       2. test_initial_loss_near_uniform
          - 무작위 초기화 모델의 손실이 ln(50257) ± 0.5 안에 있음을 assert
          - 모델은 eval 모드, no_grad 로 잴 것

       마지막에 pytest 로 실행해 결과를 보인다.

      [제약]
       - 스크립트 첫머리에서 common 을 import 할 것
       - 2번의 허용 범위 ±0.5 를 넓히지 말 것. 넓히면 게이트가 무력해진다
       - 테스트가 실패하면 테스트가 아니라 모델을 의심할 것

      [검증] 테스트 파일 전문과 pytest 출력을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -m pytest test_loss.py -q
      ```
      ## ✅ 합격 기준
      `2 passed`. 실측 출력:
      ```
      ..                                                                       [100%]
      2 passed in 2.10s
      ```

      ## 🔍 에이전트 판정 포인트
      **두 번째 테스트가 이 수업에서 가장 값싼 전체 점검이다.** 모델을 한 번 돌리는 비용으로
      위치 임베딩 누락, 잔차 누락, 초기화 이상을 한꺼번에 훑는다. **큰 훈련을 시작하기 전에
      항상 이것부터 돌려라.** 여기서 벗어나면 훈련을 돌려도 시간만 버린다.

      **허용 범위를 넓히는 것이 이 테스트를 죽이는 가장 쉬운 방법이다.** `±0.5` 를 `±2` 로
      바꾸면 W08 의 잔차 누락 모델(10.3156)도 통과한다. 에이전트가 "여유를 두었습니다"라며
      범위를 넓혀 오면 되돌려라.

