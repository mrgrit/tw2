    answer_detail: "훈련 전 기준선이 있어야 '얼마나 배웠는가'를 말할 수 있다. 10.98 → 0.89 라는 변화가 그 자체로 학습의 증거다."
    verify:
      type: output_contains
      expect: PRETRAIN_BASELINE_OK
      field: stdout
      semantic:
        intent: "훈련 전 손실 기준선 측정과 이론값 대조"
        success_criteria: ["train/val 모두 약 10.98", "eval + no_grad"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 10 에폭 사전 훈련: 곡선이 갈라지는 것을 보라

      드디어 훈련이다. GPU 에서 약 **45초** 걸린다.

      ## 💡 관찰 포인트 ① 에폭별 생성문의 변화
      | 에폭 | 생성문 (앞부분) |
      |---|---|
      | 1 | `Every effort moves you,,,,,,,,,,,,.` |
      | 3 | `... and, and the to the of the to the ... Stroud, an` |
      | 7 | `... know the picture, and pushed one of the deep arm-chairs.` |
      | **10** | **`Every effort moves you?"  "Yes--quite insensible to the irony. ..."`** |

      **모델은 빈도가 높은 것부터 배운다** — 쉼표 → 흔한 단어 → 구문 → 문장.

      ## 💡 관찰 포인트 ② 두 곡선이 갈라진다
      | 항목 | 값 |
      |---|---|
      | 최종 train | **0.8908** (퍼플렉시티 **2.44**) |
      | 최종 val | **6.3130** (퍼플렉시티 **551.69**) |
      | val 최소값 | **6.0994** (에폭 7.1) |
      | 최소 이후 상승 | **+0.2136** ← 과적합 |

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 pretrain.py
      ```
      ## ✅ 합격 기준
      최종 `train < 1`, `val` 6 초반대, `loss_curve.png` 와 `model_10ep.pth` 생성.
      그리고 val 손실이 **최소점 이후 다시 올라간** 것을 곡선에서 확인한다.

