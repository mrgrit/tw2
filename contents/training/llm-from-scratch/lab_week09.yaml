      ```
      이 에러를 만나면 에이전트는 **모델을 CPU 로 되돌려** 해결하는 쪽을 고르기도 한다.
      그러면 돌긴 하지만 다음 단계 훈련이 몇 배 느려진다. **입력을 GPU 로 올리는 것이 정답이다.**

