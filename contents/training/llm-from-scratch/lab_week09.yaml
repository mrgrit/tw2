      ## 🎯 미션 — 속도 실험: "작은 배치는 GPU를 굶긴다"

      같은 훈련을 CPU·GPU·bf16 으로 돌리고, 배치 크기를 키워 처리량을 본다.

      ## ⚠️ **이 실험만 stride=128 로 바꿔야 한다** (반드시 지킬 것)
      P9-2 설정(`max_length = stride = 256`)으로는 train 샘플이 18개뿐이라 `batch=32` 에서
      `drop_last=True` 가 배치를 **0개**로 만든다 — 루프가 아예 돌지 않아 tokens/sec 가 0 이거나
      `ZeroDivisionError` 가 난다. `stride=128` 이면 샘플이 35개가 되어 세 조건 모두 측정된다.
      (W03 그리드 표의 `(256, 128)` 행이 바로 이 설정이다.)

      **로더를 만든 직후 `len(loader)` 를 세 조건 모두 출력해 확인하라.** 이 습관이 사고를 막는다.

      ## 💡 예상 결과 (참고 실측 GB10)
      | 장치 | CPU 대비 |
      |---|---|
      | CPU | 1× |
      | **GPU (fp32)** | **11.5×** |
      | GPU + bf16 | 1.13× (GPU fp32 대비) |

      | batch | tokens/sec | batch=2 대비 |
      |---|---|---|
      | 2 | 4,155 | 1.00× |
      | 32 | **7,166** | **1.72×** |

      **bf16 의 이득이 크지 않다.** 이 규모(124M, ctx 256, batch 2)에서는 **배치가 작아 GPU가
      놀고 있기** 때문이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 배치 크기를 바꿔 가며 GPU 훈련 처리량(tokens/sec)을 측정한다

      [할 일]
       1. batch_size 를 2, 8, 32 로 바꿔 가며 train 로더를 만든다
          max_length=256, stride=128, drop_last=True, shuffle=False
       2. 로더를 만든 "직후" 배치 수를 출력한다: batch=<n>  len(loader)=<수>
          0 이면 그 조건은 건너뛰고 EMPTY_LOADER 를 출력한다
       3. 각 조건마다
          - 모델(context_length=256, 시드 123)과 AdamW(lr=4e-4, weight_decay=0.1) 를 만든다
          - 워밍업으로 한 스텝을 먼저 돌린다 (측정에 넣지 않는다)
          - synchronize 후 전체 로더를 1에폭 훈련하며 처리한 토큰 수를 센다
          - synchronize 후 시간을 재고 tokens/sec 를 출력한다
          - 모델과 옵티마이저를 del 하고 캐시를 비운다
       4. batch=32 의 처리량 ÷ batch=2 의 처리량을 출력한다: THROUGHPUT_RATIO=<값>x
       5. batch=32 가 batch=2 보다 크면 SPEED_EXPERIMENT_OK, 아니면 NG

      [제약]
       - stride 는 반드시 128 이다. 256 으로 두면 batch=32 에서 배치가 0개가 되어
         루프가 아예 안 돌고 tokens/sec 가 0 이거나 ZeroDivisionError 가 난다
       - len(loader) 를 세 조건 모두 출력할 것. 이 습관이 위 사고를 막는다
       - 측정 구간 전후에 torch.cuda.synchronize() 를 호출할 것
       - 조건마다 모델을 새로 만들 것. 이어서 훈련하면 비교가 성립하지 않는다

      [검증] 세 조건의 len(loader) 와 tokens/sec 를 모두 출력하고,
             배치를 키웠을 때 처리량이 오르는 이유를 GPU 활용률 관점에서 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, time, torch; sys.path.insert(0, '.')
      import torch.nn.functional as F
      import common  # week03/week07 경로 등록
      from dataset import create_dataloader_v1
      from gpt_model import GPTModel, GPT_CONFIG_124M
      raw = open('the-verdict.txt', encoding='utf-8').read()
      n = int(0.9*len(raw)); cfg = dict(GPT_CONFIG_124M, context_length=256)
      dev = torch.device('cuda')
      rows = []
      for bs in [2, 8, 32]:
          dl = create_dataloader_v1(raw[:n], batch_size=bs, max_length=256, stride=128,
                                    drop_last=True, shuffle=False)
          print(f'batch={bs:2d}  len(loader)={len(dl)}')
          if len(dl) == 0: print('EMPTY_LOADER'); continue
          torch.manual_seed(123); m = GPTModel(cfg).to(dev)
          opt = torch.optim.AdamW(m.parameters(), lr=4e-4, weight_decay=0.1)
          x, y = next(iter(dl)); x, y = x.to(dev), y.to(dev)
          opt.zero_grad(); F.cross_entropy(m(x).flatten(0,1), y.flatten()).backward(); opt.step()
          torch.cuda.synchronize(); t0 = time.time(); toks = 0
          for x, y in dl:
              x, y = x.to(dev), y.to(dev)
              opt.zero_grad(); F.cross_entropy(m(x).flatten(0,1), y.flatten()).backward(); opt.step()
              toks += x.numel()
          torch.cuda.synchronize(); dt = time.time()-t0
          print(f'   time={dt:.2f}s  tokens/sec={toks/dt:.0f}')
          rows.append(toks/dt); del m, opt; torch.cuda.empty_cache()
      print(f'THROUGHPUT_RATIO={rows[-1]/rows[0]:.2f}x')
      print('SPEED_EXPERIMENT_OK' if rows[-1] > rows[0] else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      세 배치 모두 `len(loader) > 0`, `batch=32` 의 tokens/sec 가 `batch=2` 보다 크고,
      `SPEED_EXPERIMENT_OK`. 실측 출력:
      ```
      batch= 2  len(loader)=17
         time=2.09s  tokens/sec=4167
      batch= 8  len(loader)=4
         time=1.30s  tokens/sec=6281
      batch=32  len(loader)=1
         time=1.17s  tokens/sec=6987
      THROUGHPUT_RATIO=1.68x
      ```

      ## 🔍 에이전트 판정 포인트
      **stride 경고를 실측으로 확인했다.** 두 설정의 배치 수를 나란히 보라.
      | stride | batch=2 | batch=8 | batch=32 |
      |---|---|---|---|
      | 256 (P9-2 설정) | 9 | 2 | **0** ← 루프가 안 돈다 |
      | **128 (이 실험)** | 17 | 4 | **1** ✅ |

      `stride=256` 으로 두면 train 샘플이 18개뿐이라 `batch=32` 에서 `drop_last=True` 가
      배치를 **0개**로 만든다. **에러가 아니라 빈 루프**라서, tokens/sec 계산에서
      `ZeroDivisionError` 가 나거나 0 이 찍힌다. 에이전트는 이때
      **`drop_last=False` 로 바꿔** 해결하려 드는데, 그러면 batch=32 조건의 실제 배치 크기가
      3(=35-32)이 되어 비교가 무의미해진다. **stride 를 바꾸는 것이 정답이다.**
      (W03 그리드 표의 `(256, 128)` 행이 바로 이 설정이다.)

      **`len(loader)` 를 먼저 찍는 습관이 이 사고를 막는다.** 로더를 만든 직후 배치 수를
      출력하라 — 0 이면 즉시 보인다.

      **bf16 의 이득이 크지 않은 이유도 같은 곳에 있다.** 참고 실측(GB10)에서 GPU fp32 는
      CPU 대비 **11.5×**, bf16 은 GPU fp32 대비 **1.13×** 에 그쳤다. 이 규모(124M, ctx 256,
      batch 2)에서는 **배치가 작아 GPU 가 놀고 있기** 때문이다. 배치를 2 → 32 로 키우면
      처리량이 1.68배 오른다 — **작은 배치는 GPU를 굶긴다.**

      이 관찰이 이후 모든 훈련(W11~W13)에서 배치·정밀도를 정하는 근거가 된다.

      ## 📝 해석 과제 (직접 작성)
