  - order: 2
    instruction: |
      ## 🎯 미션 — 손실 성질을 pytest 로 고정

      ## 💡 두 테스트
      | 테스트 | 지키는 성질 |
      |---|---|
      | 수동 == 내장 | 확률 단계부터 재구성한 값이 `F.cross_entropy` 와 일치 |
      | 초기 손실 범위 | 무작위 초기화 모델의 손실이 `ln(50257) ± 0.5` 안 |

      ## 💡 두 번째 테스트가 강력한 이유
      **이것은 모델 전체를 검사하는 게이트다.** 위치 임베딩이 빠져도, 잔차가 빠져도, 초기화가
      이상해도 이 범위를 벗어난다. W08 버그 은행 #8(잔차 누락)이 실제로 이 게이트에 걸렸다:
      ```
      정상 모델      : 10.6388  → 통과
      잔차 누락 모델 : 10.3156  → FAIL (검출됨)
      ```

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -m pytest test_loss.py -q
      ```
      ## ✅ 합격 기준
      `2 passed`.
    hint: '초기 손실 게이트는 모델 전체를 훑는 저비용 스모크 테스트다 — 큰 훈련 전에 항상 돌려라'
    answer: |
      docker exec -w /work/week09 llm-lab python3 -m pytest test_loss.py -q
    answer_detail: "훈련을 시작하기 전에 초기 손실이 ln(vocab) 근처인지 확인하는 것은 실무 표준 습관이다. 여기서 벗어나면 훈련을 돌려도 시간만 버린다."
    verify:
      type: output_contains
      expect: 2 passed
      field: stdout
      semantic:
        intent: "손실 계산 성질을 pytest 로 고정 (초기 손실 게이트 포함)"
        success_criteria: ["수동==내장 테스트", "ln(50257)±0.5 게이트"]

  - order: 3
    instruction: |
      ## 🎯 미션 — train/val 분리와 로더 구성 (9 / 1 배치)

      ## 💡 정답지
      | 로더 | 배치 수 | shape | 커버 토큰 |
      |---|---|---|---|
      | train | **9** | `[2, 256]` | **4,608** |
      | val | **1** | `[2, 256]` | **512** |

      ## 📝 손계산 과제
      배치 수를 데이터 크기에서 직접 유도해 대조하라. `the-verdict.txt` 를 90:10 으로 나눈 뒤
      각 조각의 BPE 토큰 수를 세고, W03 의 샘플 수 공식과 `batch_size=2`, `drop_last` 설정을
      적용하면 9 와 1 이 나온다.

      ## 💡 `stride = 256 = max_length` 의 의미
      W03 그리드 실험에서 **"중복 0"** 이던 그 설정이다. 데이터가 이렇게 적은데 왜 중복을
      늘리지 않았을까? **이번 주 끝에서 과적합을 본 뒤 다시 생각해 보라.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import common  # week03/week07 경로를 sys.path 에 등록
      from dataset import create_dataloader_v1
      raw = open('the-verdict.txt', encoding='utf-8').read()
      n = int(0.9*len(raw)); tr, va = raw[:n], raw[n:]
      trl = create_dataloader_v1(tr, batch_size=2, max_length=256, stride=256, drop_last=True,  shuffle=True)
      val = create_dataloader_v1(va, batch_size=2, max_length=256, stride=256, drop_last=False, shuffle=False)
      tb, vb = len(trl), len(val)
      tt = sum(x.numel() for x, _ in trl); vt = sum(x.numel() for x, _ in val)
      print('TRAIN_BATCHES', tb, 'VAL_BATCHES', vb)
      print('TRAIN_TOKENS ', tt, 'VAL_TOKENS ', vt)
      print('LOADER_OK' if tb==9 and vb==1 and tt==4608 and vt==512 else 'NG')"
      ```
      ## ✅ 합격 기준
      `TRAIN_BATCHES 9 VAL_BATCHES 1`, `TRAIN_TOKENS 4608 VAL_TOKENS 512`, `LOADER_OK`.
    hint: '커버 토큰 = 배치 수 × batch_size × max_length 다 (9 × 2 × 256 = 4,608)'
    answer: |
      docker exec -w /work/week09 llm-lab python3 -c "
