    answer_detail: "훈련 데이터가 4,608 토큰뿐이다. 모델은 1.63억 파라미터다 — 파라미터가 토큰의 3만 배다. 이 대비가 이번 주 과적합의 근본 원인이다."
    verify:
      type: output_contains
