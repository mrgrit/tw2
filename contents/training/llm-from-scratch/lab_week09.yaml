    answer_detail: "숫자를 보고 놀라는 게 아니라 먼저 예언하고 측정으로 확인한다 — 이것이 이 수업이 가르치는 사고방식이다. 퍼플렉시티 48,726 이 어휘 크기 50,257 근처인 것도 '아무것도 모르는 상태'의 정의 그대로다."
