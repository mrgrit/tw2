lab_id: llm-from-scratch-week09
title: "W09 — 내 모델의 첫 학습: 손실 해부·train/val 분리·10에폭 사전훈련·과적합 물증·속도 실험"
version: ai
course: llm-from-scratch
week: 9
description: |
  크로스 엔트로피를 확률 단계부터 수동 재구성해 초기 손실이 ln(50257) 근처임을 이론으로 예언하고
  측정으로 확인한다. train/val 을 나눠 10 에폭을 훈련하고, train 손실은 1 아래로 내려가는데 val
  손실은 6에서 정체하다 다시 올라가는 과적합을 관찰한다. 그리고 생성문이 원문과 10단어 이상
  연속 일치한다는 물증으로 "이해가 아니라 암기"를 입증한다. 마지막으로 CPU/GPU/bf16/배치 크기를
  바꿔 처리량을 측정해 "작은 배치는 GPU를 굶긴다"를 확인한다.
difficulty: hard
duration_minutes: 180
audience: LLM 밑바닥 구현 (9주차)
prerequisites:
  - W07 완료 — GPTModel, generate_text_simple
  - "`/work/week09/` 에 the-verdict.txt, week03·week07 모듈 import 가능"
  - GPU 사용 규약 — device 이동, torch.cuda.synchronize, del + empty_cache
  - W09 강의안 정독 — ln(50257) 예언, 퍼플렉시티 해석, stride=128 경고
objectives:
  - "수동 크로스 엔트로피와 F.cross_entropy 가 10.7940 으로 일치함을 확인한다"
  - "퍼플렉시티 48,726 과 ln(50257)=10.8249 를 대조한다"
  - "train 9배치 / val 1배치, 커버 토큰 4,608 / 512 를 손계산으로 유도한다"
  - "훈련 전 손실이 약 10.98 임을 확인한다"
  - "10 에폭 훈련 후 train < 1, val 6 초반대 정체·상승을 관찰한다"
  - "생성문이 원문과 10단어 이상 연속 일치함을 검색으로 입증한다"
  - "GPU/CPU 배속과 배치 크기별 tokens/sec 를 측정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 손실 해부: 수동 재구성 == F.cross_entropy (10.7940)

      크로스 엔트로피를 **확률 단계부터** 손으로 다시 만들어 라이브러리 함수와 대조한다.

      ## 💡 계산 순서
      ```
      로짓 → softmax → 정답 토큰의 확률만 추출 → −log → 평균
      ```

      ## 💡 `flatten(0, 1)` 이 왜 필요한가
      `F.cross_entropy` 는 `(N, C)` 로짓과 `(N,)` 정답을 받는데 우리 로짓은 `[2, 3, 50257]` 이다.
      ```
      logits.flatten(0, 1)  → [6, 50257]   (배치 2 × 토큰 3 = 6개 예측)
      targets.flatten()     → [6]
      ```
      배치와 토큰 축을 하나로 뭉갠다. 각 예측은 독립적으로 채점되므로 문제없다 —
      "6개 문제를 한 줄로 세워 채점한다".

      ## 💡 왜 context_length 를 1024 → 256 으로 줄이나
      훈련 데이터가 5,145 토큰뿐이다. 1024 로 두면 샘플이 4개, 256 이면 20개가 나온다.
      **⚠️ 이 설정 변경 때문에 파라미터 총계가 W07 의 163,009,536 과 달라진다.**
      정답지 수치는 항상 "어떤 설정에서"인지 함께 기억하라.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week09 llm-lab python3 -c "
      import sys, math, torch; sys.path.insert(0, '.')
      import torch.nn.functional as F
      from gpt_model import GPTModel, GPT_CONFIG_124M
      cfg = dict(GPT_CONFIG_124M, context_length=256)
      torch.manual_seed(123); m = GPTModel(cfg); m.eval()
      inputs  = torch.tensor([[16833, 3626, 6100], [40, 1107, 588]])
      targets = torch.tensor([[3626, 6100, 345], [1107, 588, 11311]])
      with torch.no_grad(): logits = m(inputs)
      probs = torch.softmax(logits, dim=-1)
      tp = torch.stack([probs[i, torch.arange(3), targets[i]] for i in range(2)])
      manual = -torch.log(tp).mean()
      auto = F.cross_entropy(logits.flatten(0,1), targets.flatten())
      print('MANUAL    ', round(manual.item(), 4))
      print('AUTO      ', round(auto.item(), 4))
      print('PERPLEXITY', round(torch.exp(auto).item(), 2))
      print('LN_50257  ', round(math.log(50257), 4))
      ok = abs(manual.item()-auto.item()) < 1e-4 and abs(auto.item()-10.7940) < 0.001
      print('LOSS_ANATOMY_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `MANUAL 10.794`, `AUTO 10.794`, `PERPLEXITY 48725.82`, `LN_50257 10.8249`,
      `LOSS_ANATOMY_OK`.
    hint: '이론 예언 ln(50257)=10.8249 와 측정 10.7940 의 차이 0.03 이 W07 의 "10배 잡음"의 결과다'
    answer: |
      docker exec -w /work/week09 llm-lab python3 -c "
