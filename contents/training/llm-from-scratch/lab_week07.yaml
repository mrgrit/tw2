      [할 일]
       1. test_greedy_deterministic
          - 같은 모델·같은 입력으로 generate_text_simple 을 두 번 호출한다
          - 두 결과가 완전히 같음을 assert
          - 모델은 eval 모드로 둘 것

       2. test_context_crop
          - 입력 길이가 context_length 를 넘는 상황을 만든다
          - 오류 없이 동작하고, 모델에 들어가는 길이가 context_length 를 넘지 않음을 assert

       3. test_logits_shape
          - 모델 출력이 [배치, 토큰수, vocab_size] 임을 assert

       마지막에 pytest 로 실행해 결과를 보인다.

      [제약]
       - 테스트에서 모델을 만들 때 시드를 고정할 것
       - 1번을 "두 결과가 비슷하다"로 쓰지 말 것. greedy 는 완전히 같아야 한다
