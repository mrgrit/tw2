lab_id: llm-from-scratch-week07
title: "W07 — 1억 6천만 개의 무작위: GPTModel 조립·파라미터 분해표·weight tying·생성"
version: ai
course: llm-from-scratch
week: 7
description: |
  6주 동안 만든 부품을 합쳐 GPT-2 를 완성한다. 출력 shape [2,4,50257] 과 전체 파라미터
  163,009,536 을 확인하고, 즉시 5행 분해표를 만들어 그 숫자를 재구성한다. weight tying 을 적용해
  124,412,160 이 나오는 것을 보고 "GPT-2 124M" 이름의 유래를 확인한 뒤, greedy 생성 루프로
  무작위 가중치 모델의 목소리를 듣는다. 마지막으로 GPT-2 4가지 크기의 파라미터를 계산해
  통칭(124M/355M/774M/1.5B)과 대조한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.
difficulty: medium
duration_minutes: 160
audience: LLM 밑바닥 구현 (7주차)
prerequisites:
  - W06 완료 — TransformerBlock(7,085,568), LayerNorm, GELU, FFN
  - "`/work/week07/` 에서 week05·week06 모듈 import 가능 (P7-0 스모크 테스트로 확인)"
  - W07 강의안 정독 — 분해표, weight tying, greedy 4단계, 마지막 위치 로짓
objectives:
  - "GPTModel 출력 shape [2,4,50257] 과 세 차원의 의미를 확인한다"
  - "전체 파라미터 163,009,536 을 재현한다"
  - "5행 분해표 각 값을 모델에서 실제로 세어 대조한다"
  - "weight tying 시 124,412,160 이 출력 헤드 직전 누적값과 같음을 확인한다"
  - "float32 메모리 621.83MB 를 손계산한다"
  - "greedy 생성으로 'Hello, I am Featureiman Byeswickattribute argue' 를 재현한다"
  - "훈련 전 최고 확률이 균등분포의 약 10배에 불과함을 관찰한다"
  - "GPT-2 4크기 파라미터가 통칭과 부합하는지 확인한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — GPTModel 조립 (shape [2,4,50257] / 163,009,536)

      6주 동안 만든 부품을 전부 합친다.

      ## 💡 조립 순서
      ```
      토큰 임베딩(50257×768) + 위치 임베딩(1024×768)
        → Dropout
        → TransformerBlock × 12 (nn.Sequential)
        → 최종 LayerNorm
        → 출력 헤드 Linear(768 → 50257, bias=False)
      ```

      ## 💡 출력 shape 세 차원의 의미
      | 차원 | 값 | 의미 |
      |---|---|---|
      | 0 | 2 | **배치** — 동시에 처리한 문장 수 |
      | 1 | 4 | **토큰 위치** — 각 문장의 토큰 수 |
      | 2 | 50,257 | **어휘 로짓** — 각 위치에서 "다음 토큰이 무엇일까"의 점수 |

      **모델은 마지막 위치뿐 아니라 모든 위치에서 다음 토큰을 예측한다.** 그래서 훈련 때 한
      시퀀스로 4개의 학습 신호를 동시에 얻는다(W03 의 시프트 라벨과 연결).

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week07/gpt_model.py 에 GPTModel 을 조립하고 출력 shape 와 파라미터를 확인한다

      [할 일]
       1. GPT_CONFIG_124M 을 정의한다
          vocab_size 50257, context_length 1024, emb_dim 768,
          n_heads 12, n_layers 12, drop_rate 0.1, qkv_bias False
       2. GPTModel(cfg) 를 만든다. 순서는 다음과 같다
          토큰 임베딩(vocab_size × emb_dim) + 위치 임베딩(context_length × emb_dim)
            → Dropout
            → TransformerBlock × n_layers (nn.Sequential)
            → 최종 LayerNorm
            → 출력 헤드 Linear(emb_dim → vocab_size, bias=False)
       3. 'Every effort moves you' 와 'Every day holds a' 를 인코딩해 배치로 쌓는다
       4. torch.manual_seed(123) 뒤 모델을 만들고 배치를 통과시킨다
       5. 다음 세 줄을 출력한다
          IN_SHAPE <입력 shape> / OUT_SHAPE <출력 shape> / PARAMS <천단위 쉼표>
       6. 출력이 (2,4,50257) 이고 파라미터가 163009536 이면 GPT_ASSEMBLE_OK, 아니면 NG

      [제약]
       - W06 의 TransformerBlock 과 LayerNorm 을 재사용할 것. 새로 만들지 말 것
       - 위치 임베딩의 입력은 torch.arange(토큰수) 다. 토큰 ID 가 아니다
       - 출력 헤드는 bias 를 끌 것. 켜면 파라미터가 50,257개 늘어난다
       - manual_seed(123) 은 모델 생성 직전에 호출할 것

      [검증] 세 줄을 모두 출력하고, 출력 shape 의 세 차원이 각각 무엇을 뜻하는지 설명할 것.
             특히 왜 마지막이 50,257 인지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      b = torch.stack([torch.tensor(enc.encode('Every effort moves you')),
                       torch.tensor(enc.encode('Every day holds a'))])
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      out = m(b); p = sum(q.numel() for q in m.parameters())
      print('IN_SHAPE ', tuple(b.shape)); print('OUT_SHAPE', tuple(out.shape))
      print('PARAMS', f'{p:,}')
      print('GPT_ASSEMBLE_OK' if tuple(out.shape)==(2,4,50257) and p==163009536 else 'NG')"
      ```
      ## ✅ 합격 기준
      `OUT_SHAPE (2, 4, 50257)`, `PARAMS 163,009,536`, `GPT_ASSEMBLE_OK`. 실측 출력:
      ```
      IN_SHAPE  (2, 4)
      OUT_SHAPE (2, 4, 50257)
      PARAMS 163,009,536
      ```

      ## 🔍 에이전트 판정 포인트
      **두 문장이 모두 4토큰이어야 `[2,4]` 배치가 만들어진다.** `torch.stack` 은 길이가 다른
      텐서를 쌓지 못하고 `RuntimeError` 를 낸다. 에이전트가 이 에러를 만나면 패딩을 넣거나
      문장을 바꿔 버리기 쉬운데, **그러면 정답지 `(2,4,50257)` 이 깨진다.** 교재가 이 두 문장을
      고른 이유가 우연히 둘 다 4토큰이기 때문이다. `enc.encode` 결과를 먼저 찍어 확인하라.

      **출력 헤드 bias 를 켜면 163,059,793 이 된다** (+50,257). 파라미터 한 줄만 보면
      "비슷하네" 싶지만 2단계 분해표에서 출력 헤드 행이 어긋난다.

      **파라미터가 안 맞을 때 어디를 볼지 정해 두라.** 이것이 다음 단계에서 분해표를 만드는
      이유다. "어딘가 틀렸다"가 아니라 "블록 행이 틀렸다 → `n_layers` 또는 `qkv_bias` 확인"
      으로 좁혀져야 한다.

      **출력 shape 의 의미를 학생이 말할 수 있어야 한다.**
      | 차원 | 값 | 의미 |
      |---|---|---|
      | 0 | 2 | **배치** — 동시에 처리한 문장 수 |
      | 1 | 4 | **토큰 위치** — 각 문장의 토큰 수 |
      | 2 | 50,257 | **어휘 로짓** — 각 위치에서 "다음 토큰이 무엇일까"의 점수 |

      **모델은 마지막 위치뿐 아니라 모든 위치에서 다음 토큰을 예측한다.** 그래서 훈련 때 한
      시퀀스로 4개의 학습 신호를 동시에 얻는다(W03 의 시프트 라벨과 연결).
    hint: '두 문장이 모두 4토큰이어야 [2,4] 배치가 만들어진다 — encode 결과를 먼저 확인하라'
    answer: |
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      b = torch.stack([torch.tensor(enc.encode('Every effort moves you')),
                       torch.tensor(enc.encode('Every day holds a'))])
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      out = m(b); p = sum(q.numel() for q in m.parameters())
      print('IN_SHAPE ', tuple(b.shape)); print('OUT_SHAPE', tuple(out.shape))
      print('PARAMS', f'{p:,}')
      print('GPT_ASSEMBLE_OK' if tuple(out.shape)==(2,4,50257) and p==163009536 else 'NG')"
    answer_detail: "W03 임베딩 + W04·W05 어텐션 + W06 블록이 여기서 하나로 합쳐진다. 163,009,536 이 안 나오면 다음 단계 분해표에서 어긋난 행을 역추적한다."
    verify:
      type: output_contains
      expect: GPT_ASSEMBLE_OK
      field: stdout
      semantic:
        intent: "GPT-2 전체 모델 조립과 출력 shape·파라미터 확인"
        success_criteria: ["[2,4,50257] shape", "163,009,536 파라미터", "세 차원 의미 설명"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 파라미터 분해표: 숫자를 **재구성**하기

      163,009,536 을 외울 필요는 없다. **백지에서 다시 만들어낼 수 있어야** 한다.

      ## 💡 분해표 (정답지)
      | 구성 요소 | 산식 | 파라미터 수 | 누적 합계 |
      |---|---|---|---|
      | 토큰 임베딩 | 50,257 × 768 | 38,597,376 | 38,597,376 |
      | 위치 임베딩 | 1,024 × 768 | 786,432 | **39,383,808** |
      | TransformerBlock × 12 | 7,085,568 × 12 | 85,026,816 | **124,410,624** |
      | 최종 LayerNorm | 768 × 2 | 1,536 | **124,412,160** |
      | 출력 헤드 | 768 × 50,257 | 38,597,376 | **163,009,536** |

      ## 📌 누적 합계 열을 눈여겨 보라
      출력 헤드 **직전** 누적값이 **124,412,160** 이다. 이 숫자가 다음 단계의 핵심이다.

      ## 💡 분해표는 디버깅 도구다
      총합이 안 맞으면 **어긋난 행을 찾아 역추적**하면 된다. "어딘가 틀렸다"가 아니라
      "블록 행이 틀렸다 → `n_layers` 또는 `qkv_bias` 확인"으로 좁혀진다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 163,009,536 을 다섯 구성 요소로 분해하고, 각 행을 산식과 실측 두 경로로 대조한다

      [할 일]
       1. GPTModel 을 만든다 (시드 123)
       2. 다섯 구성 요소의 파라미터를 "모델에서 직접" 센다
          토큰 임베딩 / 위치 임베딩 / TransformerBlock 12개 합 / 최종 LayerNorm / 출력 헤드
       3. 같은 다섯 값을 "산식으로도" 계산한다
          50257×768 / 1024×768 / 7085568×12 / 768×2 / 768×50257
       4. 행마다 한 줄씩 출력한다. 누적 합계를 함께 찍을 것
          <이름> 산식=<값> 실측=<값> 일치=<True/False> 누적=<값>
       5. 다섯 실측이 [38597376, 786432, 85026816, 1536, 38597376] 이고
          누적 총합이 163009536 이면 BREAKDOWN_OK, 아니면 NG

      [제약]
       - 산식 값을 실측에서 가져오지 말 것. 두 경로가 독립이어야 대조가 성립한다
       - 누적 열을 빠뜨리지 말 것. 다음 단계에서 이 열을 읽는다
       - 다섯 행의 합이 총 파라미터와 같은지도 확인할 것.
         빠진 파라미터가 있으면 합이 모자란다

      [검증] 다섯 줄을 전부 출력하고, 어떤 행이 어긋났을 때 무엇을 의심해야 하는지
             행별로 한 줄씩 적을 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch
      from gpt_model import GPTModel, GPT_CONFIG_124M
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      tok = m.tok_emb.weight.numel(); pos = m.pos_emb.weight.numel()
      blk = sum(q.numel() for q in m.trf_blocks.parameters())
      fln = sum(q.numel() for q in m.final_norm.parameters())
      head = m.out_head.weight.numel()
      rows = [('토큰임베딩', 50257*768, tok), ('위치임베딩', 1024*768, pos),
              ('블록x12', 7085568*12, blk), ('최종LN', 768*2, fln), ('출력헤드', 768*50257, head)]
      acc = 0
      for name, formula, actual in rows:
          acc += actual
          print(f'{name:12s} 산식={formula:>11,}  실측={actual:>11,}  일치={formula==actual}  누적={acc:,}')
      ok = [r[2] for r in rows] == [38597376, 786432, 85026816, 1536, 38597376] and acc == 163009536
      print('BREAKDOWN_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      다섯 행 모두 `일치=True`, 누적이 `39,383,808 → 124,410,624 → 124,412,160 → 163,009,536`,
      `BREAKDOWN_OK`.

      실측 출력:
      ```
      토큰임베딩  산식= 38,597,376  실측= 38,597,376  일치=True  누적=38,597,376
      위치임베딩  산식=    786,432  실측=    786,432  일치=True  누적=39,383,808
      블록x12    산식= 85,026,816  실측= 85,026,816  일치=True  누적=124,410,624
      최종LN     산식=      1,536  실측=      1,536  일치=True  누적=124,412,160
      출력헤드    산식= 38,597,376  실측= 38,597,376  일치=True  누적=163,009,536
      ```

      ## 🔍 에이전트 판정 포인트
      **산식을 실측에서 역산하면 `일치=True` 는 항상 나온다.** 에이전트가
      `formula = actual` 로 쓰거나 `50257*768` 대신 `m.tok_emb.weight.numel()` 을 양쪽에
      넣으면 표 전체가 무의미해진다. **산식 열은 손으로 쓴 곱셈이어야 한다.** 코드를 눈으로
      확인하라.

      **속성 이름은 본인 구현에 맞게 조정해야 한다.** 에이전트가 만든 모델의 속성이
      `tok_emb` 가 아니라 `token_embedding` 일 수 있다. 이때 `AttributeError` 가 나면
      에이전트는 **속성 이름을 맞추는 대신 값을 하드코딩하려 든다.** 그러면 "모델에서 직접
      센다"는 이 단계의 목적이 사라진다.

      **다섯 행의 합이 총 파라미터와 같은지 반드시 확인하라.** 이 검사가 없으면 **어디에도
      안 잡힌 파라미터**를 놓친다. 예를 들어 dropout 을 nn.Parameter 로 잘못 만들었다면
      다섯 행은 전부 맞는데 총합만 어긋난다.

      **행별 역추적 표 — 이것이 분해표의 실용적 가치다.**
      | 어긋난 행 | 의심할 것 |
      |---|---|
      | 토큰 임베딩 | `vocab_size`, `emb_dim` |
      | 위치 임베딩 | `context_length` |
      | 블록 × 12 | `n_layers`, `qkv_bias`, FFN 확장 계수 |
      | 최종 LayerNorm | scale/shift 둘 다 있는지 |
      | 출력 헤드 | `bias=False` 인지 |

      ## 📌 누적 합계 열을 눈여겨 보라
      출력 헤드 **직전** 누적값이 **124,412,160** 이다. 이 숫자가 다음 단계의 핵심이다.

      ## 📝 과제
      **백지에 분해표를 재구성**해 보라. 8주차 이론 시험의 출제 범위다.
      (속성 이름은 본인 구현에 맞게 조정한다.)
