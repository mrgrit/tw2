    answer_detail: "10주차에서 124M 과 355M 의 공식 가중치를 실제로 내려받아 비교한다. 여기서 만든 스케일 감각이 그때 '왜 355M 이 더 좋은가'를 해석하는 기준이 된다."
    verify:
      type: output_contains
