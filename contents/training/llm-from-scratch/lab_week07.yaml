  - order: 2
    instruction: |
      ## 🎯 미션 — 파라미터 분해표: 숫자를 **재구성**하기

      163,009,536 을 외울 필요는 없다. **백지에서 다시 만들어낼 수 있어야** 한다.

      ## 💡 분해표 (정답지)
      | 구성 요소 | 산식 | 파라미터 수 | 누적 합계 |
      |---|---|---|---|
      | 토큰 임베딩 | 50,257 × 768 | 38,597,376 | 38,597,376 |
      | 위치 임베딩 | 1,024 × 768 | 786,432 | **39,383,808** |
      | TransformerBlock × 12 | 7,085,568 × 12 | 85,026,816 | **124,410,624** |
      | 최종 LayerNorm | 768 × 2 | 1,536 | **124,412,160** |
      | 출력 헤드 | 768 × 50,257 | 38,597,376 | **163,009,536** |

      ## 📌 누적 합계 열을 눈여겨 보라
      출력 헤드 **직전** 누적값이 **124,412,160** 이다. 이 숫자가 다음 단계의 핵심이다.

      ## 💡 분해표는 디버깅 도구다
      총합이 안 맞으면 **어긋난 행을 찾아 역추적**하면 된다. "어딘가 틀렸다"가 아니라
      "블록 행이 틀렸다 → `n_layers` 또는 `qkv_bias` 확인"으로 좁혀진다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch
      from gpt_model import GPTModel, GPT_CONFIG_124M
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      tok = m.tok_emb.weight.numel(); pos = m.pos_emb.weight.numel()
      blk = sum(q.numel() for q in m.trf_blocks.parameters())
      fln = sum(q.numel() for q in m.final_norm.parameters())
      head = m.out_head.weight.numel()
      rows = [('토큰임베딩', 50257*768, tok), ('위치임베딩', 1024*768, pos),
              ('블록x12', 7085568*12, blk), ('최종LN', 768*2, fln), ('출력헤드', 768*50257, head)]
      acc = 0
      for name, formula, actual in rows:
          acc += actual
          print(f'{name:12s} 산식={formula:>11,}  실측={actual:>11,}  일치={formula==actual}  누적={acc:,}')
      ok = [r[2] for r in rows] == [38597376, 786432, 85026816, 1536, 38597376] and acc == 163009536
      print('BREAKDOWN_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      다섯 행 모두 `일치=True`, 누적이 `39,383,808 → 124,410,624 → 124,412,160 → 163,009,536`,
      `BREAKDOWN_OK`.

      ## 📝 과제
      **백지에 분해표를 재구성**해 보라. 8주차 이론 시험의 출제 범위다.
      (속성 이름은 본인 구현에 맞게 조정한다.)
    hint: '블록 행이 다르면 n_layers 나 qkv_bias 를, 임베딩 행이 다르면 vocab_size/emb_dim 을 의심하라'
    answer: |
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch
      from gpt_model import GPTModel, GPT_CONFIG_124M
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      tok = m.tok_emb.weight.numel(); pos = m.pos_emb.weight.numel()
      blk = sum(q.numel() for q in m.trf_blocks.parameters())
      fln = sum(q.numel() for q in m.final_norm.parameters())
      head = m.out_head.weight.numel()
      rows = [('토큰임베딩', 50257*768, tok), ('위치임베딩', 1024*768, pos),
              ('블록x12', 7085568*12, blk), ('최종LN', 768*2, fln), ('출력헤드', 768*50257, head)]
      acc = 0
      for name, formula, actual in rows:
          acc += actual
          print(f'{name:12s} 산식={formula:>11,}  실측={actual:>11,}  일치={formula==actual}  누적={acc:,}')
      ok = [r[2] for r in rows] == [38597376, 786432, 85026816, 1536, 38597376] and acc == 163009536
      print('BREAKDOWN_OK' if ok else 'NG')"
    answer_detail: "분해표는 '이 모델이 왜 이만큼 메모리를 먹는가'를 설명하는 실무 도구이기도 하다. 새 모델의 config.json 을 보고 규모를 추정할 수 있게 된다."
    verify:
      type: output_contains
      expect: BREAKDOWN_OK
      field: stdout
      semantic:
        intent: "파라미터를 구성 요소별로 분해해 산식과 실측을 대조"
        success_criteria: ["5행 산식=실측", "누적 합계 4단계", "총합 163,009,536"]

  - order: 3
    instruction: |
      ## 🎯 미션 — "124M" 의 진실: weight tying 과 메모리

      ## 💡 tying 후 파라미터는 어디서 오나 — **뺄셈이 아니다**
      계산상으로는 `163,009,536 − 38,597,376 = 124,412,160` 이지만,
      **분해표에서는 그냥 읽힌다** — 2단계 표의 "출력 헤드 직전 누적값"이 정확히 이 값이다.
      출력 헤드를 임베딩과 공유하면 그 행이 사라지므로 누적값이 그대로 총합이 된다.

      **이것이 "GPT-2 124M" 이라는 이름의 유래다.**

      ## 💡 왜 공유해도 되는가
      | 행렬 | 역할 | 크기 |
      |---|---|---|
      | 토큰 임베딩 | 토큰 ID → 768차원 벡터 | 50,257 × 768 |
      | 출력 헤드 | 768차원 벡터 → 토큰 ID 점수 | 768 × 50,257 |

      **서로 전치 관계다.** 같은 사전을 양방향으로 쓰는 것이라고 볼 수 있다. 3,860만 파라미터를
      아끼고 성능도 비슷하거나 낫다는 것이 경험적으로 알려져 있다.
      OpenAI 의 GPT-2 공식 가중치도 tying 을 쓴다(W10 에서 이식할 때 다시 만난다).

      ## 💡 메모리 손계산
      > `163,009,536 × 4 바이트 ÷ 1024² = ` **621.83 MB** (float32), bf16 이면 절반

      ## 🔴 "모델 적재"와 "훈련"의 메모리는 전혀 다르다
      훈련에는 가중치 + 기울기(같은 크기) + AdamW 모멘텀 2벌(같은 크기 × 2) + 활성값이 필요하다.
      대략 **가중치의 4배 이상**. 9주차에서 직접 계산하고 몸으로 확인한다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch
      from gpt_model import GPTModel, GPT_CONFIG_124M
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      p = sum(q.numel() for q in m.parameters())
      tied = p - m.out_head.weight.numel()
      mem = p * 4 / 1024**2
      print('TOTAL     ', f'{p:,}')
      print('TIED      ', f'{tied:,}')
      print('MEM_FP32  ', f'{mem:.2f} MB')
      print('MEM_BF16  ', f'{mem/2:.2f} MB')
      ok = tied == 124412160 and abs(mem - 621.83) < 0.01
      print('TYING_MEM_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `TIED 124,412,160`, `MEM_FP32 621.83 MB`, `TYING_MEM_OK`.
      그리고 **tied 값이 2단계 분해표의 '최종LN' 행 누적값과 같은지** 눈으로 확인하라.
    hint: '621.83 을 직접 계산해 보라 — 163009536 × 4 ÷ 1024 ÷ 1024'
    answer: |
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch
