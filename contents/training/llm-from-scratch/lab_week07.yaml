      ## 🎯 미션 — 스케일 감각: GPT-2 4가지 크기 (연습문제 4.2)

      설정만 바꿔 네 크기의 파라미터를 계산하고 통칭과 대조한다.

      ## 💡 예상 결과 (실측)
      | 설정 | emb/layers/heads | 전체 | tying 적용 | 통칭 |
      |---|---|---|---|---|
      | small | 768 / 12 / 12 | 163,009,536 | **124,412,160** | **124M** |
      | medium | 1024 / 24 / 16 | 406,212,608 | **354,749,440** | **355M** |
      | large | 1280 / 36 / 20 | 838,220,800 | **773,891,840** | **774M** |
      | xl | 1600 / 48 / 25 | 1,637,792,000 | **1,557,380,800** | **1.5B** |

      **모델 이름의 숫자는 tying 적용 후 값이다.** 이제 "GPT-2 355M" 을 들으면
      `emb_dim=1024, n_layers=24, n_heads=16` 이 떠올라야 한다.

      ## 💡 관찰
      small → xl 은 파라미터가 12.5배인데 `emb_dim` 은 2배, `n_layers` 는 4배다.
      파라미터는 대체로 `n_layers × emb_dim²` 에 비례하므로 `4 × 2² = 16`배 근처가 되고,
      임베딩 항이 선형이라 조금 낮아진다.

      ## ⚠️ 메모리 주의
      xl 은 16억 파라미터라 float32 로 약 6GB 다. 계산 후 `del` 로 즉시 해제한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] GPT-2 네 가지 크기의 파라미터를 계산해 세상에 알려진 통칭과 대조한다

      [할 일]
       1. 네 설정을 만든다 (vocab_size 50257, context_length 1024, drop_rate 0.1, qkv_bias False 공통)
          small  : emb_dim 768,  n_layers 12, n_heads 12
          medium : emb_dim 1024, n_layers 24, n_heads 16
          large  : emb_dim 1280, n_layers 36, n_heads 20
          xl     : emb_dim 1600, n_layers 48, n_heads 25
       2. 각각 모델을 만들어 한 줄씩 출력한다
          <이름> total=<전체 파라미터> tied=<tying 적용 후> (<tied 를 백만 단위로>M)
       3. tied 값이 순서대로 124412160 / 354749440 / 773891840 이면 CONFIG_SCALE_OK

      [제약]
       - 한 모델을 다 쓰고 나면 반드시 del 로 해제할 것.
         xl 은 16억 파라미터라 float32 로 약 6GB 다. 네 개를 동시에 들고 있으면 안 된다
       - 파라미터를 공식으로 추정하지 말고 실제 모델을 만들어 셀 것
       - 통칭(124M/355M/774M/1.5B)과 비교할 값은 total 이 아니라 tied 다

      [검증] 네 줄을 모두 출력하고, tied 값이 통칭과 부합하는지 하나씩 대조할 것.
             그리고 small → xl 에서 emb_dim 은 2배, n_layers 는 4배인데
             파라미터는 왜 12.5배인지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      from gpt_model import GPTModel
      cfgs = {'small':(768,12,12), 'medium':(1024,24,16), 'large':(1280,36,20), 'xl':(1600,48,25)}
      res = {}
      for n, (d, l, h) in cfgs.items():
          c = dict(vocab_size=50257, context_length=1024, emb_dim=d, n_heads=h,
                   n_layers=l, drop_rate=0.1, qkv_bias=False)
          m = GPTModel(c)
          p = sum(q.numel() for q in m.parameters()); t = p - m.out_head.weight.numel()
          print(f'{n:7s} total={p:>13,}  tied={t:>13,}  ({t/1e6:.0f}M)')
          res[n] = t; del m
      ok = res['small']==124412160 and res['medium']==354749440 and res['large']==773891840
      print('CONFIG_SCALE_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      네 줄이 정답지와 일치하고 `CONFIG_SCALE_OK`. 실측 출력:
      ```
      small   total=  163,009,536  tied=  124,412,160  (124M)
      medium  total=  406,212,608  tied=  354,749,440  (355M)
      large   total=  838,220,800  tied=  773,891,840  (774M)
      xl      total=1,637,792,000  tied=1,557,380,800  (1557M)
      ```

      ## 🔍 에이전트 판정 포인트
      **`del` 을 빼먹으면 이 단계에서 메모리가 터진다.** 네 모델을 동시에 들고 있으면
      float32 로 대략 `0.6 + 1.6 + 3.4 + 6.5 = 12GB` 다. 에이전트는 리스트에 모델을 모아
      두고 마지막에 한꺼번에 처리하는 코드를 즐겨 쓰는데, 여기서는 그게 OOM 을 부른다.
      **한 개 만들고, 세고, 버린다.**

      **비교 대상을 `total` 로 잡으면 통칭과 안 맞는다.** small 의 `total` 은 163M 인데
      세상은 이 모델을 "124M" 이라 부른다. **모델 이름의 숫자는 tying 적용 후 값이다.**
      에이전트가 "교재 정답지가 틀렸다"고 보고해 오면 어느 열을 봤는지 확인하라.

      **xl 이 `1557M` 으로 찍히는 것은 정상이다.** 통칭 "1.5B" 는 반올림한 표현이다.
      판정 조건에 xl 이 빠져 있는 것도 그래서다.

      **스케일 감각이 이 단계의 산출물이다.** 이제 "GPT-2 355M" 을 들으면
      `emb_dim=1024, n_layers=24, n_heads=16` 이 떠올라야 한다.

      **왜 12.5배인가.** small → xl 은 `emb_dim` 2배, `n_layers` 4배다. 파라미터는 대체로
      `n_layers × emb_dim²` 에 비례하므로 `4 × 2² = 16`배 근처가 되고, 임베딩 항이
      `vocab_size × emb_dim` 으로 선형이라 조금 낮아져 12.5배가 된다.

      10주차에서 124M 과 355M 의 공식 가중치를 실제로 내려받아 비교한다. 여기서 만든 스케일
      감각이 그때 "왜 355M 이 더 좋은가"를 해석하는 기준이 된다.
    hint: 'tying 값이 통칭과 부합하는지 확인하라 — 통칭은 전체 파라미터가 아니라 tying 후 값이다'
