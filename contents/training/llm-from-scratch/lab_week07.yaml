      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M)
      p = sum(q.numel() for q in m.parameters())
      tied = p - m.out_head.weight.numel()
      mem = p * 4 / 1024**2
      print('TOTAL     ', f'{p:,}')
      print('TIED      ', f'{tied:,}')
      print('MEM_FP32  ', f'{mem:.2f} MB')
      print('MEM_BF16  ', f'{mem/2:.2f} MB')
      ok = tied == 124412160 and abs(mem - 621.83) < 0.01
      print('TYING_MEM_OK' if ok else 'NG')"
    answer_detail: "모델 이름의 숫자(124M)는 tying 적용 후 값이다. 분해표의 누적 합계 열이 있어야 이 사실이 '뺄셈'이 아니라 '읽기'로 보인다 — 그래서 분해표에 누적 열을 넣었다."
    verify:
      type: output_contains
      expect: TYING_MEM_OK
      field: stdout
      semantic:
        intent: "weight tying 파라미터와 모델 메모리 손계산 대조"
        success_criteria: ["124,412,160 확인", "누적값과 일치 인지", "621.83MB 계산"]

  - order: 4
    instruction: |
      ## 🎯 미션 — greedy 생성: 무작위 가중치의 목소리

      ## 💡 생성 루프 4단계
      ```
      ① 컨텍스트 크롭  idx[:, -context_size:]
      ② 로짓 계산      with torch.no_grad()
      ③ 마지막 위치만   logits[:, -1, :] → argmax
      ④ 뒤에 이어붙임   torch.cat
      ```

      ## 💡 왜 **마지막 위치만** 쓰는가
      인과 마스크 때문에 **마지막 위치만이 전체 시퀀스를 다 본 유일한 위치**다(W05 인과성).
      앞쪽 위치들은 아직 뒷부분을 못 봤으니 다음 토큰 예측에 쓸 수 없다.
      이 논리는 11주차 "왜 마지막 토큰의 로짓으로 분류하는가"에서 그대로 회수된다.

      ## 💡 정답지
      ```
      시작 토큰 : [15496, 11, 314, 716]  (4개)
      생성 후   : 10개
      디코딩    : "Hello, I am Featureiman Byeswickattribute argue"
      ```
      뜻 없는 단어들이다 — **가중치가 전부 무작위**이므로 당연하다. 중요한 것은
      **이 문자열이 정확히 재현된다는 사실**이다. 같은 시드로 같은 구조를 만들면 같은 무작위
      가중치가 나오고 greedy 는 결정적이므로 같은 출력이 나온다.
      **재현되지 않는다면 구조나 시드 위치가 교재와 다른 것이다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      from generate import generate_text_simple
      enc = tiktoken.get_encoding('gpt2')
      start = enc.encode('Hello, I am')
      print('START', start, len(start))
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M); m.eval()
      out = generate_text_simple(m, torch.tensor([start]), 6, GPT_CONFIG_124M['context_length'])
      txt = enc.decode(out[0].tolist())
      print('TOTAL_TOKENS', out.shape[1]); print('TEXT', repr(txt))
      ok = (start == [15496,11,314,716] and out.shape[1] == 10
            and txt == 'Hello, I am Featureiman Byeswickattribute argue')
      print('GENERATE_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `START [15496, 11, 314, 716] 4`, `TOTAL_TOKENS 10`,
      `TEXT 'Hello, I am Featureiman Byeswickattribute argue'`, `GENERATE_OK`.
    hint: '시드 → 모델 생성 → eval() 순서가 지켜져야 한다. 다르면 시드 호출 위치부터 의심하라'
    answer: |
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      from generate import generate_text_simple
      enc = tiktoken.get_encoding('gpt2')
      start = enc.encode('Hello, I am')
      print('START', start, len(start))
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M); m.eval()
      out = generate_text_simple(m, torch.tensor([start]), 6, GPT_CONFIG_124M['context_length'])
      txt = enc.decode(out[0].tolist())
      print('TOTAL_TOKENS', out.shape[1]); print('TEXT', repr(txt))
      ok = (start == [15496,11,314,716] and out.shape[1] == 10
            and txt == 'Hello, I am Featureiman Byeswickattribute argue')
      print('GENERATE_OK' if ok else 'NG')"
    answer_detail: "이 문자열은 매우 강력한 게이트다 — 시드 위치, 모듈 생성 순서, forward 구조, eval 모드가 모두 맞아야 재현된다. 교차 검증에서도 다른 에이전트가 이 토큰 ID 10개를 정확히 재현했다."
    verify:
      type: output_contains
      expect: GENERATE_OK
      field: stdout
      semantic:
        intent: "greedy 생성 루프 구현과 정답지 문자열 정확 재현"
        success_criteria: ["시작 토큰 4개", "생성 후 10개", "디코딩 문자열 일치"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 훈련 전 모델의 "자신감"

      마지막 위치 로짓에 softmax 를 적용해 최고 확률을 본다.

      ## 💡 예상 결과 (실측)
      | 항목 | 값 |
      |---|---|
      | 최고 확률 | **0.0205%** |
      | 균등분포 (1/50257) | 0.00199% |
      | 배율 | 약 **10.3배** |

      **1%에 한참 못 미친다.** 훈련 전 모델은 사실상 아무것도 모른다.
      다만 완전한 균등분포도 아니다 — 무작위 가중치도 우연히 어떤 토큰에 조금 더 큰 점수를
      주기 때문이다. **이 "10배"는 지식이 아니라 잡음이다.**

      ## 🔗 9주차에서 이 값이 어떻게 변하는지 본다
      훈련이 진행되면 최고 확률이 수십 %까지 올라간다. 그것이 "학습"의 눈에 보이는 형태다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M); m.eval()
      x = torch.tensor([enc.encode('Hello, I am')])
      with torch.no_grad(): lg = m(x)[:, -1, :]
      p = torch.softmax(lg, dim=-1)
      top = p.max().item(); uni = 1/50257
      tid = p.argmax().item()
      print(f'TOP_TOKEN  = {tid} {enc.decode([tid])!r}')
      print(f'TOP_PROB   = {top*100:.4f}%')
      print(f'UNIFORM    = {uni*100:.5f}%')
      print(f'RATIO      = {top/uni:.1f}x')
      print('CONFIDENCE_OK' if top < 0.01 else 'NG')"
      ```
      ## ✅ 합격 기준
      `TOP_PROB` 가 **1% 미만**이고 `CONFIDENCE_OK`.
      수십 %가 나오면 이미 훈련된 가중치를 쓴 것이다.
    hint: '균등분포 1/50257 = 0.00199% 와 비교해야 "10배"라는 감각이 생긴다'
    answer: |
