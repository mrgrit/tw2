  - order: 7
    instruction: |
      ## 🎯 미션 — pytest 로 생성 성질 고정

      생성 함수의 세 가지 성질을 테스트로 굳힌다.

      ## 💡 세 테스트가 지키는 것
      | 테스트 | 지키는 성질 |
      |---|---|
      | greedy 결정성 | 같은 입력·같은 모델이면 **항상 같은 출력** (샘플링 요소 없음) |
      | context crop | 입력이 `context_length` 를 넘어도 오류 없이 동작 |
      | 로짓 shape | 출력이 `[B, T, vocab_size]` |

      ## 💡 왜 결정성을 테스트하나
      greedy 는 argmax 라 난수가 없다. 그런데 dropout 이 켜져 있거나(`eval()` 누락)
      비결정적 연산이 섞이면 출력이 달라진다. **이 테스트 하나가 `model.eval()` 누락을 잡는다.**

      10주차에서 temperature·top-k 샘플링을 도입하면 이 성질이 **의도적으로 깨진다** —
      그때 이 테스트가 "무엇이 바뀌었는지"를 정확히 알려준다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -m pytest test_gpt.py -q
      ```
      ## ✅ 합격 기준
      `3 passed`.
    hint: 'eval() 을 빼고 돌려 보라 — 결정성 테스트가 깨지는 것을 직접 확인할 수 있다'
    answer: |
      docker exec -w /work/week07 llm-lab python3 -m pytest test_gpt.py -q
    answer_detail: "greedy 결정성은 10주차에서 '의도적으로 깨질' 성질이다. 지금 고정해 두면 그때 temperature/top-k 가 무엇을 바꾸는지 정확히 대비할 수 있다."
    verify:
      type: output_contains
      expect: 3 passed
      field: stdout
      semantic:
        intent: "생성 함수의 결정성·크롭·shape 성질을 pytest 로 고정"
        success_criteria: ["greedy 결정성", "context crop", "로짓 shape"]
