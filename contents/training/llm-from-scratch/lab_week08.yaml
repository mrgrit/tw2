lab_id: llm-from-scratch-week08
title: "W08 — 중간고사 모의 실기: 버그 은행 진단·학기 자산 재사용·뮤테이션 테스팅"
version: ai
course: llm-from-scratch
week: 8
description: |
  중간고사 실기의 모의 훈련이다. 2~7주차 코드에 버그를 심고, 학기 동안 쌓은 자산(인과성 성질
  테스트·정답지 수치·분해표·초기 손실 게이트)이 그 버그를 실제로 잡는지 확인한다. 특히 8번(잔차
  누락)과 10번(argmax 위치)은 소박하게 구현하면 검출되지 않는다는 사실을 실측으로 확인하고,
  검출 가능한 형태로 바꾸는 법을 배운다. "버그를 심었다"와 "버그가 검출된다"는 다른 문제다.
difficulty: hard
duration_minutes: 150
audience: LLM 밑바닥 구현 (8주차 중간고사)
prerequisites:
  - W02~W07 완료 — 모든 주차 코드와 테스트가 저장소에 있어야 한다
  - "`/work/week08/` 생성, week03~week07 모듈 import 가능"
  - W08 강의안 정독 — 답안 4요소, 시간 배분, 버그 은행 10종
objectives:
  - "인과성 성질 테스트가 마스크 반전 버그를 잡는지 확인한다"
  - "√d 스케일링 생략이 W04 정답지 수치로 잡히는지 확인한다"
  - "위치 임베딩 누락이 W03 실험으로 잡히는지 확인한다"
  - "잔차 누락은 12층을 쌓아야 드러남을 층별 비교로 확인한다"
  - "9주차 초기 손실 게이트로 잔차 누락을 검출한다"
  - "평탄화 argmax 가 IndexError 를 내는 것을 확인한다"
  - "모의 함정(mock_trap)을 직접 정독 후 차등 테스트로 진단한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 버그 #6: 인과성 성질 테스트가 마스크 반전을 잡는가

      W05 에서 만든 **인과성 불변 테스트**가 실전에서 쓸모 있는지 확인한다.

      ## 💡 심는 버그
      `tril`/`triu` 를 뒤바꿔 **미래만 보는 모델**을 만든다. 출력 shape 도 맞고 오류도 안 난다.
      오직 **"미래를 바꿔도 과거 출력이 안 변한다"** 는 성질만 깨진다.

      ## 💡 이것이 뮤테이션 테스팅이다
      코드에 의도적으로 결함을 심어 **테스트 스위트의 실효성**을 측정하는 기법이다.
      테스트 커버리지 100%인데 아무 버그도 못 잡는 경우가 실무에서 흔하다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week05')
      import torch
      from multihead import MultiHeadAttention
      class Bug6(MultiHeadAttention):
          def __init__(self, *a, **k):
              super().__init__(*a, **k)
              ctx = self.mask.shape[0]
              self.mask.copy_(torch.tril(torch.ones(ctx, ctx), diagonal=-1))
      def causal_ok(m):
          m.eval()
          x1 = torch.rand(1, 5, 3); x2 = x1.clone(); x2[0, -1] = torch.rand(3)
          with torch.no_grad(): o1, o2 = m(x1), m(x2)
          return torch.allclose(o1[:, :-1], o2[:, :-1], atol=1e-5)
      torch.manual_seed(123); good = MultiHeadAttention(3, 4, 6, 0.0, 2)
      torch.manual_seed(123); bad  = Bug6(3, 4, 6, 0.0, 2)
      print('GOOD_CAUSAL_PASS', causal_ok(good))
      print('BUG6_CAUSAL_PASS', causal_ok(bad))
      print('BUG6_DETECTED_OK' if causal_ok(good) and not causal_ok(bad) else 'NG')"
      ```
      ## ✅ 합격 기준
      `GOOD_CAUSAL_PASS True`, `BUG6_CAUSAL_PASS False`, `BUG6_DETECTED_OK`.
      **버그 버전이 테스트를 통과하면 그 테스트는 쓸모가 없는 것이다.**
    hint: '성질 테스트는 값이 아니라 규칙을 검사하므로 구현이 바뀌어도 살아남는다'
