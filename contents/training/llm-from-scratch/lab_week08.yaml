  - order: 2
    instruction: |
      ## 🎯 미션 — 버그 #3: √d 스케일링 생략을 정답지 수치로 잡기

      W04 에서 확인한 정답지 수치가 진단 도구가 된다.

      ## 💡 심는 버그
      `scores / d_k**0.5` 에서 나눗셈을 뺀다. 오류는 안 나고, 출력 shape 도 같다.
      그런데 **W04 정답지 `[0.3061, 0.8210]` 이 재현되지 않는다.**

      ## 💡 왜 이것이 좋은 진단인가
      정답지 수치는 **구조·시드·연산 순서가 모두 맞아야** 나온다. 하나라도 어긋나면 값이
      달라진다. 그래서 "숫자 하나"가 여러 가능성을 동시에 배제한다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week04')
      import torch
      from inputs import inputs
      from attention_v1v2 import SelfAttention_v1
      class Bug3(SelfAttention_v1):
          def forward(self, x):
              q = x @ self.W_query; k = x @ self.W_key; v = x @ self.W_value
              w = torch.softmax(q @ k.T, dim=-1)   # ← √d 나눗셈 생략
              return w @ v
      torch.manual_seed(123); good = SelfAttention_v1(3, 2)
      torch.manual_seed(123); bad  = Bug3(3, 2)
      g = [round(t,4) for t in good(inputs)[1].tolist()]
      b = [round(t,4) for t in bad(inputs)[1].tolist()]
      print('GOOD_ROW2', g, '(정답지 [0.3061, 0.821])')
      print('BUG3_ROW2', b)
      print('BUG3_DETECTED_OK' if g == [0.3061, 0.821] and b != g else 'NG')"
      ```
      ## ✅ 합격 기준
      정상은 `[0.3061, 0.821]`, 버그는 **다른 값**, `BUG3_DETECTED_OK`.
    hint: '정답지 수치 하나가 구조·시드·연산 순서를 동시에 검사한다'
