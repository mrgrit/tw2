      **모델 파라미터의 기울기를 재면 다른 실험이 된다.** 여기서 보려는 것은 "역전파 신호가
      입력까지 도달하는가"이므로 `x.grad` 를 봐야 한다. 에이전트가 `named_parameters()` 를
      순회하기 시작하면 W06 5단계와 혼동한 것이다.

      **절대값이 안 맞는다고 실패로 판정하지 마라.** torch 버전이 다르면 초기 난수 소비가
