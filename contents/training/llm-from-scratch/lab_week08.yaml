      ## 🎯 미션 — 버그 #8: **소박하게 심으면 안 잡힌다** (출제 검증)

      ## 🔴 출제 검증에서 드러난 사실
      "잔차 덧셈 누락"을 **1층에만** 심으면 기울기가 절반쯤 줄어들 뿐이라 잡기 어렵다.
      **12층을 쌓아야** 6.5배 차이가 나서 드러난다.

      | 블록 수 | 정상 (입력 기울기) | 잔차 누락 | 비율 |
      |---|---|---|---|
      | 1 | 1.542874 | 0.941785 | 0.6104배 |
      | 4 | 2.808569 | 0.745214 | 0.2653배 |
      | **12** | **4.801310** | **0.683338** | **0.1423배** |

      ⚠️ **절대값은 환경마다 다르다.** 위 표는 이 강의 골든 이미지(torch 2.9.1+cu130,
      aarch64)에서 3회 반복 재현을 확인한 값이다. 다른 torch 버전에서는 초기 난수 소비가
      달라져 소수점이 바뀐다. **판정 기준은 절대값이 아니라 "비율이 단조 감소하고
      12층에서 0.25 미만"이다.**

      ## 💡 출제 시 주의
      **전 층에 심으면** 손실이 눈에 띄게 발산해 누구나 "뭔가 크게 잘못됐다"고 알아채지만
      **어느 층인지 특정하지 못한다.** 그래서 **12개 블록 중 하나에만** 심고,
      문제에 "12개 블록 중 하나에 심었다"를 명시해야 탐색 공간이 적절해진다.

      ## 💡 배울 것
      **"버그를 심었다"와 "버그가 검출된다"는 다른 문제다.** 검출되지 않는 버그는 출제하면 안 된다.
      이것을 확인하는 절차가 곧 **테스트 스위트의 실효성 검증**이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] "잔차 누락" 버그가 몇 층부터 검출 가능해지는지 측정한다

      [할 일]
       1. TransformerBlock 과 같은 구조의 블록 클래스를 만들되,
          생성자에 res 플래그를 받아 잔차 덧셈을 켜고 끌 수 있게 한다
          (drop_rate 는 0.0 으로 고정)
       2. 블록 수 n = 1, 4, 12 각각에 대해
          - res=True / res=False 두 버전을 같은 시드(123)로 만든다
          - requires_grad=True 인 입력 (1, 4, 768) 을 통과시킨다
          - 출력의 합으로 backward 한 뒤 "입력의" 기울기 절대 평균을 기록한다
       3. 한 줄씩 출력한다
          blocks=<n>  normal=<값>  no_residual=<값>  ratio=<no_residual÷normal>
       4. 12층의 비율이 0.25 미만이면 BUG8_DEPTH_OK, 아니면 NG

      [제약]
       - 세 깊이를 모두 측정할 것. 1층 결과만 보고 결론 내지 말 것
       - 기울기는 모델 파라미터가 아니라 "입력"의 것을 볼 것.
         입력까지 신호가 도달했는지가 이 실험의 관심사다
       - 각 조합마다 시드를 다시 고정할 것
       - 절대값은 환경에 따라 다르다. 판정은 비율의 추세로 할 것

      [검증] 세 줄을 모두 출력하고, 왜 1층에서는 이 버그를 잡기 어려운지 설명할 것.
             그리고 이 결과가 시험 출제에 어떤 제약을 주는지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys
      for w in ('week05', 'week06'): sys.path.insert(0, '/work/' + w)
      import torch, torch.nn as nn
      from layers import LayerNorm, FeedForward
      from multihead import MultiHeadAttention
      from transformer_block import GPT_CONFIG_124M
      class Blk(nn.Module):
          def __init__(self, cfg, res):
              super().__init__(); self.res = res
              self.att = MultiHeadAttention(cfg['emb_dim'], cfg['emb_dim'], cfg['context_length'],
                                            0.0, cfg['n_heads'], cfg['qkv_bias'])
              self.ff = FeedForward(cfg)
              self.n1 = LayerNorm(cfg['emb_dim']); self.n2 = LayerNorm(cfg['emb_dim'])
          def forward(self, x):
              s = x; x = self.att(self.n1(x)); x = x + s if self.res else x
              s = x; x = self.ff(self.n2(x));  x = x + s if self.res else x
              return x
      cfg = dict(GPT_CONFIG_124M, drop_rate=0.0)
      for n in [1, 4, 12]:
          rows = []
          for res in [True, False]:
              torch.manual_seed(123)
              net = nn.Sequential(*[Blk(cfg, res) for _ in range(n)])
              x = torch.rand(1, 4, 768, requires_grad=True)
              net(x).sum().backward()
              rows.append(x.grad.abs().mean().item())
          print(f'blocks={n:2d}  normal={rows[0]:.6f}  no_residual={rows[1]:.6f}  ratio={rows[1]/rows[0]:.4f}')
          if n == 12: ratio12 = rows[1]/rows[0]
      print('BUG8_DEPTH_OK' if ratio12 < 0.25 else 'NG')"
      ```
