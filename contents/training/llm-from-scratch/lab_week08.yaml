  - order: 5
    instruction: |
      ## 🎯 미션 — 버그 #10: 평탄화 argmax 는 즉시 드러난다

      ## 🔴 소박한 구현은 버그가 아니다
      ```python
      torch.argmax(logits, dim=-1)[:, -1:]   # ← 버그가 아니다! 정답과 출력이 완전히 일치
      ```
      마지막 시점의 argmax 를 **먼저 슬라이스하나 나중에 슬라이스하나 수학적으로 같기** 때문이다.
      출제 검증에서 3개 시작점 모두 정답 구현과 **완전히 동일한 출력**이 나왔다.

      ## 💡 진짜 버그가 되려면
      **차원을 평탄화해 시점 정보를 뭉개야** 한다:
      ```python
      idx_next = torch.argmax(logits.flatten(1), dim=-1, keepdim=True)   # ← 진짜 버그
      ```
      `[B, T, 50257]` 이 `[B, T×50257]` 로 평탄화되어 argmax 가 **50,257을 넘는 값**을 내고,
      다음 스텝의 임베딩 조회에서 `IndexError: index out of range in self` 가 난다.

      ## 📌 이 문항의 노림수
      학생이 오류 메시지에서 **"인덱스가 어휘 크기를 넘었다 → 그럼 argmax 가 무엇 위에서
      돌았나"** 를 역추적하게 하는 것이다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week07 llm-lab python3 -c "
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M); m.eval()
      idx = torch.tensor([enc.encode('Hello, I am')])
      with torch.no_grad(): lg = m(idx)
      good = torch.argmax(lg[:, -1, :], dim=-1, keepdim=True)
      bad  = torch.argmax(lg.flatten(1), dim=-1, keepdim=True)
      print('GOOD_NEXT_ID', good.item(), '(어휘 범위 내)')
      print('BAD_NEXT_ID ', bad.item(), '(어휘 50257 초과)')
      try:
          m(torch.cat((idx, bad), dim=1)); print('NO_ERROR_UNEXPECTED')
      except IndexError as e:
          print('IndexError:', str(e)[:60]); print('BUG10_DETECTED_OK')"
      ```
      ## ✅ 합격 기준
      `BAD_NEXT_ID` 가 **50,257 초과**, `IndexError` 발생, `BUG10_DETECTED_OK`.
    hint: 'logits.flatten(1) 의 shape 를 직접 찍어 보라 — [B, T*50257] 이다'
