lab_id: llm-from-scratch-week08
title: "W08 — 중간고사 모의 실기: 버그 은행 진단·학기 자산 재사용·뮤테이션 테스팅"
version: ai
course: llm-from-scratch
week: 8
description: |
  중간고사 실기의 모의 훈련이다. 2~7주차 코드에 버그를 심고, 학기 동안 쌓은 자산(인과성 성질
  테스트·정답지 수치·분해표·초기 손실 게이트)이 그 버그를 실제로 잡는지 확인한다. 특히 8번(잔차
  누락)과 10번(argmax 위치)은 소박하게 구현하면 검출되지 않는다는 사실을 실측으로 확인하고,
  검출 가능한 형태로 바꾸는 법을 배운다. "버그를 심었다"와 "버그가 검출된다"는 다른 문제다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  **다만 6단계(모의 실기)만은 예외다.** 처음 10분은 에이전트를 쓰지 않는다 —
  시험이 그렇게 진행되기 때문이다.
difficulty: hard
duration_minutes: 150
audience: LLM 밑바닥 구현 (8주차 중간고사)
prerequisites:
  - W02~W07 완료 — 모든 주차 코드와 테스트가 저장소에 있어야 한다
  - "`/work/week08/` 생성, week03~week07 모듈 import 가능"
  - W08 강의안 정독 — 답안 4요소, 시간 배분, 버그 은행 10종
objectives:
  - "인과성 성질 테스트가 마스크 반전 버그를 잡는지 확인한다"
  - "√d 스케일링 생략이 W04 정답지 수치로 잡히는지 확인한다"
  - "위치 임베딩 누락이 W03 실험으로 잡히는지 확인한다"
  - "잔차 누락은 12층을 쌓아야 드러남을 층별 비교로 확인한다"
  - "9주차 초기 손실 게이트로 잔차 누락을 검출한다"
  - "평탄화 argmax 가 IndexError 를 내는 것을 확인한다"
  - "모의 함정(mock_trap)을 직접 정독 후 차등 테스트로 진단한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 버그 #6: 인과성 성질 테스트가 마스크 반전을 잡는가

      W05 에서 만든 **인과성 불변 테스트**가 실전에서 쓸모 있는지 확인한다.

      ## 💡 심는 버그
      `tril`/`triu` 를 뒤바꿔 **미래만 보는 모델**을 만든다. 출력 shape 도 맞고 오류도 안 난다.
      오직 **"미래를 바꿔도 과거 출력이 안 변한다"** 는 성질만 깨진다.

      ## 💡 이것이 뮤테이션 테스팅이다
      코드에 의도적으로 결함을 심어 **테스트 스위트의 실효성**을 측정하는 기법이다.
      테스트 커버리지 100%인데 아무 버그도 못 잡는 경우가 실무에서 흔하다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] W05 의 인과성 성질 테스트가 마스크 반전 버그를 실제로 잡는지 확인한다

      [할 일]
       1. week05 의 MultiHeadAttention 을 상속한 Bug6 클래스를 만든다
          생성자에서 마스크를 뒤집는다 — 미래를 가리는 대신 과거를 가리도록
       2. 인과성 판정 함수를 만든다
          - 모델을 eval 모드로 둔다
          - (1, 5, 3) 입력 x1 과, 마지막 토큰만 바꾼 x2 를 만든다
          - 마지막 위치를 뺀 출력이 동일하면 True, 아니면 False
       3. 같은 시드로 정상 모델과 Bug6 를 각각 만들어 판정한다
          GOOD_CAUSAL_PASS <True/False>
          BUG6_CAUSAL_PASS <True/False>
       4. 정상이 True 이고 버그가 False 면 BUG6_DETECTED_OK, 아니면 NG

      [제약]
       - 버그 버전도 오류 없이 돌아가야 한다. 출력 shape 도 정상과 같아야 한다.
         죽어 버리는 버그는 이 실습의 대상이 아니다
       - 두 모델을 같은 시드로 만들 것. 가중치가 다르면 무엇 때문에 갈렸는지 알 수 없다
       - 원본 multihead.py 를 수정하지 말 것. 상속으로 덮어쓸 것

      [검증] 두 줄을 모두 출력하고, 이 버그가 "오류를 내지 않는다"는 점이
             왜 위험한지 한 문장으로 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week05')
      import torch
      from multihead import MultiHeadAttention
      class Bug6(MultiHeadAttention):
          def __init__(self, *a, **k):
              super().__init__(*a, **k)
              ctx = self.mask.shape[0]
              self.mask.copy_(torch.tril(torch.ones(ctx, ctx), diagonal=-1))
      def causal_ok(m):
          m.eval()
          x1 = torch.rand(1, 5, 3); x2 = x1.clone(); x2[0, -1] = torch.rand(3)
          with torch.no_grad(): o1, o2 = m(x1), m(x2)
          return torch.allclose(o1[:, :-1], o2[:, :-1], atol=1e-5)
      torch.manual_seed(123); good = MultiHeadAttention(3, 4, 6, 0.0, 2)
      torch.manual_seed(123); bad  = Bug6(3, 4, 6, 0.0, 2)
      print('GOOD_CAUSAL_PASS', causal_ok(good))
      print('BUG6_CAUSAL_PASS', causal_ok(bad))
      print('BUG6_DETECTED_OK' if causal_ok(good) and not causal_ok(bad) else 'NG')"
      ```
      ## ✅ 합격 기준
      `GOOD_CAUSAL_PASS True`, `BUG6_CAUSAL_PASS False`, `BUG6_DETECTED_OK`.
      **버그 버전이 테스트를 통과하면 그 테스트는 쓸모가 없는 것이다.**

      ## 🔍 에이전트 판정 포인트
      **이번 주는 에이전트에게 "버그를 고쳐라"라고 하면 안 되는 주간이다.** 지금까지는 버그를
      만나면 고치는 것이 목표였지만, 여기서는 **버그를 만들어 테스트를 시험한다.** 에이전트가
      Bug6 의 마스크를 "올바르게" 되돌려 놓고 "수정했습니다"라고 보고하면 실습이 무너진다.

      **원본 `week05/multihead.py` 를 건드리는지 감시하라.** 상속으로 덮어써야 하는데,
      에이전트는 파일을 직접 수정하는 쪽이 간단하다고 판단할 수 있다. 그러면 W05 산출물이
      오염되고 이후 주차가 전부 틀어진다.

      **`GOOD_CAUSAL_PASS` 도 함께 확인하는 이유.** 버그가 False 인 것만으로는 부족하다.
      정상 구현이 True 여야 "이 테스트가 정상과 버그를 구분한다"가 성립한다. 테스트가 무엇이든
      False 를 뱉는다면 그것도 쓸모없는 테스트다.

      **이것이 뮤테이션 테스팅이다.** 코드에 의도적으로 결함을 심어 **테스트 스위트의
      실효성**을 측정하는 기법이다. 테스트 커버리지 100%인데 아무 버그도 못 잡는 경우가
      실무에서 흔하다. 실기 답안의 "검증 증거" 항목(4점)이 바로 이런 것이다 —
      **수정 전후를 구분하는 테스트를 제시하는 것.**
    hint: '성질 테스트는 값이 아니라 규칙을 검사하므로 구현이 바뀌어도 살아남는다'
    answer: |
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week05')
      import torch
      from multihead import MultiHeadAttention
      class Bug6(MultiHeadAttention):
          def __init__(self, *a, **k):
              super().__init__(*a, **k)
              ctx = self.mask.shape[0]
              self.mask.copy_(torch.tril(torch.ones(ctx, ctx), diagonal=-1))
      def causal_ok(m):
          m.eval()
          x1 = torch.rand(1, 5, 3); x2 = x1.clone(); x2[0, -1] = torch.rand(3)
          with torch.no_grad(): o1, o2 = m(x1), m(x2)
          return torch.allclose(o1[:, :-1], o2[:, :-1], atol=1e-5)
      torch.manual_seed(123); good = MultiHeadAttention(3, 4, 6, 0.0, 2)
      torch.manual_seed(123); bad  = Bug6(3, 4, 6, 0.0, 2)
      print('GOOD_CAUSAL_PASS', causal_ok(good))
      print('BUG6_CAUSAL_PASS', causal_ok(bad))
      print('BUG6_DETECTED_OK' if causal_ok(good) and not causal_ok(bad) else 'NG')"
    answer_detail: "W05 인과성 테스트가 실제 진단 도구로 쓰인다. 실기 답안의 '검증 증거' 항목(4점)이 바로 이런 것이다 — 수정 전후를 구분하는 테스트를 제시하는 것."
    verify:
      type: output_contains
      expect: BUG6_DETECTED_OK
      field: stdout
      semantic:
        intent: "인과성 성질 테스트의 버그 검출력 확인 (뮤테이션 테스팅)"
        success_criteria: ["정상은 통과", "버그는 실패", "shape 오류 없이 값만 틀림"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 버그 #3: √d 스케일링 생략을 정답지 수치로 잡기

      W04 에서 확인한 정답지 수치가 진단 도구가 된다.

      ## 💡 심는 버그
      `scores / d_k**0.5` 에서 나눗셈을 뺀다. 오류는 안 나고, 출력 shape 도 같다.
      그런데 **W04 정답지 `[0.3061, 0.8210]` 이 재현되지 않는다.**

      ## 💡 왜 이것이 좋은 진단인가
      정답지 수치는 **구조·시드·연산 순서가 모두 맞아야** 나온다. 하나라도 어긋나면 값이
      달라진다. 그래서 "숫자 하나"가 여러 가능성을 동시에 배제한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] W04 의 정답지 수치 [0.3061, 0.8210] 이 √d 스케일링 생략을 잡아내는지 확인한다

      [할 일]
       1. week04 의 SelfAttention_v1 을 상속한 Bug3 를 만든다
          forward 에서 점수를 √d_k 로 나누는 단계만 뺀다. 나머지는 그대로 둔다
       2. 같은 시드(123)로 정상 모델과 Bug3 를 각각 만든다
       3. 같은 inputs 를 통과시켜 두 번째 행을 소수 4자리로 각각 출력한다
          GOOD_ROW2 <리스트> (정답지 [0.3061, 0.821])
          BUG3_ROW2 <리스트>
       4. 정상이 정답지와 같고 버그가 다르면 BUG3_DETECTED_OK, 아니면 NG

      [제약]
       - 버그 버전도 오류 없이 돌아야 하고 출력 shape 도 같아야 한다
       - 두 모델을 같은 시드로 만들 것
       - 정답지 [0.3061, 0.821] 을 실측값으로 바꾸지 말 것

      [검증] 두 줄을 나란히 보이고, 두 값의 차이가 얼마나 작은지 지적할 것.
             그리고 이 정도 차이를 "거의 같다"로 넘기면 무엇을 놓치는지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week04')
      import torch
      from inputs import inputs
      from attention_v1v2 import SelfAttention_v1
      class Bug3(SelfAttention_v1):
          def forward(self, x):
              q = x @ self.W_query; k = x @ self.W_key; v = x @ self.W_value
              w = torch.softmax(q @ k.T, dim=-1)   # ← √d 나눗셈 생략
              return w @ v
      torch.manual_seed(123); good = SelfAttention_v1(3, 2)
      torch.manual_seed(123); bad  = Bug3(3, 2)
      g = [round(t,4) for t in good(inputs)[1].tolist()]
      b = [round(t,4) for t in bad(inputs)[1].tolist()]
      print('GOOD_ROW2', g, '(정답지 [0.3061, 0.821])')
      print('BUG3_ROW2', b)
      print('BUG3_DETECTED_OK' if g == [0.3061, 0.821] and b != g else 'NG')"
      ```
      ## ✅ 합격 기준
      정상은 `[0.3061, 0.821]`, 버그는 **다른 값**, `BUG3_DETECTED_OK`. 실측 출력:
      ```
      GOOD_ROW2 [0.3061, 0.821] (정답지 [0.3061, 0.821])
      BUG3_ROW2 [0.3157, 0.843]
      BUG3_DETECTED_OK
      ```

      ## 🔍 에이전트 판정 포인트
      **차이가 0.01 수준이다.** `0.3061` vs `0.3157`, `0.821` vs `0.843`. 그래프로 그리면
      두 곡선이 겹쳐 보이고, "구현 방식 차이로 인한 미세한 오차"로 넘어가기 딱 좋다.
      **이 실습이 소수 4자리까지 대조하는 이유가 이것이다.** 자릿수를 줄이면 이 버그는
      영원히 안 잡힌다.

      **정답지 수치가 강한 진단인 이유.** 이 값은 **구조·시드·연산 순서가 모두 맞아야** 나온다.
      하나라도 어긋나면 달라진다. 그래서 "숫자 하나"가 여러 가능성을 동시에 배제한다.
      에이전트가 "값이 조금 다르지만 구현은 맞습니다"라고 보고하면, 무엇이 다른지 특정하기
      전에는 받아들이지 마라.

      **성질 테스트(1단계)와 값 대조(2단계)는 잡는 것이 다르다.**
      | 자산 | 잡는 것 | 못 잡는 것 |
      |---|---|---|
      | 인과성 성질 테스트 | 토큰 축을 건드리는 버그 | 스케일링 생략 (인과성은 그대로다) |
      | 정답지 수치 | 값에 영향을 주는 모든 변화 | 정답지가 없는 새 코드 |

      **둘을 함께 써야 커버리지가 넓어진다.** 실기 시험에서 두 자산을 모두 꺼낼 수 있어야 한다.
    hint: '정답지 수치 하나가 구조·시드·연산 순서를 동시에 검사한다'
    answer: |
