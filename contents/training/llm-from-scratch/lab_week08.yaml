  - order: 3
    instruction: |
      ## 🎯 미션 — 버그 #9: 위치 임베딩 누락을 W03 실험으로 잡기

      ## 💡 심는 버그
      `x = tok_emb + pos_emb` 에서 `pos_emb` 를 빼먹는다. 여전히 오류 없이 돌고 shape 도 같다.

      ## 💡 잡는 방법
      W03 위치 임베딩 실험을 그대로 쓴다 — **같은 토큰 ID 가 두 번 나오는 시퀀스**를 넣고,
      두 위치의 최종 로짓이 같은지 본다.
      - 정상: 위치가 다르므로 **로짓이 다르다**
      - 버그: 위치 정보가 없으므로... 그런데 **어텐션 때문에 여전히 다를 수 있다**(앞 문맥이 다름)

      그래서 더 확실한 검사는 **모델 임베딩 단계 직후**를 비교하는 것이다.
      W03 에서 쓴 `I saw the cat and the dog`(` the` = 262 가 두 번)를 재사용한다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week07')
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      ids = enc.encode('I saw the cat and the dog')
      pos_idx = [i for i, v in enumerate(ids) if v == 262]
      print('DUP_POSITIONS', pos_idx)
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M).eval()
      x = torch.tensor([ids])
      te = m.tok_emb(x)
      pe = m.pos_emb(torch.arange(len(ids)))
      i, j = pos_idx
      d_bug  = (te[0, i] - te[0, j]).norm().item()          # 위치 임베딩 누락
      d_good = ((te+pe)[0, i] - (te+pe)[0, j]).norm().item() # 정상
      print(f'BUG9_DIFF ={d_bug:.6f}  (위치 임베딩 없음)')
      print(f'GOOD_DIFF ={d_good:.6f}  (정상)')
      print('BUG9_DETECTED_OK' if d_bug == 0.0 and d_good > 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `BUG9_DIFF = 0.000000`, `GOOD_DIFF > 0`, `BUG9_DETECTED_OK`.
    hint: 'W03 6단계의 선행 공백 함정을 기억하라 — 중복 토큰이 실재하는 문장을 써야 한다'
