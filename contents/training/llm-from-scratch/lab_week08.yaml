        success_criteria: ["정상 값 재현", "버그 값 불일치", "오류 없이 값만 다름"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 버그 #9: 위치 임베딩 누락을 W03 실험으로 잡기

      ## 💡 심는 버그
      `x = tok_emb + pos_emb` 에서 `pos_emb` 를 빼먹는다. 여전히 오류 없이 돌고 shape 도 같다.

      ## 💡 잡는 방법
      W03 위치 임베딩 실험을 그대로 쓴다 — **같은 토큰 ID 가 두 번 나오는 시퀀스**를 넣고,
      두 위치의 최종 로짓이 같은지 본다.
      - 정상: 위치가 다르므로 **로짓이 다르다**
      - 버그: 위치 정보가 없으므로... 그런데 **어텐션 때문에 여전히 다를 수 있다**(앞 문맥이 다름)

      그래서 더 확실한 검사는 **모델 임베딩 단계 직후**를 비교하는 것이다.
      W03 에서 쓴 `I saw the cat and the dog`(` the` = 262 가 두 번)를 재사용한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 위치 임베딩 누락 버그를 W03 의 중복 토큰 실험으로 검출한다

      [할 일]
       1. 같은 토큰 ID 가 두 번 나오는 문장을 고른다.
          W03 6단계에서 확인한 "I saw the cat and the dog" 를 쓴다
       2. 중복 토큰(262)이 놓인 위치 두 개를 찾아 출력한다: DUP_POSITIONS <리스트>
       3. GPTModel 을 만들고(시드 123, eval) 임베딩 두 개를 각각 얻는다
          te = 토큰 임베딩 결과 / pe = 위치 임베딩 결과
       4. 두 위치의 벡터 차 L2 노름을 두 가지로 계산해 출력한다
          BUG9_DIFF = te 만 썼을 때 (= 위치 임베딩 누락 상황)
          GOOD_DIFF = te + pe 를 썼을 때 (= 정상)
       5. BUG9_DIFF 가 정확히 0 이고 GOOD_DIFF 가 0 보다 크면 BUG9_DETECTED_OK

      [제약]
       - 문장을 임의로 바꾸지 말 것. 중복 토큰이 없는 문장을 쓰면 실험이 성립하지 않는다
         ("the cat and the dog" 는 두 the 의 토큰 ID 가 달라서 안 된다 — W03 6단계 참고)
       - 최종 로짓을 비교하지 말 것. 어텐션 때문에 앞 문맥이 달라 위치 임베딩이 없어도
         값이 달라진다. 임베딩 단계 직후를 비교해야 깨끗하다
       - 중복 토큰과 위치를 하드코딩하지 말고 코드로 찾을 것

      [검증] 세 줄을 모두 출력하고, 왜 최종 로짓이 아니라 임베딩 직후를 비교해야
             하는지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week08 llm-lab python3 -c "
      import sys; sys.path.insert(0, '/work/week07')
      import torch, tiktoken
      from gpt_model import GPTModel, GPT_CONFIG_124M
      enc = tiktoken.get_encoding('gpt2')
      ids = enc.encode('I saw the cat and the dog')
      pos_idx = [i for i, v in enumerate(ids) if v == 262]
      print('DUP_POSITIONS', pos_idx)
      torch.manual_seed(123); m = GPTModel(GPT_CONFIG_124M).eval()
      x = torch.tensor([ids])
      te = m.tok_emb(x)
      pe = m.pos_emb(torch.arange(len(ids)))
      i, j = pos_idx
      d_bug  = (te[0, i] - te[0, j]).norm().item()          # 위치 임베딩 누락
      d_good = ((te+pe)[0, i] - (te+pe)[0, j]).norm().item() # 정상
      print(f'BUG9_DIFF ={d_bug:.6f}  (위치 임베딩 없음)')
      print(f'GOOD_DIFF ={d_good:.6f}  (정상)')
      print('BUG9_DETECTED_OK' if d_bug == 0.0 and d_good > 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `BUG9_DIFF = 0.000000`, `GOOD_DIFF > 0`, `BUG9_DETECTED_OK`. 실측 출력:
      ```
      DUP_POSITIONS [2, 5]
      BUG9_DIFF =0.000000  (위치 임베딩 없음)
      GOOD_DIFF =39.910233  (정상)
      BUG9_DETECTED_OK
      ```

      ## 🔍 에이전트 판정 포인트
      **W03 6단계의 선행 공백 함정이 여기서 회수된다.** 에이전트에게 "같은 단어가 두 번 나오는
      문장"을 고르라고 하면 `"the cat and the dog"` 같은 짧은 예문을 고르기 쉽다. 그런데 두
      `the` 의 토큰 ID 가 1169 와 262 로 **다르다.** 그러면 `BUG9_DIFF` 가 0 이 아니게 나오고,
      에이전트는 **"위치 임베딩이 없어도 구분된다 → 이 버그는 검출 불가"** 라는 정반대 결론을
      내린다. 실험 전제를 측정으로 먼저 확인해야 하는 이유다.

      **최종 로짓을 비교하면 판정이 흐려진다.** 어텐션 때문에 두 위치의 앞 문맥이 달라
      위치 임베딩이 없어도 로짓은 달라진다. 에이전트가 "모델 출력을 비교하겠습니다"라고 하면
      멈추게 하고 임베딩 직후를 보게 하라. **무엇을 비교하느냐가 검출력을 결정한다.**

      **`GOOD_DIFF = 39.9` 라는 크기에는 의미가 없다.** 시드와 차원(768)에서 나온 숫자다.
      이 실험이 말하는 것은 오직 **0 이었던 것이 0 이 아니게 되었다**뿐이다.

      학기 자산은 버리는 것이 아니라 쌓이는 것이다 — 실기 시험에서 이 파일들을 자유롭게
      쓸 수 있는 이유다.
