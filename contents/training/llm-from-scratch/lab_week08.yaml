    answer_detail: "정답지 수치는 '값 대조' 계열 자산이다. 성질 테스트가 규칙을 검사한다면 정답지 수치는 한 지점을 정밀하게 검사한다 — 둘을 함께 써야 커버리지가 넓어진다."
    verify:
