      ```
      마지막 시점의 argmax 를 **먼저 슬라이스하나 나중에 슬라이스하나 수학적으로 같기** 때문이다.
      출제 검증에서 3개 시작점 모두 정답 구현과 **완전히 동일한 출력**이 나왔다.

      ## 💡 진짜 버그가 되려면
      **차원을 평탄화해 시점 정보를 뭉개야** 한다:
      ```python
      idx_next = torch.argmax(logits.flatten(1), dim=-1, keepdim=True)   # ← 진짜 버그
      ```
      `[B, T, 50257]` 이 `[B, T×50257]` 로 평탄화되어 argmax 가 **50,257을 넘는 값**을 내고,
      다음 스텝의 임베딩 조회에서 `IndexError: index out of range in self` 가 난다.

      ## 📌 이 문항의 노림수
      학생이 오류 메시지에서 **"인덱스가 어휘 크기를 넘었다 → 그럼 argmax 가 무엇 위에서
      돌았나"** 를 역추적하게 하는 것이다.

