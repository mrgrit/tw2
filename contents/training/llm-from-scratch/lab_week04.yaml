  - order: 7
    instruction: |
      ## 🎯 미션 — √d 스케일링은 왜 필요한가 (측정으로 증명)

      "관례적 상수"가 아니라 **이론이 있는 상수**임을 실측으로 확인한다.

      ## 💡 왜 분산이 d에 비례하는가
      표준정규 벡터 두 개의 내적은 `Σ(qᵢ × kᵢ)` 로 **d개 항의 합**이다. 각 항의 분산이 1이고
      서로 독립이면 합의 분산은 **d** 가 된다. 그래서 `√d` 로 나누면 분산이 1로 돌아온다.

      ## 💡 예상 결과 (실측)
      | d | 측정 분산 | 이론값 |
      |---|---|---|
      | 8 | **8.19** | 8 |
      | 64 | **64.82** | 64 |
      | 512 | **515.67** | 512 |

      | d=512 | softmax 최댓값 |
      |---|---|
      | 스케일링 **없이** | **0.9985** ← 거의 원-핫 |
      | √d 로 나눈 뒤 | **0.3773** ← 완만 |

      ## 💡 원-핫에 가까운 softmax 가 왜 해로운가
      softmax 는 출력이 0 또는 1에 가까워지면 **미분값이 0에 수렴**한다(포화 구간). 역전파로
      흘러가는 신호가 사라져 학습이 멈춘다. 스케일링 한 줄이 이것을 막는다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] "내적의 분산이 차원 d 에 비례한다"를 측정으로 확인하고,
             그것이 softmax 분포에 어떤 영향을 주는지 본다

      [할 일]
       실험 A — 분산 측정
        1. torch.manual_seed(123) 으로 고정한다
        2. d = 8, 64, 512 각각에 대해
           - 표준정규분포로 (10000, d) 크기 텐서 q, k 를 만든다
           - 행마다 q·k 내적을 구해 10000개의 내적 값을 얻는다
           - 그 분산을 출력한다: d=<d> var=<분산> (이론값 <d>)

       실험 B — softmax 분포 비교
        4. d = 512 로 쿼리 1개와 키 6개를 표준정규로 만든다
        5. 점수를 두 가지로 구한다: 그대로 / √d 로 나눈 것
        6. 각각 softmax 를 적용해 최댓값을 소수 4자리로 출력한다
           NO_SCALE_MAX_P <값>
           SCALED_MAX_P   <값>
        7. 마지막에 SCALING_OK 를 출력한다

      [제약]
       - 난수는 반드시 표준정규분포(randn)를 쓸 것.
         균등분포(rand)를 쓰면 분산이 d 에 비례하지 않아 실험이 성립하지 않는다
       - 표본 수를 10000 보다 줄이지 말 것. 분산 추정이 흔들린다
       - 분산은 이론값과 "정확히" 같을 수 없다. 근접하면 된다

      [검증] 세 줄의 분산과 두 최댓값을 모두 출력할 것.
             그리고 왜 합의 분산이 d 가 되는지 수식으로 한 줄 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      for d in [8, 64, 512]:
          q = torch.randn(10000, d); k = torch.randn(10000, d)
          dots = (q*k).sum(dim=-1)
          print(f'd={d:4d} var={dots.var().item():8.2f} (이론값 {d})')
      d = 512; q = torch.randn(d); k = torch.randn(6, d)
      raw = k @ q; scaled = raw / d**0.5
      print('NO_SCALE_MAX_P', round(torch.softmax(raw, dim=-1).max().item(), 4))
      print('SCALED_MAX_P  ', round(torch.softmax(scaled, dim=-1).max().item(), 4))
      print('SCALING_OK')"
      ```
      ## ✅ 합격 기준
      세 분산이 각각 이론값 d에 근접하고, 스케일링 없는 최댓값이 훨씬 크며, `SCALING_OK`.
      실측 출력:
      ```
      d=   8 var=    8.19 (이론값 8)
      d=  64 var=   64.82 (이론값 64)
      d= 512 var=  515.67 (이론값 512)
      NO_SCALE_MAX_P 0.9985
      SCALED_MAX_P   0.3773
      ```

      ## 🔍 에이전트 판정 포인트
      **`randn` 대신 `rand` 를 쓰면 실험 자체가 무너진다.** 균등분포 U(0,1) 은 평균이 0 이
      아니어서 내적이 전부 양수로 몰리고, 분산도 d 에 비례하지 않는다. 그런데 **에러는 안 나고
      숫자는 나온다.** 에이전트가 보고한 분산이 이론값과 크게 어긋나 있으면 분포부터 의심하라.

      **에이전트가 "분산이 정확히 8이 아니라 8.19라서 실패"라고 보고하면 그것도 오판이다.**
      10000 표본의 추정치라 흔들리는 게 정상이다. 반대로 "8.19 ≈ 8 이니 통과"를 스스로
      판단하게 두면 나중에 진짜 어긋난 값도 통과시킨다. **그래서 이 단계의 판정 기준은
      "이론값에 근접"이라는 사람의 판단으로 남겨 뒀다** — 자동 판정이 항상 가능한 건 아니다.

      **숫자가 말하는 것을 놓치지 마라.** d=512 에서 스케일링 없이 softmax 를 걸면 최댓값이
      **0.9985** — 사실상 원-핫이다. softmax 는 출력이 0 이나 1 에 붙으면 **미분값이 0 으로
      수렴**한다(포화 구간). 역전파 신호가 사라져 학습이 멈춘다. √d 로 나누면 0.3773 으로
      완만해진다. **√d 스케일링은 관례가 아니라 측정으로 정당화되는 필수다.**

      ## 📝 해석 과제 (report.md 에 **직접** 작성 — 에이전트 사용 금지)
      원-핫에 가까운 softmax 가 학습(기울기)에 왜 해로운지, 이번 측정 결과를 인용하며
      3~5문장으로 설명하라.
    hint: '분산이 d와 크게 다르면 표준정규(randn)가 아닌 분포를 쓴 것이다'
