          print(f'd={d:4d} var={dots.var().item():8.2f} (이론값 {d})')
      d = 512; q = torch.randn(d); k = torch.randn(6, d)
      raw = k @ q; scaled = raw / d**0.5
      print('NO_SCALE_MAX_P', round(torch.softmax(raw, dim=-1).max().item(), 4))
      print('SCALED_MAX_P  ', round(torch.softmax(scaled, dim=-1).max().item(), 4))
      print('SCALING_OK')"
    answer_detail: "분산 ∝ d 를 측정으로 확인하고, 그 결과가 softmax 를 원-핫으로 만드는 것을 최댓값 0.9985 vs 0.3773 으로 본다. √d 스케일링은 취향이 아니라 측정으로 정당화되는 필수다."
    verify:
