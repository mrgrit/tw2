       2. 세 개의 학습 가능한 가중치를 nn.Parameter 로 만든다
          W_query, W_key, W_value — 각각 shape (d_in, d_out), torch.rand 로 초기화
       3. forward(x) 는 다음 순서로 계산한다
          - queries = x @ W_query, keys = x @ W_key, values = x @ W_value
          - scores  = queries @ keys 의 전치
          - scores 를 키 차원의 제곱근으로 나눈다  ← 빠뜨리지 말 것
          - weights = softmax(scores, 마지막 차원 기준)
          - 반환값 = weights @ values

