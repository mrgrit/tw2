  - order: 7
    instruction: |
      ## 🎯 미션 — √d 스케일링은 왜 필요한가 (측정으로 증명)

      "관례적 상수"가 아니라 **이론이 있는 상수**임을 실측으로 확인한다.

      ## 💡 왜 분산이 d에 비례하는가
      표준정규 벡터 두 개의 내적은 `Σ(qᵢ × kᵢ)` 로 **d개 항의 합**이다. 각 항의 분산이 1이고
      서로 독립이면 합의 분산은 **d** 가 된다. 그래서 `√d` 로 나누면 분산이 1로 돌아온다.

      ## 💡 예상 결과 (실측)
      | d | 측정 분산 | 이론값 |
      |---|---|---|
      | 8 | **8.19** | 8 |
      | 64 | **64.82** | 64 |
      | 512 | **515.67** | 512 |

      | d=512 | softmax 최댓값 |
      |---|---|
      | 스케일링 **없이** | **0.9985** ← 거의 원-핫 |
      | √d 로 나눈 뒤 | **0.3773** ← 완만 |

      ## 💡 원-핫에 가까운 softmax 가 왜 해로운가
      softmax 는 출력이 0 또는 1에 가까워지면 **미분값이 0에 수렴**한다(포화 구간). 역전파로
      흘러가는 신호가 사라져 학습이 멈춘다. 스케일링 한 줄이 이것을 막는다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      torch.manual_seed(123)
      for d in [8, 64, 512]:
          q = torch.randn(10000, d); k = torch.randn(10000, d)
          dots = (q*k).sum(dim=-1)
          print(f'd={d:4d} var={dots.var().item():8.2f} (이론값 {d})')
      d = 512; q = torch.randn(d); k = torch.randn(6, d)
      raw = k @ q; scaled = raw / d**0.5
      print('NO_SCALE_MAX_P', round(torch.softmax(raw, dim=-1).max().item(), 4))
      print('SCALED_MAX_P  ', round(torch.softmax(scaled, dim=-1).max().item(), 4))
      print('SCALING_OK')"
      ```
      ## ✅ 합격 기준
      세 분산이 각각 이론값 d에 근접하고, 스케일링 없는 최댓값이 훨씬 크며, `SCALING_OK`.

      ## 📝 해석 과제 (report.md 에 **직접** 작성 — 에이전트 사용 금지)
      원-핫에 가까운 softmax 가 학습(기울기)에 왜 해로운지, 이번 측정 결과를 인용하며
      3~5문장으로 설명하라.
    hint: '분산이 d와 크게 다르면 표준정규(randn)가 아닌 분포를 쓴 것이다'
    answer: |
