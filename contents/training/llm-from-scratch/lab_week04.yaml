      `nn.Linear` 로 만든 v2 의 가중치를 `nn.Parameter` 로 만든 v1 에 이식해 두 구현이 동일함을
      증명한다. **그대로 복사하면 안 된다.**

      ## 🔴 왜 전치가 필요한가
      | 구현 | 가중치 shape | 곱하는 방식 |
      |---|---|---|
      | `nn.Parameter(torch.rand(d_in, d_out))` | `(d_in, d_out)` | `x @ W` |
      | `nn.Linear(d_in, d_out)` | **`(d_out, d_in)`** | `x @ W.T` (내부에서) |

      `nn.Linear` 는 가중치를 **(출력차원, 입력차원)** 으로 저장한다. 그래서 이식에는
      `sa1.W_query.data = sa2.W_query.weight.T` 처럼 **전치**가 필요하다.

      ## 🔗 이 문제는 10주차에서 회수된다
      OpenAI 의 GPT-2 공식 가중치는 TensorFlow 규약(입력, 출력)으로 저장돼 있어서 PyTorch
      `nn.Linear` 에 넣을 때 **똑같은 전치**가 필요하다. 오늘 이해하지 않으면 6주 뒤에
      shape 오류로 만난다.

