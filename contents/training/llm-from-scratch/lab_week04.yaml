    instruction: |
      ## 🎯 미션 — 어텐션 히트맵 시각화

      6×6 가중치 행렬을 그림으로 본다. **시각화 검증은 사람 눈이 최종 판정자다.**

      ## 💡 컨테이너에서 그림 그릴 때
      `matplotlib.use("Agg")` 를 **import 직후 먼저** 지정해야 디스플레이 없는 환경에서 저장이
      된다. 골든 이미지에는 `fonts-nanum` 이 들어 있어 한글 라벨도 깨지지 않는다(W01 참고).

      ## 📝 관찰 과제
      그림을 직접 열어 보고 사실 3가지를 서술하라. 예:
      - 어떤 토큰 쌍의 가중치가 가장 큰가? 왜 그런가(임베딩 값을 보라)
      - 대각선(자기 자신)은 어떤 의미인가
      - 아직 "의미상 관련"이 아니라 "벡터 유사도"인 이유

      ## 💻 실행 명령
