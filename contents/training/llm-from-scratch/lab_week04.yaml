  - order: 2
    instruction: |
      ## 🎯 미션 — 전체 행렬화 + 루프 대조 (벡터화 검증)

      쿼리 6개를 for 루프로 도는 대신 행렬 연산 한 번으로 처리하고, **두 버전이 같은 답**을
      내는지 검증한다.

      ## 💡 이것이 "벡터화 검증"의 표준 패턴
      느리지만 명백한 구현(루프)을 먼저 만들고, 빠른 구현(행렬)이 같은 답을 내는지 대조한다.
      **빠른 구현을 검증할 대상이 없으면 틀려도 모른다.** W03 의 "원-핫 행렬곱 vs 조회"와 같은
      구조이며 W05 인과 마스크에서 다시 쓴다.

      ## ⚠️ `dim=-1` 이 왜 중요한가
      `scores` 의 i행은 "i번째 토큰이 각 토큰을 얼마나 보는가"이므로 **행마다** 합이 1이어야
      한다. `dim=0` 으로 잘못 주면 열 합이 1이 되어 의미가 완전히 달라지는데, **shape 는 똑같이
      나와서 오류 없이 조용히 틀린다.** 그래서 "각 행 합이 1인지"를 검증 항목에 넣는다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      loop = torch.empty(6, 6)
      for i, a in enumerate(inputs):
          for j, b in enumerate(inputs): loop[i, j] = torch.dot(a, b)
      mat = inputs @ inputs.T
      w = torch.softmax(mat, dim=-1); ctx = w @ inputs
      print('LOOP_EQ_MATMUL', torch.allclose(loop, mat))
      print('ROWSUM_1', torch.allclose(w.sum(dim=-1), torch.ones(6)))
      print('ROW2', [round(v,4) for v in ctx[1].tolist()])
      print('MATRIX_ATTN_OK' if torch.allclose(loop, mat) and [round(v,4) for v in ctx[1].tolist()]==[0.4419,0.6515,0.5683] else 'NG')"
      ```
      ## ✅ 합격 기준
      `LOOP_EQ_MATMUL True`, `ROWSUM_1 True`, `ROW2 [0.4419, 0.6515, 0.5683]`, `MATRIX_ATTN_OK`.
    hint: '행렬 버전 2번째 행이 1단계의 z2 와 같아야 한다 — 다르면 dim 을 의심하라'
