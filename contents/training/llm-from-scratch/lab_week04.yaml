lab_id: llm-from-scratch-week04
title: "W04 — 어텐션은 어디를 보는가: 3단계 추적·행렬화·히트맵·Q/K/V·√d 스케일링"
version: ai
course: llm-from-scratch
week: 4
description: |
  어텐션을 점수(내적) → 정규화(softmax) → 가중합 세 단계로 분해해 중간값까지 정답지와 대조한다.
  루프 구현과 행렬 구현의 동치를 검증하고, 가중치를 히트맵으로 시각화한 뒤, 학습 가능한 Q/K/V 를
  도입한 SelfAttention v1(nn.Parameter)/v2(nn.Linear)를 만든다. 두 구현 사이의 전치 규약 차이를
  가중치 이식으로 증명하고, 마지막으로 √d 스케일링의 필요성을 내적 분산 측정으로 확인한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.
difficulty: medium
duration_minutes: 160
audience: LLM 밑바닥 구현 (4주차)
prerequisites:
  - W03 완료 — 임베딩 파이프라인, 브로드캐스팅 이해
  - "`/work/week04/inputs.py` 에 교재 3장 장난감 텐서(6×3) 정의"
  - W04 강의안 정독 — 3단계, Q/K/V 역할, nn.Linear 저장 방향, 분산 ∝ d
objectives:
  - "점수/가중치/문맥벡터 중간값을 정답지와 소수 4자리까지 대조한다"
  - "내적 하나(0.9544)를 손으로 검산한다"
  - "루프 구현과 행렬 구현이 allclose 임을 검증한다"
  - "가중치 행 합이 모두 1인지 확인해 dim 오류를 배제한다"
  - "어텐션 가중치를 히트맵으로 저장하고 관찰 3가지를 서술한다"
  - "SelfAttention_v1 두 번째 행 [0.3061, 0.8210] 을 재현한다"
  - "nn.Linear 저장 방향 때문에 전치가 필요함을 증명한다"
  - "내적 분산이 차원 d에 비례함을 측정하고 스케일링 효과를 확인한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 쿼리 하나로 어텐션 3단계 추적

      두 번째 토큰 `journey`(인덱스 1)를 쿼리로 잡고, 점수 → 가중치 → 문맥 벡터를 한 단계씩
      계산해 **모든 중간값을 정답지와 대조**한다. 어텐션을 블랙박스가 아닌 산수로 만드는 시간이다.

      ## 💡 정답지
      | 단계 | 값 |
      |---|---|
      | 점수 | `[0.9544, 1.4950, 1.4754, 0.8434, 0.7070, 1.0865]` |
      | 가중치 | `[0.1385, 0.2379, 0.2333, 0.1240, 0.1082, 0.1581]` (합 **1.0**) |
      | 문맥 z2 | `[0.4419, 0.6515, 0.5683]` |

      ## 📝 손계산 과제 (report.md 에 남길 것)
      점수의 첫 값은 내적 하나다:
      `0.43×0.55 + 0.15×0.87 + 0.89×0.66 = 0.2365 + 0.1305 + 0.5874 = 0.9544`
      **6×6 전체를 손으로 할 필요는 없다 — 표본 하나를 검산하는 것이 검증력이다.**

      ## ⚠️ 아직 "의미"는 없다
      가중치가 `journey`(0.2379)와 `starts`(0.2333)에 몰린 이유는 두 임베딩이 거의 같기
      때문이다. 학습 가중치가 없으니 "무엇을 기준으로 주목할지"를 배울 수 없다.
      이 단계의 주목은 **벡터 유사도**일 뿐이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 두 번째 토큰을 쿼리로 삼아 어텐션을 점수 → 가중치 → 문맥벡터 3단계로
             계산하고 각 단계의 중간값을 전부 출력한다

      [할 일]
       1. /work/week04/inputs.py 의 inputs 텐서(6×3)를 불러온다
       2. 쿼리 q = inputs[1] (두 번째 토큰) 로 잡는다
       3. 1단계 — q 와 6개 토큰 각각의 내적을 구해 점수 6개를 만든다
          출력: SCORES <소수 4자리 리스트>
       4. 2단계 — 점수에 softmax 를 적용해 가중치를 만든다
          출력: WEIGHTS <소수 4자리 리스트> sum= <합, 소수 4자리>
       5. 3단계 — 가중치로 6개 입력 벡터를 가중합해 문맥 벡터를 만든다
          출력: Z2 <소수 4자리 리스트>
       6. SCORES 가 [0.9544, 1.4950, 1.4754, 0.8434, 0.7070, 1.0865] 이고
          Z2 가 [0.4419, 0.6515, 0.5683] 이면 ATTN_STEP3_OK, 아니면 NG 를 출력한다

      [제약]
       - inputs.py 의 텐서 값을 수정하지 말 것. 하나라도 바꾸면 이후 모든 주차의 정답지가 어긋난다
       - 이 단계에는 학습 가중치(W_q/W_k/W_v)가 없다. 임의로 도입하지 말 것
       - 가중치 합이 1인지 반드시 함께 출력할 것
       - 중간값을 생략하지 말 것. 최종 답만 맞으면 되는 문제가 아니다

      [검증] 세 줄을 모두 출력하고, SCORES 의 첫 값 0.9544 가 어떤 내적인지
             곱셈 3개의 합으로 풀어 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      q = inputs[1]
      scores = torch.tensor([torch.dot(x, q) for x in inputs])
      w = torch.softmax(scores, dim=0)
      z2 = (w.unsqueeze(1) * inputs).sum(dim=0)
      print('SCORES ', [round(v,4) for v in scores.tolist()])
      print('WEIGHTS', [round(v,4) for v in w.tolist()], 'sum=', round(w.sum().item(),4))
      print('Z2     ', [round(v,4) for v in z2.tolist()])
      ok = ([round(v,4) for v in scores.tolist()]==[0.9544,1.4950,1.4754,0.8434,0.7070,1.0865]
            and [round(v,4) for v in z2.tolist()]==[0.4419,0.6515,0.5683])
      print('ATTN_STEP3_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      세 줄이 정답지와 일치하고 `ATTN_STEP3_OK`. 실측 출력:
      ```
      SCORES  [0.9544, 1.495, 1.4754, 0.8434, 0.707, 1.0865]
      WEIGHTS [0.1385, 0.2379, 0.2333, 0.124, 0.1082, 0.1581] sum= 1.0
      Z2      [0.4419, 0.6515, 0.5683]
      ATTN_STEP3_OK
      ```
      `1.4950` 이 `1.495` 로, `0.7070` 이 `0.707` 으로 찍히는 것은 파이썬이 뒤 0 을 떼기
      때문이다. **값은 같다** — 여기서 NG 판정을 내리지 마라.

      ## 🔍 에이전트 판정 포인트
      **에이전트는 "어텐션을 계산하라"고 하면 곧장 `torch.nn.MultiheadAttention` 을 쓰거나
      Q/K/V 행렬을 만들어 온다.** 그게 "제대로 된 어텐션"이라고 학습돼 있기 때문이다. 하지만
      이 단계의 목적은 **가중치 없는 맨 어텐션의 산수를 보는 것**이다. 프롬프트에 "학습
      가중치를 임의로 도입하지 말 것"을 넣은 이유다. 출력이 정답지와 다르면 십중팔구 이것이다.

      **중간값을 안 보여주고 최종 결과만 보고하는 것도 실패로 보라.** 이 단계는 답을 맞히는
      게 아니라 **어디서 틀렸는지 짚을 수 있는 상태를 만드는 것**이 목적이다. Z2 만 맞고
      SCORES 를 안 보여주면 다음 주에 값이 틀어졌을 때 되짚을 지점이 없다.

      **손계산 검산은 학생 몫이다.** 표본 하나면 충분하다.
      `0.43×0.55 + 0.15×0.87 + 0.89×0.66 = 0.2365 + 0.1305 + 0.5874 = 0.9544`
      6×6 전체를 손으로 할 필요는 없다 — **표본 하나를 검산하는 것이 검증력이다.**
    hint: 'inputs 텐서 값을 하나라도 바꾸면 이후 모든 정답지가 어긋난다'
    answer: |
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      q = inputs[1]
      scores = torch.tensor([torch.dot(x, q) for x in inputs])
      w = torch.softmax(scores, dim=0)
      z2 = (w.unsqueeze(1) * inputs).sum(dim=0)
      print('SCORES ', [round(v,4) for v in scores.tolist()])
      print('WEIGHTS', [round(v,4) for v in w.tolist()], 'sum=', round(w.sum().item(),4))
      print('Z2     ', [round(v,4) for v in z2.tolist()])
      ok = ([round(v,4) for v in scores.tolist()]==[0.9544,1.4950,1.4754,0.8434,0.7070,1.0865]
            and [round(v,4) for v in z2.tolist()]==[0.4419,0.6515,0.5683])
      print('ATTN_STEP3_OK' if ok else 'NG')"
    answer_detail: "어텐션의 전부는 이 3단계다. 인과 마스크(W05)도 멀티헤드(W05)도 GPT-2 전체(W07)도 이 뼈대 위에 얹힌 변주일 뿐이다. 여기서 흐릿하게 넘어가면 뒤가 전부 흐려진다."
    verify:
      type: output_contains
      expect: ATTN_STEP3_OK
      field: stdout
      semantic:
        intent: "단순 어텐션 3단계 중간값을 정답지와 대조"
        success_criteria: ["점수 6개 일치", "가중치 합 1.0", "z2 일치"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 전체 행렬화 + 루프 대조 (벡터화 검증)

      쿼리 6개를 for 루프로 도는 대신 행렬 연산 한 번으로 처리하고, **두 버전이 같은 답**을
      내는지 검증한다.

      ## 💡 이것이 "벡터화 검증"의 표준 패턴
      느리지만 명백한 구현(루프)을 먼저 만들고, 빠른 구현(행렬)이 같은 답을 내는지 대조한다.
      **빠른 구현을 검증할 대상이 없으면 틀려도 모른다.** W03 의 "원-핫 행렬곱 vs 조회"와 같은
      구조이며 W05 인과 마스크에서 다시 쓴다.

      ## ⚠️ `dim=-1` 이 왜 중요한가
      `scores` 의 i행은 "i번째 토큰이 각 토큰을 얼마나 보는가"이므로 **행마다** 합이 1이어야
      한다. `dim=0` 으로 잘못 주면 열 합이 1이 되어 의미가 완전히 달라지는데, **shape 는 똑같이
      나와서 오류 없이 조용히 틀린다.** 그래서 "각 행 합이 1인지"를 검증 항목에 넣는다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 6개 쿼리 전부를 행렬 연산 한 번으로 처리하고,
             그 결과가 이중 for 루프 구현과 같은지 검증한다

      [할 일]
       1. 느린 기준 구현 — 이중 for 루프로 6×6 점수 행렬을 채운다
          loop[i][j] = inputs[i] 와 inputs[j] 의 내적
       2. 빠른 구현 — 행렬곱 한 번으로 같은 6×6 점수 행렬을 만든다
       3. 두 행렬이 allclose 인지 출력한다: LOOP_EQ_MATMUL <True/False>
       4. 점수 행렬에 softmax 를 적용해 가중치를 만들고,
          각 행의 합이 전부 1인지 출력한다: ROWSUM_1 <True/False>
       5. 가중치로 입력을 가중합해 문맥 행렬을 만들고, 두 번째 행을 출력한다
          ROW2 <소수 4자리 리스트>
       6. LOOP_EQ_MATMUL 이 True 이고 ROW2 가 [0.4419, 0.6515, 0.5683] 이면
          MATRIX_ATTN_OK, 아니면 NG 를 출력한다

      [제약]
       - 루프 구현을 생략하지 말 것. 행렬 구현만 만들면 검증할 기준이 없어진다
       - softmax 는 마지막 차원 기준으로 적용할 것 (행마다 합이 1이어야 한다)
       - 행 합 검사를 "눈으로 봤다"로 대체하지 말 것. allclose 로 판정할 것

      [검증] 세 줄을 모두 출력하고, ROW2 가 1단계의 Z2 와 같은 값인지 대조해 보일 것.
             그리고 softmax 를 행이 아니라 열 기준으로 걸면 무엇이 잘못되는지 한 문장으로 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      loop = torch.empty(6, 6)
      for i, a in enumerate(inputs):
          for j, b in enumerate(inputs): loop[i, j] = torch.dot(a, b)
      mat = inputs @ inputs.T
      w = torch.softmax(mat, dim=-1); ctx = w @ inputs
      print('LOOP_EQ_MATMUL', torch.allclose(loop, mat))
      print('ROWSUM_1', torch.allclose(w.sum(dim=-1), torch.ones(6)))
      print('ROW2', [round(v,4) for v in ctx[1].tolist()])
      print('MATRIX_ATTN_OK' if torch.allclose(loop, mat) and [round(v,4) for v in ctx[1].tolist()]==[0.4419,0.6515,0.5683] else 'NG')"
      ```
      ## ✅ 합격 기준
      `LOOP_EQ_MATMUL True`, `ROWSUM_1 True`, `ROW2 [0.4419, 0.6515, 0.5683]`, `MATRIX_ATTN_OK`.

      ## 🔍 에이전트 판정 포인트
      **`dim` 을 잘못 주면 에러 없이 조용히 틀린다.** softmax 를 행이 아니라 열 기준으로 걸어도
      shape 는 `(6, 6)` 그대로다. 실측하면 이렇게 나온다.
      ```
      shape 동일: (6, 6)
      행 합: [0.922, 1.297, 1.2788, 0.7974, 0.754, 0.9508]   ← 1 이 아니다
      ROW2 : [0.5595, 0.7824, 0.6953]                        ← 1단계 Z2 와 다르다
      ```
      `scores` 의 i행은 "i번째 토큰이 각 토큰을 얼마나 보는가"이므로 **행마다** 합이 1이어야
      한다. 열 합이 1이 되면 "각 토큰이 얼마나 주목받는가"라는 **완전히 다른 의미**가 된다.
      그래서 `ROWSUM_1` 을 검증 항목에 별도로 넣었다 — 이것이 없으면 틀린 값이 통과한다.

      **루프 구현을 생략하는지 보라.** 에이전트는 "행렬로 하면 되는데 왜 루프까지?"라며 루프를
      건너뛰고 행렬 구현만 내놓는 경우가 많다. 그러면 **빠른 구현을 검증할 대상이 사라진다.**
      느리지만 명백한 구현을 기준으로 삼는 것이 벡터화 검증의 표준 패턴이고, W03 의
      "원-핫 행렬곱 vs 조회"와 같은 구조이며 W05 인과 마스크에서 다시 쓴다.

      **ROW2 가 1단계 Z2 와 같은지 반드시 대조하라.** 두 단계를 잇는 유일한 고리다.
    hint: '행렬 버전 2번째 행이 1단계의 z2 와 같아야 한다 — 다르면 dim 을 의심하라'
    answer: |
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      loop = torch.empty(6, 6)
      for i, a in enumerate(inputs):
          for j, b in enumerate(inputs): loop[i, j] = torch.dot(a, b)
      mat = inputs @ inputs.T
      w = torch.softmax(mat, dim=-1); ctx = w @ inputs
      print('LOOP_EQ_MATMUL', torch.allclose(loop, mat))
