      ```text
      [목표] SelfAttention_v2 의 가중치를 SelfAttention_v1 에 옮겨 심고,
             두 구현의 출력이 같아지는지 확인한다

      [할 일]
       1. torch.manual_seed(789) 를 호출한다
       2. SelfAttention_v2(3, 2) 와 SelfAttention_v1(3, 2) 를 각각 만든다
       3. v2 의 W_query / W_key / W_value 가중치를 v1 의 대응 파라미터에 옮겨 심는다
       4. 같은 inputs 를 두 모델에 통과시켜 출력이 allclose 인지 출력한다
          TRANSFER_ALLCLOSE <True/False>
       5. True 면 TRANSPOSE_OK, 아니면 NG 를 출력한다

      [제약]
       - 가중치를 "그대로" 복사하면 안 된다. 두 구현은 가중치를 저장하는 방향이 다르다.
         무엇을 어떻게 맞춰야 하는지는 알려주지 않는다 — shape 를 직접 찍어 보고 판단할 것
       - 값을 억지로 맞추려고 forward 를 고치지 말 것. 고쳐야 할 것은 이식 방법뿐이다
       - allclose 의 tolerance 를 키워서 통과시키지 말 것

      [검증] v1 과 v2 의 가중치 shape 를 각각 출력해 보이고,
             왜 그 처리가 필요했는지 shape 를 근거로 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      from attention_v1v2 import SelfAttention_v1, SelfAttention_v2
      torch.manual_seed(789)
      sa2 = SelfAttention_v2(3, 2)
      sa1b = SelfAttention_v1(3, 2)
      sa1b.W_query.data = sa2.W_query.weight.T
      sa1b.W_key.data   = sa2.W_key.weight.T
      sa1b.W_value.data = sa2.W_value.weight.T
      same = torch.allclose(sa1b(inputs), sa2(inputs))
      print('TRANSFER_ALLCLOSE', same)
      print('TRANSPOSE_OK' if same else 'NG')"
      ```
      ## ✅ 합격 기준
      `TRANSFER_ALLCLOSE True` 와 `TRANSPOSE_OK`.

      ## 🔍 에이전트 판정 포인트
      **`.T` 를 빼면 이렇게 죽는다.** 직접 돌려 보라 — 왜 필요한지 몸으로 알게 된다.
      ```
      v1 W_query shape:        (3, 2)
      v2 W_query.weight shape: (2, 3)
      RuntimeError: mat1 and mat2 shapes cannot be multiplied (6x3 and 2x3)
      ```
      `nn.Linear` 는 가중치를 **(출력차원, 입력차원)** 으로 저장한다. `nn.Parameter` 쪽은
      **(입력차원, 출력차원)** 이다. 그래서 이식에 전치가 필요하다.

      **여기서 에이전트가 무엇을 고치는지가 이 단계의 진짜 시험이다.** 셋 다 에러를 없애지만
      하나만 정답이다.

      | 에이전트의 반응 | 판정 |
      |---|---|
      | 이식할 때 `.T` 를 붙인다 | ✅ 정답 |
      | v1 의 `forward` 를 `W_query @ x` 로 뒤집는다 | ❌ 4단계 정답지 `[0.3061, 0.821]` 이 깨진다 |
      | v1 의 파라미터 shape 를 `(d_out, d_in)` 으로 바꾼다 | ❌ v1 이 v1 이 아니게 된다 |

      두 번째·세 번째는 **"에러를 없앴다"는 점에서는 성공**이라 에이전트가 자신 있게 보고한다.
      4단계 값이 그대로인지 되짚어야 걸린다. **한 곳을 고쳐 다른 곳을 깨뜨렸는지 확인하는 것**이
      에이전트 감독의 핵심 기술이다.

      **`allclose` 의 tolerance 를 키워 통과시키는 것도 흔한 우회다.** `atol=1e-1` 이면 거의
      아무 두 텐서나 통과한다. 기본 tolerance 로 통과해야 한다.

      ## 🔗 이 문제는 10주차에서 회수된다
      OpenAI 의 GPT-2 공식 가중치는 TensorFlow 규약 `(입력, 출력)` 으로 저장돼 있어 PyTorch
      `nn.Linear` 에 넣을 때 **똑같은 전치**가 필요하다. 오늘 이해하지 않으면 6주 뒤에
      shape 오류로 다시 만난다.
