  - order: 4
    instruction: |
      ## 🎯 미션 — Q/K/V 도입: SelfAttention_v1 (정답지 [0.3061, 0.8210])

      이제 학습 가능한 W_q, W_k, W_v 를 도입한다. 각 토큰을 **쿼리(질문) / 키(색인) /
      값(내용물)** 세 역할로 투영한다.

      ## 💡 검색 엔진 비유
      검색어(**쿼리**)를 넣으면 엔진이 문서 **제목**(키)들과 비교해 점수를 매기고, 점수 높은
      문서의 **본문**(값)을 가져온다. 세 역할이 다르기 때문에 세 개의 행렬이 필요하다.

      ## ⚠️ 시드 호출 위치가 결과를 결정한다
      `torch.manual_seed(123)` 은 **인스턴스 생성 직전**에 호출해야 한다. 다른 위치에 두면
      난수 소비 순서가 달라져 정답지와 다른 값이 나온다.

      ## 💻 실행 명령
      먼저 `week04/attention_v1v2.py` 에 `SelfAttention_v1`(nn.Parameter 방식)을 만든 뒤:
      ```bash
      docker exec -w /work/week04 llm-lab python3 -c "
      import torch
      from inputs import inputs
      from attention_v1v2 import SelfAttention_v1
      torch.manual_seed(123)
      sa1 = SelfAttention_v1(3, 2)
      out1 = sa1(inputs)
      print('V1_OUT'); print(out1)
      print('V1_ROW2', [round(v,4) for v in out1[1].tolist()])
      print('SA_V1_OK' if [round(v,4) for v in out1[1].tolist()]==[0.3061,0.8210] else 'NG')"
      ```
      ## ✅ 합격 기준
      두 번째 행이 **`[0.3061, 0.821]`** 이고 `SA_V1_OK`.
      다르면 시드 위치 또는 forward 구조(스케일링 `/ d_k**0.5` 포함 여부)를 확인한다.
    hint: 'forward 에서 scores 를 d_k**0.5 로 나눴는지 확인하라 — 이 한 줄이 값을 바꾼다'
