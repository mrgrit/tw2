  - order: 8
    instruction: |
      ## 🎯 미션 — 외부 노출 포트 감사: UFW가 못 막는 것

      **"UFW가 켜져 있으니 안전하다"는 이 장비에서 거짓이다.** Docker는 iptables의 `DOCKER`
      체인에 직접 규칙을 넣어 UFW의 `INPUT` 체인을 **우회**한다. `docker run -p 8080:8080` 으로
      띄운 서비스는 UFW가 `deny` 여도 외부에서 접속된다.

      ## 💡 무엇을 보는가
      `ss -tln` 의 4번째 열이 **로컬 청취 주소**다. 여기서
      - `127.0.0.1:PORT` / `[::1]:PORT` → 루프백 전용. 외부에서 못 붙는다. **안전.**
      - `0.0.0.0:PORT` / `*:PORT` / `[::]:PORT` → **모든 인터페이스**. 외부 노출.

      13주차에서 쓰는 **Ollama** 는 기본값이 `0.0.0.0:11434` 라 전 인터페이스에 열린다.

      ## 💻 실행 명령
      ```bash
      ss -tln | awk 'NR>1{print $4}' | grep -Ev '^(127\.|\[::1\])' | sort -u
      ss -tln | awk 'NR>1{print $4}' | grep -Ev '^(127\.|\[::1\])' | sort -u | wc -l | awk '{print "PORT_AUDIT_OK_"$1"_external"}'
      ```
      ## ✅ 합격 기준
      외부 바인딩 목록이 출력되고 `PORT_AUDIT_OK_<개수>_external` 이 찍힌다.
      목록에 있는 포트 하나하나에 대해 "이게 밖에 열려 있어야 하는가"를 스스로 답할 수 있어야 한다.
      불필요하면 `-p 127.0.0.1:PORT:PORT` 처럼 루프백에 바인딩한다.
    hint: 'ss -tlnp 로 실행하면 어느 프로세스가 그 포트를 잡고 있는지까지 나온다(root 권한 필요)'
    answer: |
      ss -tln | awk 'NR>1{print $4}' | grep -Ev '^(127\.|\[::1\])' | sort -u
      ss -tln | awk 'NR>1{print $4}' | grep -Ev '^(127\.|\[::1\])' | sort -u | wc -l | awk '{print "PORT_AUDIT_OK_"$1"_external"}'
    answer_detail: "방화벽 정책이 아니라 실제 청취 주소를 보는 것이 진짜 감사다. UFW status 는 '규칙'을 보여주고 ss 는 '사실'을 보여준다. 둘이 어긋나는 대표 사례가 Docker 퍼블리시 포트다."
    verify:
      type: output_contains
      expect: PORT_AUDIT_OK
      field: stdout
      semantic:
        intent: "실제 청취 주소 기준 외부 노출 감사 — UFW 우회 사실 확인"
        success_criteria: ["ss 로 청취 주소 확인", "루프백/전 인터페이스 구분"]

