lab_id: llm-from-scratch-week01
title: "W01 — 나의 AI 슈퍼컴퓨터 개통: 장비 파악·하드닝·골든 컨테이너·스모크 테스트"
version: ai
course: llm-from-scratch
week: 1
description: |
  DGX Spark(GB10 / aarch64 / CUDA 13 / 통합 메모리 128GB)를 개통한다. 장비 사양을 증거와 함께
  문서화하고, 최소 하드닝 상태를 점검하며, 골든 이미지 llm-course:v1 로 llm-lab 컨테이너를 띄워
  torch.cuda.is_available() == True 를 증명한다. 마지막으로 교재 2장 노트북 스모크 테스트를 돌려
  "의도된 실패 1개를 제외한 무결 실행"을 확인한다. 모든 실습 코드는 llm-lab 컨테이너 안에서 돈다.
difficulty: easy
duration_minutes: 120
audience: LLM 밑바닥 구현 입문 (1주차)
prerequisites:
  - DGX Spark 호스트 SSH 접속 가능 (작업용·비상용 세션 2개 확보)
  - 코딩 에이전트 CLI 사용 가능 (Claude Code 등)
  - 골든 이미지 `llm-course:v1` 빌드 완료 — 제작 절차는 W01 강의 **부록 A** 전문 공개
    (정본 `_golden-image/Dockerfile.llm-course-v1` + `bash build.sh`, 조교용 상세 `_GOLDEN-IMAGE.md`)
  - 교재 저장소 clone — `https://github.com/rickiepark/llm-from-scratch`
  - W01 강의안 정독 — 프롬프트 5원칙, 위험 작업 3요소, 계층별 GPU 진단
objectives:
  - "LC_ALL=C 를 붙여 한국어 로케일 함정을 피하고 aarch64 를 확인한다"
  - "GB10 GPU·드라이버·통합 메모리를 증거 명령으로 확인한다"
  - "골든 이미지와 llm-lab 컨테이너에서 CUDA 가용성을 증명한다"
  - "볼륨 마운트가 실제로 호스트에 파일을 남기는지 확인한다"
  - "SSH 패스워드 인증 상태와 외부 노출 포트를 조회 전용으로 점검한다"
  - "Docker 퍼블리시 포트가 UFW 를 우회한다는 사실을 실측으로 확인한다"
  - "ch02 노트북 스모크 테스트에서 '의도된 오류 1개'를 판정 기준으로 삼는다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 아키텍처 확인 (한국어 로케일 함정 통과)

      이 장비는 ARM 64비트(`aarch64`)다. 인터넷 설치 가이드 대부분은 x86_64 기준이라 그대로 따라
      하면 실패한다. 앞으로의 모든 트러블슈팅은 "내 환경이 무엇인가"에서 출발한다.

      ## 💡 왜 `LC_ALL=C` 인가
      이 장비는 한국어 로케일이라 `lscpu` 의 필드명이 **한글**로 나온다. 그래서
      `lscpu | grep Architecture` 는 **아무것도 출력하지 않는다**. `LC_ALL=C` 는 그 명령 한 번만
      로케일을 C(영어)로 강제하는 환경변수 prefix다. 에이전트에게 조회를 시킬 때 이걸 제약으로
      명시해야 한다.

      ## 💻 실행 명령
      ```bash
      LC_ALL=C lscpu | awk -F: '/^Architecture/{gsub(/ /,"",$2); print "ARCH_"$2}'
      ```
      ## ✅ 합격 기준
      `ARCH_aarch64` 가 출력된다. `x86_64` 가 나오면 접속한 장비가 다른 것이니 조교에게 문의한다.
    hint: 'LC_ALL=C 없이 실행해 보고 출력이 사라지는 것을 먼저 확인해 보라'
    answer: |
      LC_ALL=C lscpu | awk -F: '/^Architecture/{gsub(/ /,"",$2); print "ARCH_"$2}'
    answer_detail: "aarch64 는 ARM 64비트다. 이 한 줄이 '왜 pip 설치가 실패하는가'의 근거가 되고, 호스트 대신 컨테이너에서만 작업하는 이유가 된다. LC_ALL=C 는 로케일 의존 출력에 대한 표준 방어책."
    verify:
      type: output_contains
      expect: ARCH_aarch64
      field: stdout
      semantic:
        intent: "장비 아키텍처를 로케일 함정 없이 확인 — 환경 파악의 출발점"
        success_criteria: ["LC_ALL=C 사용", "aarch64 확인"]

  - order: 2
    instruction: |
      ## 🎯 미션 — GPU 모델명과 드라이버 확인

      `NVIDIA GB10`(Grace Blackwell)은 CUDA 13 세대다. 오래된 PyTorch 빌드는 이 GPU를 아예
      인식하지 못한다. 그래서 이 수업은 CUDA 13 런타임 기반 골든 이미지를 쓴다.

      ## 💡 처음 나오는 도구 — nvidia-smi
      NVIDIA System Management Interface. GPU 상태를 조회·모니터링하는 표준 도구다.
      `--query-gpu=name,driver_version --format=csv,noheader` 는 표 전체가 아니라 필요한 필드만
      CSV 한 줄로 뽑는 옵션이다(스크립트에서 파싱하기 좋다).

      ## 💻 실행 명령
      ```bash
      nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      nvidia-smi --query-gpu=name --format=csv,noheader | grep -q "GB10" && echo "GPU_GB10_OK"
      ```
      ## ✅ 합격 기준
      모델명에 `NVIDIA GB10` 이 보이고 `GPU_GB10_OK` 가 출력된다.
    hint: 'nvidia-smi 가 없다면 드라이버 미설치 — 호스트 계층에서 이미 끊긴 것이다'
    answer: |
      nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      nvidia-smi --query-gpu=name --format=csv,noheader | grep -q "GB10" && echo "GPU_GB10_OK"
    answer_detail: "호스트에서 nvidia-smi 가 도는 것은 GPU 진단 4계층 중 ①번이다. 여기가 되어야 ②docker --gpus all → ③컨테이너 안 nvidia-smi → ④torch CUDA 빌드로 진행할 수 있다."
    verify:
      type: output_contains
      expect: GPU_GB10_OK
      field: stdout
      semantic:
        intent: "호스트 계층에서 GPU 인식 확인 — 계층 진단의 1단계"
        success_criteria: ["nvidia-smi 동작", "GB10 확인"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 통합 메모리 확인

      일반 그래픽카드는 VRAM이 따로 있고 넘치면 즉시 OOM이다. Spark는 **통합 메모리**라 CPU와
      GPU가 같은 128GB 풀을 공유한다. 커널·펌웨어 예약분 때문에 `free -g` 로는 119GiB 내외로
      보인다 — 정상이다.

      ## 💡 왜 이 숫자를 지금 재는가
      9주차에서 "모델을 올리는 메모리"와 "모델을 훈련하는 메모리"가 전혀 다르다는 것을 계산으로
      확인한다. 훈련에는 가중치 + 기울기 + 옵티마이저 모멘텀 2벌 + 활성값이 모두 필요하다.
      그 계산의 분모가 지금 재는 이 값이다.

      ## 💻 실행 명령
      ```bash
      LC_ALL=C free -g | awk '/^Mem:/{ if ($2>=100) print "UNIFIED_MEM_OK_"$2"GiB"; else print "MEM_LOW_"$2 }'
      ```
      ## ✅ 합격 기준
      `UNIFIED_MEM_OK_119GiB` 형태로 출력된다(정확한 숫자는 장비마다 ±수 GiB 다를 수 있다).
    hint: 'free 의 출력도 한국어 로케일이면 Mem: 대신 다른 라벨일 수 있다 — LC_ALL=C 를 붙였다'
    answer: |
      LC_ALL=C free -g | awk '/^Mem:/{ if ($2>=100) print "UNIFIED_MEM_OK_"$2"GiB"; else print "MEM_LOW_"$2 }'
    answer_detail: "통합 메모리 100GiB 이상이면 통과. 이 값이 후반부(GPT-2 355M 지시 튜닝, LoRA 비교)에서 큰 모델을 한 대에서 다룰 수 있는 근거가 된다."
    verify:
      type: output_contains
      expect: UNIFIED_MEM_OK
      field: stdout
      semantic:
        intent: "통합 메모리 총량 확인 — 후반부 모델 크기 계획의 근거"
        success_criteria: ["free 로 총량 확인", "100GiB 이상"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 골든 이미지 존재 확인

      교재 실습은 **전원이 같은 컨테이너 이미지**에서 돈다. "제 환경에선 되는데요"를 원천 차단하기
      위해서다.

      ## 💡 골든 이미지 `llm-course:v1` 구성
      | 계층 | 내용 | 왜 |
      |---|---|---|
      | 베이스 | `nvidia/cuda:13.0.1-runtime-ubuntu24.04` | GB10(CUDA 13) 인식 |
      | PyTorch | `torch 2.9.1+cu130` | cu130 빌드여야 CUDA가 켜진다 |
      | 실습 패키지 | tiktoken / matplotlib / pandas / pytest | 2·4·6·9주차 필수 |
      | 한글 폰트 | fonts-nanum + MATPLOTLIBRC | 없으면 그래프 한글 라벨이 전부 `□` |

      ## 💻 실행 명령
      ```bash
      docker images llm-course:v1 --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      docker images llm-course:v1 --format '{{.Repository}}:{{.Tag}}' | grep -q 'llm-course:v1' && echo "IMAGE_OK"
      ```
      ## ✅ 합격 기준
      `llm-course:v1` 과 `IMAGE_OK` (크기 8.06GB 내외)가 출력된다.

      ## 🔧 이미지가 없다면 — 직접 굽는다
      제작 절차는 감춰져 있지 않다. **W01 강의 부록 A** 에 Dockerfile 전문·근거·수락 시험까지
      공개돼 있다. 정본 파일은 트랙 폴더의 `_golden-image/` 다.
      ```bash
      cd _golden-image && bash build.sh    # 사전조건 검사 → 빌드(약 3분) → 수락 시험
      ```
      `SMOKE_OK` 가 나오면 합격이다. 사전조건 중 **컨테이너 GPU 패스스루**
      (`docker run --rm --gpus all nvidia/cuda:13.0.1-runtime-ubuntu24.04 nvidia-smi -L`)
      가 먼저다 — 여기가 깨져 있으면 빌드는 성공하고 실행만 실패한다.
    hint: 'docker images 에 아무것도 안 나오면 아직 빌드 전이다 — 강의 부록 A 의 build.sh 로 직접 구울 수 있다'
    answer: |
      docker images llm-course:v1 --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      docker images llm-course:v1 --format '{{.Repository}}:{{.Tag}}' | grep -q 'llm-course:v1' && echo "IMAGE_OK"
    answer_detail: "골든 이미지는 이 수업의 재현성 기반이다. 한글 폰트 한 줄이 이미지에 들어간 이유는 4·6·9주차 그래프의 한글 라벨이 깨지기 때문 — '돌려보고 나서야 아는 환경 결함'의 전형이다."
    verify:
      type: output_contains
      expect: IMAGE_OK
      field: stdout
      semantic:
        intent: "수업 표준 컨테이너 이미지 확보 확인"
        success_criteria: ["llm-course:v1 존재", "이미지 크기 확인"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 컨테이너에서 CUDA 가용성 증명

      "GPU가 있다"와 "PyTorch가 GPU를 쓸 수 있다"는 **다른 문제**다. 드라이버·컨테이너 런타임·
      PyTorch 빌드가 전부 맞아야 `True` 가 나온다.

      ## 💡 컨테이너 실행 옵션
      ```bash
      docker run -d --name llm-lab --gpus all --ipc=host \
        -v ~/work:/work -v ~/textbook:/textbook llm-course:v1 sleep infinity
      ```
      - `--gpus all` 없으면 컨테이너 안 `nvidia-smi` 부터 실패한다.
      - `--ipc=host` 없으면 3주차 이후 `num_workers>0` DataLoader 에서 `Bus error` 가 난다.

      ## ⚠️ 정상인데 무섭게 생긴 경고
      `UserWarning: Found GPU0 NVIDIA GB10 which is of cuda capability 12.1. ... supported ...
      is (8.0) - (12.0)` — GB10의 compute capability가 PyTorch가 적어둔 상한보다 높아서 나온다.
      **동작은 정상이다.** 이걸 보고 에이전트가 "PyTorch를 다운그레이드하겠습니다"라고 하면 막아라.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import torch
      print('TORCH_' + torch.__version__)
      print('CUDA_OK' if torch.cuda.is_available() else 'CUDA_NG')
      print('DEV_' + torch.cuda.get_device_name(0).replace(' ','_'))
      "
      ```
      ## ✅ 합격 기준
      `TORCH_2.9.1+cu130` / `CUDA_OK` / `DEV_NVIDIA_GB10` 세 줄이 출력된다.
    hint: 'CUDA_NG 가 나오면 ①호스트 nvidia-smi ②--gpus all ③컨테이너 안 nvidia-smi ④torch.version.cuda 순으로 계층 진단'
    answer: |
      docker exec llm-lab python3 -c "
      import torch
      print('TORCH_' + torch.__version__)
      print('CUDA_OK' if torch.cuda.is_available() else 'CUDA_NG')
      print('DEV_' + torch.cuda.get_device_name(0).replace(' ','_'))
      "
    answer_detail: "torch.cuda.is_available() == True 하나로 4계층이 모두 통과했음이 증명된다. False 일 때는 고치지 말고 어느 계층에서 끊겼는지부터 찾는 것이 V1-3 의 핵심."
    verify:
      type: output_contains
      expect: CUDA_OK
      field: stdout
      semantic:
        intent: "컨테이너 안 PyTorch 가 GPU 를 실제로 쓸 수 있는지 증명"
        success_criteria: ["torch 버전 cu130", "is_available True", "GB10 장치명"]

  - order: 6
    instruction: |
      ## 🎯 미션 — 볼륨 마운트 지속성 확인

      컨테이너 안에서 만든 파일이 **호스트에 실제로 남는지** 확인한다. 마운트가 없으면 한 학기
      산출물이 `docker rm` 한 번에 사라진다.

      ## 💡 왜 이 확인이 필요한가
      "컨테이너 안에서 작업했으니 안전하다"는 흔한 오해다. 컨테이너의 쓰기 계층은 컨테이너를 지우면
      같이 사라진다. `-v ~/work:/work` 로 호스트 디렉토리를 겹쳐 놓아야 살아남는다. 이 실습에서
      쓰는 경로는 컨테이너 `/work` ↔ 호스트 `~/work` 다(마운트 소스는 본인 설정에 맞춰 바꾼다).

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab sh -c 'mkdir -p /work/week01 && echo persist-check > /work/week01/.mount_probe'
      test -f ~/work/week01/.mount_probe && echo "MOUNT_PERSIST_OK" && rm -f ~/work/week01/.mount_probe
      ```
      ## ✅ 합격 기준
      `MOUNT_PERSIST_OK` 가 출력된다. 안 나오면 `docker inspect llm-lab --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}'` 로 실제 마운트를 확인한다.
    hint: 'docker inspect 로 Source -> Destination 을 직접 확인하는 것이 가장 빠르다'
    answer: |
      docker exec llm-lab sh -c 'mkdir -p /work/week01 && echo persist-check > /work/week01/.mount_probe'
      test -f ~/work/week01/.mount_probe && echo "MOUNT_PERSIST_OK" && rm -f ~/work/week01/.mount_probe
    answer_detail: "컨테이너에서 쓴 파일이 호스트 경로에 보이면 마운트가 살아 있다. 이 확인 없이 한 학기를 진행하면 어느 날 산출물이 통째로 사라진다."
    verify:
      type: output_contains
      expect: MOUNT_PERSIST_OK
      field: stdout
      semantic:
        intent: "볼륨 마운트로 작업 산출물이 호스트에 보존되는지 확인"
        success_criteria: ["컨테이너에서 파일 생성", "호스트에서 동일 파일 확인"]

  - order: 7
    instruction: |
      ## 🎯 미션 — SSH 인증 상태 점검 (조회 전용)

      하드닝은 "했다"가 아니라 "증명 가능하다"가 기준이다. 이 단계는 **현재 상태를 읽기만** 한다.

      ## ⚠️ 이 단계에서 절대 하지 않는 것
      `PasswordAuthentication no` 로 **바꾸지 않는다.** 원격 접속 중에 이 설정을 잘못 바꾸면
      자기 장비에서 잠긴다(lockout). 변경은 반드시 ① 설정 백업 ② 키 로그인이 실제로 되는지 확인
      ③ `sshd -t` 문법 검사 통과 — 3단계를 거친 뒤, **비상용 SSH 세션을 열어둔 채로** 한다.

      ## 💡 처음 나오는 명령 — `sshd -T`
      sshd 의 **최종 유효 설정**을 전부 출력한다(`-t` 는 문법 검사, `-T` 는 설정 덤프로 다르다).
