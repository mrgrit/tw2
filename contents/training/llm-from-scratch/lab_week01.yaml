lab_id: llm-from-scratch-week01
title: "W01 — 나의 AI 슈퍼컴퓨터 개통: 장비 파악·하드닝·골든 컨테이너·스모크 테스트"
version: ai
course: llm-from-scratch
week: 1
description: |
  DGX Spark(GB10 / aarch64 / CUDA 13 / 통합 메모리 128GB)를 개통한다. 장비 사양을 증거와 함께
  문서화하고, 최소 하드닝 상태를 점검하며, 골든 이미지 llm-course:v2 로 llm-lab 컨테이너를 띄워
  torch.cuda.is_available() == True 를 증명한다. 마지막으로 교재 2장 노트북 스모크 테스트를 돌려
  "의도된 실패 1개를 제외한 무결 실행"을 확인한다. 모든 실습 코드는 llm-lab 컨테이너 안에서 돈다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  이 과목은 **코드를 손으로 치지 않는다.** 각 단계에서 여러분이 하는 일은 둘이다.

  | 단계 | 여러분이 하는 일 |
  |---|---|
  | 🤖 **에이전트 프롬프트** | 이 블록을 **그대로 복사해 코딩 에이전트에 붙여넣는다** |
  | ✅ **합격 기준** | 에이전트가 낸 출력이 기준과 맞는지 **직접 판정한다** |

  ```bash
  # 에이전트 실행 (둘 중 편한 쪽)
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  에이전트가 다른 명령으로 같은 결과를 냈다면 그것도 정답이다 — **판정 기준은 명령이 아니라
  출력**이다.
difficulty: easy
duration_minutes: 120
audience: LLM 밑바닥 구현 입문 (1주차)
prerequisites:
  - DGX Spark 호스트 SSH 접속 가능 (작업용·비상용 세션 2개 확보)
  - 코딩 에이전트 CLI 사용 가능 (Claude Code 등)
  - 골든 이미지 `llm-course:v2` 빌드 완료 — 제작 절차는 W01 강의 **부록 A** 전문 공개
    (정본 `_golden-image/Dockerfile.llm-course-v2` + `bash build.sh`, 조교용 상세 `_GOLDEN-IMAGE.md`)
  - 교재 저장소 clone — `https://github.com/rickiepark/llm-from-scratch`
  - W01 강의안 정독 — 프롬프트 5원칙, 위험 작업 3요소, 계층별 GPU 진단
objectives:
  - "LC_ALL=C 를 붙여 한국어 로케일 함정을 피하고 aarch64 를 확인한다"
  - "GB10 GPU·드라이버·통합 메모리를 증거 명령으로 확인한다"
  - "골든 이미지와 llm-lab 컨테이너에서 CUDA 가용성을 증명한다"
  - "볼륨 마운트가 실제로 호스트에 파일을 남기는지 확인한다"
  - "SSH 패스워드 인증 상태와 외부 노출 포트를 조회 전용으로 점검한다"
  - "Docker 퍼블리시 포트가 UFW 를 우회한다는 사실을 실측으로 확인한다"
  - "ch02 노트북 스모크 테스트에서 '의도된 오류 1개'를 판정 기준으로 삼는다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 아키텍처 확인 (한국어 로케일 함정 통과)

      이 장비는 ARM 64비트(`aarch64`)다. 인터넷 설치 가이드 대부분은 x86_64 기준이라 그대로 따라
      하면 실패한다. 앞으로의 모든 트러블슈팅은 "내 환경이 무엇인가"에서 출발한다.

      ## 💡 왜 `LC_ALL=C` 인가
      이 장비는 한국어 로케일이라 `lscpu` 의 필드명이 **한글**로 나온다. 그래서
      `lscpu | grep Architecture` 는 **아무것도 출력하지 않는다**. `LC_ALL=C` 는 그 명령 한 번만
      로케일을 C(영어)로 강제하는 환경변수 prefix다. 에이전트에게 조회를 시킬 때 이걸 제약으로
      명시해야 한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 이 장비의 CPU 아키텍처를 확인한다
      [할 일]
       1. lscpu 로 Architecture 필드를 조회한다
       2. 결과를 ARCH_<값> 형식 한 줄로 출력한다 (예: ARCH_aarch64)
      [제약]
       - 조회만 한다. 시스템 설정을 바꾸는 명령은 쓰지 말 것
       - 이 장비는 한국어 로케일이라 lscpu 의 필드명이 한글로 나온다.
         조회 명령 앞에 LC_ALL=C 를 붙여 로케일을 강제할 것
      [검증] 실행한 명령 원문과 출력을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      LC_ALL=C lscpu | awk -F: '/^Architecture/{gsub(/ /,"",$2); print "ARCH_"$2}'
      ```
      ## ✅ 합격 기준
      `ARCH_aarch64` 가 출력된다. `x86_64` 가 나오면 접속한 장비가 다른 것이니 조교에게 문의한다.

      ## 🔍 에이전트 판정 포인트
      `LC_ALL=C` 를 빼먹으면 **출력이 아예 안 나온다.** 에이전트가 "Architecture 를 찾을 수
      없습니다"라고 하면 제약을 안 지킨 것이다. 프롬프트에 분명히 적혀 있는데도 빠뜨리는 일이
      흔하다 — 그것을 잡아내는 것이 이번 단계의 진짜 목적이다.
    hint: 'LC_ALL=C 없이 실행해 보고 출력이 사라지는 것을 먼저 확인해 보라'
    answer: |
      LC_ALL=C lscpu | awk -F: '/^Architecture/{gsub(/ /,"",$2); print "ARCH_"$2}'
    answer_detail: "aarch64 는 ARM 64비트다. 이 한 줄이 '왜 pip 설치가 실패하는가'의 근거가 되고, 호스트 대신 컨테이너에서만 작업하는 이유가 된다. LC_ALL=C 는 로케일 의존 출력에 대한 표준 방어책."
    verify:
      type: output_contains
      expect: ARCH_aarch64
      field: stdout
      semantic:
        intent: "장비 아키텍처를 로케일 함정 없이 확인 — 환경 파악의 출발점"
        success_criteria: ["LC_ALL=C 사용", "aarch64 확인"]

  - order: 2
    instruction: |
      ## 🎯 미션 — GPU 모델명과 드라이버 확인

      `NVIDIA GB10`(Grace Blackwell)은 CUDA 13 세대다. 오래된 PyTorch 빌드는 이 GPU를 아예
      인식하지 못한다. 그래서 이 수업은 CUDA 13 런타임 기반 골든 이미지를 쓴다.

      ## 💡 처음 나오는 도구 — nvidia-smi
      NVIDIA System Management Interface. GPU 상태를 조회·모니터링하는 표준 도구다.
      `--query-gpu=name,driver_version --format=csv,noheader` 는 표 전체가 아니라 필요한 필드만
      CSV 한 줄로 뽑는 옵션이다(스크립트에서 파싱하기 좋다).

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 이 호스트가 인식하는 GPU 모델명과 드라이버 버전을 확인한다
      [할 일]
       1. nvidia-smi 로 GPU 이름과 드라이버 버전을 한 줄로 조회한다
          (표 전체를 뽑지 말고 필요한 필드만 CSV 로 뽑을 것)
       2. 모델명에 GB10 이 포함되면 GPU_GB10_OK 를 출력한다
      [제약] 조회만 한다. 드라이버를 설치·변경하지 말 것
      [검증] 조회 결과 원문과 판정 문자열을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      nvidia-smi --query-gpu=name --format=csv,noheader | grep -q "GB10" && echo "GPU_GB10_OK"
      ```
      ## ✅ 합격 기준
      모델명에 `NVIDIA GB10` 이 보이고 `GPU_GB10_OK` 가 출력된다.

      ## 🔍 에이전트 판정 포인트
      `nvidia-smi` 를 그냥 실행해 **표 전체를 붙여 놓고 "GB10 이 보입니다"** 라고 보고하는
      경우가 있다. 그것도 사실이긴 하지만, 판정 문자열이 없으면 **기계가 채점할 수 없다.**
      "무엇이 출력되면 통과인가"를 프롬프트가 지정해야 하는 이유다.
    hint: 'nvidia-smi 가 없다면 드라이버 미설치 — 호스트 계층에서 이미 끊긴 것이다'
    answer: |
      nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      nvidia-smi --query-gpu=name --format=csv,noheader | grep -q "GB10" && echo "GPU_GB10_OK"
    answer_detail: "호스트에서 nvidia-smi 가 도는 것은 GPU 진단 4계층 중 ①번이다. 여기가 되어야 ②docker --gpus all → ③컨테이너 안 nvidia-smi → ④torch CUDA 빌드로 진행할 수 있다."
    verify:
      type: output_contains
      expect: GPU_GB10_OK
      field: stdout
      semantic:
        intent: "호스트 계층에서 GPU 인식 확인 — 계층 진단의 1단계"
        success_criteria: ["nvidia-smi 동작", "GB10 확인"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 통합 메모리 확인

      일반 그래픽카드는 VRAM이 따로 있고 넘치면 즉시 OOM이다. Spark는 **통합 메모리**라 CPU와
      GPU가 같은 128GB 풀을 공유한다. 커널·펌웨어 예약분 때문에 `free -g` 로는 119GiB 내외로
      보인다 — 정상이다.

      ## 💡 왜 이 숫자를 지금 재는가
      9주차에서 "모델을 올리는 메모리"와 "모델을 훈련하는 메모리"가 전혀 다르다는 것을 계산으로
      확인한다. 훈련에는 가중치 + 기울기 + 옵티마이저 모멘텀 2벌 + 활성값이 모두 필요하다.
      그 계산의 분모가 지금 재는 이 값이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 이 장비의 총 메모리(통합 메모리) 크기를 GiB 단위로 확인한다
      [할 일]
       1. free 로 총 메모리를 GiB 단위로 조회한다
       2. 100GiB 이상이면 UNIFIED_MEM_OK_<값>GiB 를, 미만이면 MEM_LOW_<값> 를 출력한다
      [제약]
       - 조회만 한다
       - 한국어 로케일이라 free 출력의 라벨도 한글일 수 있다. LC_ALL=C 를 붙일 것
      [검증] free 원본 출력과 판정 문자열을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      LC_ALL=C free -g | awk '/^Mem:/{ if ($2>=100) print "UNIFIED_MEM_OK_"$2"GiB"; else print "MEM_LOW_"$2 }'
      ```
      ## ✅ 합격 기준
      `UNIFIED_MEM_OK_119GiB` 형태로 출력된다(정확한 숫자는 장비마다 ±수 GiB 다를 수 있다).

      ## 🔍 에이전트 판정 포인트
      `nvidia-smi` 의 GPU 메모리 항목을 보고 답하려 드는 경우가 있다. **이 장비에서는 그
      항목이 `Not Supported` 로 나온다** — 통합 메모리라 GPU 전용 VRAM 이 따로 없기 때문이다.
      "일반 그래픽카드와 다르다"는 것을 여기서 처음 몸으로 만난다.
    hint: 'free 의 출력도 한국어 로케일이면 Mem: 대신 다른 라벨일 수 있다 — LC_ALL=C 를 붙였다'
    answer: |
      LC_ALL=C free -g | awk '/^Mem:/{ if ($2>=100) print "UNIFIED_MEM_OK_"$2"GiB"; else print "MEM_LOW_"$2 }'
    answer_detail: "통합 메모리 100GiB 이상이면 통과. 이 값이 후반부(GPT-2 355M 지시 튜닝, LoRA 비교)에서 큰 모델을 한 대에서 다룰 수 있는 근거가 된다."
    verify:
      type: output_contains
      expect: UNIFIED_MEM_OK
      field: stdout
      semantic:
        intent: "통합 메모리 총량 확인 — 후반부 모델 크기 계획의 근거"
        success_criteria: ["free 로 총량 확인", "100GiB 이상"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 골든 이미지 존재 확인

      교재 실습은 **전원이 같은 컨테이너 이미지**에서 돈다. "제 환경에선 되는데요"를 원천 차단하기
      위해서다.

      ## 💡 골든 이미지 `llm-course:v2` 구성
      | 계층 | 내용 | 왜 |
      |---|---|---|
      | 베이스 | `nvidia/cuda:13.0.1-runtime-ubuntu24.04` | GB10(CUDA 13) 인식 |
      | PyTorch | `torch 2.9.1+cu130` | cu130 빌드여야 CUDA가 켜진다 |
      | 실습 패키지 | tiktoken / matplotlib / pandas / pytest / numpy / requests / tqdm / jupyter | 2·4·6·9주차 필수 |
      | 가중치 이식 | safetensors / huggingface_hub | 10주차 OpenAI GPT-2 이식의 **필수** 경로 |
      | 한글 폰트 | fonts-nanum + MATPLOTLIBRC + 폰트 캐시 | 없으면 그래프 한글 라벨이 전부 `□` |
      | BPE 사전 | tiktoken gpt2 캐시 프리로드 | 폐쇄망이면 2주차가 첫 줄에서 멈춘다 |
      | 자체 검증 | `verify-env` 명령 | 배포 직후 한 줄로 11항목 확인 |

      **전 패키지 버전 고정**(`requirements.txt`). 이 수업의 통과 기준은 수치라(4,690 토큰 /
      163,009,536 파라미터 / test 95.67% ±1%p) 버전이 흔들리면 정답지가 무너진다.
      `transformers` 는 **일부러 뺐다** — 있으면 `from_pretrained()` 한 줄로 7~10주차가 무력화된다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 수업용 골든 이미지 llm-course:v2 가 이 호스트에 있는지 확인한다
      [할 일]
       1. docker images 로 llm-course:v2 의 이름과 크기를 출력한다
       2. 존재하면 IMAGE_OK 를 출력한다
      [제약]
       - 없다고 해서 임의로 빌드하거나 pull 하지 말 것. 존재 여부만 보고한다
       - 없으면 그 사실과 함께, 어떻게 만들 수 있는지 경로만 알려 줄 것
      [검증] docker images 출력 원문과 판정 문자열을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker images llm-course:v2 --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      docker images llm-course:v2 --format '{{.Repository}}:{{.Tag}}' | grep -q 'llm-course:v2' && echo "IMAGE_OK"
      ```
      ## ✅ 합격 기준
      `llm-course:v2` 과 `IMAGE_OK` (크기 8.11GB 내외)가 출력된다.

      ## 🔍 에이전트 판정 포인트
      `[제약] 임의로 빌드하지 말 것` 이 이 단계의 핵심이다. 이미지가 없으면 에이전트는
      **8GB 짜리 빌드를 말없이 시작한다.** 3분이 걸리고, 네트워크를 쓰고, 그 사이 학생은
      무슨 일이 벌어지는지 모른다. **"점검"과 "조치"를 분리하는 첫 연습**이다.

      ## 🔧 이미지가 없다면 — 직접 굽는다
      제작 절차는 감춰져 있지 않다. **W01 강의 부록 A** 에 Dockerfile 전문·근거·수락 시험까지
      공개돼 있다. 정본 파일은 트랙 폴더의 `_golden-image/` 다.
      ```bash
