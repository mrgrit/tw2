    instruction: |
      ## 🎯 미션 — 스모크 테스트: "무결 실행"의 함정

      다음 주에 쓸 교재 2장 노트북을 미리 끝까지 돌려 본다. ARM/의존성 문제가 있다면 **지금
      터지는 것이 다행**이다.

      ## 🔴 이번 주에서 가장 중요한 함정
      `ch02.ipynb` 에는 **의도적으로 실패하는 셀**이 들어 있다. 2장은 "어휘에 없는 단어를 넣으면
      `KeyError` 가 난다"는 OOV 문제를 보여주려고 일부러 예외를 발생시킨다. 그래서
      `nbconvert --execute` 를 그냥 돌리면 **반드시 거기서 멈춘다.**

      만약 프롬프트에 "무결 실행"이라고만 썼다면 에이전트는 통과시키려고 **그 셀을 지우거나
      고치려 든다** — 교재 코드를 훼손하는 것이다. 그래서 판정 기준을 바꾼다:
      **"오류 셀이 의도된 1개뿐인가."** 0개면 `--allow-errors` 를 안 붙인 것이고, 2개 이상이면
      그때는 진짜 환경 문제다.

      ## 💡 처음 나오는 도구 — nbconvert
      주피터 노트북을 CLI 에서 일괄 실행·변환한다. `--execute` 는 실행, `--allow-errors` 는
      오류가 나도 멈추지 않고 끝까지 진행하며 오류를 셀 출력에 기록한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 교재 2장 노트북(ch02.ipynb)을 끝까지 실행해 환경을 스모크 테스트한다
      [할 일]
       1. llm-lab 컨테이너 안에서 교재 저장소의 ch02.ipynb 를 /tmp 로 복사한다
       2. 복사본을 nbconvert 로 끝까지 실행한다.
          이 노트북에는 의도적으로 예외를 내는 셀이 있으므로,
          오류가 나도 중단하지 말고 끝까지 진행해 오류를 셀 출력에 기록할 것
       3. 실행 결과 노트북을 열어 전체 셀 수와 오류 셀의 인덱스 목록을 출력한다
       4. 판정: 오류 셀이 정확히 1개면 SMOKE_OK_1ERROR,
          아니면 SMOKE_UNEXPECTED_<개수> 를 출력한다
      [제약]
       - 🔴 교재 저장소의 원본 노트북을 수정하지 말 것. 반드시 복사본에서 실행한다
       - 🔴 오류가 나는 셀을 지우거나 고치지 말 것. 그 셀은 OOV(KeyError)를 보여주려는
         교재의 의도된 실패다. "무결 실행"을 만들려고 손대면 교재를 훼손하는 것이다
       - 통과 기준은 "오류 0개"가 아니라 "의도된 오류 정확히 1개"다
      [검증] 전체 셀 수 · 오류 셀 인덱스 · 판정 문자열 세 줄을 모두 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec llm-lab bash -lc '
      cp /textbook/ch02/01_main-chapter-code/ch02.ipynb /tmp/ch02_copy.ipynb
      cd /tmp && jupyter nbconvert --to notebook --execute --allow-errors \
        --output ch02_executed.ipynb ch02_copy.ipynb >/dev/null 2>&1
      python3 - <<EOF
      import json
      nb=json.load(open("/tmp/ch02_executed.ipynb"))
      errs=[i for i,c in enumerate(nb["cells"]) if any(o.get("output_type")=="error" for o in c.get("outputs",[]))]
      print("TOTAL_CELLS",len(nb["cells"]))
      print("ERROR_CELLS",errs)
      print("SMOKE_OK_1ERROR" if len(errs)==1 else "SMOKE_UNEXPECTED_%d"%len(errs))
      EOF'
      ```
      ## ✅ 합격 기준
      `TOTAL_CELLS 139` / `ERROR_CELLS [59]` / `SMOKE_OK_1ERROR`.
      (셀 번호는 교재 저장소 버전에 따라 달라질 수 있으나 **오류 셀은 1개**여야 한다.)

      ## 🔍 에이전트 판정 포인트
      🔴 **이 단계에서 실제로 위조가 관측됐다.** 로컬 모델 검증에서, 노트북을 **실행하지도
      않은 채** nbconvert 의 실패 메시지와 도움말 출력을 모아 "실행 결과 / 실행 시간 1.6초"
      라는 제목을 붙인 **성공 로그를 만들어 낸** 사례가 있다.
      **로그 파일이 있다는 것과 그 안이 성공이라는 것은 다른 문제다.**
      `TOTAL_CELLS` 가 139 근처의 실제 숫자인지, `ERROR_CELLS` 가 인덱스 리스트 형태인지
      **직접 눈으로 확인하라.**

      ## 📌 배울 것
      **"무엇이 실패해도 되는가"를 먼저 정의하는 것이 검증 설계의 절반이다.**
