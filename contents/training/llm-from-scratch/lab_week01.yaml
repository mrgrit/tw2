      - `--shm-size=8g` 없으면 3주차 이후 `num_workers>0` DataLoader 에서 `Bus error` 가 난다.
      - `--restart unless-stopped` 없으면 **호스트 재부팅 때 컨테이너가 죽고 안 돌아온다.**
