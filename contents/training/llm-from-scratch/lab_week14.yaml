      kinds = ' '.join(k for _, k in causes)
      print('CAUSES', len(causes), '| KINDS', kinds)
      for kind in ('기술', '일정', '협업'):
          print(f'  {kind}:', kinds.count(kind), '개')
      has_all = len(causes) == 5 and all(k in kinds for k in ('기술','일정','협업'))
      print('PREMORTEM_CAUSES_OK' if has_all else 'NG')"
    answer_detail: "사전 부검은 NASA·의료·소프트웨어 전반에서 쓰는 표준 기법이다. '실패했다고 가정'하는 것이 핵심 — 사람은 미래의 위험보다 과거의 원인을 훨씬 잘 찾아낸다."
    verify:
      type: output_contains
      expect: PREMORTEM_CAUSES_OK
      field: stdout
      semantic:
        intent: "사전 부검으로 실패 원인 5개를 세 분류에 걸쳐 발굴"
        success_criteria: ["원인 5개", "기술·일정·협업 각 1+", "구체적 서술"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 산출물이 **요구와 제약을 지켰는가** 검증

      에이전트의 산출물을 그대로 믿지 않는다. 프롬프트 문면과 대조한다.

      ## 💡 검사 항목
      | 항목 | 요구 출처 |
      |---|---|
      | 원인별 (조기 신호, 예방 조치) 표 5행, 빈 칸 없음 | 할 일 2 |
      | 원인 번호가 1~5 와 일치 | 할 일 1·2 연결 |
      | **"화요일"** 시점 명시 | 할 일 2 |
      | 성공 기준 **각각**을 비판 | 할 일 3 |
      | 측정 방법 누락을 **명시적으로** 지적 | 할 일 3 |
      | **대안 주제 제안 0건** | **[제약]** |

      ## 🔴 마지막 항목이 가장 자주 깨진다
      에이전트는 친절해서 "이런 주제는 어떠세요?"를 덧붙이려 한다. 제약을 명시해도 어긴다.
      **제약 준수 자체를 검증 항목으로 두어야 한다.**

      ## ⚠️ 검사자를 만들 때의 함정 (실제 사례)
      "대안 제안"을 찾으려고 `"대신 "` 이라는 단어를 검색하면
      `"ctx 를 1024 대신 64로 낮춘 소형 설정"` 같은 **정상 문장이 걸린다**.
      이것은 파라미터 변경이지 주제 전환이 아니다.
      **검사자도 검증해야 한다** — 다른 트랙 이름과 주제 전환 표현으로 좁혀야 정확하다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week14 llm-lab python3 check_premortem.py
      ```
      ## ✅ 합격 기준
      모든 검사 항목 `PASS` 와 최종 `W14-G1 판정: **PASS**`.
      특히 `[제약] 대안 주제 제안 없음` 이 `PASS` 여야 한다.
    hint: '검사자가 오탐(false positive)을 내면 검사자를 고쳐야 한다 — 테스트를 약화시키는 것과 다르다'
    answer: |
      docker exec -w /work/week14 llm-lab python3 check_premortem.py
    answer_detail: "실제로 이 검사자를 만들 때 '대신 '이라는 단순 키워드가 정상 문장을 오탐했다. 잘못 정의된 테스트를 정확하게 고치는 것은 테스트를 약화시키는 것과 다르다 — 그 구분이 W06 에서 배운 것이다."
    verify:
      type: output_contains
      expect: W14-G1
