  - order: 3
    instruction: |
      ## 🎯 미션 — 사전 부검: 실패를 미리 죽이기

      ## 🔴 에이전트에게 주제를 정하게 하면 안 된다
      "뭘 하면 좋을까?"라고 물으면 그럴듯하지만 팀 역량·자원과 무관한 답이 온다.
      그리고 그 순간부터 그 프로젝트는 여러분의 것이 아니다.
      **아이디어는 팀의 것, 에이전트는 그 아이디어를 두들기는 망치다.**

      ## 📋 프롬프트 P14-1
      ```text
      [역할] 너는 이 제안서의 회의적인 심사위원이다
      [입력] (제안서 붙여넣기)
      [할 일]
       1. "이 프로젝트가 금요일에 실패했다"고 가정하고, 가장 그럴듯한 실패
          원인 5개를 구체적으로 서술해줘 (기술·일정·협업 각 1개 이상)
       2. 각 원인마다: 화요일에 감지할 수 있는 조기 신호 1개와 예방 조치 1개
       3. 성공 기준(2번 항목)이 검증 가능하게 쓰였는지 비판해줘 —
          측정 방법이 빠졌으면 지적할 것
      [제약] 대안 주제를 제안하지 말 것. 이 주제 안에서만 비판하라
      ```

      ## 💡 이 프롬프트의 세 장치
      | 장치 | 효과 |
      |---|---|
      | `[역할] 회의적인 심사위원` | 칭찬 대신 비판을 끌어낸다 |
      | `"이미 실패했다"는 가정` | "혹시 안 될까요?" 보다 **구체적인 원인**이 나온다 |
      | `[제약] 대안 주제 제안 금지` | 주제를 바꾸지 못하게 못 박는다 |

      **"화요일에 감지할 수 있는 조기 신호"** 라는 요구가 핵심이다. 리스크 목록만 있으면
      소용없다 — **언제 무엇을 보고 알아챌 것인가**가 있어야 실제로 막을 수 있다.

      ## 💻 실행 명령 (산출물 생성 후 형식 확인)
      ```bash
      docker exec -w /work/week14 llm-lab python3 -c "
      import re
      t = open('premortem.md', encoding='utf-8').read()
      causes = re.findall(r'^### 원인 (\d+) \(([^)]+)\)', t, re.M)
      kinds = ' '.join(k for _, k in causes)
      print('CAUSES', len(causes), '| KINDS', kinds)
      for kind in ('기술', '일정', '협업'):
          print(f'  {kind}:', kinds.count(kind), '개')
      has_all = len(causes) == 5 and all(k in kinds for k in ('기술','일정','협업'))
      print('PREMORTEM_CAUSES_OK' if has_all else 'NG')"
      ```
      ## ✅ 합격 기준
      실패 원인 **5개**, 기술·일정·협업이 **각각 1개 이상**, `PREMORTEM_CAUSES_OK`.
      **기술만 5개면 편향된 것이다** — 실제 프로젝트는 일정과 협업에서 더 자주 무너진다.
    hint: '"이미 실패했다"고 가정하면 "혹시 문제가 될까요?" 보다 훨씬 구체적인 답이 나온다'
    answer: |
      docker exec -w /work/week14 llm-lab python3 -c "
