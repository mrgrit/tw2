    answer_detail: "'성능을 개선한다'는 반려, '동일 출력 게이트 통과 + 1.5배 이상'은 승인이다. 측정 방법이 명시되지 않은 기준은 프로젝트가 끝나도 성공 여부를 말할 수 없다."
    verify:
