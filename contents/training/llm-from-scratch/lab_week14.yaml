    instruction: |
      ## 🎯 미션 — 채점 루브릭 검산 (합 = 100)

      평가받을 기준의 산수부터 확인한다. **배점 합이 100이 아니면 채점 자체가 불가능하다.**

      ## 💡 루브릭
      | 항목 | 배점 | 기준 |
      |---|---|---|
      | **실험 설계** | **30** | 성공 기준의 정량성, 통제 변인, **학기 자산의 이식** |
      | **검증과 실패 분석** | **30** | 주장마다 증거. **실패를 원인 수준까지** |
      | 결과 완성도 | 20 | 최소 = 12, 기대 = 17, 도전 = 20 |
      | 협업·로그 | 10 | 개인 로그의 실재성 |
      | 회고 정합성 | 10 | 제안서 리스크 예측과 실제의 대조 |
      | **합계** | **100** | |

      ## 🔴 실패 자체는 감점이 아니다
      배점 **60점**이 "설계"와 "검증·분석"에 있다. 목표를 못 이뤄도 **왜 안 됐는지 원인 수준까지
      규명**하면 높은 점수를 받는다. 반대로 목표를 이뤘어도 증거가 없으면 낮다.

      ## 💡 '결과 완성도' 내부 배점도 검산한다
      최소 12 / 기대 17 / 도전 20 — **단조 증가**하고 **최대치가 항목 배점(20)과 일치**해야 한다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] check_rubrics.py 를 만들어 교재의 채점 배점이 산술적으로 맞는지 검산한다

      [할 일]
       1. 교재 마크다운(LLM_강의교재_Week14-15.md)에서 다음 표를 찾아 파싱한다
          - 14.6 프로젝트 채점 루브릭 (항목별 배점)
          - 15.6 기말 평가 배분 (항목별 %)
       2. 각 표의 배점 합을 계산해 출력한다
          W14-G3: 루브릭 합이 100 인가
          W15-G2: 기말 평가 배분 합이 100% 인가
       3. '결과 완성도' 내부 세부 배점(최소/기대/도전)도 검산한다
          - 단조 증가하는가
          - 최대치가 항목 배점과 일치하는가
       4. 각 판정을 PASS / FAIL 로 출력한다

      [제약]
       - 표준 라이브러리만 쓸 것 (호스트에서 바로 돌아가야 한다)
       - 합이 100 이 아니면 그대로 FAIL 로 보고할 것.
         "반올림 차이입니다" 로 넘어가지 말 것
       - 배점을 코드에 하드코딩하지 말고 교재에서 읽을 것.
         하드코딩하면 교재가 바뀌어도 검산이 통과한다

      [검증] 항목별 배점과 합계를 표로 출력하고, 두 판정을 함께 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      cd code/week14 && python3 check_rubrics.py ../../course/LLM_강의교재_Week14-15.md
      ```
      (`check_rubrics.py` 는 표준 라이브러리만 쓰므로 호스트에서 실행한다. 교재 마크다운 경로는
      본인 환경에 맞게 지정한다.)

      ## ✅ 합격 기준
      `W14-G3 판정: **PASS**` (루브릭 합 100) 와
      `W15-G2 판정: **PASS**` (기말 평가 배분 합 100%). 실측 출력:
      ```
      회고 정합성                 10
      합계                    100
      → W14-G3 판정: **PASS** (항목 5개)

      프로젝트 결과물 (14.6 루브릭)          60%
      발표·시연                        25%
      동료 평가                         5%
      기말 리포트                       10%
      합계                          100%
      → W15-G2 판정: **PASS** (항목 4개)

      최소 12 / 기대 17 / 도전 20   (항목 배점 20)
      단조 증가하고 최대치가 항목 배점과 일치: **PASS**
      ```

      ## 🔍 에이전트 판정 포인트
      **배점을 코드에 하드코딩하면 검산이 아니다.** 에이전트가 `RUBRIC = {"실험 설계": 30, ...}`
      를 직접 써 넣고 합을 구하면, **교재가 바뀌어도 항상 PASS 가 나온다.**
      자기 자신과 비교하는 검증 — W07 2단계의 "산식을 실측에서 역산" 과 같은 함정이다.
      **교재 파일에서 읽어야 한다.**

      **합이 100이 아닐 때 "반올림 차이"로 넘기려 드는 경우가 있다.** 배점은 정수다.
      99 나 101 이면 채점표가 틀린 것이고, **채점표가 틀리면 아무도 공정하게 평가받지 못한다.**

      **평가 기준의 산수를 검산하는 것도 검증이다.** 13주 동안 모델의 숫자를 검산했다면,
      이번 주는 **여러분을 평가할 숫자**를 검산한다.

      ## 🔴 실패 자체는 감점이 아니다
      배점 **60점**이 "설계"(30)와 "검증·분석"(30)에 있다. 목표를 못 이뤄도 **왜 안 됐는지
      원인 수준까지 규명**하면 높은 점수를 받는다. 반대로 목표를 이뤘어도 증거가 없으면 낮다.

