lab_id: llm-from-scratch-week14
title: "W14 — 팀 프로젝트: 정량 성공 기준·사전 부검·학기 자산 이식·루브릭 검산"
version: ai
course: llm-from-scratch
week: 14
description: |
  13주 동안 교재가 정답지를 줬다. 이번 주부터는 성공 기준을 학생이 정의하고 그 통과를 스스로
  입증한다. 트랙을 고르고 정량 성공 기준을 담은 제안서를 쓴 뒤, 사전 부검(pre-mortem) 프롬프트로
  실패 원인 5개와 조기 신호·예방 조치를 뽑는다. 그리고 그 산출물이 프롬프트의 요구와 제약(특히
  "대안 주제 제안 금지")을 지켰는지 검사자로 검증한다. 마지막으로 채점 루브릭 배점 합을 검산한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  ## 🔴 이번 주는 프롬프트를 여러분이 씁니다

  13주 동안은 프롬프트가 주어졌다. 이번 주부터는 **여러분이 프롬프트를 설계한다.**
  2단계 제안서와 3단계 사전 부검이 그 훈련이다. 아래 프롬프트들은 **템플릿**이지
  복사해 그대로 쓰는 정답이 아니다 — 여러분의 트랙과 주제에 맞게 채워야 한다.

  **다만 한 가지는 절대 에이전트에게 넘기지 마라: 주제 선정.**
  "뭘 하면 좋을까?"라고 묻는 순간 그 프로젝트는 여러분의 것이 아니게 된다.
difficulty: medium
duration_minutes: 150
audience: LLM 밑바닥 구현 (14주차 프로젝트)
prerequisites:
  - W01~W13 완료 — 학기 자산(성질 테스트·품질 게이트·측정 규약) 보유
  - 팀 편성 (2인 1조 권장, 트랙 D는 2인 필수)
  - 교재 저장소 보너스 폴더 접근 가능
  - W14 강의안 정독 — 자산 목록, 트랙 카드, 사전 부검 3장치
objectives:
  - "트랙별 출발 자료가 교재 저장소에 실재하는지 확인한다"
  - "측정 가능한 정량 성공 기준을 담은 제안서를 작성한다"
  - "사전 부검 프롬프트로 실패 원인 5개(기술·일정·협업 각 1+)를 뽑는다"
  - "각 원인의 조기 신호와 예방 조치를 화요일 시점으로 명시한다"
  - "에이전트가 '대안 주제 제안 금지' 제약을 지켰는지 검증한다"
  - "채점 루브릭 배점 합이 100인지 검산한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 트랙 출발 자료 실재 확인

      트랙을 고르기 전에 **출발 자료가 실제로 있는지** 확인한다. 없는 자료를 전제로 계획을
      세우면 화요일에 무너진다.

      ## 💡 6개 트랙
      | 트랙 | 주제 | 핵심 검증 기준 |
      |---|---|---|
      | **A** | KV 캐시 | 캐시 on/off **완전 동일성 게이트** + tokens/sec |
      | **B** | 최신 모델 재현 (Llama/Qwen/Gemma) | 가중치 로드 후 생성 + **분해표 재작성** |
      | **C** | DPO 정렬 | 저지 점수 전후 비교 + 손실 곡선 |
      | **D** | 분산 훈련 (2인 필수) | tokens/sec 배율 + 손실 궤적 |
      | **E** | 챗 UI 서빙 | 시나리오 완주 + 컨텍스트 초과 동작 |
      | **F** | 자율 (승인 필요) | **정량 기준 자체 정의** |

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 우리 팀이 고른 트랙의 출발 자료가 교재 저장소에 실제로 있는지 확인한다

      [할 일]
       1. 컨테이너의 /textbook 마운트가 살아 있는지 먼저 확인한다.
          없으면 즉시 멈추고 TEXTBOOK_NOT_MOUNTED 를 보고한다
       2. 보너스 폴더(ch*/02_ ~ ch*/09_ 형태)를 전부 나열한다
       3. 우리 트랙에 해당하는 폴더가 실재하는지 개별 확인한다
          A: KV 캐시  /  B: 최신 모델 재현  /  C: DPO 정렬
          D: 분산 훈련 /  E: 챗 UI 서빙    /  F: 자율
       4. 보너스 폴더 개수를 출력하고, 하나 이상이면 TRACK_MATERIALS_OK 를 출력한다
       5. 우리 트랙 자료가 "없으면" 그 사실을 명확히 보고한다

      [제약]
       - 자료가 없는데 "비슷한 것으로 대체 가능합니다"라고 넘어가지 말 것.
         없으면 없다고 보고한다. 트랙을 바꿀지는 팀이 결정한다
       - 폴더 이름을 추측하지 말고 실제로 나열해 확인할 것
       - 파일 내용까지 읽을 필요는 없다. 실재 여부만 본다

      [검증] 폴더 목록 원문과 개수를 보이고,
             우리 트랙 자료의 정확한 경로를 지목할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec llm-lab bash -c '
      cd /textbook 2>/dev/null || { echo "TEXTBOOK_NOT_MOUNTED"; exit 1; }
      echo "--- 보너스 폴더 목록"
      ls -d ch*/0[2-9]_* 2>/dev/null | head -20
      echo "--- 트랙 A(KV캐시/GQA/MLA/SWA) 자료"; ls -d ch04/*kv* ch04/*gqa* ch04/*mla* ch04/*swa* 2>/dev/null
      echo "--- 트랙 D(DDP) 자료"; ls -d appendix-A/* 2>/dev/null | head -5
      n=$(ls -d ch*/0[2-9]_* 2>/dev/null | wc -l)
      echo "BONUS_FOLDERS=$n"
      [ "$n" -gt 0 ] && echo "TRACK_MATERIALS_OK"'
      ```
      ## ✅ 합격 기준
      보너스 폴더가 하나 이상 나열되고 `TRACK_MATERIALS_OK`.
      **고른 트랙의 자료가 없으면 트랙을 바꾸거나 조교에게 문의한다.**

      실측 출력 (`BONUS_FOLDERS=29`) 중 트랙별로 확인할 경로:
      ```
      트랙 A: ch04/03_kv-cache, ch04/04_gqa, ch04/05_mla, ch04/06_swa, ch04/07_moe
      트랙 B: ch05/07_gpt_to_llama, ch05/02_alternative_weight_loading
      트랙 D: appendix-A/01_main-chapter-code, appendix-A/02_setup-recommendations
      트랙 E: ch05/06_user_interface
      기타  : ch04/02_performance-analysis, ch05/03_bonus_pretraining_on_gutenberg,
              ch05/04_learning_rate_schedulers, ch05/05_bonus_hparam_tuning,
              ch05/08_memory_efficient_weight_loading, ch04/08_deltanet
      ```

      ## 🔍 에이전트 판정 포인트
      **자료가 없을 때 에이전트는 대체재를 찾아 준다.** "KV 캐시 폴더는 없지만 ch04 의
      performance-analysis 로 비슷하게 할 수 있습니다" 같은 답이 온다. **친절하지만 위험하다** —
      팀은 자료가 있다고 믿고 계획을 세우고, 화요일에 실제로 열어 보고 무너진다.
      **없으면 없다고 보고하게 하고, 트랙 변경은 팀이 결정한다.**

      **폴더 이름을 추측해 보고하는 경우도 있다.** 교재 구조를 아는 모델이라
      `ch04/03_kv-cache` 를 실행 없이 답할 수 있다. **실제 `ls` 출력이 있는지 확인하라** —
      W01 에서 배운 "자기보고를 믿지 마라"가 여기서도 적용된다.

      **제안서를 쓰기 전에 전제를 확인하는 것** — W03 6단계의 "실험 전제를 측정으로 먼저
      확인하라"와 같은 원리다. **없는 자료를 전제로 한 계획은 계획이 아니다.**
    hint: '자료가 없는 트랙을 고르면 화요일에 플랜 B 를 발동해야 한다 — 월요일에 확인하라'
    answer: |
      docker exec llm-lab bash -c '
      cd /textbook 2>/dev/null || { echo "TEXTBOOK_NOT_MOUNTED"; exit 1; }
      echo "--- 보너스 폴더 목록"
      ls -d ch*/0[2-9]_* 2>/dev/null | head -20
      echo "--- 트랙 D(DDP) 자료"; ls -d appendix-A/* 2>/dev/null | head -5
      n=$(ls -d ch*/0[2-9]_* 2>/dev/null | wc -l)
      echo "BONUS_FOLDERS=$n"
      [ "$n" -gt 0 ] && echo "TRACK_MATERIALS_OK"'
    answer_detail: "제안서를 쓰기 전에 전제를 확인하는 것 — W03 의 '실험 전제를 측정으로 먼저 확인하라'와 같은 원리다. 없는 자료를 전제로 한 계획은 계획이 아니다."
    verify:
      type: output_contains
      expect: TRACK_MATERIALS_OK
      field: stdout
      semantic:
        intent: "트랙 출발 자료의 실재를 확인한 뒤 트랙 확정"
        success_criteria: ["보너스 폴더 확인", "고른 트랙 자료 존재", "없으면 트랙 변경"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 제안서 작성: **측정 가능한** 성공 기준

      ## 💡 템플릿
      ```markdown
      # 팀명 / 트랙 / 팀원(역할)
      ## 1. 목표 (2~3문장)
      ## 2. 성공 기준 (정량 — 무엇을 측정해 얼마면 성공인가)
      ## 3. 마일스톤: 최소 / 기대 / 도전
      ## 4. 역할 분담 (누가 어떤 미션의 지시·검증을 맡나)
      ## 5. 리스크 상위 3개와 플랜 B
      ```

      ## 🔴 성공 기준이 "검증 가능"하다는 것
      | 나쁜 기준 | 왜 나쁜가 | 좋은 기준 |
      |---|---|---|
      | "성능을 개선한다" | 무엇을 얼마나? | "동일 출력 게이트 통과 + 512토큰 생성에서 **1.5배 이상**" |
      | "잘 동작한다" | 측정 방법 없음 | "저지 평균 **65점 이상**(llama3.1:8b, seed 123)" |
      | "빠르게 만든다" | 기준선 없음 | "tokens/sec 가 캐시 없음 대비 **2배 이상**" |

      **측정 방법이 빠진 기준은 반려된다.**

      ## 💡 좋은 제안서 예 (트랙 A)
      ```
      - 캐시 on/off 의 greedy 출력이 1토큰도 다르지 않을 것 (256토큰 × 10개 프롬프트)
      - 256토큰 생성에서 tokens/sec 1.5배 이상
      - 컨텍스트 1024 초과 시 크롭이 동작하고 캐시가 함께 잘릴 것
      ```
      세 기준 모두 **무엇을·어떻게·얼마면**이 들어 있다.

      ## 🤖 에이전트 프롬프트 — 제안서를 **쓰게** 하지 말고 **두들기게** 하라
      ```text
      [역할] 너는 이 제안서의 성공 기준만 보는 까다로운 심사위원이다

      [입력]
      (여기에 우리 팀이 직접 쓴 proposal.md 를 붙여넣는다)

      [할 일]
       1. "## 2. 성공 기준" 의 각 항목에 대해 다음 세 가지를 확인해라
          - 무엇을 측정하는가 (측정 대상이 명확한가)
          - 어떻게 측정하는가 (측정 방법·도구·조건이 적혀 있는가)
          - 얼마면 성공인가 (임계값이 숫자로 있는가)
       2. 셋 중 하나라도 빠진 항목을 지적하고, 무엇이 빠졌는지 명시해라
       3. 각 지적에 대해 "이렇게 고치면 된다"는 예시 문장을 하나씩 제시해라

      [제약]
       - 성공 기준을 대신 써 주지 말 것. 무엇이 빠졌는지만 지적한다
       - 프로젝트 주제나 트랙에 대해 의견을 내지 말 것. 성공 기준만 본다
       - "괜찮아 보입니다" 로 넘어가지 말 것. 반드시 하나 이상 지적한다

      [검증] 항목별로 (무엇을 / 어떻게 / 얼마면) 세 칸 표를 만들어 보여라
      ```

      ## 📎 참고 — 자기 제안서를 기계적으로 검사하는 명령
      ```bash
      docker exec -w /work/week14 llm-lab python3 -c "
      import re, sys
      t = open('proposal.md', encoding='utf-8').read()
      secs = ['## 1. 목표', '## 2. 성공 기준', '## 3. 마일스톤', '## 4. 역할 분담', '## 5. 리스크']
      missing = [s for s in secs if s not in t]
      print('SECTIONS_MISSING', missing if missing else '없음')
      crit = t.split('## 2.')[1].split('## 3.')[0] if '## 2.' in t else ''
      nums = re.findall(r'\d+(?:\.\d+)?\s*(?:배|%|점|토큰|초|GB)', crit)
      print('QUANT_TOKENS_IN_CRITERIA', nums)
      vague = [w for w in ['개선한다', '잘 동작', '빠르게', '향상시킨다'] if w in crit]
      print('VAGUE_PHRASES', vague if vague else '없음')
      ok = not missing and len(nums) >= 2 and not vague
      print('PROPOSAL_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      5개 절이 모두 있고, 성공 기준에 **정량 표현이 2개 이상**, 모호한 표현이 **0개**,
      `PROPOSAL_OK`. 실측 출력(트랙 A 예시 제안서):
      ```
      SECTIONS_MISSING 없음
      QUANT_TOKENS_IN_CRITERIA ['1토큰', '256토큰', '256토큰', '1.5배', '1024 초']
      VAGUE_PHRASES 없음
      PROPOSAL_OK
      ```

      ## 🔍 에이전트 판정 포인트
      **제안서를 에이전트에게 쓰게 하면 안 된다.** 그럴듯한 문장이 나오지만 팀의 역량·자원·
      관심과 무관하다. 그리고 **그 순간부터 그 프로젝트는 여러분의 것이 아니다.**
      위 프롬프트가 "성공 기준을 대신 써 주지 말 것" 이라고 못 박은 이유다.

      **에이전트는 "괜찮아 보입니다"로 넘어가려 한다.** 사람이 쓴 글을 비판하는 것은
      학습된 성향과 충돌하기 때문이다. `[역할] 까다로운 심사위원` 과
      `"반드시 하나 이상 지적한다"` 두 장치가 그것을 막는다. 지적이 하나도 없이 돌아오면
      프롬프트가 작동하지 않은 것이다.

      **기계 검사와 사람 검사를 둘 다 하라.** 위 스크립트는 정량 표현의 "존재"만 본다 —
      `"3개월 안에"` 같은 무의미한 숫자도 통과한다. **숫자가 있다는 것과 측정 가능하다는 것은
      다르다.** 그래서 에이전트에게 (무엇을 / 어떻게 / 얼마면) 세 칸을 채우게 시킨다.

      | 나쁜 기준 | 왜 나쁜가 | 좋은 기준 |
      |---|---|---|
      | "성능을 개선한다" | 무엇을 얼마나? | "동일 출력 게이트 통과 + 512토큰 생성에서 **1.5배 이상**" |
