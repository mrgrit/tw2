    answer_detail: "-100 마스킹은 틀려도 오류가 안 나서 조용히 모델을 망친다. 그래서 '정말 빠지는가'를 숫자로 확인하는 이 단계가 필요하다. 이것이 이 교재가 말하는 '증거로 검증하기'의 전형이다."
    verify:
      type: output_contains
      expect: IGNORE_INDEX_OK
      field: stdout
      semantic:
        intent: "-100 이 손실 계산에서 제외됨을 수치로 실증"
