      logits2 = torch.tensor([[-1.0, 1.0], [-0.5, 1.5]])
      t2 = torch.tensor([0, 1])
      l2 = F.cross_entropy(logits2, t2)
      logits3 = torch.cat((logits2, torch.tensor([[-0.5, 1.5]])))
      t3 = torch.tensor([0, 1, -100])
      l3 = F.cross_entropy(logits3, t3)
      print('LOSS_2TOKEN          ', round(l2.item(), 6))
      print('LOSS_3TOKEN_WITH_-100', round(l3.item(), 6))
      print('DIFF                 ', abs(l2.item()-l3.item()))
      print('IGNORE_INDEX_OK' if abs(l2.item()-l3.item()) < 1e-6 else 'NG')"
