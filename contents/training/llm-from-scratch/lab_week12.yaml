      처리된다.

      **에이전트가 `ignore_index=-100` 을 명시적으로 넘기면 실험이 약해진다.** 확인하려는 것이
      **"-100 이 기본값"** 이라는 사실이기 때문이다. 명시해 버리면 "내가 지정했으니 되는 것"이
      되어, 실제 collate 코드에서 다른 값을 썼을 때 조용히 틀리는 상황을 못 잡는다.

      **`-100` 은 마법의 숫자가 아니다.** `F.cross_entropy(..., ignore_index=-100)` 의
      **기본값**일 뿐이다. 다른 값으로 바꾸려면 `ignore_index` 를 명시하면 된다.

      **`-100` 대신 0 을 넣어 보라.** 손실이 달라지는 것을 직접 확인할 수 있다 —
      0 은 어휘의 유효한 토큰 ID(`"!"`)이므로 "그 자리에 `!` 가 와야 한다"고 학습된다.

      **이 마스킹은 틀려도 오류가 안 나서 조용히 모델을 망친다.** 그래서 "정말 빠지는가"를
      숫자로 확인하는 이 단계가 필요하다. 이것이 이 교재가 말하는 **증거로 검증하기**의 전형이다.
    hint: '-100 대신 0 을 넣어 보라 — 손실이 달라지는 것을 직접 확인할 수 있다'
    answer: |
      docker exec llm-lab python3 -c "
      import torch, torch.nn.functional as F
      logits2 = torch.tensor([[-1.0, 1.0], [-0.5, 1.5]])
      t2 = torch.tensor([0, 1])
      l2 = F.cross_entropy(logits2, t2)
      logits3 = torch.cat((logits2, torch.tensor([[-0.5, 1.5]])))
      t3 = torch.tensor([0, 1, -100])
      l3 = F.cross_entropy(logits3, t3)
      print('LOSS_2TOKEN          ', round(l2.item(), 6))
      print('LOSS_3TOKEN_WITH_-100', round(l3.item(), 6))
      print('DIFF                 ', abs(l2.item()-l3.item()))
      print('IGNORE_INDEX_OK' if abs(l2.item()-l3.item()) < 1e-6 else 'NG')"
      docker exec -w /work/week12 llm-lab python3 -m pytest test_collate.py -q
    answer_detail: "-100 마스킹은 틀려도 오류가 안 나서 조용히 모델을 망친다. 그래서 '정말 빠지는가'를 숫자로 확인하는 이 단계가 필요하다. 이것이 이 교재가 말하는 '증거로 검증하기'의 전형이다."
