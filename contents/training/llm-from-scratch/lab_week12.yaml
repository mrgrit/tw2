lab_id: llm-from-scratch-week12
title: "W12 — 데이터가 절반이다: Alpaca 포맷·collate 3단계 진화·-100 마스킹 실증·품질 점검"
version: ai
course: llm-from-scratch
week: 12
description: |
  지시 튜닝의 재료를 만든다. Alpaca 프롬프트 포맷터를 구현하고(input 이 빈 항목에서 블록이 통째로
  빠지는지 확인), collate 함수를 패딩 → 타깃 시프트 → -100 마스킹 3단계로 진화시킨다. 특히
  -100(ignore_index)이 손실에서 정말로 제외되는지 2토큰 vs 3토큰 손실 비교로 소수점 6자리까지
  실증한다. 마지막으로 "데이터를 의심하라" — 길이 분포와 완전 중복을 정량 점검한다.
difficulty: medium
duration_minutes: 150
audience: LLM 밑바닥 구현 (12주차)
prerequisites:
  - W11 완료 — 패딩 개념, 사전훈련 모델 로드
  - "`/work/week12/` 에 instruction-data.json (1,100건)"
  - W12 강의안 정독 — Alpaca 포맷, 3단계 진화, EOS 하나 남기기
objectives:
  - "instruction-data.json 1,100건과 분할 935/110/55 를 확인한다"
  - "input 이 빈 항목에서 ### Input: 블록이 통째로 빠지는지 확인한다"
  - "장난감 배치로 collate 정답지 3행을 재현한다"
  - "각 행에 50256 이 정확히 한 번만 남는 이유를 확인한다"
  - "-100 이 손실에서 제외됨을 2토큰 vs 3토큰 비교로 실증한다"
  - "실제 데이터에서 -100 이 응답 종료 후에만 있는지 확인한다"
  - "최장 토큰 길이와 완전 중복 그룹 수를 정량 보고한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 데이터 확보와 Alpaca 프롬프트 포맷터

      ## 💡 왜 "포맷"이 필요한가
      모델은 `### Instruction:` 같은 **고정된 신호**를 보고 "여기서부터 지시" / "여기서부터
      응답"을 구분하는 법을 배운다. 포맷이 흔들리면 그 신호가 사라진다.

      ```
      Below is an instruction that describes a task. Write a response that appropriately completes the request.

      ### Instruction:
      Convert 45 kilometers to meters.

      ### Response:
      45 kilometers is 45000 meters.
      ```

      ## ⚠️ 고정 서두를 정확히 쓸 것
      `"Below is an instruction that describes a task. Write a response that appropriately
      completes the request."` — 이 문장 **전체**가 포맷의 일부다. 생략하고 `"..."` 로 대충 쓰면
      결과가 맞아 보여도 그건 **모델의 사전 지식이 채운 것**이지 여러분의 명세가 유도한 것이
      아니다. 소형 오픈 모델로 바꾸면 재현되지 않는다.

      ## 💡 `input` 이 빈 항목
      **`### Input:` 블록이 통째로 빠진다.** 빈 블록을 남기면 모델이 "빈 Input" 이라는 잘못된
      패턴을 배운다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week12 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      from instr_data import load_data, format_input
      data = load_data(); print('TOTAL', len(data))
      with_input = [d for d in data if d.get('input')][0]
      no_input   = [d for d in data if not d.get('input')][0]
      print('--- input 있는 항목'); print(format_input(with_input))
      print('--- input 없는 항목'); print(format_input(no_input))
      has = '### Input:' in format_input(no_input)
      print('NO_INPUT_HAS_BLOCK', has, '(False 여야 정상)')
      print('FORMAT_OK' if len(data) == 1100 and not has else 'NG')"
      ```
      ## ✅ 합격 기준
      `TOTAL 1100`, `input` 없는 항목에 `### Input:` 이 **없음**, `FORMAT_OK`.
    hint: '교재 ch07 노트북 출력과 문자 단위로 비교해 보라 — 공백 하나도 달라선 안 된다'
