  - order: 6
    instruction: |
      ## 🎯 미션 — 데이터를 의심하라: 길이 분포와 중복

      ## 🔴 교재는 "심각한 문제는 적을 것"이라고 했지만
      실측하면 **완전 중복이 20 그룹(45건)** 있다. 이 문구가 학생의 탐색을 **조기 종료**시킨다 —
      "문제가 적을 것"이라고 들으면 대충 보고 넘어간다.

      **다만 중복 45건의 output 은 전부 서로 달랐다** — 같은 질문에 다른 답이 달린 것이다.
      이것이 "제거해야 할 중복"인지 "다양성 데이터"인지는 **판단이 필요하다. 그 판단이 여러분의
      몫이다.**

      ## 💡 길이 분포의 의미
      | 항목 | 실측 |
      |---|---|
      | 최장 토큰 길이 | **91** |
      | 평균 | 56.4 |
      | 컨텍스트 | 1,024 (여유 **933**) |

      컨텍스트 1024 중 91 만 쓴다 — **패딩이 대부분이다.** 이것이 `-100` 마스킹이 없으면 안 되는
      이유이고, 동시에 "배치 안에서 가장 긴 것에만 맞추는" **동적 패딩**이 효율적인 이유다
      (고정 1024로 채우면 90%가 낭비다).

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week12 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import tiktoken
      from collections import Counter
      from instr_data import load_data, format_input
      enc = tiktoken.get_encoding('gpt2')
      data = load_data()
      lens = [len(enc.encode(format_input(d) + chr(10)*2 + '### Response:' + chr(10) + d['output']))
              for d in data]
      print('MAX_TOKENS', max(lens), 'MEAN', round(sum(lens)/len(lens), 1))
      print('CONTEXT 1024  HEADROOM', 1024 - max(lens))
      key = [(d['instruction'], d.get('input','')) for d in data]
      dup = [k for k, c in Counter(key).items() if c > 1]
      dup_items = sum(c for k, c in Counter(key).items() if c > 1)
      print('DUPLICATE_GROUPS', len(dup), 'DUPLICATE_ITEMS', dup_items)
      print('QUALITY_CHECK_OK' if max(lens) < 1024 and len(dup) > 0 else 'NG')"
      ```
      ## ✅ 합격 기준
      `MAX_TOKENS 91`, `DUPLICATE_GROUPS 20`, `QUALITY_CHECK_OK`.

