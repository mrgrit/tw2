      import torch, tiktoken
      from common import device
      from spam_finetune import load_and_modify, classify_review
      m, cfg = load_and_modify(strategy='b', verbose=False)
      m.load_state_dict(torch.load('spam_classifier.pth', map_location='cpu', weights_only=True))
      m.to(device).eval()
      enc = tiktoken.get_encoding('gpt2')
      a = 'You are a winner you have been specially selected to receive \$1000 cash or a \$2000 award.'
      b = 'Hey, just wanted to check if we are still on for dinner tonight? Let me know!'
      ra1, ra2 = classify_review(a, m, enc, device), classify_review(a, m, enc, device)
      rb = classify_review(b, m, enc, device)
      print('A ->', ra1, '(재실행:', ra2, ')')
      print('B ->', rb)
      print('DETERMINISTIC', ra1 == ra2)
      ok = ra1 == 'spam' and rb == 'not spam' and ra1 == ra2
      print('CLASSIFY_OK' if ok else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      `A -> spam`, `B -> not spam`, `DETERMINISTIC True`, `CLASSIFY_OK`. 실측 출력:
      ```
      A -> spam (재실행: spam )
      B -> not spam
      DETERMINISTIC True
      ```

      ## 🔍 에이전트 판정 포인트
      **`model.eval()` 을 빼면 같은 문장이 실행할 때마다 다르게 분류된다.** 샘플링이 없는데도
      그렇다 — dropout 이 켜져 있으면 순전파 자체가 확률적이기 때문이다. **직접 빼고 두 번
      돌려 보라.** 이 수업에서 `eval()` 누락이 몇 번째로 나오는 문제인지 세어 보면
      W05·W06·W07·W09·W10 그리고 여기다.

      **`DETERMINISTIC` 검사를 빠뜨리면 이 버그를 못 잡는다.** 한 번만 호출하면 답이
      그럴듯하게 나오고 끝난다. **두 번 호출해 비교하는 것**이 검사다.

      **매트릭스 실험 — "큰 모델이 항상 낫다"는 거짓이었다.**
      | 전략 | 훈련 대상 | 124M | 355M |
      |---|---|---|---|
      | (a) | 출력 헤드만 | — | — |
      | **(b)** | 헤드 + 마지막 블록 + 최종 LN | **96.33%** | **85.00%** |
      | (c) | 헤드 + 마지막 **두** 블록 + 최종 LN | — | — |

      20 에폭으로 늘려 재측정해도 **94.33%** 로 124M 에 못 미쳤다. 훈련 부족이 아니라
      **전략의 문제**다.

      **원인:** 전략 (b)는 "마지막 블록 1개"를 푼다. 124M 은 12층이라 **1/12** 를 풀지만
      355M 은 24층이라 **1/24** 만 푼다. **모델이 클수록 같은 전략이 더 적은 비율을 푼다.**
      큰 모델을 쓰려면 동결 전략도 함께 조정해야 한다 — W13 의 LoRA 가 이 문제의 다른 해법이다.

      ## 📝 해석 과제 (report.md 에 **직접** 작성)
      매트릭스 실험에서 355M 이 124M 보다 낮게 나온 이유를 **층 수 대비 해동 비율**로
      설명하고, 355M 을 제대로 쓰려면 전략을 어떻게 바꿔야 할지 제안하라.
