lab_id: llm-from-scratch-week11
title: "W11 — 분류기가 된 GPT: 기준선·패딩·헤드 교체·선택적 동결·±1%p 재현 게이트"
version: ai
course: llm-from-scratch
week: 11
description: |
  GPT-2 를 스팸 분류기로 개조한다. 불균형 데이터에서 바보 분류기(86.6%) 기준선을 먼저 세우고,
  균형화·3분할 후 패딩으로 배치를 만든다. 출력 헤드를 50,257개에서 2개로 갈아 끼우고 대부분의 층을
  얼려 파라미터의 5.70% 만 훈련한다. "왜 마지막 토큰의 로짓인가"는 W05 인과성이 답한다. 그리고
  교재 정답지의 훈련 가능 파라미터 값이 틀렸다는 것을 손계산으로 직접 잡아낸다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  **이번 주는 4단계가 특별하다.** 에이전트가 계산해 준 숫자와 교재 정답지가 다를 때
  **어느 쪽이 틀렸는지 학생이 판정해야 한다.**

  ## 📁 `common.py` 를 먼저 만든다 (P11-0)

  W09·W10 과 같은 방식으로 `/work/week11/common.py` 에 `week07`·`week10` 경로 등록,
  `device`, `text_to_token_ids` / `token_ids_to_text` 를 둔다.
difficulty: hard
duration_minutes: 180
audience: LLM 밑바닥 구현 (11주차)
prerequisites:
  - W10 완료 — OpenAI 가중치 이식(qkv_bias=True), openai_load.build
  - "`/work/week11/` 에 SMS Spam Collection 데이터셋"
  - W11 강의안 정독 — 기준선, 패딩, 선택적 동결, 마지막 토큰 로짓
objectives:
  - "원본 5,572건(ham 4,825 / spam 747)과 바보 분류기 86.59% 를 확인한다"
  - "균형화 1,494건, 분할 1,045/149/300 을 확인한다"
  - "train max_length 120 과 배치 130/19/38, shape [8,120] 을 확인한다"
  - "패딩 토큰이 50256 임을 확인한다"
  - "훈련 가능 파라미터 7,090,946(5.70%)을 손계산하고 교재 오류를 잡는다"
  - "훈련 후 test 정확도 95.67% ±1%p 재현 게이트를 통과한다"
  - "classify_review 가 결정적으로 spam/not spam 을 판정한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 실태 파악과 **기준선** 세우기 (86.59%)

      ## 🔴 불균형 데이터에서 정확도만 보면 속는다
      | 항목 | 값 |
      |---|---|
      | 총 건수 | **5,572** |
      | ham (정상) | **4,825** (86.6%) |
      | spam | **747** (13.4%) |

      **항상 "ham" 이라고 답하는 바보 분류기의 정확도 = 4,825 / 5,572 = 86.59%.**
      **86.6% 를 넘지 못하면 아무 의미가 없다.** 이 기준선을 먼저 세우는 것이 실무 습관이다.

      ## 💡 그래서 균형화한다
      spam 747건에 맞춰 ham 을 747건만 남긴다 → **1,494건**. 그러면 바보 분류기의 정확도가
      **50%** 가 되고, 그 위로 얼마나 올라가는지가 순수한 실력이 된다.
      분할은 70/10/20 → **1,045 / 149 / 300**.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] SMS Spam Collection 데이터를 확보하고, 기준선을 세운 뒤 균형화·분할한다

      [할 일]
       1. UCI SMS Spam Collection 데이터셋을 /work/week11/sms_spam_collection/ 에 받는다
          (탭 구분, 컬럼 2개: Label, Text)
       2. /work/week11/spam_data.py 에 다음을 만든다
          - create_balanced_dataset(df): spam 건수에 맞춰 ham 을 무작위 표본으로 줄여
            두 클래스 개수를 같게 만든다 (시드 고정)
          - random_split(df, 0.7, 0.1): 70/10/20 으로 나눠 train/val/test 를 반환하고
            각각 train.csv / validation.csv / test.csv 로 저장한다
       3. 다음을 출력한다
          TOTAL <전체 건수> <라벨별 건수 딕셔너리>
          DUMMY_BASELINE <항상 ham 이라 답하는 분류기의 정확도, 소수 2자리> %
          BALANCED <균형화 후 건수>
          SPLIT <train> <val> <test>
       4. 5572 / 1494 / (1045, 149, 300) 이면 SPAM_DATA_OK, 아니면 NG

      [제약]
       - 균형화와 분할에 시드를 고정할 것. 안 하면 다음 단계 max_length 와
         최종 정확도가 재현되지 않는다
       - spam 을 늘리지 말고 ham 을 줄일 것 (언더샘플링)
       - 바보 분류기 기준선을 반드시 계산할 것. 이 숫자가 없으면
         나중에 "정확도 95%"가 좋은 건지 나쁜 건지 판단할 수 없다

      [검증] 네 줄을 모두 출력하고, 균형화 후에는 바보 분류기의 정확도가
             얼마가 되는지 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import pandas as pd
      from spam_data import create_balanced_dataset, random_split
      df = pd.read_csv('sms_spam_collection/SMSSpamCollection.tsv', sep='\t',
                       header=None, names=['Label','Text'])
      print('TOTAL', len(df), df['Label'].value_counts().to_dict())
      print('DUMMY_BASELINE', round(4825/5572*100, 2), '%')
      bal = create_balanced_dataset(df); print('BALANCED', len(bal))
      tr, va, te = random_split(bal); print('SPLIT', len(tr), len(va), len(te))
      ok = len(df)==5572 and len(bal)==1494 and (len(tr),len(va),len(te))==(1045,149,300)
      print('SPAM_DATA_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `TOTAL 5572 {'ham': 4825, 'spam': 747}`, `DUMMY_BASELINE 86.59 %`,
      `BALANCED 1494`, `SPLIT 1045 149 300`, `SPAM_DATA_OK`. 실측 출력:
      ```
      TOTAL 5572 {'ham': 4825, 'spam': 747}
      DUMMY_BASELINE 86.59 %
      BALANCED 1494
      SPLIT 1045 149 300
      ```

      ## 🔍 에이전트 판정 포인트
      **에이전트에게 "데이터를 준비하라"고 하면 기준선은 안 계산한다.** 데이터 로드·정제·분할은
      익숙한 작업이라 알아서 하지만, **"아무것도 안 하면 몇 점인가"** 는 시키지 않으면 안 한다.
      그리고 이 숫자가 없으면 6단계에서 "95.67%" 를 보고도 좋은 건지 나쁜 건지 판단할 수 없다.
      기준선을 먼저 세우는 것이 실무 습관이다.

      **오버샘플링으로 균형화하면 건수가 안 맞는다.** spam 을 복제해 4,825건으로 늘리면
      총 9,650건이 되고 이후 모든 정답지가 어긋난다. **ham 을 줄이는 언더샘플링이 맞다** —
      데이터를 버리는 게 아깝지만, 복제한 spam 은 새 정보가 아니라 과적합만 키운다.

      **시드를 고정하지 않으면 이번 주 전체가 재현되지 않는다.** 균형화에서 어떤 ham 을
      남기느냐에 따라 2단계의 `max_length` 가 120 이 아닌 값이 되고, 6단계 정확도도
      ±1%p 게이트를 벗어난다.

      **왜 균형화하는가 — 학생이 답할 수 있어야 한다.** 원본 분포에서는
      **항상 "ham" 이라고 답하는 바보 분류기가 이미 86.59%** 다. 균형화하면 그 기준선이
      **50%** 가 되고, 그 위로 얼마나 올라가는지가 순수한 실력이 된다.
    hint: '균형화 후 기준선이 50% 가 되는 이유를 스스로 설명할 수 있어야 한다'
    answer: |
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import pandas as pd
      from spam_data import create_balanced_dataset, random_split
      df = pd.read_csv('sms_spam_collection/SMSSpamCollection.tsv', sep='\t',
                       header=None, names=['Label','Text'])
      print('TOTAL', len(df), df['Label'].value_counts().to_dict())
      print('DUMMY_BASELINE', round(4825/5572*100, 2), '%')
      bal = create_balanced_dataset(df); print('BALANCED', len(bal))
      tr, va, te = random_split(bal); print('SPLIT', len(tr), len(va), len(te))
      ok = len(df)==5572 and len(bal)==1494 and (len(tr),len(va),len(te))==(1045,149,300)
      print('SPAM_DATA_OK' if ok else 'NG')"
    answer_detail: "기준선 없이 '정확도 95%'는 의미가 없다. 원본 분포에서는 아무것도 안 해도 86.6% 다. 균형화는 이 착시를 없애 순수 실력을 재게 한다."
    verify:
      type: output_contains
      expect: SPAM_DATA_OK
      field: stdout
      semantic:
        intent: "불균형 데이터의 기준선 설정과 균형화·분할"
        success_criteria: ["5,572건 확인", "바보 분류기 86.59%", "1,494 → 1,045/149/300"]

  - order: 2
    instruction: |
      ## 🎯 미션 — SpamDataset과 로더: 패딩의 등장

      ## 💡 왜 패딩이 필요한가
      문자 메시지는 길이가 제각각인데 배치는 **직사각형 텐서**여야 한다. 가장 긴 것에 맞춰
      나머지를 채운다. 채우는 값은 **50256** — GPT-2 의 `<|endoftext|>` 다(W02 에서 만든 그 토큰).
      GPT-2 에는 전용 패딩 토큰이 없어서 이것을 빌려 쓴다.

      ## ⚠️ train 의 max_length 를 val/test 에 **강제**한다
      ```python
      train_ds = SpamDataset('train.csv', tok, max_length=None)                  # 자동 결정 → 120
      val_ds   = SpamDataset('validation.csv', tok, max_length=train_ds.max_length)
      test_ds  = SpamDataset('test.csv', tok, max_length=train_ds.max_length)
      ```
      **val/test 가 자기 max_length 를 쓰면 데이터 누수(leakage)다.** 평가 데이터의 특성이
      모델 입력 형태를 바꾸면 안 된다. 실전에서는 새 데이터가 얼마나 길지 모른다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] spam_data.py 에 SpamDataset 과 build_loaders 를 만들어 배치를 구성한다

      [할 일]
       1. SpamDataset(csv_file, tokenizer, max_length=None, pad_token_id=50256) 을 만든다
          - 각 문장을 BPE 로 인코딩한다
          - max_length 가 None 이면 train 데이터에서 가장 긴 문장 길이로 자동 결정한다
          - max_length 보다 긴 문장은 자르고, 짧은 문장은 pad_token_id 로 채운다
          - __getitem__ 은 (입력 텐서, 라벨 텐서) 를 반환한다
       2. build_loaders() 를 만든다
          - train 데이터셋은 max_length=None (자동 결정)
          - val/test 데이터셋은 max_length=train 데이터셋의 값을 "그대로 물려받는다"
          - batch_size=8, train 만 shuffle=True, train 만 drop_last=True
          - (train_loader, val_loader, test_loader, train_ds, val_ds, test_ds) 반환
       3. 다음을 출력한다
          TRAIN_MAX_LENGTH <값>
          BATCHES <train> <val> <test>
          SHAPE <첫 배치 입력 shape>
          PAD_TOKENS_IN_BATCH <첫 배치에 든 패딩 토큰 개수>
          SAME_MAXLEN <세 데이터셋의 max_length 가 모두 같은가>
       4. 120 / (130,19,38) / (8,120) 이면 LOADER_OK, 아니면 NG

      [제약]
       - val/test 가 자기 데이터에서 max_length 를 계산하게 하지 말 것.
         평가 데이터의 특성이 모델 입력 형태를 바꾸면 데이터 누수(leakage)다
       - 패딩 값을 0 으로 두지 말 것. 0 은 GPT-2 어휘의 "!" 토큰이다
       - 라벨을 문자열 그대로 두지 말고 정수(ham=0, spam=1)로 바꿀 것

      [검증] 다섯 줄을 모두 출력하고, 왜 50256 을 패딩 값으로 쓰는지,
             그리고 val/test 가 train 의 max_length 를 물려받아야 하는 이유를 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from spam_data import build_loaders
      trl, val, tel, trds, vds, tds = build_loaders()
      print('TRAIN_MAX_LENGTH', trds.max_length)
      print('BATCHES', len(trl), len(val), len(tel))
      x, y = next(iter(trl)); print('SHAPE', tuple(x.shape))
      print('PAD_TOKENS_IN_BATCH', (x == 50256).sum().item())
      print('SAME_MAXLEN', trds.max_length == vds.max_length == tds.max_length)
      ok = (trds.max_length == 120 and (len(trl),len(val),len(tel)) == (130,19,38)
            and tuple(x.shape) == (8,120))
      print('LOADER_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `TRAIN_MAX_LENGTH 120`, `BATCHES 130 19 38`, `SHAPE (8, 120)`,
      패딩 토큰이 **50256**, `SAME_MAXLEN True`, `LOADER_OK`. 실측 출력:
      ```
      TRAIN_MAX_LENGTH 120
      BATCHES 130 19 38
      SHAPE (8, 120)
      PAD_TOKENS_IN_BATCH 783
      SAME_MAXLEN True
      ```
      첫 배치 8×120 = 960 칸 중 **783 칸이 패딩**이다 — 실제 내용은 18%뿐이다.

      ## 🔍 에이전트 판정 포인트
      **`SAME_MAXLEN` 이 이 단계의 핵심 검사다.** 에이전트에게 세 데이터셋을 만들라고 하면
      **각각 자기 데이터에서 max_length 를 계산**한다. 그게 자연스러운 코드이기 때문이다.
      그런데 그건 **데이터 누수(leakage)** 다 — 평가 데이터의 특성이 모델 입력 형태를 바꾸면
      안 된다. 실전에서는 새 데이터가 얼마나 길지 모른다.
      ```python
      train_ds = SpamDataset('train.csv', tok, max_length=None)                  # 자동 → 120
      val_ds   = SpamDataset('validation.csv', tok, max_length=train_ds.max_length)
      test_ds  = SpamDataset('test.csv',       tok, max_length=train_ds.max_length)
      ```

      **패딩 값을 0 으로 두면 조용히 틀린다.** 0 은 GPT-2 어휘에서 `"!"` 토큰이다.
      에러는 안 나고, 모델은 문장 끝에 느낌표가 100개 붙은 것으로 읽는다. 정확도가 조금
      떨어지는데 원인이 안 보인다. **`PAD_TOKENS_IN_BATCH` 를 `50256` 기준으로 세는 이유**가
      이것이다 — 0 으로 채웠다면 이 값이 0 으로 나온다.

      **왜 50256 인가.** GPT-2 에는 전용 패딩 토큰이 없다. `<|endoftext|>`(50256, W02 에서
      만든 그 토큰)를 빌려 쓴다.

      **패딩은 W12 에서 다시 나온다** — 그때는 패딩 구간을 손실에서 제외하는 `-100` 마스킹까지
      배운다. 여기서는 "배치를 만들려면 길이를 맞춰야 한다"는 사실만 확인한다.
    hint: '패딩 값이 0이면 GPT-2 어휘의 "!" 토큰이 들어간 것이다 — 50256 이어야 한다'
    answer: |
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from spam_data import build_loaders
      trl, val, tel, trds, vds, tds = build_loaders()
      print('TRAIN_MAX_LENGTH', trds.max_length)
      print('BATCHES', len(trl), len(val), len(tel))
      x, y = next(iter(trl)); print('SHAPE', tuple(x.shape))
      print('PAD_TOKENS_IN_BATCH', (x == 50256).sum().item())
      print('SAME_MAXLEN', trds.max_length == vds.max_length == tds.max_length)
      ok = (trds.max_length == 120 and (len(trl),len(val),len(tel)) == (130,19,38)
