    answer_detail: "주차 간 설정 변경(qkv_bias=False → True)이 정답지에 전파되는지 확인하는 절차가 없으면 이런 일이 생긴다. 학생이 손계산으로 이것을 잡아내는 것이 이 단계의 진짜 목표다."
    verify:
      type: output_contains
      expect: TRAINABLE_OK
      field: stdout
      semantic:
        intent: "헤드 교체·선택적 동결 후 훈련 가능 파라미터 손계산과 정답지 검증"
        success_criteria: ["7,090,946 확인", "5.70% 계산", "교재 오류 2,304 특정"]

  - order: 5
    instruction: |
      ## 🎯 미션 — 왜 **마지막 토큰**의 로짓인가 (W05 인과성의 회수)

      모델 출력은 `[batch, num_tokens, 2]` 다. 여기서 **`logits[:, -1, :]`** 만 쓴다.

      ## 💡 답: 인과 마스크 때문이다
      > **마지막 위치만이 전체 문장을 다 본 유일한 위치이기 때문이다.**

      앞쪽 위치들은 아직 뒷부분을 못 봤다. 문장 전체를 판단해야 하는 분류에서 앞쪽 위치의
      로짓을 쓰는 것은 **문장을 끝까지 읽지 않고 판단하는 것**과 같다.
      **W07 생성에서 `logits[:, -1, :]` 를 쓴 이유와 정확히 같다.**

      ## 💻 실행 명령 (성질로 확인)
      ```bash
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from common import device
      from spam_finetune import load_and_modify
      m, cfg = load_and_modify(strategy='b', verbose=False); m.to(device).eval()
      x1 = torch.randint(0, 50000, (1, 20)).to(device)
      x2 = x1.clone(); x2[0, -1] = (x1[0, -1] + 7) % 50000   # 마지막 토큰만 변경
      with torch.no_grad(): o1, o2 = m(x1), m(x2)
      print('SHAPE', tuple(o1.shape), '(batch, tokens, 2)')
      past_same = torch.allclose(o1[:, :-1], o2[:, :-1], atol=1e-4)
      last_diff = not torch.allclose(o1[:, -1], o2[:, -1], atol=1e-4)
      print('PAST_UNCHANGED', past_same, '| LAST_CHANGED', last_diff)
      print('앞쪽 위치는 마지막 토큰을 보지 못한다 → 분류에 쓸 수 없다')
      print('LAST_TOKEN_LOGIC_OK' if past_same and last_diff else 'NG')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      `SHAPE (1, 20, 2)`, `PAST_UNCHANGED True | LAST_CHANGED True`, `LAST_TOKEN_LOGIC_OK`.
      **앞쪽 출력이 마지막 토큰 변경에 반응하지 않는다는 것이 곧 "전체를 못 봤다"는 증거다.**
    hint: 'W05 의 test_causal_invariance 를 분류 모델에 그대로 적용한 것이다'
