      "마지막 위치에서 다음 토큰을 예측"하도록 최적화돼 있으므로 그 위치의 표현이 가장 잘
      학습돼 있다.

      W05 성질 테스트가 **세 번째로 재사용된다**(W05 어텐션 → W06 블록 → W11 분류기).
      좋은 성질 테스트는 구조가 바뀌어도 그대로 쓸 수 있다.
