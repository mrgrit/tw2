  - order: 3
    instruction: |
      ## 🎯 미션 — 수술 **전** 실패 관찰: GPT-2 는 지시를 못 따른다

      개조하기 전에, 그냥 프롬프트로 시켜 본다.

      ## 💡 시켜 볼 것
      ```
      Is the following text 'spam'? Answer with 'yes' or 'no':
      'You are a winner you have been specially selected to receive $1000 cash...'
      ```

      ## 🔴 예상 결과: **지시를 따르지 못한다**
      GPT-2 는 사전훈련만 된 모델이라 **지시 추종 능력이 없다.** 그냥 다음 단어를 이어 쓸 뿐이다.
      `yes` / `no` 로 답하지 않는다.

      **이 실패가 이번 주 미션의 존재 이유다.** 그리고 13주차 지시 튜닝의 동기이기도 하다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch, tiktoken
      from common import device, text_to_token_ids, token_ids_to_text
      from openai_load import build
      from decoding import generate
      enc = tiktoken.get_encoding('gpt2')
      m, cfg, _ = build('gpt2-small (124M)')
      prompt = (\"Is the following text 'spam'? Answer with 'yes' or 'no':\"
                \" 'You are a winner you have been specially selected to receive \$1000 cash.'\")
      out = generate(m, text_to_token_ids(prompt, enc).to(device), 15,
                     cfg['context_length'], temperature=0.0)
      resp = token_ids_to_text(out, enc)[len(prompt):]
      print('RESPONSE:', repr(resp))
      follows = resp.strip().lower().startswith(('yes', 'no'))
      print('FOLLOWS_INSTRUCTION', follows)
      print('NO_INSTRUCTION_FOLLOWING_CONFIRMED' if not follows else 'UNEXPECTED')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      `FOLLOWS_INSTRUCTION False` 와 `NO_INSTRUCTION_FOLLOWING_CONFIRMED`.
      **지시를 따르면 오히려 이상한 것이다** — 사전훈련 모델은 그럴 능력이 없다.
    hint: '이 실패를 고치려 들지 마라. 관찰이 목적이고, 해법은 개조(이번 주)와 지시 튜닝(W13)이다'
    answer: |
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch, tiktoken
      from common import device, text_to_token_ids, token_ids_to_text
      from openai_load import build
      from decoding import generate
      enc = tiktoken.get_encoding('gpt2')
      m, cfg, _ = build('gpt2-small (124M)')
      prompt = (\"Is the following text 'spam'? Answer with 'yes' or 'no':\"
                \" 'You are a winner you have been specially selected to receive \$1000 cash.'\")
      out = generate(m, text_to_token_ids(prompt, enc).to(device), 15,
                     cfg['context_length'], temperature=0.0)
      resp = token_ids_to_text(out, enc)[len(prompt):]
      print('RESPONSE:', repr(resp))
      follows = resp.strip().lower().startswith(('yes', 'no'))
      print('FOLLOWS_INSTRUCTION', follows)
      print('NO_INSTRUCTION_FOLLOWING_CONFIRMED' if not follows else 'UNEXPECTED')" 2>/dev/null
    answer_detail: "사전훈련 모델은 '다음 토큰 예측기'일 뿐이다. 지시를 따르게 하려면 (a) 구조를 바꾸거나(이번 주 분류 헤드) (b) 지시 데이터로 튜닝해야 한다(W13). 두 경로를 모두 배우는 것이 이 교재의 후반부다."
    verify:
      type: output_contains
      expect: NO_INSTRUCTION_FOLLOWING_CONFIRMED
      field: stdout
      semantic:
        intent: "개조 전 모델이 지시를 따르지 못함을 관찰"
        success_criteria: ["yes/no 로 답하지 못함", "고치지 않고 관찰"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 개조 수술 + **교재 정답지의 오류를 잡아라**

      ## 💡 세 단계 수술
      ```python
      for p in model.parameters(): p.requires_grad = False       # ① 전부 동결
      model.out_head = torch.nn.Linear(768, 2)                   # ② 헤드 교체
      for p in model.trf_blocks[-1].parameters(): p.requires_grad = True   # ③ 선택적 해동
      for p in model.final_norm.parameters():     p.requires_grad = True
      ```

      ## 🔴 손계산 — 그리고 교재가 틀렸다
      | 구성 | 계산 | 값 |
      |---|---|---|
      | 마지막 TransformerBlock | 7,085,568 + **2,304**(QKV bias) | **7,087,872** |
      | 최종 LayerNorm | 768 × 2 | 1,536 |
      | 새 출력 헤드 | 768 × 2 + 2 | 1,538 |
      | **합계** | | **7,090,946** |

      **교재는 7,088,642 라고 적었다. 차이는 2,304 = 3 × 768 이다.**
      W10 에서 OpenAI 가중치를 이식하려고 `qkv_bias=True` 로 바꿨는데, W11 산식이 그 변경을
      반영하지 않았다. 그리고 교재의 "약 4.3%" 도 **수술 전 분모**로 나눈 값이다 —
      수술 후 전체는 **124,441,346** 이므로 실제 비율은 **5.70%** 다.

      **"정답지도 틀릴 수 있다" — W02 `" It' s"` 이후 두 번째 사례다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week11 llm-lab python3 -c "
      import sys; sys.path.insert(0, '.')
      import torch
      from spam_finetune import load_and_modify
      m, cfg = load_and_modify(strategy='b', verbose=False)
      tot = sum(p.numel() for p in m.parameters())
      tr  = sum(p.numel() for p in m.parameters() if p.requires_grad)
      print(f'TOTAL_AFTER_SURGERY {tot:,}')
      print(f'TRAINABLE           {tr:,}')
      print(f'PCT                 {tr/tot*100:.2f}%')
      print(f'TEXTBOOK_CLAIM      7,088,642  (차이 {tr-7088642})')
      print('TRAINABLE_OK' if tr == 7090946 else f'NG (got {tr})')" 2>/dev/null
      ```
      ## ✅ 합격 기준
      `TRAINABLE 7,090,946`, `PCT 5.70%`, 교재 값과의 차이가 **2,304**, `TRAINABLE_OK`.
    hint: '2,304 = 3 × 768 이다. Q/K/V 각각의 bias 가 마지막 블록에 들어 있다'
    answer: |
