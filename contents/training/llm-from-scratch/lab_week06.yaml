      [할 일]
       1. nn.Module 을 상속한 GELU 를 만든다. forward 는 다음 식을 그대로 옮긴다
          GELU(x) = 0.5 · x · (1 + tanh( sqrt(2/pi) · (x + 0.044715 · x³) ))
       2. -3 부터 3 까지 100개 점에서 내 GELU 와 PyTorch 함수를 비교한다
          GELU_ALLCLOSE <allclose 인가, atol=1e-6>
       3. x = -3.0, -0.5, 0.0, 0.5, 3.0 다섯 점에서 GELU 값과 ReLU 값을 나란히 출력한다
          x=<값>  GELU=<값>  ReLU=<값>
       4. allclose 가 True 면 GELU_OK, 아니면 NG

      [제약]
       - 비교 대상은 F.gelu(x, approximate='tanh') 다.
         approximate 인자를 빼면 정확한 erf 버전과 비교하게 되어 미세하게 어긋난다
       - torch.nn.GELU 를 호출해서 감싸지 말 것. 위 식을 직접 구현할 것
       - 상수 0.044715 와 sqrt(2/pi) 를 반올림하지 말 것

      [검증] allclose 결과와 다섯 점 표를 모두 출력하고,
             x=-0.5 에서 GELU 와 ReLU 가 어떻게 다른지, 그 차이가 학습에 왜 중요한지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week06 llm-lab python3 -c "
      import torch
      from layers import GELU
      x = torch.linspace(-3, 3, 100)
      same = torch.allclose(GELU()(x), torch.nn.functional.gelu(x, approximate='tanh'), atol=1e-6)
      print('GELU_ALLCLOSE', same)
      for v in [-3.0, -0.5, 0.0, 0.5, 3.0]:
          t = torch.tensor([v])
          print(f'x={v:5.1f}  GELU={GELU()(t).item():8.5f}  ReLU={torch.relu(t).item():8.5f}')
      print('GELU_OK' if same else 'NG')"
      ```
      ## ✅ 합격 기준
      `GELU_ALLCLOSE True` 와 `GELU_OK`. 실측 출력:
      ```
