  - order: 5
    instruction: |
      ## 🎯 미션 — 잔차 연결: 기울기 소실을 **숫자로** 측정

      "잔차 연결이 깊은 신경망을 가능하게 한다"를 말이 아니라 측정으로 확인한다.

      ## 💡 실험 설계
      5층 MLP(각 층 `Linear + GELU`)를 shortcut 유무 두 버전으로 만들고, 동일 입력·타깃으로
      backward 한 뒤 **각 층 가중치의 기울기 절대 평균**을 비교한다.

      ## 💡 예상 결과 (실측)
      | 층 | shortcut **없음** | shortcut **있음** |
      |---|---|---|
      | `layers.0` (첫 층) | **0.0002017** | **0.2216979** |
      | `layers.4` (마지막) | 0.0050496 | 1.3258542 |

      **첫 층 기울기가 약 1,100배 차이난다.** shortcut 없이는 첫 층이 마지막 층의 **4%** 신호만
      받는다 — 사실상 학습이 안 된다.

      ## 💡 수학적 이유
      `y = x + F(x)` 를 x 로 미분하면 `1 + F'(x)` 다. `F'(x)` 가 아무리 작아져도 **1이 남는다.**
      곱셈이 아니라 덧셈으로 신호가 전달되는 우회로가 생기는 것이다. GPT-2 가 12층, GPT-3 가
      96층을 쌓을 수 있는 이유가 이 한 줄이다.

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week06 llm-lab python3 -c "
      import torch
      from layers import GELU
      class Net(torch.nn.Module):
          def __init__(self, sizes, shortcut):
              super().__init__(); self.shortcut = shortcut
              self.layers = torch.nn.ModuleList([
                  torch.nn.Sequential(torch.nn.Linear(a, b), GELU()) for a, b in zip(sizes[:-1], sizes[1:])])
          def forward(self, x):
              for l in self.layers:
                  out = l(x)
                  x = x + out if (self.shortcut and x.shape == out.shape) else out
              return x
      def first_grad(shortcut):
          torch.manual_seed(123)
          m = Net([3,3,3,3,3,1], shortcut)
          out = m(torch.tensor([[1.,0.,-1.]]))
          torch.nn.MSELoss()(out, torch.tensor([[0.]])).backward()
          return {n: p.grad.abs().mean().item() for n, p in m.named_parameters() if 'weight' in n}
      no_s = first_grad(False); ye_s = first_grad(True)
      for k in no_s: print(f'{k:22s} no_shortcut={no_s[k]:.10f}  shortcut={ye_s[k]:.10f}')
      r = ye_s['layers.0.0.weight'] / no_s['layers.0.0.weight']
      print(f'FIRST_LAYER_RATIO={r:.1f}x')
      print('SHORTCUT_OK' if r > 100 else 'NG')"
