      ## 🎯 미션 — GELU: tanh 근사와 공식 함수 대조

      ## 💡 구현식
      ```
      GELU(x) = 0.5 · x · (1 + tanh(√(2/π) · (x + 0.044715 · x³)))
      ```
      이건 정확한 GELU 의 **tanh 근사**다. PyTorch 는
      `F.gelu(x, approximate="tanh")` 로 같은 근사를 제공한다.
      `approximate` 를 안 주면 정확한 erf 버전이라 미세하게 다르다 — allclose 가 실패할 수 있다.

      ## 💡 ReLU 와 무엇이 다른가
      | 구간 | ReLU | GELU |
      |---|---|---|
      | 큰 음수 | 정확히 0 | 0에 수렴 |
      | **작은 음수** | **0 (완전 차단)** | **작은 음수 (살짝 통과)** |
      | **원점** | **꺾임(미분 불연속)** | **매끄러움** |
      | 큰 양수 | y = x | y = x 에 수렴 |

      원점에서 매끄럽다는 것은 **미분이 연속**이라는 뜻이다. ReLU 는 음수 입력에서 기울기가
      완전히 0이라 뉴런이 "죽을" 수 있지만, GELU 는 작은 음수를 통과시켜 신호가 남는다.

      ## 🤖 에이전트 프롬프트
      ```text
