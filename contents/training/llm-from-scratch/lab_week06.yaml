      x= -3.0  GELU=-0.00364  ReLU= 0.00000
      x= -0.5  GELU=-0.15429  ReLU= 0.00000
      x=  0.0  GELU= 0.00000  ReLU= 0.00000
      x=  0.5  GELU= 0.34571  ReLU= 0.50000
      x=  3.0  GELU= 2.99636  ReLU= 3.00000
      ```
      `x=-0.5` 에서 GELU 는 **-0.15429**, ReLU 는 **정확히 0** 이다.

      ## 🔍 에이전트 판정 포인트
      **`approximate='tanh'` 를 빼면 allclose 가 False 로 나오고, 에이전트는 자기 구현을
      의심하기 시작한다.** 실제로는 비교 대상을 잘못 고른 것이다. PyTorch 기본값은 erf 를 쓰는
      정확한 GELU 이고, 교재가 구현하는 것은 tanh 근사다. **둘은 다른 함수이므로 안 맞는 게
      정상이다.** 여기서 에이전트가 상수 0.044715 를 미세 조정하기 시작하면 즉시 멈춰라 —
      맞춰야 할 것은 상수가 아니라 비교 대상이다.

      **`torch.nn.GELU` 를 감싸서 제출하는 것도 흔하다.** 그러면 `allclose` 는 당연히 True 다.
      직접 구현했는지 코드를 눈으로 확인하라. 자기 자신과 비교하는 검증은 검증이 아니다.

      **ReLU 와의 차이를 학생이 설명할 수 있어야 한다.**
      | 구간 | ReLU | GELU |
      |---|---|---|
      | 큰 음수 | 정확히 0 | 0에 수렴 (-0.00364) |
      | **작은 음수** | **0 (완전 차단)** | **작은 음수 (-0.15429, 살짝 통과)** |
      | **원점** | **꺾임(미분 불연속)** | **매끄러움** |
      | 큰 양수 | y = x | y = x 에 수렴 (2.99636) |

      원점에서 매끄럽다는 것은 **미분이 연속**이라는 뜻이다. ReLU 는 음수 입력에서 기울기가
      완전히 0이라 뉴런이 "죽을" 수 있지만, GELU 는 작은 음수를 통과시켜 신호가 남는다.
      다음 단계(잔차 연결)에서 기울기 이야기가 이어진다.
