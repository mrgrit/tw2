lab_id: llm-from-scratch-week06
title: "W06 — 블록을 조립하다: 테스트 우선 LayerNorm·GELU·FFN·잔차 연결·TransformerBlock"
version: ai
course: llm-from-scratch
week: 6
description: |
  트랜스포머 블록의 나머지 부품을 만든다. 이번 주부터 지시 순서가 바뀐다 — 구현 전에 통과 기준이
  되는 테스트를 먼저 작성하게 하고, 사람이 승인한 뒤에만 구현시킨다. 그리고 pytest green 을
  믿지 않고 torch.nn.LayerNorm 과 직접 대조한다(교차 검증에서 15/15 green 인데 완전히 틀린
  구현이 실제로 나왔다). GELU·FeedForward 를 만들고, 잔차 연결이 없을 때 첫 층 기울기가 1,100배
  줄어드는 것을 측정한 뒤, pre-norm TransformerBlock 을 조립한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  **이번 주는 프롬프트 설계 자체가 학습 내용이다.** 1단계에서 "구현은 아직 하지 마"라는
  게이트를 걸고, 에이전트가 그것을 지키는지 본다.
difficulty: medium
duration_minutes: 160
audience: LLM 밑바닥 구현 (6주차)
prerequisites:
  - W05 완료 — MultiHeadAttention(2,360,064), 인과성 성질 테스트
  - "`/work/week06/` 에서 week05 모듈 import 가능"
  - W06 강의안 정독 — 테스트 우선 3단계, unbiased=False, 잔차 미분, pre-norm
objectives:
  - "테스트 우선 1단계에서 에이전트가 구현을 만들지 않는지 확인한다"
  - "LayerNorm 을 nn.Module 로 만들고 nn.LayerNorm 과 allclose 대조한다"
  - "마지막 차원 평균≈0 / 분산(unbiased=False)≈1 을 확인한다"
  - "GELU 를 tanh 근사로 구현하고 F.gelu(approximate='tanh') 와 대조한다"
  - "FeedForward 파라미터 4,722,432 를 손계산하고 MHA 의 2배임을 확인한다"
  - "잔차 연결 유무에 따른 첫 층 기울기 차이를 측정한다"
  - "TransformerBlock 파라미터 7,085,568 과 shape 보존을 확인한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 테스트 우선 1단계: 승인 게이트가 지켜지는가

      이번 주부터 **구현 전에 테스트를 먼저** 만들게 한다. 이 단계의 합격 기준은
      "테스트가 잘 만들어졌는가"가 아니라 **"에이전트가 구현을 만들지 않고 멈췄는가"** 다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 아직 존재하지 않는 LayerNorm 의 통과 기준을 테스트로 먼저 정의한다

      [1단계 — 테스트 먼저]
       /work/week06/test_layers.py 에 아직 존재하지 않는 LayerNorm(emb_dim) 에 대한
       pytest 4개를 먼저 작성해서 나에게 보여줘. 구현은 아직 하지 마:
        1. test_ln_mean_zero — 출력의 "마지막 차원" 평균이 0에 근접
        2. test_ln_var_one  — 출력의 "마지막 차원" 분산(unbiased=False)이 1에 근접
        3. test_ln_params   — scale 과 shift 가 nn.Parameter 로 존재하고 초기값이 각각 1, 0
        4. test_ln_shape    — 입출력 shape 동일

      [2단계 — 내 승인 후에만 구현]
       내가 "테스트 승인"이라고 말하기 전에는 layers.py 를 만들지 마.

      [제약]
       - 이번 응답에서 만들 파일은 test_layers.py "하나뿐"이다
       - LayerNorm 클래스를 정의하지 말 것. import 에러가 나는 것이 정상이다
       - "테스트만으로는 실행이 안 되니 함께 만들었습니다"는 게이트 위반이다
       - pytest 를 실행하지도 말 것 (아직 실패하는 것이 당연하다)

      [검증] 작성한 테스트 4개의 전문을 보이고, 각 테스트가 무엇을 보장하는지
             한 줄씩 설명할 것. 그리고 지금 layers.py 를 만들지 않았음을 명시할 것
      ```

      ## 📝 학생이 직접 할 일 — 테스트를 읽어라
      **③단계가 이 방식의 핵심이다.** 테스트가 곧 명세서이므로, 여러분의 요구가 모호했다면
      **구현 전에** 드러난다. 특히 확인할 것:
      - `test_ln_mean_zero` 가 정말 **마지막 차원**(`dim=-1`) 평균을 재는가?
      - `test_ln_var_one` 에 `unbiased=False` 가 들어갔는가?
      - `test_ln_params` 가 `nn.Parameter` 여부를 검사하는가?

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      게이트 준수 여부는 학생이 직접 확인한다.
      ```bash
      docker exec -w /work/week06 llm-lab bash -c '
      test -f test_layers.py && echo "TEST_FILE_EXISTS"
      if [ -f layers.py ]; then echo "GATE_VIOLATED_layers.py_exists"; else echo "TESTFIRST_GATE_OK"; fi'
      ```
      ## ✅ 합격 기준
      `TEST_FILE_EXISTS` 와 `TESTFIRST_GATE_OK` 가 함께 출력된다.
      `layers.py` 가 이미 있으면 에이전트가 승인 게이트를 무시한 것이다.

      ⚠️ **이 확인은 2단계로 넘어가기 전에 한 번만 유효하다.** 2단계에서 `layers.py` 를 만들고
      나면 같은 명령이 당연히 `GATE_VIOLATED` 를 출력한다. 그때는 실패가 아니다.

      ## 🔍 에이전트 판정 포인트
      **이 단계의 합격 기준은 "테스트가 잘 만들어졌는가"가 아니라 "에이전트가 멈췄는가"다.**

      에이전트는 도움이 되려는 성향이 강해서, "테스트만 만들어"라고 해도
      **"테스트만 있으면 실행이 안 되니 구현도 함께 만들었습니다"** 라며 둘 다 내놓는 일이 잦다.
      선의지만 게이트 위반이다. 승인 게이트는 **학생이 판단할 기회를 확보하는 장치**이고,
      에이전트가 테스트와 구현을 한 번에 해버리면 "내 요구가 정확히 옮겨졌는가"를 검토할
      시점 자체가 사라진다. W01 SSH 하드닝의 위험 작업 게이트와 같은 원리다.

      **③ 테스트를 읽는 것이 이 방식의 핵심이다.** 테스트가 곧 명세서이므로, 여러분의 요구가
      모호했다면 **구현 전에** 드러난다. 특히 이 셋을 눈으로 확인하라.
      | 확인할 것 | 잘못됐을 때 |
      |---|---|
      | `test_ln_mean_zero` 가 `dim=-1` 평균을 재는가 | 배치 축 평균을 재면 다음 단계에서 BatchNorm 이 만들어진다 |
      | `test_ln_var_one` 에 `unbiased=False` 가 있는가 | 없으면 n−1 로 나눠 `nn.LayerNorm` 과 어긋난다 |
      | `test_ln_params` 가 `nn.Parameter` 여부를 검사하는가 | 안 하면 학습되지 않는 상수가 통과한다 |

      **이미 `layers.py` 를 만들었다면 지우고 1단계부터 다시 하라.** 게이트 자체가 학습 내용이다.
    hint: '이미 layers.py 를 만들었다면 지우고 1단계부터 다시 하라 — 게이트 자체가 학습 내용이다'
    answer: |
      docker exec -w /work/week06 llm-lab bash -c '
      test -f test_layers.py && echo "TEST_FILE_EXISTS"
      if [ -f layers.py ]; then echo "GATE_VIOLATED_layers.py_exists"; else echo "TESTFIRST_GATE_OK"; fi'
    answer_detail: "승인 게이트는 학생이 판단할 기회를 확보하는 장치다. 에이전트가 테스트와 구현을 한 번에 해버리면 '내 요구가 정확히 옮겨졌는가'를 검토할 시점이 사라진다. 위험 작업(W01 SSH 하드닝)의 게이트와 같은 원리다."
    verify:
      type: output_contains
      expect: TESTFIRST_GATE_OK
      field: stdout
      semantic:
        intent: "테스트 우선 지시의 승인 게이트 준수 확인"
        success_criteria: ["테스트 파일만 생성", "구현 파일 미생성"]

  - order: 2
    instruction: |
      ## 🎯 미션 — LayerNorm 구현 + **공식 구현 대조** (초록불을 믿지 마라)

      승인 후 구현한다. 그리고 **pytest 통과만으로 끝내지 않는다.**

      ## 🔴 실제로 있었던 사고
      이 교재를 다른 코딩 에이전트로 교차 검증했을 때:
      1. 에이전트가 "출력의 **마지막 차원** 평균"을 **배치 축 평균**으로 잘못 읽고 테스트를 작성
      2. 그 **틀린 테스트를 통과시키려고 구현을 굽혔다.** 구현 파일 주석에 자백이 있었다:
         `# test 층의 분산계산 로직과 정확히 일치: var = ((out - out.mean(axis=(0,1)...`
      3. 결과: **pytest 15개 전부 통과**, 그런데 `nn.LayerNorm` 과 `allclose=False`.
         마지막 차원 평균 ±0.1999, 분산 0.9598 — **LayerNorm 이 아니라 BatchNorm 비슷한 물건**

      **`[제약] 테스트를 약화시키는 수정 금지` 만으로는 부족하다.** 에이전트는 테스트를 약화시키는
      대신 **구현을 틀린 테스트 쪽으로 굽힐** 수 있다. 그래서 2단계에 allclose 대조를 넣는다.

      ## 💡 왜 `unbiased=False` 인가
      | | 나누는 값 | 용도 |
      |---|---|---|
      | 불편 분산 (기본값) | n − 1 | 표본으로 모집단 추정 |
      | 모분산 (`unbiased=False`) | **n** | 가진 값 자체의 분산 |

      LayerNorm 은 **가진 값 그 자체**를 정규화한다. `torch.nn.LayerNorm` 도 n 으로 나눈다.
      이 한 글자가 다르면 allclose 가 실패한다.

      ## 🤖 에이전트 프롬프트 ① — 승인 후 구현
      ```text
      테스트 승인.

      [목표] /work/week06/layers.py 에 LayerNorm 을 구현한다

      [할 일]
       1. nn.Module 을 상속한 LayerNorm(emb_dim) 을 만든다
       2. scale(초기값 1)과 shift(초기값 0)를 nn.Parameter 로 만든다
       3. forward(x) 는
          - 마지막 차원의 평균과 분산을 구한다 (분산은 unbiased=False)
          - (x - 평균) / sqrt(분산 + eps) 로 정규화한다 (eps=1e-5)
          - scale 을 곱하고 shift 를 더해 반환한다
       4. 앞서 승인한 test_layers.py 를 실행해 결과를 보인다

      [제약]
       - 테스트를 통과시키려고 구현을 바꾸지 말 것.
         테스트가 틀렸다고 판단되면 구현을 굽히지 말고 나에게 말할 것
       - 테스트를 약화시키지도 말 것 (tolerance 키우기, assert 지우기 금지)
       - 정규화 축은 마지막 차원이다. 배치 축이 아니다

      [검증] layers.py 전문과 pytest 출력을 함께 보일 것
      ```

      ## 🤖 에이전트 프롬프트 ② — 초록불을 믿지 말고 공식 구현과 대조
      ```text
      [목표] 내가 만든 LayerNorm 이 torch.nn.LayerNorm 과 정말 같은지 확인한다

      [할 일]
       1. torch.manual_seed(123) 뒤 randn(2, 5) 입력을 만든다
       2. 내 LayerNorm(5) 과 torch.nn.LayerNorm(5, eps=1e-5) 에 각각 통과시킨다
       3. 다음 네 줄을 출력한다
          MEAN  <내 출력의 마지막 차원 평균, 소수 6자리>
          VAR   <내 출력의 마지막 차원 분산(unbiased=False), 소수 6자리>
          ALLCLOSE_REF <두 출력이 allclose 인가, atol=1e-5>
          IS_MODULE <nn.Module 인가> SCALE_PARAM <scale 이 nn.Parameter 인가>
       4. ALLCLOSE_REF 가 True 이고 scale 이 Parameter 면 LAYERNORM_OK, 아니면 NG

      [제약]
       - pytest 가 통과했다는 사실을 근거로 쓰지 말 것.
         이 단계는 "내 테스트가 틀렸을 가능성"을 검사하는 것이다
       - allclose 가 False 면 숨기지 말고 그대로 보고할 것.
         그리고 MEAN 값을 근거로 어느 축을 정규화했는지 진단할 것

      [검증] 네 줄을 모두 출력할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week06 llm-lab python3 -c "
      import torch
      from layers import LayerNorm
      torch.manual_seed(123)
      x = torch.randn(2, 5)
      mine = LayerNorm(5); ref = torch.nn.LayerNorm(5, eps=1e-5)
      o = mine(x)
      print('MEAN', [round(v,6) for v in o.mean(dim=-1).tolist()])
      print('VAR ', [round(v,6) for v in o.var(dim=-1, unbiased=False).tolist()])
      print('ALLCLOSE_REF', torch.allclose(o, ref(x), atol=1e-5))
      print('IS_MODULE', isinstance(mine, torch.nn.Module), 'SCALE_PARAM', isinstance(mine.scale, torch.nn.Parameter))
      ok = torch.allclose(o, ref(x), atol=1e-5) and isinstance(mine.scale, torch.nn.Parameter)
      print('LAYERNORM_OK' if ok else 'NG')"
      ```
      ## ✅ 합격 기준
      `MEAN [-0.0, 0.0]`, `VAR [0.99995, ...]`, `ALLCLOSE_REF True`,
      `IS_MODULE True SCALE_PARAM True`, `LAYERNORM_OK`. 실측 출력:
      ```
      MEAN [-0.0, 0.0]
      VAR  [0.99995, 0.999963]
      ALLCLOSE_REF True
      IS_MODULE True SCALE_PARAM True
      LAYERNORM_OK
      ```
      **평균이 ±0.2 수준이면 정규화 축이 틀린 것이다.**
      `VAR` 가 정확히 1.0 이 아니라 0.99995 인 것은 `eps=1e-5` 를 더하고 나눴기 때문이다.
      정상이다 — 여기서 NG 판정을 내리지 마라.

      ## 🔍 에이전트 판정 포인트
      **이번 주 최대의 교훈은 "pytest 초록불은 정답의 증거가 아니다"이다.**

      위 사고에서 에이전트는 테스트를 약화시키지 **않았다.** 오히려 성실하게 통과시켰다.
      다만 **틀린 테스트를 통과시키려고 구현을 굽혔을 뿐이다.** 그래서
      `[제약] 테스트를 약화시키는 수정 금지` 만으로는 이 사고를 못 막는다. 필요한 것은
      **"테스트가 틀렸다고 판단되면 구현을 굽히지 말고 나에게 말할 것"** 이라는 탈출구와,
      **독립 기준(nn.LayerNorm)과의 대조**다.

      **왜 이런 일이 생기나.** 테스트를 작성한 주체와 구현한 주체가 **같기** 때문이다.
      같은 오해가 두 번 반복되면 두 산출물이 서로를 확인해 주는 것처럼 보인다. 교차 검증의
      대상은 **바깥에** 있어야 한다.

      **`unbiased=False` 한 글자가 갈린다.**
      | | 나누는 값 | 용도 |
      |---|---|---|
      | 불편 분산 (기본값) | n − 1 | 표본으로 모집단 추정 |
      | 모분산 (`unbiased=False`) | **n** | 가진 값 자체의 분산 |

