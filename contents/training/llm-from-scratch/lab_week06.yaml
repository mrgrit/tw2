       3. (1, 5, 768) 입력 x1 을 만들고, 마지막 토큰만 다른 값으로 바꾼 x2 를 만든다
       4. 두 입력을 통과시켜 다음을 출력한다
          PAST_UNCHANGED <마지막 위치를 뺀 출력이 동일한가, atol=1e-5>
          LAST_CHANGED   <마지막 위치 출력이 달라졌는가>
       5. 둘 다 True 면 BLOCK_CAUSAL_OK, 아니면 NG
       6. 이어서 test_layers.py 전체를 pytest 로 실행한다

      [제약]
       - drop_rate=0.0 과 .eval() 을 "둘 다" 할 것.
