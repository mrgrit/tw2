      ```text
      [목표] W05 에서 만든 인과성 성질 테스트를 TransformerBlock 에 그대로 적용한다

      [할 일]
       1. GPT_CONFIG_124M 을 복사해 drop_rate 를 0.0 으로 바꾼 설정으로 블록을 만든다
