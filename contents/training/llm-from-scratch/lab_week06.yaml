  - order: 4
    instruction: |
      ## 🎯 미션 — FeedForward: 파라미터의 무게중심 (4,722,432)

      ## 💡 구조
      `Linear(768 → 3072) → GELU → Linear(3072 → 768)` — **4배로 늘렸다 되돌린다.**
      넓은 공간에서 비선형 변환을 하고 다시 원래 차원으로 압축하는 것이다.

      ## 💡 손계산
      > `(768 × 3072 + 3072) + (3072 × 768 + 768)`
      > `= 2,362,368 + 2,360,064 = ` **4,722,432**

      `768 × 3072 = 2,359,296` 이다. **직접 계산해 대조하라.**

      ## 🔴 놀라운 사실 — FFN 이 어텐션보다 크다
      | 부품 | 파라미터 | 비율 |
      |---|---|---|
      | MultiHeadAttention (W05) | 2,360,064 | 1.00× |
      | **FeedForward** | **4,722,432** | **2.00×** |

      트랜스포머의 상징은 어텐션인데 **파라미터의 무게중심은 FFN 에 있다.**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week06 llm-lab python3 -c "
      import torch
      from layers import FeedForward
      from transformer_block import GPT_CONFIG_124M
      ff = FeedForward(GPT_CONFIG_124M)
      p = sum(q.numel() for q in ff.parameters())
      print('FFN_PARAMS', f'{p:,}')
      print('FORMULA   ', 768*3072 + 3072 + 3072*768 + 768)
      print('OUT_SHAPE ', tuple(ff(torch.rand(2,3,768)).shape))
      print('RATIO_TO_MHA', round(p/2360064, 2))
      print('FFN_PARAM_OK' if p == 4722432 else 'NG')"
      ```
      ## ✅ 합격 기준
      `FFN_PARAMS 4,722,432`, 공식과 일치, `OUT_SHAPE (2, 3, 768)`,
      `RATIO_TO_MHA 2.0`, `FFN_PARAM_OK`.
    hint: '4배 확장(emb_dim → 4*emb_dim)과 두 Linear 의 bias 를 모두 세었는지 확인하라'
