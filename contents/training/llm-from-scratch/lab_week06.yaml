      layers.1.0.weight      no_shortcut=0.0001201116  shortcut=0.2069410682
      layers.2.0.weight      no_shortcut=0.0007152041  shortcut=0.3289699554
      layers.3.0.weight      no_shortcut=0.0013988733  shortcut=0.2665732503
      layers.4.0.weight      no_shortcut=0.0050496454  shortcut=1.3258541822
      FIRST_LAYER_RATIO=1099.0x
      ```
