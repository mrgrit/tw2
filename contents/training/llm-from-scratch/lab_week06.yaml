      **`LAST_CHANGED` 를 왜 같이 보나.** `PAST_UNCHANGED` 만 검사하면 **아무것도 안 하는
      구현이 통과한다.** 출력이 입력과 무관하게 상수라면 무엇을 바꿔도 과거 출력은 안 변하니까.
      "변하지 않아야 할 것이 안 변했다"와 "변해야 할 것이 변했다"를 **짝으로** 확인해야
      의미 있는 테스트가 된다. 에이전트에게 성질 테스트를 시킬 때 자주 빠지는 절반이다.

      **dropout 을 끄지 않으면 두 값이 모두 뒤죽박죽 나온다.** `drop_rate=0.0` 과 `.eval()`
      둘 다 필요하다 — 전자는 확률을 0으로, 후자는 모듈을 추론 모드로 바꾼다. 어느 하나만
      해도 이 실습에서는 통과할 수 있지만, 습관으로는 둘 다 붙이는 게 맞다.
      **평가 코드에는 `model.eval()` 과 `torch.no_grad()` 를 항상 짝으로 넣는다.**

      **`x2 = x1` 로 두면 clone 이 안 돼 x1 까지 바뀐다.** 그러면 두 입력이 완전히 같아져
      `PAST_UNCHANGED` 는 True, `LAST_CHANGED` 는 False 가 나온다. 판정 줄이 잡아 준다.

      **왜 인과성이 유지되는가 — 학생이 답할 수 있어야 한다.**
      | 부품 | 토큰 간 정보 이동 |
      |---|---|
      | LayerNorm | 각 토큰의 마지막 차원만 → **없음** ✅ |
      | FeedForward | 각 토큰에 독립 적용 → **없음** ✅ |
      | 어텐션 | 인과 마스크로 과거만 ✅ |

      **세 부품 중 토큰을 섞는 것은 어텐션뿐이다.** 그래서 W05 의 `test_causal_invariance` 를
      블록에 그대로 적용해도 통과한다. 통과하지 않는다면 **어딘가에서 토큰 축을 건드린 것**이다.
      구현이 바뀌어도, 부품이 늘어나도 같은 규칙으로 검사할 수 있다 — 이것이 성질 테스트의 힘이다.
    hint: 'drop_rate=0.0 과 .eval() 을 둘 다 해야 결정적이 된다'
    answer: |
      docker exec -w /work/week06 llm-lab python3 -c "
      import torch
      from transformer_block import TransformerBlock, GPT_CONFIG_124M
      torch.manual_seed(123)
      cfg = dict(GPT_CONFIG_124M); cfg['drop_rate'] = 0.0
      blk = TransformerBlock(cfg).eval()
      x1 = torch.rand(1, 5, 768)
      x2 = x1.clone(); x2[0, -1] = torch.rand(768)
      with torch.no_grad(): o1, o2 = blk(x1), blk(x2)
      same_past = torch.allclose(o1[:, :-1], o2[:, :-1], atol=1e-5)
      diff_last = not torch.allclose(o1[:, -1], o2[:, -1], atol=1e-5)
      print('PAST_UNCHANGED', same_past); print('LAST_CHANGED  ', diff_last)
      print('BLOCK_CAUSAL_OK' if same_past and diff_last else 'NG')"
      docker exec -w /work/week06 llm-lab python3 -m pytest test_layers.py -q
