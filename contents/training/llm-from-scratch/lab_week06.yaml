      ## 🎯 미션 — TransformerBlock 조립 (7,085,568 / shape 보존)

      네 부품을 pre-norm 구조로 합친다.

      ## 💡 구조 (GPT-2 = pre-norm)
      ```
      서브층 1: x → LayerNorm → MultiHeadAttention → Dropout → + x (잔차)
      서브층 2: x → LayerNorm → FeedForward      → Dropout → + x (잔차)
      ```

      | 구조 | 순서 | 특징 |
      |---|---|---|
      | post-norm (원 논문) | `LayerNorm(x + Sublayer(x))` | 워밍업 없이는 불안정 |
      | **pre-norm (GPT-2)** | **`x + Sublayer(LayerNorm(x))`** | 잔차 경로가 정규화를 안 거침 → 안정 |

      pre-norm 에서는 `x` 가 LayerNorm 을 통과하지 않고 그대로 더해진다. 5단계에서 본
      "1 이라는 고속도로"가 **끝까지 막히지 않는다.**

      ## 💡 손계산
      > `2,360,064` (MHA) `+ 4,722,432` (FFN) `+ 3,072` (LayerNorm 2개 × 768 × 2)
      > `= ` **7,085,568**

