      ## 💡 왜 유지되는가
      | 부품 | 토큰 간 정보 이동 |
      |---|---|
      | LayerNorm | 각 토큰의 마지막 차원만 → **없음** ✅ |
      | FeedForward | 각 토큰에 독립 적용 → **없음** ✅ |
      | 어텐션 | 인과 마스크로 과거만 ✅ |

      **세 부품 중 토큰을 섞는 것은 어텐션뿐이다.** 그래서 W05 의 `test_causal_invariance` 를
      블록에 그대로 적용해도 통과해야 한다. 통과하지 않는다면 **어딘가에서 토큰 축을 건드린 것**이다.

