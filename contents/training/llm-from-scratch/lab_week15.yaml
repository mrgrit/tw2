lab_id: llm-from-scratch-week15
title: "W15 — 발표회: 시연 드라이런·검증의 순간·5분 전 체크리스트·포트폴리오 아카이빙"
version: ai
course: llm-from-scratch
week: 15
description: |
  마지막 주는 증명이다. 시연 시나리오를 2회 드라이런해 실행 시간과 설명 시간을 따로 산정하고
  (실행은 27초, 10분을 채우는 것은 사람의 말이다), 시나리오에 "검증의 순간"을 배치해 데모를
  쇼가 아닌 증명으로 만든다. 발표 5분 전 체크리스트를 명령어 수준으로 만들고, 마지막으로 한 학기
  저장소를 포트폴리오 README 로 정리하되 모든 상대 링크가 실재하는지 검증한다.
difficulty: medium
duration_minutes: 140
audience: LLM 밑바닥 구현 (15주차 발표)
prerequisites:
  - W14 완료 — 프로젝트 결과물과 개인 프롬프트 로그
  - W13 산출물(sft_355m.pth, lora_355m_r16.pth) 및 W10 가중치 캐시 보유
  - 호스트 Ollama 실행 중
  - W15 강의안 정독 — 시연 3규칙, 실행/설명 시간 분리, 링크 검증
objectives:
  - "시연 시나리오에 '검증의 순간'을 1개 이상 배치한다"
  - "드라이런을 2회 실행해 단계별 시간과 재현성을 측정한다"
  - "실행 시간과 설명 시간을 따로 산정해 10분에 맞춘다"
  - "발표 5분 전 체크리스트를 명령어 수준으로 만든다"
  - "포트폴리오 README 를 작성하고 모든 상대 링크를 검증한다"
  - "기말 평가 배분 합이 100% 인지 검산한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 시연 시나리오에 **"검증의 순간"** 배치

      ## 🔴 데모는 쇼가 아니라 증명이다
      시연 시나리오에는 반드시 **"검증의 순간"** 을 하나 넣어야 한다 —
      게이트 통과, 성질 테스트 실행, 전후 비교 수치.

      ## 💡 좋은 "검증의 순간" 예
      | 예 | 무엇을 증명하나 |
      |---|---|
      | **LoRA 항등 게이트** 실행 (B=0 → 손실 3.8172 일치) | "적용 직후 모델이 안 망가졌다" |
      | **저지 상한/하한** 채점 (정답 93점 / 엉터리 41.9점) | "이 평가는 신뢰 구간이 있다" |
      | 캐시 on/off **동일성 게이트** | "최적화가 결과를 바꾸지 않았다" |
      | ±1%p **재현 게이트** | "이 수치는 우연이 아니다" |

      ## 💡 시연 3규칙
      1. **콜드 스타트를 밝혀라** — 미리 띄워둔 것 vs 현장 실행을 시작할 때 선언
      2. **실패는 감점이 아니다 — 대응이 평가다** (원인을 좁히는 3분은 가산 대상)
      3. **검증의 순간을 넣어라**

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import re
      t = open('demo_scenario.md', encoding='utf-8').read()
      steps = re.findall(r'^\|\s*(\d+)\s*\|\s*(.+?)\s*\|', t, re.M)
      print('STEPS', len(steps))
      for n, s in steps: print(f'  {n}.', s[:60])
      verify_steps = [s for _, s in steps if '검증' in s or '게이트' in s or '테스트' in s]
      print('VERIFICATION_MOMENTS', len(verify_steps))
      for s in verify_steps: print('  *', s[:60])
      narr = re.findall(r'^\s*>\s*말할 것:', t, re.M)
      print('NARRATION_LINES', len(narr))
      cold = '콜드' in t or '미리' in t
      print('COLD_START_DECLARED', cold)
      print('DEMO_SCENARIO_OK' if len(verify_steps) >= 1 and cold and len(narr) >= 1 else 'NG')"
      ```
      ## ✅ 합격 기준
      `VERIFICATION_MOMENTS` 가 **1 이상**, `COLD_START_DECLARED True`, `DEMO_SCENARIO_OK`.
    hint: '검증의 순간이 없으면 "잘 되는 것처럼 보이는 화면"만 남는다'
    answer: |
