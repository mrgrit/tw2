lab_id: llm-from-scratch-week15
title: "W15 — 발표회: 시연 드라이런·검증의 순간·5분 전 체크리스트·포트폴리오 아카이빙"
version: ai
course: llm-from-scratch
week: 15
description: |
  마지막 주는 증명이다. 시연 시나리오를 2회 드라이런해 실행 시간과 설명 시간을 따로 산정하고
  (실행은 27초, 10분을 채우는 것은 사람의 말이다), 시나리오에 "검증의 순간"을 배치해 데모를
  쇼가 아닌 증명으로 만든다. 발표 5분 전 체크리스트를 명령어 수준으로 만들고, 마지막으로 한 학기
  저장소를 포트폴리오 README 로 정리하되 모든 상대 링크가 실재하는지 검증한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.

  ## 🎓 마지막 주의 프롬프트는 짧습니다

  15주차 프롬프트는 대부분 **"만들어라"가 아니라 "검사해라"** 다. 만드는 것(시나리오·대본·
  체크리스트)은 여러분의 몫이고, 에이전트는 그것이 요구를 지켰는지 기계적으로 확인한다.
  **이 역할 분담이 한 학기의 결론이다.**
difficulty: medium
duration_minutes: 140
audience: LLM 밑바닥 구현 (15주차 발표)
prerequisites:
  - W14 완료 — 프로젝트 결과물과 개인 프롬프트 로그
  - W13 산출물(sft_355m.pth, lora_355m_r16.pth) 및 W10 가중치 캐시 보유
  - 호스트 Ollama 실행 중
  - W15 강의안 정독 — 시연 3규칙, 실행/설명 시간 분리, 링크 검증
objectives:
  - "시연 시나리오에 '검증의 순간'을 1개 이상 배치한다"
  - "드라이런을 2회 실행해 단계별 시간과 재현성을 측정한다"
  - "실행 시간과 설명 시간을 따로 산정해 10분에 맞춘다"
  - "발표 5분 전 체크리스트를 명령어 수준으로 만든다"
  - "포트폴리오 README 를 작성하고 모든 상대 링크를 검증한다"
  - "기말 평가 배분 합이 100% 인지 검산한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 시연 시나리오에 **"검증의 순간"** 배치

      ## 🔴 데모는 쇼가 아니라 증명이다
      시연 시나리오에는 반드시 **"검증의 순간"** 을 하나 넣어야 한다 —
      게이트 통과, 성질 테스트 실행, 전후 비교 수치.

      ## 💡 좋은 "검증의 순간" 예
      | 예 | 무엇을 증명하나 |
      |---|---|
      | **LoRA 항등 게이트** 실행 (B=0 → 손실 3.8172 일치) | "적용 직후 모델이 안 망가졌다" |
      | **저지 상한/하한** 채점 (정답 93점 / 엉터리 41.9점) | "이 평가는 신뢰 구간이 있다" |
      | 캐시 on/off **동일성 게이트** | "최적화가 결과를 바꾸지 않았다" |
      | ±1%p **재현 게이트** | "이 수치는 우연이 아니다" |

      ## 💡 시연 3규칙
      1. **콜드 스타트를 밝혀라** — 미리 띄워둔 것 vs 현장 실행을 시작할 때 선언
      2. **실패는 감점이 아니다 — 대응이 평가다** (원인을 좁히는 3분은 가산 대상)
      3. **검증의 순간을 넣어라**

      ## 🤖 에이전트 프롬프트 — 시나리오는 여러분이 쓰고, 검사만 시킨다
      ```text
      [목표] 내가 쓴 /work/week15/demo_scenario.md 가 시연 3규칙을 지켰는지 검사한다

      [입력] demo_scenario.md (내가 직접 작성한 파일)

      [할 일]
       1. 단계 표를 파싱해 단계 수와 각 단계 제목을 나열한다
       2. 제목에 '검증' / '게이트' / '테스트' 가 든 단계를 찾아 "검증의 순간"으로 센다
       3. 각 단계에 "> 말할 것:" 대본 줄이 붙어 있는지 세어 출력한다
       4. '콜드' 또는 '미리' 라는 단어로 콜드 스타트 선언이 있는지 확인한다
       5. 검증의 순간이 1개 이상, 콜드 스타트 선언이 있고, 대본이 1줄 이상이면
          DEMO_SCENARIO_OK, 아니면 NG

      [제약]
       - 시나리오를 대신 써 주지 말 것. 검사만 한다
       - 부족한 항목이 있으면 "무엇이 몇 개 부족한지"만 알려주고,
          내용을 채워 주지 말 것
       - 검증의 순간을 제목만 보고 판정할 것.
          본문에 '검증'이라는 단어가 있다고 통과시키지 말 것

      [검증] 네 지표를 모두 출력하고, 검증의 순간으로 잡힌 단계 제목을 그대로 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import re
      t = open('demo_scenario.md', encoding='utf-8').read()
      steps = re.findall(r'^\|\s*(\d+)\s*\|\s*(.+?)\s*\|', t, re.M)
      print('STEPS', len(steps))
      for n, s in steps: print(f'  {n}.', s[:60])
      verify_steps = [s for _, s in steps if '검증' in s or '게이트' in s or '테스트' in s]
      print('VERIFICATION_MOMENTS', len(verify_steps))
      for s in verify_steps: print('  *', s[:60])
      narr = re.findall(r'^\s*>\s*말할 것:', t, re.M)
      print('NARRATION_LINES', len(narr))
      cold = '콜드' in t or '미리' in t
      print('COLD_START_DECLARED', cold)
      print('DEMO_SCENARIO_OK' if len(verify_steps) >= 1 and cold and len(narr) >= 1 else 'NG')"
      ```
      ## ✅ 합격 기준
      `VERIFICATION_MOMENTS` 가 **1 이상**, `COLD_START_DECLARED True`, `DEMO_SCENARIO_OK`.
      실측 출력(예시 시나리오):
      ```
      STEPS 8
        1. 환경 확인
        2. 튜닝 **전** 모델 로드
        3. 튜닝 전 응답
        4. 튜닝 **후** 모델 로드
        5. 튜닝 후 응답
        6. **검증의 순간 ①**
        7. **검증의 순간 ②**
        8. 3축 비교표
      VERIFICATION_MOMENTS 2
      NARRATION_LINES 8
      COLD_START_DECLARED True
      ```

      ## 🔍 에이전트 판정 포인트
      **시나리오를 에이전트에게 쓰게 하면 검증의 순간이 빠진다.** "인상적인 데모를 만들어라"
      라고 하면 **결과가 잘 나오는 장면**을 배치한다 — 생성문, 비교표, 그래프. 그건 쇼다.
      **게이트가 통과하는 장면**은 시키지 않으면 안 넣는다.

      **검증의 순간이 없으면 "잘 되는 것처럼 보이는 화면"만 남는다.** 심사자 입장에서
      결과 화면은 얼마든지 미리 만들어 둘 수 있는 것이다. **그 자리에서 게이트가 통과하는
      장면**이 훨씬 설득력 있다.

      **좋은 "검증의 순간" 예 — 전부 한 학기 동안 만든 것이다.**
      | 예 | 무엇을 증명하나 |
      |---|---|
      | **LoRA 항등 게이트** (B=0 → 손실 3.8172 일치) | "적용 직후 모델이 안 망가졌다" |
      | **저지 상한/하한** (정답 93점 / 엉터리 41.9점) | "이 평가는 신뢰 구간이 있다" |
      | 캐시 on/off **동일성 게이트** | "최적화가 결과를 바꾸지 않았다" |
      | ±1%p **재현 게이트** | "이 수치는 우연이 아니다" |

      **콜드 스타트 선언을 빠뜨리면 나중에 의심받는다.** 미리 띄워 둔 것과 현장 실행을
      구분해 말하지 않으면, 심사자는 어디까지가 준비된 화면인지 알 수 없다.
      **선언하는 것이 오히려 신뢰를 준다.**
    hint: '검증의 순간이 없으면 "잘 되는 것처럼 보이는 화면"만 남는다'
    answer: |
      docker exec -w /work/week15 llm-lab python3 -c "
      import re
      t = open('demo_scenario.md', encoding='utf-8').read()
      steps = re.findall(r'^\|\s*(\d+)\s*\|\s*(.+?)\s*\|', t, re.M)
      print('STEPS', len(steps))
      for n, s in steps: print(f'  {n}.', s[:60])
      verify_steps = [s for _, s in steps if '검증' in s or '게이트' in s or '테스트' in s]
      print('VERIFICATION_MOMENTS', len(verify_steps))
      for s in verify_steps: print('  *', s[:60])
      narr = re.findall(r'^\s*>\s*말할 것:', t, re.M)
      print('NARRATION_LINES', len(narr))
      cold = '콜드' in t or '미리' in t
      print('COLD_START_DECLARED', cold)
      print('DEMO_SCENARIO_OK' if len(verify_steps) >= 1 and cold and len(narr) >= 1 else 'NG')"
    answer_detail: "한 학기 동안 만든 게이트와 성질 테스트를 무대 위에서 실물로 돌리는 것이 이 과목의 마지막 학습 내용이다. 결과 화면보다 '검증이 통과하는 장면'이 훨씬 설득력 있다."
    verify:
      type: output_contains
      expect: DEMO_SCENARIO_OK
      field: stdout
      semantic:
        intent: "시연 시나리오에 검증의 순간과 콜드 스타트 선언을 배치"
        success_criteria: ["검증의 순간 1+", "콜드 스타트 명시", "단계별 명령 기술"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 드라이런 2회: 실행 시간 측정과 재현성

      ## 🔴 "실행 시간 10분"이라는 함정
      **명령 실행 시간만으로는 10분을 넘기기 어렵다.**

      | 단계 (8단계 시나리오) | 1회차 | 2회차 |
      |---|---|---|
      | 1. 환경 확인 (nvidia-smi) | 0.04초 | 0.02초 |
      | 2. 튜닝 전 355M 로드 | 1.97초 | 1.67초 |
      | 3. 튜닝 전 응답 3개 | 1.35초 | 1.16초 |
      | 4. 튜닝 후 모델 로드 | 1.57초 | **0.40초** |
      | 5. 튜닝 후 응답 3개 | 0.62초 | 0.62초 |
      | **6. 검증의 순간 ① — LoRA 항등 게이트** | 3.64초 | 3.52초 |
      | **7. 검증의 순간 ② — 저지 상한/하한** | 5.87초 | 3.75초 |
      | 8. 3축 비교표 출력 | 0.00초 | 0.00초 |
      | **합계** | **15.05초** | **11.14초** |

      ⚠️ **절대 시간은 장비와 캐시 상태에 따라 다르다.** 위는 GB10 실측이고, 다른 장비에서는
      수십 초가 될 수 있다. **판정 기준은 "몇 초인가"가 아니라 "10분에 한참 못 미친다"이다.**

      ## 💡 두 번 돌려서 차이를 보라
      첫 실행과 두 번째 실행의 시간이 다르다 — **파일 캐시가 데워졌기 때문**이다.
      발표장에서는 두 번째 실행 조건을 만들어 두는 것이 안전하다(사전에 한 번 돌려 캐시를 데운다).

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week15/dryrun.py 를 만들어 시연 시나리오를 2회 자동 실행하고 시간을 잰다

      [할 일]
       1. demo_scenario.md 의 8단계를 코드로 옮긴다
       2. 각 단계의 소요 시간을 개별로 측정한다
       3. 전체를 "두 번" 반복 실행하고 두 회차의 시간을 각각 기록한다
       4. 결과를 dryrun.json 에 저장한다
          키: run1(단계명, 시간 쌍의 리스트), run2(동일), total1, total2
       5. 단계별 1회차 → 2회차 시간과 총합, 워밍업 이득을 출력한다
       6. 두 총합이 모두 0보다 크면 DRYRUN_OK

       추가로: 시연 중 발생할 수 있는 위험(콜드 스타트, 네트워크 의존, 잔여 GPU 상태)과
       각각의 완화책을 함께 출력한다

      [제약]
       - 모델을 단계마다 새로 로드하지 말 것. 한 번 로드해 재사용한다
         (매번 로드하면 시연이 몇 분씩 걸린다)
       - GPU 시간 측정 전후에 torch.cuda.synchronize() 를 호출할 것 (W09 규약)
       - 2회차에서 캐시를 일부러 비우지 말 것.
         "워밍업된 상태"가 실제 발표 조건이다
       - 저지(Ollama)가 안 뜨면 그 단계를 skip 하되, skip 했다는 사실을 출력할 것

      [검증] 단계별 두 회차 시간을 나란히 보이고,
             1회차와 2회차가 가장 크게 차이 나는 단계를 지목해 이유를 답할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week15 llm-lab python3 dryrun.py
      ```
      ## ✅ 합격 기준
      `dryrun.json` 이 생성되고 2회 실행 시간이 기록된다. 두 번째가 대체로 더 빠르다.

      ## 💻 결과 확인
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import json
      d = json.load(open('dryrun.json'))
      print(f\"TOTAL_RUN1 {d['total1']:.2f}s   TOTAL_RUN2 {d['total2']:.2f}s\")
      for (n1, t1), (n2, t2) in zip(d['run1'], d['run2']):
          print(f'  {n1[:44]:46s} {t1:6.2f}s -> {t2:6.2f}s')
      print(f\"WARMUP_GAIN {d['total1']-d['total2']:.2f}s\")
      print('DRYRUN_OK' if d['total1'] > 0 and d['total2'] > 0 else 'NG')"
      ```
      실측 출력:
      ```
      TOTAL_RUN1 15.05s   TOTAL_RUN2 11.14s
        4. 튜닝 후 모델 로드 (sft_355m.pth)        1.57s ->   0.40s   ← 4배 빨라짐
        7. 검증의 순간 ② — 저지 상한/하한             5.87s ->   3.75s
      WARMUP_GAIN 3.91s
      ```

      ## 🔍 에이전트 판정 포인트
      **워밍업 이득이 가장 큰 단계가 어디인지 보라.** 4번(체크포인트 로드)이 1.57초 →
      **0.40초**로 4배 빨라졌다. **파일 캐시가 데워졌기 때문**이다. 발표장에서는
      **두 번째 실행 조건을 만들어 두는 것이 안전하다** — 사전에 한 번 돌려 캐시를 데운다.
      이것이 4단계 체크리스트 6번(파일 캐시 데우기)의 근거다.

      **에이전트가 단계마다 모델을 새로 로드하면 시연이 몇 분씩 걸린다.** 각 단계를 독립
