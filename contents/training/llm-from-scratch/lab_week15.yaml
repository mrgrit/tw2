       4. 하이라이트 (10주차 4모델 비교표, 프로젝트 결과)
       5. 재현 방법 (환경, 주차별 실행 진입점)
      [제약] 없는 것을 포장하지 말 것 — 링크가 실재하는지 전부 확인 후 작성
      [검증] README의 모든 상대 링크가 유효한지 검사해 보고할 것
      ```

      ## 🔴 `[제약] 없는 것을 포장하지 말 것` 이 핵심이다
      에이전트는 README 를 쓸 때 **그럴듯한 파일 경로를 지어낸다.** 그리고 그건 포트폴리오를
      여는 사람이 링크를 눌러 보는 순간 드러난다.
      **그래서 "모든 상대 링크가 유효한지 검사"를 검증 항목으로 둔다.**

      ## 💡 이 저장소가 무엇인가
      | 구성 | 의미 |
      |---|---|
      | 커밋 이력 | 여러분의 **지시** |
      | 테스트 | 여러분의 **검증** |
      | report.md | 여러분의 **해석** |

      **이 저장소는 과제 제출물이 아니라 "에이전트 시대에 일하는 법을 아는 사람"의 증거물이다.**

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      cd code/week15 && python3 archive_readme.py ../README.md
      ```
      ## ✅ 합격 기준
      모든 상대 링크가 `[O]` 이고 최종 `판정: **PASS**`.
      링크가 하나라도 `[X]` 면 지어낸 것이니 README 를 고친다. 실측 출력:
      ```
      상대 링크 총 81개
      깨진 링크 **0개**
      → 판정: **PASS**

      재현 방법 블록의 파일 경로도 확인:
        [O] week02/tokenizer_v1.py
        [O] week03/dataset.py
        [O] ../harness/Dockerfile.llm-course-v2
      최종 판정 (README 위치 기준 전 경로): **PASS**
      ```

      ## 🔍 에이전트 판정 포인트
      **링크가 살아 있다고 내용이 맞는 것은 아니다 (실제로 겪은 사례).**
      이 검사자를 처음 돌렸을 때 링크는 **81개 전부 통과**했다. 그런데 재현 방법 블록이
      `docker build -t llm-course:v1 -f ../harness/Dockerfile.llm-course-v1 ..` 를 안내하고
      있었다. v1 파일이 저장소에 남아 있어 링크 검사는 통과했지만, **v1 은 safetensors 가
      빠져 10주차가 실행되지 않는 폐기된 이미지**다. 그대로 따라 한 사람은 못 쓰는 환경을
      만들게 된다.

      **링크 검사는 "존재"만 본다. "옳음"은 사람이 본다.** 이것이 자동 검증의 한계이고,
      한 학기 동안 반복해서 만난 주제다 — W06 의 pytest 초록불, W13 의 저지 점수와 같다.

      **에이전트가 README 를 쓸 때 그럴듯한 파일 경로를 지어낸다.** 저장소 구조를 대충 알면
      `week08/train.py` 같은 없는 파일을 자신 있게 링크한다. 그리고 그건 **포트폴리오를 여는
      사람이 링크를 눌러 보는 순간 드러난다.** 그래서 `[제약] 없는 것을 포장하지 말 것` 과
      `[검증] 모든 상대 링크가 유효한지 검사` 를 함께 둔다.

      **경로 기준을 헷갈리지 마라.** README 가 `code/` 에 있으면 상대 링크도 그 기준이다.
      "저장소 루트에서 실행"이라고 써 놓고 루트 기준 경로를 쓰면 링크 검사가 `[X]` 를 낸다.
      **어디서 실행하는지 첫 줄에 명시하라.**

      ## 📝 마지막 과제 — 기술 회고 4문답
      | # | 질문 | 증거 |
      |---|---|---|
      | 1 | 가장 효과적이었던 **프롬프트 패턴 1개** | 실제 프롬프트를 띄우고 왜 통했는지 |
      | 2 | **최악의 지시 1개**와 그것이 만든 사고 | 로그 |
      | 3 | 에이전트가 **끝내 잘 못하더라**는 것 1개 | 발견 경위 |
      | 4 | 1주차의 나에게 해줄 **조언 한 문장** | — |

      **3번이 가장 어렵고 가장 가치 있다.** 예: "출력의 마지막 차원 평균"을 "배치 축 평균"으로
      오독한 뒤 **그 틀린 테스트에 구현을 맞춰** 15/15 green 을 만든 사례(W06), 또는
      `temperature=0` 인데도 저지 점수가 8.2% 흔들린 사례(W13).
