  - order: 2
    instruction: |
      ## 🎯 미션 — 드라이런 2회: 실행 시간 측정과 재현성

      ## 🔴 "실행 시간 10분"이라는 함정
      **명령 실행 시간만으로는 10분을 넘기기 어렵다.**

      | 단계 (8단계 시나리오, 실측) | 시간 |
      |---|---|
      | 1. 환경 확인 (nvidia-smi) | 0.04초 |
      | 2. 튜닝 전 355M 로드 | 4.0초 |
      | 3. 튜닝 전 응답 3개 | 2.7초 |
      | 4. 튜닝 후 모델 로드 | 2.9초 |
      | 5. 튜닝 후 응답 3개 | 1.3초 |
      | **6. 검증의 순간 ① — LoRA 항등 게이트** | 7.4초 |
      | **7. 검증의 순간 ② — 저지 상한/하한** | 8.4초 |
      | 8. 3축 비교표 출력 | 0.01초 |
      | **합계** | **약 27초** |

      ## 💡 두 번 돌려서 차이를 보라
      첫 실행과 두 번째 실행의 시간이 다르다 — **파일 캐시가 데워졌기 때문**이다.
      발표장에서는 두 번째 실행 조건을 만들어 두는 것이 안전하다(사전에 한 번 돌려 캐시를 데운다).

      ## 💻 실행 명령
      ```bash
      docker exec -w /work/week15 llm-lab python3 dryrun.py
      ```
      ## ✅ 합격 기준
      `dryrun.json` 이 생성되고 2회 실행 시간이 기록된다. 두 번째가 대체로 더 빠르다.

      ## 💻 결과 확인
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import json
      d = json.load(open('dryrun.json'))
      print(f\"TOTAL_RUN1 {d['total1']:.2f}s   TOTAL_RUN2 {d['total2']:.2f}s\")
      for (n1, t1), (n2, t2) in zip(d['run1'], d['run2']):
          print(f'  {n1[:44]:46s} {t1:6.2f}s -> {t2:6.2f}s')
      print(f\"WARMUP_GAIN {d['total1']-d['total2']:.2f}s\")
      print('DRYRUN_OK' if d['total1'] > 0 and d['total2'] > 0 else 'NG')"
      ```
    hint: '몇 분씩 걸린다면 모델을 매 단계 새로 로드하는 것이다 — 한 번 로드해 재사용하라'
    answer: |
      docker exec -w /work/week15 llm-lab python3 dryrun.py
      docker exec -w /work/week15 llm-lab python3 -c "
      import json
      d = json.load(open('dryrun.json'))
      print(f\"TOTAL_RUN1 {d['total1']:.2f}s   TOTAL_RUN2 {d['total2']:.2f}s\")
      for (n1, t1), (n2, t2) in zip(d['run1'], d['run2']):
          print(f'  {n1[:44]:46s} {t1:6.2f}s -> {t2:6.2f}s')
      print(f\"WARMUP_GAIN {d['total1']-d['total2']:.2f}s\")
      print('DRYRUN_OK' if d['total1'] > 0 and d['total2'] > 0 else 'NG')"
    answer_detail: "드라이런을 2회 하는 이유는 재현성 확인과 워밍업 효과 측정 두 가지다. W09 GPU 측정 규약의 '워밍업 후 측정'이 발표 리허설에서 회수된다."
    verify:
      type: output_contains
      expect: DRYRUN_OK
      field: stdout
      semantic:
        intent: "시연 시나리오 2회 드라이런으로 시간과 재현성 측정"
        success_criteria: ["단계별 시간 기록", "2회 반복", "워밍업 효과 관찰"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 실행 시간 ≠ 발표 시간: **설명 시간을 따로 산정하라**

      ## 📌 발표의 병목은 GPU 가 아니라 사람의 말이다
      실행 27초. 그런데 시연은 **10분**이다. 나머지 **9분 30초**가 여러분의 말이다.

      ## 💡 산정 방법
      1. 각 단계에 **"이 화면에서 무엇을 말할 것인가"** 를 한 줄씩 적는다
      2. 그 분량을 **분당 300자**로 환산해 설명 시간을 잡는다
      3. `(실행 + 설명)` 합계가 10분을 넘으면 **어디를 줄일지** 정한다

      ## 💡 예시 (분당 300자 기준)
      | 단계 | 설명 대본 | 글자 수 | 설명 시간 |
      |---|---|---|---|
      | 2. 튜닝 전 로드 | "이건 사전훈련만 된 355M 입니다. 지시를 주면..." | 150자 | 30초 |
      | 6. LoRA 항등 게이트 | "B를 0으로 초기화했기 때문에 적용 직후 손실이..." | 300자 | 60초 |

      ## 💻 실행 명령 (대본 분량으로 발표 시간 계산)
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import json, re
      d = json.load(open('dryrun.json'))
      t = open('demo_scenario.md', encoding='utf-8').read()
      exec_total = d['total2']
      narration = re.findall(r'^\s*>\s*말할 것:\s*(.+)$', t, re.M)
      chars = sum(len(x) for x in narration)
      talk_sec = chars / 300 * 60
      print(f'EXEC_SEC   {exec_total:.1f}')
      print(f'NARRATION_LINES {len(narration)}  CHARS {chars}')
      print(f'TALK_SEC   {talk_sec:.1f}  ({talk_sec/60:.1f}분, 분당 300자 기준)')
      total = exec_total + talk_sec
      print(f'TOTAL_SEC  {total:.1f}  ({total/60:.1f}분)')
      print('OVER_10MIN' if total > 600 else 'WITHIN_10MIN')
      print('TIMING_PLAN_OK' if len(narration) >= 1 else 'NG (대본 줄 없음 — demo_scenario.md 에 \"> 말할 것:\" 을 추가하라)')"
      ```
      ## ✅ 합격 기준
      각 단계에 대본이 붙어 있고(`NARRATION_LINES` ≥ 1), 합계가 계산되며 `TIMING_PLAN_OK`.
      **10분을 넘으면 어느 단계의 설명을 줄일지 결정한다.**
    hint: '대본을 안 쓰면 발표장에서 즉흥으로 말하게 되고, 그러면 반드시 시간이 초과된다'
    answer: |
      docker exec -w /work/week15 llm-lab python3 -c "
      import json, re
      d = json.load(open('dryrun.json'))
      t = open('demo_scenario.md', encoding='utf-8').read()
      exec_total = d['total2']
      narration = re.findall(r'^\s*>\s*말할 것:\s*(.+)$', t, re.M)
      chars = sum(len(x) for x in narration)
      talk_sec = chars / 300 * 60
      print(f'EXEC_SEC   {exec_total:.1f}')
      print(f'NARRATION_LINES {len(narration)}  CHARS {chars}')
      print(f'TALK_SEC   {talk_sec:.1f}  ({talk_sec/60:.1f}분, 분당 300자 기준)')
      total = exec_total + talk_sec
      print(f'TOTAL_SEC  {total:.1f}  ({total/60:.1f}분)')
      print('OVER_10MIN' if total > 600 else 'WITHIN_10MIN')
      print('TIMING_PLAN_OK' if len(narration) >= 1 else 'NG')"
    answer_detail: "교재 원문의 '총 시간 10분' 기준은 명령 실행 시간만 재면 절대 도달하지 않는다(실측 27초). 실행과 설명을 분리해 산정하도록 프롬프트를 고친 것이 이 단계의 배경이다."
    verify:
      type: output_contains
      expect: TIMING_PLAN_OK
      field: stdout
      semantic:
        intent: "실행 시간과 설명 시간을 분리 산정해 발표 시간 계획"
        success_criteria: ["단계별 대본 작성", "분당 300자 환산", "10분 대비 판정"]

  - order: 4
    instruction: |
      ## 🎯 미션 — 발표 5분 전 체크리스트 (명령어 수준)

      ## 📌 "돌아갈 것이다"가 아니라 "방금 돌았다"를 확인하고 무대에 오른다

      ## 💡 체크리스트 7항목
      ```bash
      # 1. 컨테이너 살아 있나
      docker ps --filter name=llm-lab --format '{{.Status}}'
      # 2. GPU 비어 있나
      nvidia-smi --query-gpu=memory.used --format=csv,noheader
      # 3. 체크포인트 있나
      ls -la code/week13/sft_355m.pth code/week13/lora_355m_r16.pth
      # 4. 가중치 캐시 있나
      ls -la code/week10/gpt2_weights/
      # 5. Ollama 응답하나
      docker exec llm-lab curl -s --max-time 5 http://172.17.0.1:11434/api/tags | head -c 40
      # 6. 파일 캐시 데우기
      docker exec llm-lab python3 -c "open('/work/week13/sft_355m.pth','rb').read(1)"
      # 7. 테스트 한 번 돌려보기
      docker exec -w /work/week13 llm-lab python3 -m pytest test_sft.py -q
      ```

      ## ⚠️ "확인한다" 류 서술은 체크리스트가 아니다
      **명령어 수준**이어야 한다. 발표 5분 전에 "무엇을 어떻게 확인하지?"를 생각할 시간은 없다.

      ## 💻 실행 명령 (체크리스트 실제 실행)
      ```bash
      docker ps --filter name=llm-lab --format '{{.Status}}'
      nvidia-smi --query-gpu=memory.used --format=csv,noheader
      ls -la code/week13/sft_355m.pth code/week13/lora_355m_r16.pth 2>/dev/null | wc -l
      ls code/week10/gpt2_weights/ 2>/dev/null | wc -l
      docker exec llm-lab curl -s --max-time 5 http://172.17.0.1:11434/api/tags | head -c 40; echo
      docker exec llm-lab python3 -c "open('/work/week13/sft_355m.pth','rb').read(1)" && echo "CACHE_WARMED"
      docker exec -w /work/week13 llm-lab python3 -m pytest test_sft.py -q 2>&1 | tail -2
      echo "PREFLIGHT_OK"
      ```
      ## ✅ 합격 기준
      7항목이 모두 실행되고 마지막에 `PREFLIGHT_OK`. pytest 도 통과해야 한다.
    hint: '5번(Ollama)이 응답 없으면 저지를 쓰는 검증의 순간을 시나리오에서 빼야 한다'
    answer: |
