      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week15 llm-lab python3 -c "
      import json, re
      d = json.load(open('dryrun.json'))
      t = open('demo_scenario.md', encoding='utf-8').read()
      exec_total = d['total2']
      narration = re.findall(r'^\s*>\s*말할 것:\s*(.+)$', t, re.M)
      chars = sum(len(x) for x in narration)
      talk_sec = chars / 300 * 60
      print(f'EXEC_SEC   {exec_total:.1f}')
      print(f'NARRATION_LINES {len(narration)}  CHARS {chars}')
      print(f'TALK_SEC   {talk_sec:.1f}  ({talk_sec/60:.1f}분, 분당 300자 기준)')
      total = exec_total + talk_sec
      print(f'TOTAL_SEC  {total:.1f}  ({total/60:.1f}분)')
      print('OVER_10MIN' if total > 600 else 'WITHIN_10MIN')
      print('TIMING_PLAN_OK' if len(narration) >= 1 else 'NG (대본 줄 없음 — demo_scenario.md 에 \"> 말할 것:\" 을 추가하라)')"
