          EXEC_SEC / NARRATION_LINES / CHARS / TALK_SEC / TOTAL_SEC
          그리고 600초를 넘으면 OVER_10MIN, 아니면 WITHIN_10MIN
       5. 대본 줄이 1개 이상이면 TIMING_PLAN_OK
       6. 10분을 넘으면, 어느 단계의 대본이 가장 긴지 순위를 매겨 알려준다

