      어휘사전에 `<|endoftext|>` 와 `<|unk|>` 를 추가하고, 미등록 토큰을 `<|unk|>` ID 로
      치환하는 V2 를 만든다.

      ## 💡 두 특수 토큰의 역할이 다르다
      | 토큰 | 역할 | 없으면 |
      |---|---|---|
      | `<\|unk\|>` | 모르는 단어의 대타 | KeyError 로 죽는다 |
      | `<\|endoftext\|>` | 서로 무관한 문서의 **경계** | 앞 문서 끝과 뒷 문서 시작을 한 문맥으로 착각 |

      GPT-2 는 실제로 `<|endoftext|>` 만 쓴다(ID 50256). `<|unk|>` 는 **쓰지 않는다** —
      BPE 에는 OOV 가 없어서 필요가 없기 때문이다.

      ⚠️ `<|unk|>` 는 해결이 아니라 미봉책이다. 모든 미지어가 같은 ID 로 뭉개지면 모델 입장에서
      `Hello` 와 `palace` 와 `quantum` 이 전부 같은 단어가 된다.

