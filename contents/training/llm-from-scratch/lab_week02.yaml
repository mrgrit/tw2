            나머지 동작은 V1 과 동일
       2. 새 어휘사전 크기를 VOCAB_V2 <크기> 로 출력한다
       3. 다음 문장으로 encode → decode 하고 결과를 출력한다
          "Hello, do you like tea? <|endoftext|> In the sunlit terraces of the palace."
       4. 크기가 1132 이고 decode 결과에 <|unk|> 가 정확히 2개면 V2_1132_UNK_OK 를 출력한다
      [제약]
       - 특수 토큰은 사전 **맨 뒤**에 붙일 것. 앞에 넣으면 기존 토큰 ID 가 전부 밀린다
       - V1 파일을 수정하지 말 것. V2 는 별도 파일로 만든다 (앞 단계 결과를 보존해야 한다)
      [검증] decode 결과에서 <|unk|> 로 바뀐 단어가 각각 무엇인지 짚고,
            그 두 단어가 왜 사전에 없는지 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 검증 명령
