       - gpt2 인코딩을 쓸 것. cl100k_base 등 다른 인코딩을 쓰면 어휘 크기가 달라진다
       - 입력에 <|endoftext|> 가 들어 있어 그냥 encode 하면 오류가 난다.
         오류를 예외 처리로 숨기지 말고, 라이브러리가 제공하는 정식 방법으로 허용할 것
      [검증] decode 결과에 <|unk|> 가 없다는 것을 명시적으로 지적하고,
