lab_id: llm-from-scratch-week02
title: "W02 — 토크나이저 해부: 정규식 분리·어휘사전·OOV·특수토큰·BPE·한국어 토큰 효율"
version: ai
course: llm-from-scratch
week: 2
description: |
  텍스트를 토큰 ID 로 바꾸는 변환기를 두 번 만든다. 먼저 정규식 기반 SimpleTokenizerV1/V2 로
  원리를 보고(그 과정에서 왕복 손실과 OOV KeyError 를 일부러 겪는다), 다음으로 GPT-2 가 실제로
  쓰는 tiktoken BPE 로 넘어가 OOV 가 원리적으로 사라지는 것을 확인한다. 마지막으로 같은 의미의
  한국어/영어 문장 쌍으로 토큰 효율 격차를 실측한다. 모든 코드는 llm-lab 컨테이너에서 실행한다.

  ---

  ## ⚠️ 이 트랙의 실습 방식 — 명령을 직접 치지 않는다

  각 단계에서 여러분이 하는 일은 둘이다. **🤖 에이전트 프롬프트를 그대로 복사해 붙여넣고**,
  **✅ 합격 기준과 대조해 직접 판정한다.**

  ```bash
  hermes                      # 대화형
  hermes --yolo -z "프롬프트"   # 한 번만 실행
  ```

  📎 **참고 명령** 블록은 "에이전트가 결국 실행하게 될 명령"을 미리 보여 주는 것이다.
  막혔을 때 대조용으로 보되, **먼저 프롬프트로 시도하는 것이 이 수업의 실습**이다.
  🔍 **에이전트 판정 포인트**는 그 단계에서 에이전트가 실제로 저지른 실수와 잡는 법이다.
difficulty: easy
duration_minutes: 150
audience: LLM 밑바닥 구현 (2주차)
prerequisites:
  - W01 완료 — llm-lab 컨테이너 기동, torch.cuda.is_available() == True
  - 교재 저장소 clone 및 `the-verdict.txt` 를 `/work/week02/` 에 확보
  - W02 강의안 정독 — 손실 변환, OOV, BPE 어휘 구성(256+50000+1)
objectives:
  - "the-verdict.txt 무결성을 두 가지 방법으로 교차 확인한다(20,479자)"
  - "정규식 분리로 4,690 토큰을 재현하고 구두점이 독립 토큰임을 확인한다"
  - "어휘사전 1,130 을 만들고 정렬이 재현성의 조건임을 이해한다"
  - "V1 왕복이 원문을 복원하지 못하는 두 지점을 특정한다"
  - "OOV KeyError 를 재현하고 고치지 않는다"
  - "V2 어휘 1,132 와 <|unk|> 치환 2건을 확인한다"
  - "pytest 3개로 검증을 코드로 격상한다"
  - "tiktoken BPE 어휘 50,257 과 무손실 왕복을 확인한다"
  - "특수 토큰 가드(ValueError)를 재현하고 allowed_special 로 해결한다"
  - "한국어/영어 토큰 비율을 실측하고 바이트 조각 분해를 관찰한다"
pass_threshold: 0.7

steps:

  - order: 1
    instruction: |
      ## 🎯 미션 — 실습 텍스트 무결성 확인 (20,479자)

      이 수업의 모든 예상 수치는 **정답지**다. 파일이 다르면 이후 모든 숫자가 어긋난다.
      그래서 시작 전에 파일부터 검증한다.

      ## 💡 왜 두 가지 방법으로 세는가
      한 가지 방법만 쓰면 그 방법 자체의 버그를 못 잡는다. 파이썬 `len()` 은 **문자** 수를,
      `wc -m` 도 로케일 기준 **문자** 수를 센다(`wc -c` 는 바이트 수라 다르다). 둘이 일치해야
      인코딩(UTF-8)까지 정상이라는 뜻이다. 이것이 **교차 검증**의 최소형이다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] /work/week02/the-verdict.txt 의 문자 수를 서로 다른 두 방법으로 교차 확인한다
      [할 일]
       1. llm-lab 컨테이너 안 /work/week02 에서 작업한다
       2. 방법 A — 파이썬으로 파일을 UTF-8 로 읽어 문자 수를 센다
       3. 방법 B — 셸 도구로 문자 수를 센다 (바이트 수가 아니라 문자 수여야 한다)
       4. PY_LEN=<A> WC_M=<B> 형식으로 두 값을 함께 출력한다
       5. 두 값이 같고 20479 이면 VERDICT_20479_OK 를 출력한다
      [제약]
       - 파일을 수정하거나 다시 내려받지 말 것. 현재 파일을 검사만 한다
       - 두 방법은 반드시 서로 다른 도구여야 한다. 같은 방법을 두 번 쓰면 교차 검증이 아니다
      [검증] 두 값과 판정 문자열을 모두 보이고, 값이 다르면 그 차이의 원인을 설명할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 명령
      ```bash
      docker exec -w /work/week02 llm-lab bash -c '
      PY=$(python3 -c "print(len(open(\"the-verdict.txt\",encoding=\"utf-8\").read()))")
      WC=$(wc -m < the-verdict.txt)
      echo "PY_LEN=$PY WC_M=$WC"
      [ "$PY" = "20479" ] && [ "$PY" = "$WC" ] && echo "VERDICT_20479_OK"'
      ```
      ## ✅ 합격 기준
      `PY_LEN=20479 WC_M=20479` 과 `VERDICT_20479_OK`. **다르면 다음으로 넘어가지 말 것.**

      ## 🔍 에이전트 판정 포인트
      `wc -c`(바이트)를 쓰면 값이 어긋난다 — 이 파일은 ASCII 라 우연히 같을 수도 있지만,
      **개념이 다르다.** 프롬프트가 "바이트 수가 아니라 문자 수"라고 못 박은 이유다.
      그리고 `[제약] 같은 방법을 두 번 쓰지 말 것` 이 없으면, 에이전트는 파이썬으로 두 번
      세어 놓고 "교차 검증했습니다"라고 한다. **경로가 달라야 교차 검증이다.**
    hint: 'wc -c(바이트)와 wc -m(문자)은 다르다. UTF-8 텍스트에서 둘이 다르면 정상이다'
    answer: |
      docker exec -w /work/week02 llm-lab bash -c '
      PY=$(python3 -c "print(len(open(\"the-verdict.txt\",encoding=\"utf-8\").read()))")
      WC=$(wc -m < the-verdict.txt)
      echo "PY_LEN=$PY WC_M=$WC"
      [ "$PY" = "20479" ] && [ "$PY" = "$WC" ] && echo "VERDICT_20479_OK"'
    answer_detail: "정답지 대조의 첫 연습이다. 20,479 가 아니면 파일이 다르거나 인코딩이 깨진 것이므로 즉시 중단하고 원본을 다시 받아야 한다. 서로 다른 두 도구가 같은 값을 내야 신뢰할 수 있다."
    verify:
      type: output_contains
      expect: VERDICT_20479_OK
      field: stdout
      semantic:
        intent: "실습 데이터 무결성을 두 경로로 교차 확인 — 정답지 체계의 출발점"
        success_criteria: ["python len 확인", "wc -m 확인", "20479 일치"]

  - order: 2
    instruction: |
      ## 🎯 미션 — 정규식으로 쪼개기 (4,690 토큰)

      토큰화의 가장 원시적인 형태다. 정규식 한 줄이 텍스트를 단어와 구두점으로 나눈다.

      ## 💡 이 정규식이 하는 일
      ```python
      r'([,.:;?_!"()\']|--|\s)'
      ```
      `re.split()` 에서 패턴을 **괄호로 감싸면 구분자도 결과에 남는다**. 그래서 구두점이
      버려지지 않고 독립 토큰이 된다. 세 갈래를 `|` 로 이었다 — 구두점 문자 하나 /
      `--`(em-dash) / 공백류(`\s`). 분리 후 `strip()` 으로 양끝 공백을 지우고 빈 문자열을 거른다.

      ⚠️ **이 `strip()` 이 공백 정보를 버린다.** 지금은 문제없어 보이지만 4단계에서 원문
      복원을 막는 원인이 된다.

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] the-verdict.txt 를 교재 2장과 동일한 방식으로 토큰 분리하는 함수를 만들고 검증한다
      [할 일]
       1. /work/week02/step1_split.py 에 split_tokens(text) -> list[str] 를 작성한다
          - 정규식 r'([,.:;?_!"()\']|--|\s)' 로 분할한다
          - 분할 결과에서 양끝 공백을 제거하고 빈 문자열은 제외한다
       2. the-verdict.txt 전체에 적용해 다음을 출력한다
          TOKENS <전체 토큰 수>
          FIRST3 <처음 세 토큰의 리스트>
       3. 토큰 수가 4690 이고 처음 세 토큰이 ['I','HAD','always'] 이면
          SPLIT_4690_OK 를 출력한다
       4. 처음 30개 토큰도 함께 출력한다
      [제약]
       - 정규식은 위에 준 것을 문자 그대로 쓸 것. 개선하거나 단순화하지 말 것
       - 구두점을 버리지 말 것. 정규식을 괄호로 감싼 이유가 그것이다
      [검증] 처음 30개 토큰 목록에서 쉼표가 독립 토큰으로 분리되어 있는지 짚어 보고할 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 검증 명령
      ```bash
      docker exec -w /work/week02 llm-lab python3 -c "
      from step1_split import split_tokens
      t = split_tokens(open('the-verdict.txt', encoding='utf-8').read())
      print('TOKENS', len(t)); print('FIRST3', t[:3])
      print('SPLIT_4690_OK' if len(t)==4690 and t[:3]==['I','HAD','always'] else 'SPLIT_NG')"
      ```
      ## ✅ 합격 기준
      `TOKENS 4690`, `FIRST3 ['I', 'HAD', 'always']`, `SPLIT_4690_OK`.
      처음 30개 안에서 `,` 가 **독립 토큰**으로 보이는지도 눈으로 확인한다(29번째).

      ## 🔍 에이전트 판정 포인트
      `[제약] 정규식을 개선하지 말 것` 이 이 단계의 핵심이다. 에이전트는 저 정규식을 보고
      **"더 나은 방식"으로 다듬으려 든다** — `\w+` 를 쓰거나 `nltk` 를 부르거나.
      그러면 토큰 수가 4,690 이 아니게 되고, **이후 15주의 모든 숫자가 어긋난다.**
      숫자가 다르면 그 자리에서 멈추고 정규식부터 대조하라.
    hint: '괄호로 감싸지 않으면 구두점이 사라진다 — 직접 빼고 돌려 보면 차이가 보인다'
    answer: |
      docker exec -w /work/week02 llm-lab python3 -c "
      from step1_split import split_tokens
      t = split_tokens(open('the-verdict.txt', encoding='utf-8').read())
      print('TOKENS', len(t)); print('FIRST3', t[:3])
      print('SPLIT_4690_OK' if len(t)==4690 and t[:3]==['I','HAD','always'] else 'SPLIT_NG')"
    answer_detail: "4,690 은 교재 정답지 값이다. 개수만 맞고 첫 토큰이 다르면 분리 순서나 strip 처리가 다른 것이므로 둘 다 검사한다."
    verify:
      type: output_contains
      expect: SPLIT_4690_OK
      field: stdout
      semantic:
        intent: "정규식 기반 토큰 분리 재현 — 구두점 독립 분리 확인"
        success_criteria: ["토큰 수 4690", "첫 토큰 I/HAD/always", "구두점 독립"]

  - order: 3
    instruction: |
      ## 🎯 미션 — 어휘사전 구축 (1,130)

      토큰 리스트에서 중복을 제거하고 **정렬**해 (토큰 → 정수 ID) 사전을 만든다.

      ## 💡 왜 `sorted()` 가 필수인가
      `set()` 은 순서를 보장하지 않는다. 정렬하지 않으면 같은 텍스트로 만들어도 실행할 때마다
      ID가 달라진다. 그러면 어제 저장한 모델을 오늘 못 쓴다. **정렬은 재현성의 조건이다.**
      이 수업에서 "재현"은 계속 나오는 주제다(9주차 손실 재현, 11주차 ±1%p 게이트).

      ## 🤖 에이전트 프롬프트
      ```text
      [목표] 토큰 리스트에서 어휘사전(토큰 → 정수 ID)을 만든다
      [할 일]
       1. /work/week02/tokenizer_v1.py 에 build_vocab(tokens) -> dict[str, int] 를 작성한다
          - 중복을 제거하고 **정렬**한 뒤 0부터 순번을 매긴다
       2. the-verdict.txt 의 토큰에 적용해 VOCAB <크기> 를 출력한다
       3. 크기가 1130 이면 VOCAB_1130_OK 를 출력한다
       4. 사전의 첫 10개 항목과 마지막 5개 항목을 (토큰, ID) 형태로 출력한다
      [제약]
       - 정렬을 생략하지 말 것. set() 만 쓰면 실행할 때마다 ID 가 바뀐다
       - 같은 파일로 두 번 실행해 첫 10개 항목이 동일한지 직접 확인해 보고할 것
      [검증] 두 번 실행한 결과가 같다는 것을 출력으로 보일 것
      ```

      ## 📎 참고 — 에이전트가 실행하게 될 검증 명령
      ```bash
      docker exec -w /work/week02 llm-lab python3 -c "
      from step1_split import split_tokens
      from tokenizer_v1 import build_vocab
      v = build_vocab(split_tokens(open('the-verdict.txt', encoding='utf-8').read()))
      print('VOCAB', len(v))
      print('VOCAB_1130_OK' if len(v)==1130 else 'VOCAB_NG')"
      ```
      ## ✅ 합격 기준
      `VOCAB 1130` 과 `VOCAB_1130_OK`.

      ## 🔍 에이전트 판정 포인트
      크기 1130 은 정렬 여부와 무관하게 맞는다. **그래서 크기만 보면 정렬 누락을 못 잡는다.**
      `[할 일] 4` 와 `[제약]` 의 "두 번 실행해 비교"가 그것을 잡는 장치다.
      **통과 기준을 하나만 두면, 그 기준을 우회하는 오류는 영원히 안 보인다.**
    hint: '4,690 토큰에서 중복을 제거하면 1,130 종류가 남는다 — 같은 단어가 평균 4번쯤 나온다는 뜻이다'
    answer: |
      docker exec -w /work/week02 llm-lab python3 -c "
      from step1_split import split_tokens
      from tokenizer_v1 import build_vocab
      v = build_vocab(split_tokens(open('the-verdict.txt', encoding='utf-8').read()))
      print('VOCAB', len(v))
      print('VOCAB_1130_OK' if len(v)==1130 else 'VOCAB_NG')"
    answer_detail: "1,130 종류의 고유 토큰. 이 사전에 없는 단어는 다음 단계에서 KeyError 를 낸다 — OOV 문제의 원인이 바로 이 '고정된 목록'이다."
    verify:
      type: output_contains
      expect: VOCAB_1130_OK
      field: stdout
      semantic:
        intent: "어휘사전 구축과 재현성 확보(정렬)"
        success_criteria: ["중복 제거", "정렬", "크기 1130"]

  - order: 4
    instruction: |
      ## 🎯 미션 — V1 왕복 테스트: **불일치가 정답이다**

      encode → decode 를 돌려 원문이 복원되는지 본다. **복원되지 않는 것이 정상이다.**

      ## 🔴 여기가 이번 주의 핵심
      ```
      원문   : "It's the last he painted, you know," Mrs. Gisburn said with pardonable pride.
      decode : " It' s the last he painted, you know," Mrs. Gisburn said with pardonable pride.
      ```
      두 군데가 다르다. ① 문장 앞에 **공백 하나**가 붙었고 ② `It's` 가 **`It' s`** 로 벌어졌다.

      **원인:** V1의 decode 는 토큰을 `" ".join()` 으로 이은 뒤 구두점 **앞**의 공백만 지운다.
      `'` 는 그 대상이라 `It '` → `It'` 로 붙지만, 그 **뒤 `s` 앞의 공백을 지울 규칙은 없다**.
      토크나이저가 `It` / `'` / `s` 로 쪼개는 순간 원문의 띄어쓰기 정보는 이미 사라졌다.

      ## ⚠️ 절대 고치지 말 것
      교재 저장소의 공식 노트북 `ch02.ipynb` 의 저장된 출력에도 `" It' s"` 가 그대로 있다.
      **정답지가 틀린 자리다.** 이 과목에서 여러분이 할 일이 바로 이것 — 실행 결과와 정답지를
      대조해 어느 쪽이 틀렸는지 판정하는 일이다.

