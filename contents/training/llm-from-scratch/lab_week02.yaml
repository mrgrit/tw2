    instruction: |
      ## 🎯 미션 — 한국어 토큰 효율 실험 (이 수업의 오리지널)

      같은 의미를 한국어와 영어로 쓰면 토큰 수가 얼마나 다른가. 이 숫자는 **비용**과
      **컨텍스트 창 소모량**에 직결된다.

      ## 💡 예상 결과 (실측 기준)
      | 문장 쌍 | ko | en | 비율 |
      |---|---|---|---|
      | 방화벽이 비정상 트래픽을 차단했다. / The firewall blocked abnormal traffic. | 43 | 6 | **7.17배** |
      | 이 식당의 김치찌개가... / The kimchi stew at this restaurant... | 56 | 15 | **3.73배** |

      10쌍 기준 대략 **4~7배**(실측 최소 3.73 / 최대 7.17 / 평균 4.94). **문장이 짧을수록
      배율이 커진다** — 영어는 짧은 단어 하나가 토큰 하나인데, 한국어는 짧아도 글자마다 바이트
      조각으로 쪼개지기 때문이다.

      ## 💡 왜 그런가
      GPT-2 의 병합 규칙은 **영어 중심 코퍼스**에서 학습됐다. `" the"` 같은 영어 조합은 통짜
      토큰으로 병합됐지만, 한국어 바이트 조합은 병합 학습이 거의 안 되어 있다. 그래서 병합되지
      못한 바이트가 낱개 토큰으로 남는다. `"방화벽이 비정상 트래픽을 차단했다."` 는 UTF-8 로
      49바이트인데 43토큰이고, 개별 토큰을 decode 하면 대부분 `�`(깨진 문자)로 나온다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      pairs = [('방화벽이 비정상 트래픽을 차단했다.','The firewall blocked abnormal traffic.'),
               ('공격자가 SQL 삽입 취약점을 이용해 인증을 우회했다.','The attacker bypassed authentication using an SQL injection vulnerability.'),
               ('이 식당의 김치찌개가 이 동네에서 가장 맛있다.','The kimchi stew at this restaurant is the best in this neighborhood.')]
      rs = []
      for ko, en in pairs:
          k, e = len(enc.encode(ko)), len(enc.encode(en)); rs.append(k/e)
          print(f'ko={k:3d} en={e:3d} ratio={k/e:.2f}  {ko}')
      avg = sum(rs)/len(rs); print(f'AVG_RATIO={avg:.2f}')
      print('KO_RATIO_OK' if avg >= 3.0 else 'KO_RATIO_LOW')
      s = '방화벽이 비정상 트래픽을 차단했다.'
      ids = enc.encode(s); frag = [enc.decode([i]) for i in ids]
      broken = sum(1 for f in frag if '�' in f)
      print('BYTES', len(s.encode('utf-8')), 'TOKENS', len(ids), 'BROKEN_FRAGMENTS', broken)"
      ```
      ## ✅ 합격 기준
      `AVG_RATIO` 가 3.0 이상이고 `KO_RATIO_OK` 가 출력된다. 바이트 조각이 다수 관찰된다.

      ## 📝 해석 과제 (report.md 에 **직접** 작성 — 에이전트 사용 금지)
      1. 왜 한국어가 더 많은 토큰으로 쪼개지는가?
      2. 이 비율이 실제 LLM 서비스에서 갖는 의미 2가지 (비용 관점 / 컨텍스트 창 관점)
    hint: '비율이 1배 근처면 한국어 문장이 로마자로 들어간 것이다 — 실제 한글인지 확인하라'
