    instruction: |
      ## 🎯 미션 — 두 가지 관찰: 특수 토큰 가드 + 미지의 단어 분해

      ## 💡 (a) 예고된 함정 — 특수 토큰 가드
      tiktoken 은 입력에 `<|endoftext|>` 문자열이 섞여 있으면 **기본적으로 오류를 낸다.**
      ```
      ValueError: Encountered text corresponding to disallowed special token '<|endoftext|>'.
      ```
      버그가 아니라 **보안 장치**다. 사용자 입력에 특수 토큰이 섞여 들어오면 모델의 문서 경계
      인식을 조작할 수 있다(프롬프트 인젝션의 한 형태). 해결은 명시적 허용:
      `enc.encode(text, allowed_special={"<|endoftext|>"})`.

      ## 💡 (b) 연습문제 2.1 — 세상에 없는 단어 분해
      `"Akwirw ier"` 는 무의미한 문자열이다. BPE 는 이것을 아는 조각으로 쪼갠다:
      `Ak`(33901) / `w`(86) / `ir`(343) / `w`(86) / `' '`(220) / `ier`(959).
      그리고 전체를 다시 decode 하면 **원문이 정확히 복원된다.** 공백이 독립 토큰 220 으로
      살아 있는 것도 보라 — V1 이 잃어버린 그 정보다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      try:
          enc.encode('a <|endoftext|> b'); print('NO_ERROR')
      except ValueError as e:
          print('ValueError:', str(e)[:90]); print('SPECIAL_TOKEN_GUARD_OK')
      ids = enc.encode('Akwirw ier')
      for i in ids: print(' ', i, '|', repr(enc.decode([i])))
      print('AKWIRW_ROUNDTRIP_OK' if enc.decode(ids)=='Akwirw ier' else 'NG')"
      ```
      ## ✅ 합격 기준
      `SPECIAL_TOKEN_GUARD_OK` 와 `AKWIRW_ROUNDTRIP_OK` 가 모두 출력된다.
