      ## 🎯 미션 — 진짜 토크나이저: tiktoken BPE (50,257 / 무손실)

      GPT-2 가 실제로 쓰는 BPE 를 로드해 V2 와 비교한다. OOV 가 어떻게 사라지는지 본다.

      ## 💡 GPT-2 어휘 50,257의 구성
      | 구성 | 개수 | 역할 |
      |---|---|---|
      | 바이트 | **256** | 모든 바이트값 0~255. **이것이 OOV 를 없앤다** |
      | 병합 토큰 | **50,000** | 자주 붙어 나온 쌍을 반복 병합한 결과 |
      | 특수 토큰 | **1** | `<\|endoftext\|>` (ID 50256) |

      어떤 텍스트든 UTF-8 로 쓰면 결국 바이트의 나열이고, 그 바이트가 전부 어휘에 있으므로
      **최악의 경우에도 바이트 단위로는 반드시 표현된다.** 그래서 BPE 에는 원리적으로 OOV 가 없다.

      ## 💻 실행 명령
      ```bash
      docker exec llm-lab python3 -c "
      import tiktoken
      enc = tiktoken.get_encoding('gpt2')
      print('VOCAB', enc.n_vocab)
      s = 'Hello, do you like tea? <|endoftext|> In the sunlit terraces of the palace.'
      ids = enc.encode(s, allowed_special={'<|endoftext|>'})
      d = enc.decode(ids)
      print('TOKENS', len(ids)); print('DECODE:', d)
      print('BPE_50257_NOUNK_OK' if enc.n_vocab==50257 and d==s and '<|unk|>' not in d else 'BPE_NG')"
      ```
