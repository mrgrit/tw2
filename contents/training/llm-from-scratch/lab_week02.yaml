          "Hello, do you like tea? <|endoftext|> In the sunlit terraces of the palace."
       3. 토큰 수와 decode 결과를 출력한다
       4. 어휘가 50257 이고 decode 가 원문과 완전히 같고 <|unk|> 가 없으면
          BPE_50257_NOUNK_OK 를 출력한다
       5. /work/week02/bpe_compare.md 에 V2 와의 비교표를 저장한다
          (어휘 크기 / OOV 처리 방식 / 이 문장의 토큰 수 / Hello 의 처리 결과)
