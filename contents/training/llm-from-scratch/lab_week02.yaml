      pairs = [('방화벽이 비정상 트래픽을 차단했다.','The firewall blocked abnormal traffic.'),
               ('공격자가 SQL 삽입 취약점을 이용해 인증을 우회했다.','The attacker bypassed authentication using an SQL injection vulnerability.'),
               ('이 식당의 김치찌개가 이 동네에서 가장 맛있다.','The kimchi stew at this restaurant is the best in this neighborhood.')]
      rs = []
      for ko, en in pairs:
          k, e = len(enc.encode(ko)), len(enc.encode(en)); rs.append(k/e)
          print(f'ko={k:3d} en={e:3d} ratio={k/e:.2f}  {ko}')
      avg = sum(rs)/len(rs); print(f'AVG_RATIO={avg:.2f}')
      print('KO_RATIO_OK' if avg >= 3.0 else 'KO_RATIO_LOW')
      s = '방화벽이 비정상 트래픽을 차단했다.'
      ids = enc.encode(s); frag = [enc.decode([i]) for i in ids]
      broken = sum(1 for f in frag if '�' in f)
      print('BYTES', len(s.encode('utf-8')), 'TOKENS', len(ids), 'BROKEN_FRAGMENTS', broken)"
